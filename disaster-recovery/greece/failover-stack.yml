# Greece WARM-STANDBY failover stack for the Prague bjj + n8n apps.
# Deploy on unraid-ptolemaida via Portainer.
#
# Network aliases reproduce the Prague k8s service FQDNs, so the n8n Postgres
# credential (host: postgres.bjj.svc.cluster.local), the nginx /api proxy
# (n8n-web.n8n.svc.cluster.local) and n8n->gotenberg all resolve UNCHANGED after
# a plain restore — no editing of restored data.
#
# n8n is in the "failover" profile => NOT started by default. Keeping
# n8n stopped on standby prevents double webhook/schedule execution against shared
# external state. Activate at failover:  docker compose --profile failover up -d
#
# Portainer stack ENV VARS to set (same values as Prague):
#   POSTGRES_USER  POSTGRES_DB  POSTGRES_PASSWORD   N8N_ENCRYPTION_KEY
services:
  postgres:
    image: postgres:16-alpine
    container_name: bjj-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - /mnt/user/appdata/bjj-failover/postgres:/var/lib/postgresql/data
    networks:
      default:
        aliases: [postgres, postgres.bjj.svc.cluster.local]

  gotenberg:
    image: gotenberg/gotenberg:8.21
    container_name: gotenberg
    restart: unless-stopped
    networks:
      default:
        aliases: [gotenberg, gotenberg.n8n.svc.cluster.local]

  n8n:
    image: n8nio/n8n:2.27.0
    container_name: n8n
    restart: unless-stopped
    profiles: ["failover"]
    user: "1000:1000"
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: auto.kostikidis.net
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://auto.kostikidis.net/
      GENERIC_TIMEZONE: Europe/Prague
      N8N_TRUST_PROXY: "true"
    volumes:
      - /mnt/user/appdata/bjj-failover/n8n:/home/node/.n8n
    networks:
      default:
        aliases: [n8n-web, n8n-web.n8n.svc.cluster.local]
    depends_on: [postgres, gotenberg]

  # NB: app.teamelwany.com dropped from DR (2026-06-17) — it was a placeholder shell;
  # the real coaches app lives on Dreamhost (teamelwany.com/coach). The bjj-app nginx
  # container and its tunnel ingress were removed. DR now covers auto.kostikidis.net (n8n) only.

  # Dedicated Cloudflare tunnel for the failover stack (tunnel "TeamElwany GR",
  # id 0fb9fd16-...). In the failover profile so it only connects when failed over.
  # Its ingress (configured in Cloudflare): auto.kostikidis.net->http://n8n:5678.
  # DNS is flipped to it by failover.sh.
  cloudflared:
    image: cloudflare/cloudflared:2026.5.2
    container_name: bjj-failover-cloudflared
    restart: unless-stopped
    profiles: ["failover"]
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    depends_on: [n8n]

networks:
  default:
    name: bjj-failover
