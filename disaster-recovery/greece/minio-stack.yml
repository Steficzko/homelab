# Greece DR off-site backup target — deploy as a Portainer stack on unraid-ptolemaida.
#
# Bound to the Tailscale IP (100.85.129.88) ONLY, so it is reachable from the
# Prague k3s nodes over the tailnet but NOT exposed on the Unraid LAN or the
# public internet.
#
# Set these two as STACK ENVIRONMENT VARIABLES in Portainer (do NOT hardcode here):
#   MINIO_ROOT_USER
#   MINIO_ROOT_PASSWORD
#
# Console:  http://100.85.129.88:9101    S3 API:  http://100.85.129.88:9100
services:
  minio:
    image: minio/minio:latest          # TODO: pin to a release tag
    container_name: minio-dr
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "100.85.129.88:9100:9000"      # S3 API  (tailnet only)
      - "100.85.129.88:9101:9001"      # console (tailnet only)
    volumes:
      - /mnt/user/appdata/minio-dr:/data
    restart: unless-stopped

  createbucket:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      until mc alias set dr http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do echo waiting for minio; sleep 2; done;
      mc mb --ignore-existing dr/app-backups;
      mc version enable dr/app-backups || true;
      echo 'DR bucket app-backups ready (versioning on)';
      "
    restart: "no"
