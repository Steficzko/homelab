# Traefik replaces ingress-nginx (retired upstream March 2026, CLSTR-29, decided 2026-10-15).
# Installed ALONGSIDE nginx: it serves only Ingresses with ingressClassName: traefik, and
# all 53 existing Ingresses say nginx, so this changes no live traffic. Apps move over
# category by category; cloudflared origins are switched per hostname as each one moves.
#
# Argo-managed chart in its own namespace, NOT the k3s-bundled Traefik. That one stays
# disabled in bootstrap/k3s-server-config.yaml, so it is versioned and upgraded like
# every other app, and k3s cannot re-apply or remove it on a server restart.

deployment:
  # Same reasoning as ingress-nginx: one pod is a cluster-wide SPOF for every public
  # host, and a drain needs somewhere to move it. Two replicas + PDB minAvailable 1.
  replicas: 2

podDisruptionBudget:
  enabled: true
  minAvailable: 1

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
              app.kubernetes.io/instance: traefik-traefik

ingressClass:
  enabled: true
  # NOT default while nginx lives: two default classes make a class-less Ingress
  # land on whichever controller wins. Flip when nginx is removed.
  isDefaultClass: true   # sole controller since CLSTR-29
  name: traefik

# Gateway API comes later (the reason Traefik was picked over a second nginx); off until
# something actually uses it.
gateway:
  enabled: false
gatewayClass:
  enabled: false

service:
  spec:
    # ClusterIP for now: cloudflared reaches ingress in-cluster, and the LAN LB IPs
    # (.201-.205 :80/:443) belong to ingress-nginx until the last category moves. The
    # LoadBalancer (with nginx's loadBalancerSourceRanges and no NodePorts, F-001)
    # comes over in that final step.
    type: ClusterIP
  additionalServices:
    # Only the `lan` entrypoint; VIP announced by kube-vip (class-only mode).
    lan:
      spec:
        type: LoadBalancer
        loadBalancerClass: kube-vip.io/kube-vip-class
      annotations:
        kube-vip.io/loadbalancerIPs: 192.168.1.210

providers:
  kubernetesIngress:
    # With a ClusterIP Service, publishedService copies an EMPTY load-balancer status
    # onto every Ingress, and Argo holds Ingresses without an address at Progressing
    # forever. Publish the in-cluster name instead (it is what cloudflared dials).
    # Permanent: Traefik stays ClusterIP (tunnels only); the LAN LoadBalancer was
    # retired with ingress-nginx, nothing on the LAN used it (CLSTR-29).
    publishedService:
      enabled: false
    ingressEndpoint:
      hostname: traefik.traefik.svc.cluster.local

metrics:
  prometheus:
    service:
      enabled: true
    serviceMonitor:
      enabled: true
      # Prometheus CR's serviceMonitorSelector ignores monitors without this label.
      additionalLabels:
        release: kube-prometheus-stack

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

ports:
  web:
    # Routers without an explicit entrypoint stay on web/websecure only, so nothing
    # lands on `lan` unless its Ingress opts in.
    asDefault: true
    transport:
      respondingTimeouts:
        # Traefik v3 cuts a request read at 60s by default, which kills large Immich /
        # Nextcloud / Paperless uploads mid-stream. nginx had no such cap (body-size 0
        # on 22 Ingresses, read timeouts up to 3600s). 0 = no limit, same as before.
        readTimeout: 0
  websecure:
    asDefault: true
    transport:
      respondingTimeouts:
        readTimeout: 0
    http:
      # nginx emitted HSTS globally but only over HTTPS; on this entrypoint only =
      # the same behaviour (faktury via the tunnel's https origin, and LAN https).
      middlewares:
        - traefik-hsts@kubernetescrd
  # Split horizon at home (ADR-044 amendment 2026-10-22): the router's DNS answers the
  # Immich hosts with 192.168.1.210, so uploads skip Cloudflare's 100 MB request cap.
  # Opt-in only (not asDefault): an Ingress joins via router.entrypoints, so a LAN
  # client cannot reach Access-gated apps by sending their Host/SNI here.
  lan:
    port: 8444
    exposedPort: 443
    expose:
      default: false
      lan: true
    transport:
      respondingTimeouts:
        readTimeout: 0
    http:
      tls:
        enabled: true
      middlewares:
        - traefik-hsts@kubernetescrd

# Not ported on purpose: ssl-redirect (all 49 annotations say "false"), body-size 0 and
# proxy-buffering off (Traefik's defaults already). Per-app body LIMITS (1m, 25m, 64k…)
# become a Buffering middleware in that app's namespace when the app moves.
extraObjects:
  - apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: hsts
      namespace: traefik
    spec:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: false   # deliberate, see the ingress-nginx values comment
