apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich-lightroom
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Steficzko/homelab.git
    targetRevision: HEAD
    path: kubernetes/apps/immich-lightroom
    directory:
      recurse: true
      exclude: '*.sops.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: immich-lightroom
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
