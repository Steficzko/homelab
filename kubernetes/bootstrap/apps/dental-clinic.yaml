apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dental-clinic
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Steficzko/homelab.git
    targetRevision: HEAD
    path: kubernetes/apps/dental.clinic
    directory:
      recurse: true
      exclude: '*.sops.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: dental-clinic
  syncPolicy:
    automated:
      prune: false               # NEVER auto-delete the DB PVC (manifest-reviewer C2)
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: ""
      kind: Secret
      jsonPointers:
        - /data                       # SOPS secrets applied out-of-band; don't let Argo strip them
