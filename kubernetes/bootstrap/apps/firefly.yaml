apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: firefly
  namespace: argocd
spec:
  project: default
  # Firefly III — full personal finance manager (multi-currency: IQD + CZK) at
  # money.kostikidis.net. App + dedicated Postgres (documenso pattern). Behind the
  # *.kostikidis.net Cloudflare Access wildcard. Native app via Waterfly III (Android).
  # Secrets (APP_KEY + DB password) in SOPS, applied out-of-band.
  source:
    repoURL: https://github.com/Steficzko/homelab.git
    targetRevision: HEAD
    path: kubernetes/apps/firefly
    directory:
      recurse: true
      exclude: '*.sops.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: firefly
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
