apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: penpot
  namespace: argocd
spec:
  project: default
  sources:
    # raw stateful bits (postgres, valkey, NFS PV/PVC, namespace) — secrets applied out-of-band
    - repoURL: https://github.com/Steficzko/homelab.git
      targetRevision: HEAD
      path: kubernetes/apps/penpot
      directory:
        recurse: true
        exclude: '*.sops.yaml'
    # penpot app services (frontend/backend/exporter/mcp) via official Helm chart
    - repoURL: https://helm.penpot.app
      chart: penpot
      targetRevision: 1.8.0
      helm:
        valuesObject:
          # Resource requests/limits added 2026-08-20. These four ran with
          # `resources: {}`, which caused a real outage: draining k3s-prg-w1 put
          # its workload on w2, the scheduler counted these pods as consuming
          # NOTHING when placing them, and once w2 exhausted memory the kernel
          # OOM-killed penpot-backend (exit 137) — BestEffort pods die before
          # Burstable ones. w2's load hit 455 and its kubelet went unreachable.
          # Requests are the important half: they make the scheduler account for
          # this workload. Sized from measured steady state (backend 1503Mi,
          # exporter 185Mi, frontend 177Mi, mcp 128Mi).
          backend:
            resources:
              requests:
                memory: 1Gi
                cpu: 200m
              limits:
                memory: 3Gi
          frontend:
            resources:
              requests:
                memory: 128Mi
                cpu: 50m
              limits:
                memory: 512Mi
          exporter:
            resources:
              requests:
                memory: 256Mi
                cpu: 100m
              limits:
                memory: 768Mi
          mcp:
            resources:
              requests:
                memory: 128Mi
                cpu: 50m
              limits:
                memory: 512Mi
          config:
            publicUri: "https://design.kostikidis.net"
            # locked down: password login only, no self-registration, no email verification.
            # prepl-server = admin CLI (create-profile); mcp = AI design access (read designs directly)
            flags: "enable-login-with-password disable-registration disable-email-verification enable-prepl-server enable-mcp"
            telemetryEnabled: false
            existingSecret: penpot-secret
            secretKeys:
              apiSecretKey: apiSecretKey
            postgresql:
              host: postgres.penpot.svc.cluster.local
              port: 5432
              username: penpot
              database: penpot
              existingSecret: penpot-secret
              secretKeys:
                passwordKey: POSTGRES_PASSWORD
            redis:
              host: redis.penpot.svc.cluster.local
              port: 6379
              database: "0"
            objectsStorage:
              storageBackend: fs
              filesystem:
                directory: /opt/data/assets
          persistence:
            assets:
              enabled: true
              existingClaim: penpot-assets-pvc
          ingress:
            enabled: true
            className: nginx
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
              nginx.ingress.kubernetes.io/ssl-redirect: "false"
              nginx.ingress.kubernetes.io/proxy-body-size: "0"
            hosts:
              - design.kostikidis.net
            tls:
              - hosts: [design.kostikidis.net]
                secretName: penpot-tls
  destination:
    server: https://kubernetes.default.svc
    namespace: penpot
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers:
        - /spec/resources/requests/storage
