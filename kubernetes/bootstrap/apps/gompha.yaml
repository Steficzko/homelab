apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gompha
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Steficzko/homelab.git
    targetRevision: HEAD
    path: kubernetes/apps/gompha
    directory:
      recurse: true
      exclude: '{*.sops.yaml,*.example.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: gompha
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
