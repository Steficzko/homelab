apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hiba
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Steficzko/homelab.git
    targetRevision: HEAD
    path: kubernetes/apps/hiba
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: hiba
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
