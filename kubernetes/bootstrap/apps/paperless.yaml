apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: paperless
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Steficzko/homelab.git
    targetRevision: HEAD
    path: kubernetes/apps/paperless
    directory:
      recurse: true
      # ADR-029: the previous instance was broken by ArgoCD applying example/placeholder
      # Secrets over the real SOPS values, resetting the DB and admin passwords to
      # "changeme". Both patterns must stay excluded.
      exclude: '{*.sops.yaml,*placeholder*.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: paperless
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: backup-s3-secret
      jsonPointers:
        - /data                       # populated out-of-band; don't let Argo strip it
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers:
        - /spec/resources/requests/storage   # Longhorn expansions happen live
