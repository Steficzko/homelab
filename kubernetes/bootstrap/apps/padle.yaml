apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: padle
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Steficzko/homelab.git
    targetRevision: HEAD
    path: kubernetes/apps/padle
    directory:
      exclude: "{*.sops.yaml,secret-placeholder.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: padle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
