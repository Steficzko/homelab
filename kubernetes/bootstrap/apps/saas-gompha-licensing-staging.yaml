apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: saas-gompha-licensing-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Steficzko/homelab.git
    targetRevision: HEAD
    path: kubernetes/apps/saas-gompha-licensing/staging
    directory:
      recurse: true
      exclude: '{*.sops.yaml,*placeholder*.yaml,*.example.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: saas-gompha-licensing-staging
  syncPolicy:
    automated:
      prune: false               # NEVER auto-delete the DB PVC (manifest-reviewer C2 precedent; B3 2026-08-17)
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
