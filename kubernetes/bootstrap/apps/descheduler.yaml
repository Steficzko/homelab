apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: descheduler
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/descheduler/
    chart: descheduler
    targetRevision: 0.32.0
    helm:
      values: |
        schedule: "*/10 * * * *"
        deschedulerPolicy:
          profiles:
            - name: default
              pluginConfig:
                - name: DefaultEvictor
                  args:
                    evictSystemCriticalPods: false
                    evictFailedBarePods: false
                    evictLocalStoragePods: false
                    evictDaemonSetPods: false
                    nodeFit: true
                - name: LowNodeUtilization
                  args:
                    thresholds:
                      cpu: 20
                      memory: 30
                    targetThresholds:
                      cpu: 50
                      memory: 50
                - name: RemoveDuplicates
                  args: {}
              plugins:
                balance:
                  enabled:
                    - LowNodeUtilization
                    - RemoveDuplicates
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
