apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: descheduler
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/descheduler/
    chart: descheduler
    targetRevision: 0.37.0
    helm:
      values: |
        schedule: "0 */6 * * *"
        deschedulerPolicy:
          profiles:
            - name: default
              pluginConfig:
                - name: DefaultEvictor
                  args:
                    evictSystemCriticalPods: false
                    evictFailedBarePods: false
                    evictLocalStoragePods: false
                    evictDaemonSetPods: false
                    nodeFit: true
                - name: LowNodeUtilization
                  args:
                    # Tuned 2026-08-20. A node is an eviction RECEIVER only if it
                    # is below ALL `thresholds`; a SOURCE if above ANY
                    # `targetThresholds`. The old pods:22 (=24 pods of 110) sat
                    # below every node's real count, so NO node counted as
                    # under-utilized and the plugin evicted nothing. Raised to 45
                    # so workers qualify as receivers. Memory target 75->65 so a
                    # tight control plane (g2 was 67% req) becomes a source; the
                    # 55/65 band leaves a 10% gap to avoid evict/replace churn.
                    # This only EQUALISES load — the worker-bias (system-reserved
                    # on the CPs, allocatable 15.8Gi vs 12.2Gi) is what makes the
                    # kube-scheduler re-place the evicted pods onto w1/w2.
                    thresholds:
                      cpu: 55
                      memory: 55
                      pods: 45
                    # 2026-11-02: CPs carry PreferNoSchedule (owner: apps on w1/w2,
                    # r1/g2/b3 < 50 % mem). Workers now run ~80 % of requests BY
                    # DESIGN, so the old 80/65/50 targets made them permanent
                    # "sources" -> evict -> scheduler puts the pod back on a
                    # worker -> churn every 6 h. Targets raised so this plugin
                    # only acts on a REAL imbalance (e.g. an empty worker after
                    # a reboot is a receiver; the full one is a source).
                    targetThresholds:
                      cpu: 95
                      memory: 85
                      pods: 90
                - name: RemovePodsViolatingNodeTaints
                  args:
                    # Pulls app pods back OFF the control planes once a worker
                    # has room (after a drain/failover they land on r1/g2/b3
                    # and nothing else ever moves them back). nodeFit=true in
                    # DefaultEvictor = only evicts if the pod fits elsewhere.
                    includePreferNoSchedule: true
                    namespaces:
                      exclude:
                        - kube-system
                        - longhorn-system
                - name: RemoveDuplicates
                  args: {}
              plugins:
                balance:
                  enabled:
                    - LowNodeUtilization
                    - RemoveDuplicates
                deschedule:
                  enabled:
                    - RemovePodsViolatingNodeTaints
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
