# kube-vip holds the apiserver VIP .200. prune OFF on purpose: a bad git change must never be able
# to delete the thing every kubeconfig points at. selfHeal ON: live edits snap back to git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-vip
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Steficzko/homelab.git
    targetRevision: HEAD
    path: kubernetes/networking/kube-vip
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
