apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bjj
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Steficzko/homelab.git
    targetRevision: HEAD
    path: kubernetes/apps/bjj
    directory:
      recurse: true
      exclude: '{*.sops.yaml,*placeholder*.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: bjj
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers:
        - /spec/resources/requests/storage
    - group: ""
      kind: Secret
      name: backup-s3-secret
      jsonPointers:
        - /data                       # populated out-of-band; don't let Argo strip it
