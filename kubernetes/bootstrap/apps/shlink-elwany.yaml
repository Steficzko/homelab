apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shlink-elwany
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Steficzko/homelab.git
    targetRevision: HEAD
    path: kubernetes/apps/shlink-elwany
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: shlink-elwany
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
