apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-ingress
  namespace: argocd
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # ArgoCD server speaks HTTPS internally: Traefik uses the scheme + ServersTransport
    # annotated on Service argocd-server (bootstrap/argocd/kustomization.yaml).
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - argocd.kostikidis.net
      secretName: argocd-tls
  rules:
    - host: argocd.kostikidis.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 443
