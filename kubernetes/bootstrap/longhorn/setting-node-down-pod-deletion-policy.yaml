# STOR-42. When a node goes NotReady, force-delete its terminating StatefulSet AND
# Deployment pods that hold Longhorn volumes, so the volumes detach and the replacement
# pods start on healthy nodes from the replicas already there.
#
# The default (do-nothing) cost 7h18m on 2026-10-03: w1 hard-froze at 08:33, 17 replacement
# pods sat in Multi-Attach until it was power-cycled at 15:50 (Immich DB, n8n, bjj, blanca,
# dental clinic DB, paperless, Prometheus...).
#
# Accepted risk: a node that is NotReady but still alive could write to a local replica after
# the volume moved. Longhorn marks that replica stale and rebuilds it from the healthy ones on
# reconnect; with replicas on other nodes that beats an outage of unknown length.
#
# Setting CR rather than the default-setting ConfigMap: that key is not in the upstream
# manifest's ConfigMap, and a Setting is what longhorn-manager actually reads.
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: node-down-pod-deletion-policy
  namespace: longhorn-system
value: delete-both-statefulset-and-deployment-pod
