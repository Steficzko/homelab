# Longhorn managing itself, pinned to the version already running.
#
# Longhorn holds every PVC in this cluster. It was installed and upgraded by hand
# (v1.7.0 -> v1.12.1 across five rungs on 2026-08-27) with no record in git of what
# version was deployed or why. This puts the storage layer under the same GitOps
# discipline as everything it stores.
#
# Upgrade procedure: Longhorn does NOT support skipping minor versions. Bump this tag
# one minor at a time, let it sync, confirm every volume is healthy before the next.
# Recovery, if a sync ever wedges the manager:
#   kubectl apply -f https://raw.githubusercontent.com/longhorn/longhorn/<tag>/deploy/longhorn.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: longhorn-system

resources:
  - https://raw.githubusercontent.com/longhorn/longhorn/v1.13.0/deploy/longhorn.yaml
  - setting-node-down-pod-deletion-policy.yaml    # STOR-42
  - setting-replica-auto-balance.yaml            # disabled, see file
  - backup-catchup.yaml                          # re-backs volumes the nightly job skipped, see file

patches:
  # Request = 14d p95, 2026-10-18 (CLSTR-15). longhorn-manager is the only Longhorn
  # workload in longhorn.yaml: instance-managers (5 x ~1.5Gi) and the CSI sidecars are
  # created at runtime and take no requests from git — that ~8.5Gi stays invisible to
  # the scheduler; node system-reserved is the only knob. No limit: an OOM-killed
  # manager detaches volumes.
  - target: {kind: DaemonSet, name: longhorn-manager}
    patch: |-
      apiVersion: apps/v1
      kind: DaemonSet
      metadata: {name: longhorn-manager}
      spec:
        template:
          spec:
            containers:
              - name: longhorn-manager
                resources: {requests: {memory: 384Mi, cpu: 50m}}   # p95 310Mi, max 345Mi

  # STOR-48: new volumes keep their data when a PVC is deleted or pruned. Longhorn builds
  # the `longhorn` StorageClass from this ConfigMap; upstream ships Delete, and a hand
  # edit is undone by selfHeal on the next sync (2026-10-24). Copy of the v1.13.0 content
  # with only reclaimPolicy changed: re-diff it against upstream on every Longhorn bump.
  - target: {kind: ConfigMap, name: longhorn-storageclass}
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata: {name: longhorn-storageclass}
      data:
        storageclass.yaml: |
          kind: StorageClass
          apiVersion: storage.k8s.io/v1
          metadata:
            name: longhorn
            annotations:
              storageclass.kubernetes.io/is-default-class: "true"
          provisioner: driver.longhorn.io
          allowVolumeExpansion: true
          reclaimPolicy: "Retain"
          volumeBindingMode: Immediate
          parameters:
            numberOfReplicas: "3"
            staleReplicaTimeout: "30"
            fromBackup: ""
            fsType: "ext4"
            dataLocality: "disabled"
            unmapMarkSnapChainRemoved: "ignored"
            disableRevisionCounter: "true"
            dataEngine: "v1"
            backupTargetName: "default"

  # NOT here, deliberately: an ipBlock 10.42.0.0/16 rule on the longhorn-manager
  # NetworkPolicy (e91bfb0, reverted the same day). It fixed the nightly "connection
  # refused" race of the daily-backup pod, but port 9500 is an unauthenticated API that
  # can delete volumes, and 29 namespaces have no egress policy. backup-catchup.yaml
  # handles the missed night instead, through the Kubernetes API only.
