# Rebalance replicas across nodes after a drain, not just restore minimal redundancy.
#
# The default (least-effort) only acts when a node holds zero replicas. On 2026-10-16 the
# worker memory-limit fix drained w1 and w2 one after the other; w1 stayed down past the
# 600 s replenishment wait, so Longhorn rebuilt nearly all of its replicas on g2 and never
# moved them back: g2 reached 86% of its scheduling ceiling (205 of 226 GiB scheduled, 28
# replicas) while w1 sat at 7 GiB with 2 replicas. LonghornNodeSchedulingCeiling fired for
# two days. best-effort spreads replicas evenly across nodes and disks, so the next drain
# self-heals instead of parking the cluster's PVC ceiling on one node.
#
# Rebuilds are throttled by concurrent-replica-rebuild-per-node-limit (default 5) and run
# on the storage network, so expect a few hours of background copying after this lands.
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: replica-auto-balance
  namespace: longhorn-system
value: best-effort
