# ArgoCD managing itself. The base is the UPSTREAM install manifest pinned to the
# exact version already running, so the first sync is a no-op rather than ArgoCD
# rewriting its own deployment while it runs.
#
# Bump procedure: change the tag below, let ArgoCD sync, verify it comes back.
# If a bad version ever wedges the controller, ArgoCD cannot fix ArgoCD — recover
# by applying the upstream manifest for a known-good tag by hand:
#   kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/<tag>/manifests/install.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd

resources:
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.6/manifests/install.yaml
  - traefik-serverstransport.yaml

patches:
  # k3s ServiceLB blanks status.loadBalancer on every LoadBalancer, kube-vip's included,
  # so the stock check held traefik-lan at Progressing forever (CLSTR-37). A LoadBalancer
  # with spec.externalIPs is reachable via kube-proxy whatever its status says.
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cm
      data:
        resource.customizations.health.Service: |
          hs = {status = "Healthy"}
          if obj.spec ~= nil and obj.spec.type == "LoadBalancer" then
            local st = obj.status
            local hasIngress = st ~= nil and st.loadBalancer ~= nil and st.loadBalancer.ingress ~= nil and #st.loadBalancer.ingress > 0
            local hasExternal = obj.spec.externalIPs ~= nil and #obj.spec.externalIPs > 0
            if not hasIngress and not hasExternal then
              hs.status = "Progressing"
              hs.message = "Waiting for a load balancer address"
            end
          end
          return hs
  # Traefik reaches argocd-server over HTTPS (CLSTR-29; see traefik-serverstransport.yaml).
  - target:
      kind: Service
      name: argocd-server
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          traefik.ingress.kubernetes.io/service.serversscheme: https
          traefik.ingress.kubernetes.io/service.serverstransport: argocd-argocd-server@kubernetescrd
  # Keep the application controller off the control-plane/etcd nodes. It is the
  # single largest movable pod in the cluster (~1.35Gi) and it was living on r1,
  # an etcd member, which sat at 85% memory until 2026-08-29. Preferred, not
  # required: if the workers are gone it may still schedule anywhere.
  # Was applied as a live kubectl patch; this is that change made durable.
  - target:
      kind: StatefulSet
      name: argocd-application-controller
    patch: |-
      - op: add
        path: /spec/template/spec/affinity
        value:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: DoesNotExist
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: argocd-application-controller
                  topologyKey: kubernetes.io/hostname
              - weight: 5
                podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/part-of: argocd
                  topologyKey: kubernetes.io/hostname
  # Requests = 14d p95, 2026-10-18 (CLSTR-15). No limits: an OOM-killed controller
  # stalls every sync. ponytail: only containers over ~100Mi; the other five sum to
  # ~350Mi. Add them if BestEffort eviction order (CLSTR-6) ever bites.
  - target: {kind: StatefulSet, name: argocd-application-controller}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {requests: {memory: 1Gi, cpu: 100m}}      # p95 974Mi, max 1226Mi
  - target: {kind: Deployment, name: argocd-repo-server}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {requests: {memory: 256Mi, cpu: 50m}}     # p95 180Mi
  - target: {kind: Deployment, name: argocd-dex-server}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {requests: {memory: 128Mi, cpu: 10m}}     # p95 115Mi
