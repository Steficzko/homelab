deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 744h  # 31 days
  # retention_period alone does NOTHING. Loki only deletes when the compactor has
  # retention_enabled, and this block was missing from 2026-06-02 to 2026-09-16:
  # the 10Gi volume grew unbounded to 8.5Gi (~95Mi/day) with 106 days of logs on
  # it. delete_request_store is mandatory once retention is on (filesystem = the
  # same PVC). Deletions land ~2h after marking (retention_delete_delay default).
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
    working_directory: /var/loki/compactor

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: longhorn
    size: 10Gi
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: loki

# Disable all microservice components — singleBinary handles everything
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
patternIngester:
  replicas: 0
indexGateway:
  replicas: 0
bloomCompactor:
  replicas: 0
bloomGateway:
  replicas: 0

# Caches are only useful in distributed/microservices mode — disable in SingleBinary
chunksCache:
  enabled: false

resultsCache:
  enabled: false
