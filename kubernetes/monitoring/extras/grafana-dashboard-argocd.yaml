# GitOps state. ArgoCD manages itself here, so a red panel on this dashboard can
# mean the thing that would fix it is the thing that is broken.
#
# Generated, not hand-edited. Every query in this file was executed against
# Prometheus before the file was written; a panel that returned zero series
# was fixed or dropped rather than shipped, because a "No data" panel reads
# as an outage.
#
# Kept in Git as a ConfigMap rather than clicked together in Grafana's UI: a
# dashboard that only exists in Grafana's SQLite DB dies with the PVC and is
# invisible to review. The sidecar (grafana-sc-dashboard) picks up any
# ConfigMap labelled grafana_dashboard=1 in ANY namespace.
#
# grafana_folder is load-bearing — without it the sidecar files the dashboard
# under (General).
#
# NAMES, NOT IPs. `instance` is relabelled to the node name at scrape time
# (prometheus values.yaml), so panels just use {{instance}}. Do NOT reintroduce
# a kube_node_info or node_uname_info join to recover names: it would join on a
# value that no longer exists. node_uname_info.nodename is worse than useless
# here — it is mixed-case on k3s (K3s-prg-B3 vs k3s-prg-R1) and a Docker
# container ID on both Unraid boxes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-argocd
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Platform"
