# daedalus (VM 100 on pve, 192.168.10.48, VLAN 10) is the PRIMARY for Immich ML (:3003) and LiteLLM whisper
# (:8000), and both fall back silently (Unraid, LXC 111), so without this nobody would learn it is
# down: after an AC loss pve's BIOS forgets SVM and the VM cannot start at all. Probed from a pod:
# pods leave through the node IPs, which are the only LAN sources daedalus's ufw admits.
# Alert: MlDaedalusDown (estate-alerts.yaml) on last successful run older than 30 min.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ml-daedalus-probe
  namespace: monitoring
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          securityContext: { runAsUser: 65534, runAsGroup: 65534, runAsNonRoot: true }
          containers:
            - name: probe
              image: busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
              command:
                - sh
                - -c
                - |
                  H=192.168.10.48
                  # fresh pods are refused for ~30-45s until kube-router learns their IP
                  i=0; until wget -q -T 5 -O /dev/null http://$H:3003/ping; do
                    i=$((i+1)); [ $i -ge 12 ] && { echo "DOWN: immich-ml $H:3003/ping"; exit 1; }; sleep 5
                  done
                  echo "ok: immich-ml $H:3003"
                  wget -q -T 5 -O /dev/null http://$H:8000/health || { echo "DOWN: whisper $H:8000/health"; exit 1; }
                  echo "ok: whisper $H:8000"
              resources:
                requests: { memory: 8Mi, cpu: 5m }
                limits: { memory: 32Mi }
