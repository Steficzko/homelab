         "legendFormat": "",
         "refId": "D",
         "instant": true,
         "range": false
        }
       ],
       "transformations": [
        {
         "id": "joinByField",
         "options": {
          "byField": "target",
          "mode": "outer"
         }
        },
        {
         "id": "organize",
         "options": {
          "excludeByName": {
           "Time": true,
           "Time 1": true,
           "Time 2": true,
           "Time 3": true,
           "Time 4": true
          },
          "indexByName": {
           "target": 0,
           "Value #A": 1,
           "Value #B": 2,
           "Value #C": 3,
           "Value #D": 4
          },
          "renameByName": {
           "target": "Namespace / PVC",
           "Value #A": "Age",
           "Value #B": "Snapshots",
           "Value #C": "Volume size",
           "Value #D": "Uploaded"
          }
         }
        },
        {
         "id": "sortBy",
         "options": {
          "fields": {},
          "sort": [
           {
            "field": "Age",
            "desc": true
           }
          ]
         }
        }
