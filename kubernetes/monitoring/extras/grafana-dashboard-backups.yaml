        {
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "sum by (target) (label_join(count by (volume) (max by (backup,volume) (longhorn_backup_state)) * on (volume) group_left(pvc,pvc_namespace) (max by (volume,pvc,pvc_namespace) (longhorn_volume_last_backup_at) * 0 + 1), \"target\", \"/\", \"pvc_namespace\", \"pvc\"))",
