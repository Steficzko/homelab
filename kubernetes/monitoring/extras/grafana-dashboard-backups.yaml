# Backups — the one dashboard that answers "is my data actually safe?".
#
# Three independent systems back this estate up and they protect different things.
# Conflating them is how an estate ends up with a green dashboard and no data:
#
#   1. Application CronJobs (19 of them, 15 namespaces) — logical pg_dump /
#      mysqldump / app exports. These cover the databases.
#   2. Longhorn volume backups — block-level, to the MinIO backupstore. The ONLY
#      backups here that contain PVC bytes. 32 of 49 volumes carry the
#      daily-backup recurring job.
#   3. Velero — API objects only. 5.9 MB for the whole cluster. It restores the
#      shape of the cluster and none of the contents. Every Velero panel on this
#      dashboard says so on the panel itself.
#
# Age-since-last-success is the number this dashboard is built around. A CronJob
# whose status reads "succeeded" but whose last success was nine days ago is the
# failure that actually loses data, and it is invisible on any panel that only
# shows a success/fail state.
#
# Traps baked into these queries:
#   * All five longhorn-managers export every volume and every backup. Counts are
#     always count(count by (volume) ...) / max by (backup) ...; a plain count()
#     reports roughly five times the truth.
#   * 17 volumes have longhorn_volume_last_backup_at == 0 (never backed up). Any
#     "time() - last_backup_at" without a "> 0" filter renders them as 57 years
#     old and drags every max() panel with them.
#   * Backup metrics carry only the volume UUID. PVC names are recovered by
#     joining longhorn_volume_last_backup_at with "* 0 + 1" — joining on the raw
#     metric multiplies every size by a unix timestamp.
#   * Four CronJobs are named postgres-backup in four different namespaces.
#     Tables join on a label_join'd "namespace/cronjob" key, never on cronjob.
#   * snapshot-cleanup is weekly. Counting it in a ">26h is stale" tile paints the
#     dashboard red six days out of seven, so it has its own tile in days.
#
# Generated by a script, not hand-edited. Every query in this file was executed
# against Prometheus through the Grafana datasource proxy before the file was
# written; nothing here returns zero series.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-backups
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
  annotations:
    grafana_folder: Platform
data:
