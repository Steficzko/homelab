         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "expr": "sum by (target) (label_join(max by (volume) (longhorn_backup_actual_size_bytes) * on (volume) group_left(pvc,pvc_namespace) (max by (volume,pvc,pvc_namespace) (longhorn_volume_last_backup_at) * 0 + 1), \"target\", \"/\", \"pvc_namespace\", \"pvc\"))",
         "legendFormat": "",
         "refId": "C",
         "instant": true,
         "range": false
        },
        {
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
