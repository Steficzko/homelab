              "range": true
            }
          ]
        }
      ],
      "templating": {
        "list": []
      },
      "annotations": {
        "list": []
      },
      "description": "TLS certificate lifecycle. Default range is 30 days because a renewal cycle is invisible at 6 hours."
    }
