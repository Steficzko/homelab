# TLS certificate lifecycle.
#
# Default time range is 30 days, not 6 hours: a Let's Encrypt renewal cycle is
# completely invisible at 6h, and the sawtooth IS the signal.
#
# certmanager_certificate_ready_status carries a `condition` label with one
# series each for True/False/Unknown. Summing it without condition="True"
# triple-counts every certificate.
#
# Generated, not hand-edited. Every query in this file was executed against
# Prometheus before the file was written; a panel that returned zero series
# was fixed or dropped rather than shipped, because a "No data" panel reads
# as an outage.
#
# Kept in Git as a ConfigMap rather than clicked together in Grafana's UI: a
# dashboard that only exists in Grafana's SQLite DB dies with the PVC and is
# invisible to review. The sidecar (grafana-sc-dashboard) picks up any
# ConfigMap labelled grafana_dashboard=1 in ANY namespace.
#
# grafana_folder is load-bearing — without it the sidecar files the dashboard
# under (General).
#
# NAMES, NOT IPs. `instance` is relabelled to the node name at scrape time
# (prometheus values.yaml), so panels just use {{instance}}. Do NOT reintroduce
# a kube_node_info or node_uname_info join to recover names: it would join on a
# value that no longer exists. node_uname_info.nodename is worse than useless
# here — it is mixed-case on k3s (K3s-prg-B3 vs k3s-prg-R1) and a Docker
# container ID on both Unraid boxes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-cert-manager
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Platform"
data:
  cert-manager.json: |
    {
      "uid": "homelab-cert-manager",
      "title": "cert-manager",
      "tags": [
        "homelab",
        "platform",
        "tls"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "1m",
      "editable": true,
      "graphTooltip": 1,
      "time": {
        "from": "now-30d",
        "to": "now"
      },
      "panels": [
        {
          "id": 368,
          "type": "row",
          "title": "At a glance",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 369,
          "type": "stat",
          "title": "Certificates",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "text": {}
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(certmanager_certificate_expiration_timestamp_seconds) or vector(0)",
              "legendFormat": "",
              "refId": "G",
              "instant": true,
              "range": false
            }
          ]
        },
        {
          "id": 371,
          "type": "stat",
          "title": "Ready",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "text": {}
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(certmanager_certificate_ready_status{condition=\"True\"}) or vector(0)",
              "legendFormat": "",
              "refId": "I",
              "instant": true,
              "range": false
            }
          ]
        },
        {
          "id": 373,
          "type": "stat",
          "title": "Not ready",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "text": {}
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(certmanager_certificate_expiration_timestamp_seconds) - sum(certmanager_certificate_ready_status{condition=\"True\"}) or vector(0)",
              "legendFormat": "",
              "refId": "K",
              "instant": true,
              "range": false
            }
          ]
        },
        {
          "id": 375,
          "type": "stat",
          "title": "Soonest expiry",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 604800
                  },
                  {
                    "color": "green",
                    "value": 1209600
                  }
                ]
              },
              "unit": "s",
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "text": {}
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "(min(certmanager_certificate_expiration_timestamp_seconds) - time()) or vector(0)",
              "legendFormat": "",
              "refId": "M",
              "instant": true,
              "range": false
            }
          ]
        },
        {
          "id": 377,
          "type": "stat",
          "title": "Expiring < 14d",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "text": {}
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count((certmanager_certificate_expiration_timestamp_seconds - time()) < 1209600) or vector(0)",
              "legendFormat": "",
              "refId": "O",
              "instant": true,
              "range": false
            }
          ]
        },
        {
          "id": 379,
          "type": "stat",
          "title": "ACME orders failed (24h)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "text": {}
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(increase(certmanager_http_acme_client_request_count{status!~\"2..\"}[24h])) or vector(0)",
              "legendFormat": "",
              "refId": "Q",
              "instant": true,
              "range": false
            }
          ]
        },
        {
          "id": 381,
          "type": "row",
          "title": "Certificates",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "panels": []
        },
        {
          "id": 383,
          "type": "table",
          "title": "Expiry table",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 12,
            "w": 24,
            "x": 0,
            "y": 6
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "custom": {
                "align": "auto",
                "filterable": false
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Days left"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "d"
                  },
                  {
                    "id": "decimals",
                    "value": 1
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background",
                      "mode": "gradient"
                    }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "red",
                          "value": null
                        },
                        {
                          "color": "orange",
                          "value": 7
                        },
                        {
                          "color": "green",
                          "value": 14
                        }
                      ]
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "footer": {
              "show": false
            },
            "cellHeight": "sm"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "(certmanager_certificate_expiration_timestamp_seconds - time()) / 86400",
              "legendFormat": "",
              "refId": "S",
              "instant": true,
              "range": false
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "job": true,
                  "instance": true,
                  "container": true,
                  "endpoint": true,
                  "namespace": true,
                  "pod": true,
                  "service": true,
                  "issuer_group": true,
                  "__name__": true
                },
                "indexByName": {
                  "name": 0,
                  "exported_namespace": 1,
                  "issuer_name": 2,
                  "issuer_kind": 3,
                  "Value": 4
                },
                "renameByName": {
                  "name": "Certificate",
                  "exported_namespace": "Namespace",
                  "issuer_name": "Issuer",
                  "issuer_kind": "Issuer kind",
                  "Value": "Days left"
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "fields": {},
                "sort": [
                  {
                    "field": "Days left"
                  }
                ]
              }
            }
          ],
          "description": "Let's Encrypt certificates renew at 30 days remaining. Anything sitting below 14 days is not renewing."
        },
        {
          "id": 384,
          "type": "row",
          "title": "Renewal activity",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 18
          },
          "panels": []
        },
        {
          "id": 386,
          "type": "timeseries",
          "title": "Days until expiry",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 19
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "d",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 8,
                "gradientMode": "opacity",
