# Photo/video counts and storage for the four Immich libraries in k3s.
#
# Fed by immich-sql-exporter (kubernetes/apps/immich/metrics/sql-exporter.yaml),
# NOT by Immich's own telemetry: IMMICH_TELEMETRY_INCLUDE exports job queues,
# request latencies and process metrics, and exactly one business gauge
# (immich.users.total). It has no asset count and no byte total, so enabling it
# would not have answered the question.
#
# Counts follow Immich's own definition (UserRepository.getUserStats): not
# soft-deleted, and visibility <> 'hidden' — hidden is the video half of a
# live/motion photo, and counting it double-counts every iPhone photo.
#
# Storage is split into uploaded vs external-library bytes deliberately. Immich's
# statistics API only counts uploads, so it reports 0 B for a library-backed
# instance. Lightroom is 100%% external (300k assets, 7.3 TB) and its storage
# panel would read 0 B — the exact "looks broken" failure this estate avoids.
#
# Labelled by `target` (the library name). These metrics carry no `instance` and
# nothing here is addressed by IP.
#
# Generated, not hand-edited. Every query in this file was executed against
# Prometheus before the file was written; a panel that returned zero series
# was fixed or dropped rather than shipped, because a "No data" panel reads
# as an outage.
#
# Kept in Git as a ConfigMap rather than clicked together in Grafana's UI: a
# dashboard that only exists in Grafana's SQLite DB dies with the PVC and is
# invisible to review. The sidecar (grafana-sc-dashboard) picks up any
# ConfigMap labelled grafana_dashboard=1 in ANY namespace.
#
# grafana_folder is load-bearing — without it the sidecar files the dashboard
# under (General).
#
# NAMES, NOT IPs. `instance` is relabelled to the node name at scrape time
# (prometheus values.yaml), so panels just use {{instance}}. Do NOT reintroduce
# a kube_node_info or node_uname_info join to recover names: it would join on a
# value that no longer exists. node_uname_info.nodename is worse than useless
# here — it is mixed-case on k3s (K3s-prg-B3 vs k3s-prg-R1) and a Docker
# container ID on both Unraid boxes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-immich
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Apps"
