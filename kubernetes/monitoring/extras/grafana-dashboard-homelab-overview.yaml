# Homelab overview dashboard — the single screen that answers "is the estate OK?".
#
# Kept in Git as a ConfigMap rather than clicked together in Grafana's UI: a
# dashboard that only exists in Grafana's SQLite DB is lost with the PVC and is
# invisible to review. The sidecar (grafana-sc-dashboard) picks up any ConfigMap
# labelled grafana_dashboard=1 in ANY namespace and drops it into Grafana.
#
# NAMES, NOT IPs — and the fix lives at the SOURCE, not here. `instance` is
# relabelled to the node name at scrape time (prometheus values.yaml,
# prometheus-node-exporter.prometheus.monitor.relabelings), so every dashboard in
# Grafana — including the 25 stock ones — shows k3s-prg-r1 rather than
# 192.168.1.201:9100. This dashboard therefore just uses {{instance}}; the earlier
# kube_node_info join it carried is gone, because it would now break.
# Proxmox still joins pve_guest_info to turn id="lxc/110" into name="xt-ml".
#
# Every panel query was executed against Prometheus BEFORE committing and confirmed
# to return series — no speculative panels. Two corrections that came out of that
# check and are worth not re-making:
#   * longhorn_volume_* is exported by all 5 longhorn-managers, so a naive
#     count() reports ~294 volumes instead of 49. Hence count(count by (volume) ...).
#   * node_memory_* / node_filesystem_* carry `instance`, NOT `node`. Grouping by
#     node collapses all five hosts into one meaningless 267% figure.
# NAS row: both Unraid boxes run node-exporter on :9110 (9100 is MinIO on both).
# Array disks are matched by mountpoint=~"/mnt/(disk|cache|dataservices|virtual).*"
# rather than a flat /mnt/.* — Unraid also mounts several 1 MB tmpfs stubs under
# /mnt (addons, remotes, rootshare, disks) that would otherwise sit at 0% and
# clutter the panel.
#
# Panels that can legitimately be empty (degraded volumes, failed pods) use
# `or vector(0)` so a healthy estate renders 0 rather than "No data".
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-homelab-overview
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
