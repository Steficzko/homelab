# The one screen that answers "is the estate OK?" — every machine side by side.
#
# This is deliberately the ONLY estate-wide dashboard. A separate "Estate"
# dashboard beside this one would be two dashboards for one subject, which is
# the duplication this layout exists to remove.
#
# Traps baked into the queries here:
#   * longhorn_volume_* is exported by all 5 longhorn-managers, so a naive
#     count() reports ~294 volumes instead of 49 — hence count(count by (volume)).
#   * node_memory_* / node_filesystem_* carry `instance`, NOT `node`. Grouping
#     by node collapses all five hosts into one meaningless figure.
#   * Unraid mounts 1 MB tmpfs stubs under /mnt (addons, remotes, rootshare,
#     disks). They are excluded by fstype, not by name — /mnt/disks matches a
#     "disk.*" name filter and drags a 0%% series through every array panel.
#   * Speedtest metrics are speedtest_tracker_*, not speedtest_*. The old
#     speedtest_download_bits / speedtest_ping_latency panels here were empty
#     from the day they were written; those metric names never existed.
#
# Generated, not hand-edited. Every query in this file was executed against
# Prometheus before the file was written; a panel that returned zero series
# was fixed or dropped rather than shipped, because a "No data" panel reads
# as an outage.
#
# Kept in Git as a ConfigMap rather than clicked together in Grafana's UI: a
# dashboard that only exists in Grafana's SQLite DB dies with the PVC and is
# invisible to review. The sidecar (grafana-sc-dashboard) picks up any
# ConfigMap labelled grafana_dashboard=1 in ANY namespace.
#
# grafana_folder is load-bearing — without it the sidecar files the dashboard
# under (General).
#
# NAMES, NOT IPs. `instance` is relabelled to the node name at scrape time
# (prometheus values.yaml), so panels just use {{instance}}. Do NOT reintroduce
# a kube_node_info or node_uname_info join to recover names: it would join on a
# value that no longer exists. node_uname_info.nodename is worse than useless
# here — it is mixed-case on k3s (K3s-prg-B3 vs k3s-prg-R1) and a Docker
# container ID on both Unraid boxes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-homelab-overview
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Homelab"
