# kube-prometheus-stack Helm values
# Chart: prometheus-community/kube-prometheus-stack v85.0.3 (Prometheus Operator v0.90.1)
# Installed: helm install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#              -n monitoring --create-namespace -f values.yaml
#
# Includes: Prometheus, Grafana, Alertmanager, node-exporter, kube-state-metrics
# Access: kubectl port-forward -n monitoring svc/kube-prometheus-stack-grafana 3000:80
# Default Grafana credentials: admin / prom-operator (change after first login)

grafana:
  deploymentStrategy:
    type: Recreate
  admin:
    existingSecret: kube-prometheus-stack-grafana
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    storageClassName: longhorn
    size: 5Gi
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: grafana

prometheus:
  prometheusSpec:
    retention: 7d
    retentionSize: 8GiB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          resources:
            requests:
              storage: 20Gi
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: prometheus

alertmanager:
  alertmanagerSpec:
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: alertmanager
