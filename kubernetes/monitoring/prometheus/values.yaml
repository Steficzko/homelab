# kube-prometheus-stack Helm values
# Chart: prometheus-community/kube-prometheus-stack v85.0.3 (Prometheus Operator v0.90.1)
# Installed: helm install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#              -n monitoring --create-namespace -f values.yaml
#
# Includes: Prometheus, Grafana, Alertmanager, node-exporter, kube-state-metrics
# Access: kubectl port-forward -n monitoring svc/kube-prometheus-stack-grafana 3000:80
# Default Grafana credentials: admin / prom-operator (change after first login)

# K3s bundles controller-manager/scheduler/proxy/etcd into one process and does not
# expose them as separate scrape targets, so kube-prometheus-stack's default
# ServiceMonitors always report them "down" (KubeControllerManagerDown etc.) —
# false positives. Disabling drops both the scrape target and the bogus *Down rules.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

grafana:
  # ADR-030 pattern: prefer workers (non-control-plane), soft fallback.
  # 2026-08-29: b3 was at 77% memory with only one volume-free pod to move, so
  # grafana comes too. It holds a 5Gi RWO Longhorn volume, meaning the move is a
  # detach/reattach rather than a plain restart — dashboards blink for ~a minute.
  # deploymentStrategy Recreate below already prevents two pods contending for it.
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
  deploymentStrategy:
    type: Recreate
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki.monitoring.svc.cluster.local:3100
      access: proxy
      isDefault: false
  # Three exporters were being scraped and displayed NOWHERE: longhorn-backend
  # (5 targets, 63 metrics), node-exporter (5 targets, 321 metrics) and
  # pve-exporter (28 metrics). The stock chart ships 25 dashboards, but every one
  # of them is Kubernetes internals — API server, kubelet, CoreDNS — so the estate
  # was fully instrumented and almost none of it was actually visible.
  #
  # Fetched by gnetId at pod start; verified Grafana can reach grafana.com and that
  # each ID resolves to the dashboard named below. Revisions are PINNED so a
  # dashboard cannot change under you between restarts — bump them deliberately.
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: homelab
          orgId: 1
          folder: Homelab
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/homelab
  dashboards:
    homelab:
      longhorn:
        gnetId: 13032        # Longhorn Example v1.1.0
        revision: 6
        datasource: Prometheus
      node-exporter-full:
        gnetId: 1860         # Node Exporter Full — disks, network, temps, per-node
        revision: 45
        datasource: Prometheus
      proxmox:
        gnetId: 10347        # Proxmox via Prometheus (pve-exporter)
        revision: 5
        datasource: Prometheus
  admin:
    existingSecret: kube-prometheus-stack-grafana
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    storageClassName: longhorn
    size: 5Gi
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: grafana

prometheus:
  prometheusSpec:
    retention: 7d
    retentionSize: 8GiB
    # Added 2026-08-20 after Prometheus was OOM-killed (exit 137) on k3s-prg-w2.
    # It ran with no requests/limits at all, which meant two things: the scheduler
    # counted it as consuming nothing when placing pods, and under node memory
    # pressure the kernel picked it first (BestEffort dies before Burstable).
    # Steady state measured 2776Mi. requests drive scheduling; the limit is
    # deliberately generous because WAL replay after a restart spikes well above
    # steady state — too tight a limit turns one OOM into a crash-loop.
    resources:
      requests:
        memory: 3Gi
        cpu: 200m
      limits:
        memory: 6Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          resources:
            requests:
              storage: 20Gi
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: prometheus
    # Speedtest Tracker on both Unraid boxes. They live OUTSIDE the cluster, so a
    # ServiceMonitor cannot reach them — static targets are the only option.
    #
    # /prometheus is gated by the app's own IP allow-list (a DATABASE setting, not
    # an env var) and 403s until the SOURCE address is listed. That address differs
    # per site and neither is obvious:
    #   Prague  sees 192.168.1.202 — the k3s node's real LAN IP, preserved.
    #   Greece  sees 192.168.16.1 — its Docker runs userland-proxy, which rewrites
    #     the source to the bridge gateway, so no real client IP ever arrives and
    #     192.168.16.0/20 had to be allowed there instead.
    # 5m interval is deliberate: the data only changes hourly, so scraping faster
    # just adds load against an off-cluster HTTP endpoint for no extra resolution.
    additionalScrapeConfigs:
      - job_name: speedtest-tracker
        metrics_path: /prometheus
        scrape_interval: 5m
        scrape_timeout: 30s
        static_configs:
          - targets: ["192.168.1.100:8765"]
            labels:
              site: prague
              nas: repy
          - targets: ["100.85.129.88:8765"]
            labels:
              site: greece
              nas: ptolemaida

alertmanager:
  alertmanagerSpec:
    # mounts at /etc/alertmanager/secrets/alertmanager-telegram/bottoken
    secrets:
      - alertmanager-telegram
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: alertmanager
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['namespace', 'alertname']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: telegram
      routes:
        # Watchdog = always-firing heartbeat; InfoInhibitor = suppression helper.
        # Neither is a real alert — both go to the black hole, not Telegram.
        - matchers:
            - alertname =~ "Watchdog|InfoInhibitor"
          receiver: "null"
    receivers:
      - name: "null"
      - name: telegram
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/bottoken
            chat_id: 692889944
            send_resolved: true
            parse_mode: ""
            message: |-
              {{ if eq .Status "firing" }}🔴 FIRING{{ else }}✅ RESOLVED{{ end }} [{{ .CommonLabels.severity }}]
              {{ range .Alerts }}{{ .Labels.alertname }} — {{ .Labels.namespace }}/{{ .Labels.pod }}{{ .Labels.instance }}
              {{ .Annotations.summary }}{{ .Annotations.description }}
              {{ end }}
    inhibit_rules:
      - source_matchers: ['severity = "critical"']
        target_matchers: ['severity =~ "warning|info"']
        equal: ['namespace', 'alertname']
