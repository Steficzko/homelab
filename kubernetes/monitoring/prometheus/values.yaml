# kube-prometheus-stack Helm values
# Chart: prometheus-community/kube-prometheus-stack v85.0.3 (Prometheus Operator v0.90.1)
# Installed: helm install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#              -n monitoring --create-namespace -f values.yaml
#
# Includes: Prometheus, Grafana, Alertmanager, node-exporter, kube-state-metrics
# Access: kubectl port-forward -n monitoring svc/kube-prometheus-stack-grafana 3000:80
# Default Grafana credentials: admin / prom-operator (change after first login)

# K3s bundles controller-manager/scheduler/proxy/etcd into one process and does not
# expose them as separate scrape targets, so kube-prometheus-stack's default
# ServiceMonitors always report them "down" (KubeControllerManagerDown etc.) —
# false positives. Disabling drops both the scrape target and the bogus *Down rules.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

# Make `instance` the NODE NAME instead of 192.168.1.20x:9100.
#
# This is the single highest-leverage label change available: every stock dashboard
# (Node Exporter Full, all the Kubernetes/Compute Resources ones) uses `instance` as
# its variable, so with the default they all present the fleet as five IP:port
# strings. Relabelling once at the source renames them everywhere at once, rather
# than patching join logic into each dashboard.
#
# COORDINATED CHANGE — this breaks anything that joined ON the old value:
#   * the Homelab Overview dashboard joined via kube_node_info.internal_ip to
#     recover the name; those joins are removed in the same commit and now just use
#     {{instance}} directly.
#   * homepage's node widgets hardcoded instance="192.168.1.20x:9100" in 15 PromQL
#     queries; those are rewritten to the node names in the same commit.
# Landing any of these three alone leaves broken panels.
prometheus-node-exporter:
  prometheus:
    monitor:
      relabelings:
        - action: replace
          sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: instance

# Same treatment for kubelet, which is the other genuinely node-level scrape and
# feeds every Kubernetes/Compute Resources dashboard as well as its own.
#
# kubelet metrics already carry a `node` label, but the stock dashboards key on
# `instance`, so they still displayed 192.168.1.20x:10250. The chart's own
# relabelings here are minimal — a single __metrics_path__ -> metrics_path — and
# `relabelings` REPLACES rather than appends, so that one is repeated below. Drop it
# and cAdvisor/probes series lose the metrics_path label they are distinguished by.
#
# Not touched deliberately: apiserver, and the in-cluster pod targets (argocd,
# cert-manager, longhorn, ingress-nginx...). Those are keyed by pod IP, which is
# ephemeral and changes on every restart — the `pod` label already names them, and
# rewriting instance there would fight the convention every stock dashboard assumes.
kubelet:
  serviceMonitor:
    relabelings: &kubeletRelabel
      - action: replace
        sourceLabels: [__metrics_path__]
        targetLabel: metrics_path
      - action: replace
        sourceLabels: [__meta_kubernetes_endpoint_address_target_name]
        targetLabel: instance
    cAdvisorRelabelings: *kubeletRelabel
    probesRelabelings: *kubeletRelabel
    resourceRelabelings: *kubeletRelabel

grafana:
  # ADR-030 pattern: prefer workers (non-control-plane), soft fallback.
  # 2026-08-29: b3 was at 77% memory with only one volume-free pod to move, so
  # grafana comes too. It holds a 5Gi RWO Longhorn volume, meaning the move is a
  # detach/reattach rather than a plain restart — dashboards blink for ~a minute.
  # deploymentStrategy Recreate below already prevents two pods contending for it.
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
  deploymentStrategy:
    type: Recreate
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki.monitoring.svc.cluster.local:3100
      access: proxy
      isDefault: false
  # Three exporters were being scraped and displayed NOWHERE: longhorn-backend
  # (5 targets, 63 metrics), node-exporter (5 targets, 321 metrics) and
  # pve-exporter (28 metrics). The stock chart ships 25 dashboards, but every one
  # of them is Kubernetes internals — API server, kubelet, CoreDNS — so the estate
  # was fully instrumented and almost none of it was actually visible.
  #
  # Fetched by gnetId at pod start; verified Grafana can reach grafana.com and that
  # each ID resolves to the dashboard named below. Revisions are PINNED so a
  # dashboard cannot change under you between restarts — bump them deliberately.
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: homelab
          orgId: 1
          folder: Homelab
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/homelab
        # Node Exporter Full is a 284-panel community dashboard that overlaps the
        # curated Machines dashboards. It is kept because it is a genuinely useful
        # drill-down, but it does not belong beside the curated set — a reader
        # opening `Homelab` should find the one canonical view, not two competing
        # ones. Parking it in `Reference` is additive and reverses by moving the
        # entry back under `homelab:` below.
        - name: reference
          orgId: 1
          folder: Reference
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/reference
  dashboards:
    homelab:
      longhorn:
        gnetId: 13032        # Longhorn Example v1.1.0
        revision: 6
        datasource: Prometheus
      proxmox:
        gnetId: 10347        # Proxmox via Prometheus (pve-exporter)
        revision: 5
        datasource: Prometheus
    reference:
      node-exporter-full:
        gnetId: 1860         # Node Exporter Full — disks, network, temps, per-node
        revision: 45
        datasource: Prometheus
  # Everything the dashboard sidecar picked up landed in (General): 25 stock chart
  # dashboards plus every dashboard we ship as a ConfigMap. (General) is where
  # dashboards go to be un-findable, and a hiring manager opening Grafana sees one
  # undifferentiated list of 26 items.
  #
  # folderAnnotation makes the sidecar read `grafana_folder` off each ConfigMap and
  # file the dashboard under that name; foldersFromFilesStructure is what actually
  # lets Grafana create those folders from the directory tree the sidecar writes.
  # BOTH are required — folderAnnotation alone silently does nothing.
  #
  # `annotations` is applied by the chart to all 25 of its own dashboard ConfigMaps
  # (templates/grafana/dashboards-1.14/*.yaml render it verbatim), which is what
  # moves them out of (General) in one line instead of 25 patches. They are all
  # Kubernetes internals, so they share one folder.
  sidecar:
    dashboards:
      folderAnnotation: grafana_folder
      annotations:
        grafana_folder: "Kubernetes"
      provider:
        foldersFromFilesStructure: true
  # Grafana opened on the stock "Welcome to Grafana" splash — a page of
  # tutorial links and a "Add your first data source" call to action on an
  # estate with 40 dashboards and 20 scrape jobs. Anyone opening this Grafana
  # should land on the one screen that answers "is the estate OK?".
  #
  # Path, not UID. Grafana's default_home_dashboard_uid exists, but it resolves
  # against the database, and these dashboards are provisioned from ConfigMaps
  # by the sidecar — their UIDs are stable but the path is what is guaranteed to
  # be readable at boot, before provisioning has necessarily run.
  #
  # The filename is the ConfigMap's DATA KEY (homelab-overview.json), not the
  # ConfigMap name, and the directory is the grafana_folder annotation. Rename
  # either and Grafana silently falls back to the splash page — there is no
  # error, the file just is not there. Verified against the live pod:
  #   /tmp/dashboards/Homelab/homelab-overview.json
  grafana.ini:
    dashboards:
      default_home_dashboard_path: /tmp/dashboards/Homelab/homelab-overview.json
  admin:
    existingSecret: kube-prometheus-stack-grafana
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    storageClassName: longhorn
    size: 5Gi
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: grafana

prometheus:
  prometheusSpec:
    # retention and retentionSize are an OR, not an AND: whichever limit is hit
    # first wins. At 8GiB, size won every time and 7d was decorative.
    #
    # Measured before changing anything, on 2026-09-07:
    #   prometheus_tsdb_lowest_timestamp        -> 3.58 days of history
    #   prometheus_tsdb_storage_blocks_bytes    -> 6.90 GB
    #   prometheus_tsdb_wal_storage_size_bytes  -> 0.92 GB
    #   prometheus_tsdb_head_chunks_storage_..  -> 0.10 GB   = 7.92 GB total
    #   prometheus_tsdb_size_retentions_total   -> 20    <- size evicted 20 times
    #   prometheus_tsdb_time_retentions_total   -> 0     <- time never did
    # Since 2.28 retentionSize counts the WHOLE data directory, WAL included, so
    # the effective ceiling really was 8GiB against a 7.92 GB working set.
    #
    # Consequence: every panel with a range longer than ~3 days was empty, and
    # the speedtest "vs its own 7-day median" alert had no 7 days to compare to.
    #
    # 14GiB = 15.03 GB. Scaling the measured blocks linearly, 7 days needs
    # 6.90 * (7/3.58) = 13.5 GB of blocks plus ~1.0 GB of WAL and head chunks,
    # so 14.5 GB — it fits, with the PVC's remaining 6.4 GB (of 21.5 GB usable
    # from the 20Gi Longhorn volume) left free for compaction, which needs room
    # to write a new block before deleting the old ones.
    #
    # This is sized for TODAY's 528k active series. If the series count grows
    # past roughly 550k, size becomes the binding limit again and the honest fix
    # is a 30Gi PVC, not a bigger number here against the same volume.
    retention: 7d
    retentionSize: 14GiB
    # Added 2026-08-20 after Prometheus was OOM-killed (exit 137) on k3s-prg-w2.
    # It ran with no requests/limits at all, which meant two things: the scheduler
    # counted it as consuming nothing when placing pods, and under node memory
    # pressure the kernel picked it first (BestEffort dies before Burstable).
    # Steady state measured 2776Mi. requests drive scheduling; the limit is
    # deliberately generous because WAL replay after a restart spikes well above
    # steady state — too tight a limit turns one OOM into a crash-loop.
    resources:
      requests:
        memory: 3Gi
        cpu: 200m
      limits:
        memory: 6Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          resources:
            requests:
              storage: 20Gi
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: prometheus
    # Speedtest Tracker on both Unraid boxes. They live OUTSIDE the cluster, so a
    # ServiceMonitor cannot reach them — static targets are the only option.
    #
    # /prometheus is gated by the app's own IP allow-list (a DATABASE setting, not
    # an env var) and 403s until the SOURCE address is listed. That address differs
    # per site and neither is obvious:
    #   Prague  sees 192.168.1.202 — the k3s node's real LAN IP, preserved.
    #   Greece  sees 192.168.16.1 — its Docker runs userland-proxy, which rewrites
    #     the source to the bridge gateway, so no real client IP ever arrives and
    #     192.168.16.0/20 had to be allowed there instead.
    # 5m interval is deliberate: the data only changes hourly, so scraping faster
    # just adds load against an off-cluster HTTP endpoint for no extra resolution.
    additionalScrapeConfigs:
      - job_name: speedtest-tracker
        metrics_path: /prometheus
        scrape_interval: 5m
        scrape_timeout: 30s
        # instance would default to the ip:port; use the friendly name instead so
        # panels and the target list read repy/ptolemaida, matching the node-exporter
        # relabel above.
        relabel_configs:
          - source_labels: [nas]
            target_label: instance
        static_configs:
          - targets: ["192.168.1.100:8765"]
            labels:
              site: prague
              nas: repy
          - targets: ["100.85.129.88:8765"]
            labels:
              site: greece
              nas: ptolemaida
      # The two Unraid NAS boxes themselves. They hold every backup, MinIO, the
      # media stack and the Immich originals, and neither was visible to Prometheus
      # at all — only the speedtest container on each was scraped. This adds CPU,
      # memory, per-array-disk capacity, network and ~19 temperature sensors.
      #
      # Port 9110, not the conventional 9100: MinIO already binds 9100 on both hosts.
      # Prague is reached on its LAN address and Greece over the tailnet, which is
      # the only route to it.
      - job_name: unraid-node-exporter
        metrics_path: /metrics
        scrape_interval: 60s
        relabel_configs:
          - source_labels: [nas]
            target_label: instance
        static_configs:
          - targets: ["192.168.1.100:9110"]
            labels:
              site: prague
              nas: repy
          - targets: ["100.85.129.88:9110"]
            labels:
              site: greece
              nas: ptolemaida

      # ---------------------------------------------------------------------
      # PROPOSED, NOT ENABLED. Both blocks below are commented out because each
      # needs a credential that must not be created without Stefanos deciding.
      #
      # MinIO and Uptime Kuma both already speak Prometheus natively and both
      # currently refuse Prometheus:
      #     http://192.168.1.100:9100/minio/v2/metrics/cluster   -> 403
      #     http://100.85.129.88:9100/minio/v2/metrics/cluster   -> 403
      #     http://100.82.66.30:3001/metrics                     -> 401
      # (verified 2026-09-07). Neither is a scrape-config bug — the endpoints
      # are auth-gated and no credential exists.
      #
      # MinIO matters most: it is the Longhorn backupstore AND the target of the
      # hourly Prague->Greece replication, so with it unscraped the Backups
      # dashboard can show that a backup ran but not that the bucket holding it
      # is healthy or how full it is.
      #
      # Two ways to open MinIO, and the recommendation is the second:
      #   a) set MINIO_PROMETHEUS_AUTH_TYPE=public on both containers. One env
      #      var, no secret to rotate — but it publishes bucket names and sizes
      #      unauthenticated to anything on the LAN and anything on the tailnet,
      #      and the tailnet ACL is a blocklist, not least-privilege.
      #   b) mint a read-only bearer token with
      #         mc admin prometheus generate <alias> --expiry 8760h
      #      store it as a Secret and mount it into Prometheus the same way the
      #      Telegram bot token is mounted into Alertmanager:
      #         prometheusSpec.secrets: [minio-prometheus-token]
      #      which lands at /etc/prometheus/secrets/minio-prometheus-token/token.
      #      Keeps the endpoint authenticated; costs one credential to rotate.
      #
      # Uptime Kuma's /metrics is HTTP Basic with ANY username and an API key as
      # the password, so enabling it means creating an API key in the Kuma UI.
      # Note before doing that: the Kuma admin login is recorded as breached and
      # pending rotation — rotate the login first, then mint the key.
      #
      # Uncomment either block only after the matching Secret exists and is
      # listed in prometheus.prometheusSpec.secrets, or Prometheus will start
      # with a config-reload failure.
      #
      # - job_name: minio
      #   metrics_path: /minio/v2/metrics/cluster
      #   scrape_interval: 60s
      #   authorization:
      #     type: Bearer
      #     credentials_file: /etc/prometheus/secrets/minio-prometheus-token/token
      #   relabel_configs:
      #     - source_labels: [nas]
      #       target_label: instance
      #   static_configs:
      #     - targets: ["192.168.1.100:9100"]
      #       labels:
      #         site: prague
      #         nas: repy
      #     - targets: ["100.85.129.88:9100"]
      #       labels:
      #         site: greece
      #         nas: ptolemaida
      #
      # - job_name: uptime-kuma
      #   metrics_path: /metrics
      #   scrape_interval: 60s
      #   basic_auth:
      #     username: prometheus
      #     password_file: /etc/prometheus/secrets/uptime-kuma-token/apikey
      #   static_configs:
      #     - targets: ["100.82.66.30:3001"]
      #       labels:
      #         site: prague
      #         instance: uptime-kuma

alertmanager:
  alertmanagerSpec:
    # mounts at /etc/alertmanager/secrets/alertmanager-telegram/bottoken
    secrets:
      - alertmanager-telegram
      - alertmanager-deadmanswitch
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: alertmanager
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['namespace', 'alertname']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: telegram
      routes:
        # InfoInhibitor is a suppression helper, not an alert. Black hole.
        - matchers:
            - alertname = "InfoInhibitor"
          receiver: "null"
        # Watchdog fires forever by design. It used to go to "null" alongside
        # InfoInhibitor, which meant NOTHING ever exercised the pager end to end:
        # Prometheus evaluating -> Alertmanager routing -> Telegram token -> phone.
        # A rule that fails to load also fails to fire, so the failure mode of this
        # whole stack is silence, and silence looked identical to health.
        # One heartbeat a day walks the real path. Its ABSENCE is the alarm.
        # Upgrade path: point this at a healthchecks.io webhook so the absence is
        # noticed by something outside the fleet instead of by a human.
        # Watchdog goes to BOTH legs, because they prove different things and
        # continue:true is what lets one alert match two routes.
        #   deadmanswitch -> proves Prometheus is evaluating and Alertmanager is
        #     routing, and healthchecks.io notices the SILENCE from outside the fleet.
        #   telegram      -> proves the actual pager: the bot token and its egress.
        # The webhook alone was a regression: if the bot token died, the dead-man
        # switch would stay green while every real alert vanished. Daily, so it is a
        # heartbeat and not noise.
        - matchers:
            - alertname = "Watchdog"
          receiver: deadmanswitch
          group_wait: 0s
          # group_interval is the floor on how often a group can notify again, so
          # repeat_interval only takes effect on a group_interval boundary. Setting
          # BOTH to 1h meant the repeat timer was never ripe at the 1h tick and fired
          # at the 2h one instead — pings arrived every 2h against a 90m window, so
          # healthchecks.io flipped DOWN then UP every two hours and paged all night
          # (5 false pairs on 2026-09-11). Small group_interval, repeat_interval owns
          # the cadence. 30m pings against a 1h+30m window tolerates one missed ping.
          group_interval: 5m
          repeat_interval: 30m
          continue: true
        - matchers:
            - alertname = "Watchdog"
          receiver: telegram
          group_wait: 0s
          # Same trap as the route above: group_interval is a floor on re-notify, so
          # 24h/24h would have delivered the "daily" heartbeat every 48h. Keep the
          # floor small and let repeat_interval alone set the cadence.
          group_interval: 5m
          repeat_interval: 24h
    receivers:
      - name: "null"
      # Dead-man switch. healthchecks.io expects a ping every hour (30m grace) and
      # alerts when one does not arrive — so it watches for SILENCE, which Telegram
      # cannot do. It sits outside the fleet deliberately: everything that could
      # break the pager (this cluster, Prague Unraid, the tunnel) is inside it.
      # send_resolved is off; Watchdog never resolves, and a resolve ping would
      # just be a second heartbeat.
      - name: deadmanswitch
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-deadmanswitch/url
            send_resolved: false
      - name: telegram
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/bottoken
            chat_id: 692889944
            send_resolved: true
            parse_mode: ""
            message: |-
              {{ if eq .Status "firing" }}🔴 FIRING{{ else }}✅ RESOLVED{{ end }} [{{ .CommonLabels.severity }}]
              {{ range .Alerts }}{{ .Labels.alertname }} — {{ .Labels.namespace }}/{{ .Labels.pod }}{{ .Labels.instance }}
              {{ .Annotations.summary }}{{ .Annotations.description }}
              {{ end }}
    inhibit_rules:
      - source_matchers: ['severity = "critical"']
        target_matchers: ['severity =~ "warning|info"']
        equal: ['namespace', 'alertname']
