# Dead-man switch target for the Alertmanager Watchdog route.
#
# Watchdog fires forever by design, so a notification failing to arrive is the
# signal. Telegram cannot carry that: a human has to notice an absence. This
# healthchecks.io check notices it instead, from OUTSIDE the fleet, which matters
# because everything that could break the pager lives inside it.
#
# Mounted by alertmanagerSpec.secrets as
#   /etc/alertmanager/secrets/alertmanager-deadmanswitch/url
# and read by the webhook receiver's url_file (Alertmanager >= 0.26).
#
# NOT applied by ArgoCD. Like every other *.sops.yaml here, the encrypted file is
# the source of truth in git and the Secret is applied by hand:
#   sops -d kubernetes/monitoring/prometheus/alertmanager-deadmanswitch.sops.yaml | kubectl apply -f -
