apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-tunnel-token-vaclavspanos
  namespace: cloudflare-tunnel
type: Opaque
stringData:
  token: "REPLACE_WITH_VACLAVSPANOS_TUNNEL_TOKEN"
