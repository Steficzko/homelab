# vaclavspanos.com Cloudflare Tunnel token — tunnel ID 78634652-1e5e-4851-a70e-ca7a7f7be98b,
# Cloudflare account 90e7dc33... Public hostnames are set in that account's dashboard (remotely managed):
#     art.vaclavspanos.com -> http://traefik.traefik.svc.cluster.local:80   (Václav Spanos art site, apps/ceramicus)
#
# The real secret lives in secret-vaclavspanos.sops.yaml (SOPS-encrypted, excluded from ArgoCD).
# Apply it out-of-band like the other SOPS secrets:
