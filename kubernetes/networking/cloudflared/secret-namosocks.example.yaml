# namosocks.com Cloudflare Tunnel token — tunnel ID ca867f1b-213c-40ba-be0d-af0f8a11d5fa,
# in the CLIENT's Cloudflare account (e46015daf8cbd2eb8989b0c145df3342, owner: Samrand Hassan).
# Connects the namosocks.com tunnel into the cluster so its public hostnames can target the
# ingress Service (http://ingress-nginx-controller.ingress-nginx.svc.cluster.local:80).
#
# NOTE: public-hostname routing for this tunnel is configured in the CLIENT's Zero Trust
# dashboard (remotely-managed config) — we run the connector only.
#
# The real secret lives in secret-namosocks.sops.yaml (SOPS-encrypted, excluded from ArgoCD).
# Apply it out-of-band like the other SOPS secrets:
#     sops -d kubernetes/networking/cloudflared/secret-namosocks.sops.yaml | kubectl apply -f -
#
# Get / rotate the token: Cloudflare Zero Trust > Networks > Tunnels > (namosocks-k3s) > Configure -> "token".
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-tunnel-token-namosocks
  namespace: cloudflare-tunnel
type: Opaque
stringData:
  token: "REPLACE_WITH_NAMOSOCKS_TUNNEL_TOKEN"
