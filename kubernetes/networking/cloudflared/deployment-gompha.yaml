apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-gompha
  namespace: cloudflare-tunnel
spec:
  replicas: 2   # HA — both connect the Gompha tunnel; Cloudflare load-balances
  selector:
    matchLabels:
      app: cloudflared-gompha
  template:
    metadata:
      labels:
        app: cloudflared-gompha
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: cloudflared-gompha
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.6.1
          args:
            - tunnel
            - --no-autoupdate
            - run
            - --token
            - $(TUNNEL_TOKEN)
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-tunnel-token-gompha   # Gompha (dental) tunnel 2cd98378; separate CF account 61417c55; see secret-gompha.example.yaml
                  key: token
          resources:
            requests:
              memory: 64Mi
              cpu: 10m
            limits:
              memory: 128Mi
              cpu: 200m
