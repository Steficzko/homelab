# Team Elwany Cloudflare Tunnel token — tunnel ID 9bb353e8-09a8-4b4d-9eca-5fa360aa6270.
# This moves the team-elwany tunnel's CONNECTOR into the cluster (so its routes can
# use the ingress Service DNS), replacing the cloudflared-elwany Docker container on Unraid.
#
# Create the real secret as secret-elwany.sops.yaml (SOPS-encrypted, excluded from ArgoCD),
# then apply it manually like the other SOPS secrets:
#     sops -d kubernetes/networking/cloudflared/secret-elwany.sops.yaml | kubectl apply -f -
#
# Get the token from either:
#   - Cloudflare Zero Trust > Networks > Tunnels > (team-elwany) > Configure  -> "token", OR
#   - the existing Unraid container:  docker inspect cloudflared-elwany (the --token arg)
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-tunnel-token-elwany
  namespace: cloudflare-tunnel
type: Opaque
stringData:
  token: "REPLACE_WITH_TEAM_ELWANY_TUNNEL_TOKEN"
