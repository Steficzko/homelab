# Ingress rules for the namosocks.com tunnel (ca867f1b), run in locally-managed mode.
# We hold the client's tunnel token but not dashboard access to their Zero Trust account,
# so hostname->service routing is defined here rather than remotely.
#
# PUBLISH MODEL (decided 2026-07-31): DNS is NOT changed wholesale — the live site and the
# wildcard A record keep pointing at the original host. Only what we deliberately publish moves
# here, per hostname:
#   1. create a k8s Ingress with host <app>.namosocks.com
#   2. add ONE Cloudflare CNAME <app> -> ca867f1b-….cfargotunnel.com (proxied)
# The wildcard rule below is tunnel-side only; it routes nothing by itself, because traffic only
# reaches the tunnel for hostnames whose DNS points at it. Two independent allow-lists (DNS
# record + k8s Ingress) must agree before anything is served — a hostname missing either gets a
# 404, never an accidental origin.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-namosocks-config
  namespace: cloudflare-tunnel
data:
  config.yaml: |
    tunnel: ca867f1b-213c-40ba-be0d-af0f8a11d5fa
    credentials-file: /etc/cloudflared/creds/credentials.json
    originRequest:
      connectTimeout: 30s
    ingress:
      # warehouse has a real LE cert on the ingress (cert-manager) — the in-cluster hop is
      # TLS end-to-end for it. Other hosts still terminate at Cloudflare (plain http origin).
      - hostname: warehouse.namosocks.com
        service: https://ingress-nginx-controller.ingress-nginx.svc.cluster.local:443
        originRequest:
          originServerName: warehouse.namosocks.com
      - hostname: staging.namosocks.com
        service: http://ingress-nginx-controller.ingress-nginx.svc.cluster.local:80
      - hostname: "*.namosocks.com"
        service: http://ingress-nginx-controller.ingress-nginx.svc.cluster.local:80
      - service: http_status:404
