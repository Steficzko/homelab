apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-namosocks
  namespace: cloudflare-tunnel
spec:
  replicas: 2   # HA — both connect the namosocks tunnel; Cloudflare load-balances
  selector:
    matchLabels:
      app: cloudflared-namosocks
  template:
    metadata:
      labels:
        app: cloudflared-namosocks
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: cloudflared-namosocks
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.8.3
          # Locally-managed config: we hold the tunnel token but NOT dashboard access to the
          # client's Zero Trust account, so ingress rules live in the ConfigMap instead of remotely.
          args:
            - tunnel
            - --no-autoupdate
            - --config
            - /etc/cloudflared/config.yaml
            - run
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared
            - name: creds
              mountPath: /etc/cloudflared/creds
          resources:
            requests:
              memory: 64Mi
              cpu: 10m
            limits:
              memory: 128Mi
              cpu: 200m
      volumes:
        - name: config
          configMap:
            name: cloudflared-namosocks-config   # ingress rules (staging.namosocks.com -> ingress-nginx)
        - name: creds
          secret:
            secretName: cloudflared-namosocks-creds   # derived from the tunnel token; applied out-of-band
