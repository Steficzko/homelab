apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-namosocks
  namespace: cloudflare-tunnel
spec:
  replicas: 2   # HA — both connect the namosocks tunnel; Cloudflare load-balances
  selector:
    matchLabels:
      app: cloudflared-namosocks
  template:
    metadata:
      labels:
        app: cloudflared-namosocks
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: cloudflared-namosocks
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.9.0
          # Locally-managed config: we hold the tunnel token but NOT dashboard access to the
          # client's Zero Trust account, so ingress rules live in the ConfigMap instead of remotely.
          args:
            - tunnel
            - --no-autoupdate
            - --config
            - /etc/cloudflared/config.yaml
            # Off QUIC 2026-09-15: the Vodafone CPE rebooted at 00:26 UTC into new
            # firmware and its NAT now drops our long-lived UDP mappings; all tunnels then
            # flap in lockstep. Not packet loss -- UDP measures 0% and HTTP/3 runs at
            # 7.8 MB/s. See kubernetes/networking/cloudflared/deployment.yaml for the full
            # evidence. http2 rides TCP/7844 and re-establishes through it transparently.
            - --protocol
            - http2
            # No IPv6 default route on any node; without this, AAAA dials burn connection
            # slots failing "network is unreachable".
            - --edge-ip-version
            - "4"
            - run
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared
            - name: creds
              mountPath: /etc/cloudflared/creds
          resources:
            requests:
              memory: 64Mi
              cpu: 10m
            limits:
              memory: 128Mi
              cpu: 200m
      volumes:
        - name: config
          configMap:
            name: cloudflared-namosocks-config   # ingress rules (staging.namosocks.com -> ingress-nginx)
        - name: creds
          secret:
            secretName: cloudflared-namosocks-creds   # derived from the tunnel token; applied out-of-band
