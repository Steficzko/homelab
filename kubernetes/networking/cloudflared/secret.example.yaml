# Cloudflare Tunnel token
# DO NOT commit the real value — this file shows structure only.
# In production: encrypt with SOPS+Age and commit as secret.sops.yaml
#
# Get the token from: Cloudflare Zero Trust → Networks → Tunnels → k3s-cluster → Configure → token
#
# Create the real secret:
#   kubectl create secret generic cloudflare-tunnel-token \
#     --from-literal=token=<YOUR_TUNNEL_TOKEN> \
#     -n cloudflare-tunnel
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-tunnel-token
  namespace: cloudflare-tunnel
type: Opaque
stringData:
  token: REPLACE_WITH_TUNNEL_TOKEN
