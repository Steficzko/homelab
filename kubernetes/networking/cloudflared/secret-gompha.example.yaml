# Gompha (dental product) Cloudflare Tunnel token — tunnel ID 2cd98378-e42c-4132-866b-a1b042012e7f,
# in a SEPARATE Cloudflare account (61417c55...). Connects the gompha.com tunnel into the cluster so
# its public hostnames (demo.gompha.com, auto.gompha.com, *.gompha.com) can target the ingress Service.
#
# The real secret lives in secret-gompha.sops.yaml (SOPS-encrypted, excluded from ArgoCD).
# Apply it out-of-band like the other SOPS secrets:
#     sops -d kubernetes/networking/cloudflared/secret-gompha.sops.yaml | kubectl apply -f -
#
# Get / rotate the token: Cloudflare Zero Trust > Networks > Tunnels > (gompha) > Configure -> "token".
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-tunnel-token-gompha
  namespace: cloudflare-tunnel
type: Opaque
stringData:
  token: "REPLACE_WITH_GOMPHA_TUNNEL_TOKEN"
