apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflare-tunnel
spec:
  replicas: 2   # 2 replicas for HA — both connect to Cloudflare, traffic is load-balanced
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: cloudflared
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.0
          args:
            - tunnel
            - --no-autoupdate
            # Protocol history. 2026-09-15: forced to http2 after the Vodafone CPE rebooted
            # into firmware AR01.05.063.13 and every QUIC tunnel began tearing down in
            # lockstep. The NAT-state theory written here that night was wrong: the line
            # itself was lossy (26.7% at Vodafone's first hop, OFDMA upstream losing lock,
            # 28 full WAN drops by 2026-09-28 -- see Plane NET-31). http2 over TCP rode
            # through the drops; QUIC over UDP could not. Vodafone changed something on
            # 2026-09-29 06:00 (upload 20 -> 100 Mb/s, zero drops since) and a technician
            # is on the line on 2026-10-01, so QUIC is restored as the probe: if the tunnels
            # start flapping again, the line is not fixed. Re-pin with "--protocol http2"
            # if that happens. The IPv4 pin below is unrelated and stays.
            # The nodes have ZERO IPv6 default routes, but cloudflared defaults to trying
            # both families, so every AAAA dial fails "network is unreachable" and burns a
            # connection slot retrying. One main-tunnel pod was thrashing 2 of its 4
            # connections on this alone.
            - --edge-ip-version
            - "4"
            - run
            - --token
            - $(TUNNEL_TOKEN)
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-tunnel-token   # See secret.example.yaml
                  key: token
          resources:
            requests:
              memory: 64Mi
              cpu: 10m
            limits:
              memory: 128Mi
              cpu: 200m
