apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflare-tunnel
spec:
  replicas: 2   # 2 replicas for HA — both connect to Cloudflare, traffic is load-balanced
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: cloudflared
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.9.0
          args:
            - tunnel
            - --no-autoupdate
            # QUIC (UDP/7844) is being mangled on this uplink: every tunnel in the cluster was
            # logging "failed to accept QUIC stream: timeout: no recent network activity" and
            # re-dialling every ~2 min (1310 events in 5000 log lines on 2026-09-15), which shows
            # up to visitors as intermittent 502s — worst from far-away colos, since all four
            # connections land in prg/vie. http2 rides TCP/443 instead. Revert if the flapping
            # turns out to be Cloudflare-side rather than the uplink.
            - --protocol
            - http2
            - run
            - --token
            - $(TUNNEL_TOKEN)
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-tunnel-token   # See secret.example.yaml
                  key: token
          resources:
            requests:
              memory: 64Mi
              cpu: 10m
            limits:
              memory: 128Mi
              cpu: 200m
