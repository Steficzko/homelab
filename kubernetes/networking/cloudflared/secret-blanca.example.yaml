# BlancaDentalClinic Cloudflare Tunnel token — tunnel ID 0552c71b-34c0-4fa5-ba4e-af9d36915e73.
# Dashboard-managed (remote config): public hostnames for the Dr. Ali clinic domain are
# configured in Zero Trust > Networks > Tunnels; routes point at
# http://ingress-nginx-controller.ingress-nginx.svc.cluster.local:80.
#
# The real secret is applied out-of-band (token never lands in git):
#     kubectl -n cloudflare-tunnel create secret generic cloudflare-tunnel-token-blanca \
#       --from-literal=token=<token from ZT dashboard > Tunnels > BlancaDentalClinic > Configure>
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-tunnel-token-blanca
  namespace: cloudflare-tunnel
type: Opaque
stringData:
  token: "REPLACE_WITH_BLANCA_TUNNEL_TOKEN"
