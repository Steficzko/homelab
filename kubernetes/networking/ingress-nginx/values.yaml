# ingress-nginx Helm values
# Chart: ingress-nginx/ingress-nginx v4.15.1 (app v1.15.1)
# Installed: helm install ingress-nginx ingress-nginx/ingress-nginx -n ingress-nginx --create-namespace
#
# No custom values needed — defaults work for this setup.
# Traffic path: Internet → Cloudflare Tunnel → ingress-nginx ClusterIP → app Service
# kube-vip assigns the LoadBalancer IPs (192.168.1.201-203), used for LAN access.
#
# Ingress conventions for all apps:
#   annotations:
#     cert-manager.io/cluster-issuer: letsencrypt-prod
#     nginx.ingress.kubernetes.io/ssl-redirect: "false"   # avoids redirect loops with Cloudflare
#     nginx.ingress.kubernetes.io/proxy-body-size: "0"    # required for file uploads (Immich, Nextcloud)
