apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-vip-ds
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: kube-vip-ds
  template:
    metadata:
      labels:
        name: kube-vip-ds
    spec:
      hostNetwork: true   # must use host network to send ARP on the LAN
      serviceAccountName: kube-vip
      containers:
        - name: kube-vip
          image: ghcr.io/kube-vip/kube-vip@sha256:2fcdbb014a2e217b9ea1b6dacac53d6851b185af323cdd28d100ad82d74bc79a
          args:
            - manager
          env:
            - name: vip_arp
              value: "true"
            - name: vip_interface
              value: eno1           # LAN interface on all 3 Lenovo M910q nodes
            - name: address
              value: 192.168.1.200  # floating VIP — moves to a healthy node automatically
            - name: cp_enable
              value: "true"         # manage the control-plane VIP
            - name: cp_namespace
              value: kube-system
            - name: vip_leaderelection
              value: "true"
            - name: vip_leaseduration
              value: "15"
            - name: vip_renewdeadline
              value: "10"
            - name: vip_retryperiod
              value: "2"
          securityContext:
            capabilities:
              add:
                - NET_ADMIN   # required to bind the VIP to the interface
                - NET_RAW     # required to send ARP announcements
