apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cal
  namespace: cal
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts: [cal.kostikidis.net]
      secretName: cal-tls
  rules:
    - host: cal.kostikidis.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cal
                port:
                  number: 3000
