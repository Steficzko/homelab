apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cal
  namespace: cal
spec:
  podSelector:
    matchLabels:
      app: cal
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:   # Traefik (CLSTR-29); nginx kept until it is removed
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 3000
