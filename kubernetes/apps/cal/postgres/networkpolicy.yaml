apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  namespace: cal
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 5432
      from:
        - podSelector:
            matchLabels:
              app: cal
        # pg_dump backup CronJob (netpol admits it or dumps silently fail — learned twice)
        - podSelector:
            matchLabels:
              app: postgres-backup
