apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless
  namespace: paperless-drali
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: paperless
  template:
    metadata:
      labels:
        app: paperless
    spec:
      initContainers:
        - name: fix-consume-perms
          image: alpine:3
          command: ["chmod", "-R", "a+r", "/consume"]
          volumeMounts:
            - name: consume
              mountPath: /consume
        - name: tessdata-swe
          image: alpine:3
          command:
            - sh
            - -c
            - |
              if [ ! -f /tessdata/swe.traineddata ]; then
                wget -qO /tessdata/swe.traineddata \
                  https://github.com/tesseract-ocr/tessdata/raw/main/swe.traineddata && \
                echo "Downloaded swe.traineddata" || echo "Failed to download swe.traineddata"
              else
                echo "swe.traineddata already present"
              fi
          volumeMounts:
            - name: tessdata
              mountPath: /tessdata
      containers:
        - name: paperless
          image: ghcr.io/paperless-ngx/paperless-ngx:2.20.15
          envFrom:
            - secretRef:
                name: paperless-secret
          env:
            - name: PAPERLESS_DBHOST
              value: postgres
            - name: PAPERLESS_DBNAME
              value: paperless
            - name: PAPERLESS_DBUSER
              value: paperless
            - name: PAPERLESS_TIKA_ENABLED
              value: "1"
            - name: PAPERLESS_TIKA_ENDPOINT
              value: http://tika:9998
            - name: PAPERLESS_TIKA_GOTENBERG_ENDPOINT
              value: http://gotenberg:3000
            - name: PAPERLESS_URL
              value: https://dralibjj.kostikidis.net
            - name: PAPERLESS_TIME_ZONE
              value: Europe/Prague
            - name: PAPERLESS_OCR_LANGUAGE
              value: eng
            - name: PAPERLESS_OCR_OUTPUT_TYPE
              value: pdf
            - name: PAPERLESS_CONSUMER_RECURSIVE
              value: "true"
            - name: PAPERLESS_CONSUMER_IGNORE_PATTERNS
              value: '["[\\.].*",".*[\\.]gpg$","*.epub","*.mobi","*.azw","*.azw3","*.mp3","*.m4b","*.m4a","*.flac","*.ogg","*.aac","*.wav","*.mkv","*.mp4","*.avi"]'
          resources:
            requests:
              memory: 512Mi
              cpu: "200m"
            limits:
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /usr/src/paperless/data
            - name: media
              mountPath: /usr/src/paperless/media
            - name: consume
              mountPath: /usr/src/paperless/consume
            - name: tessdata
              mountPath: /usr/share/tesseract-ocr/5/tessdata/swe.traineddata
              subPath: swe.traineddata
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paperless-data-pvc
        - name: media
          persistentVolumeClaim:
            claimName: paperless-media-pvc
        - name: consume
          persistentVolumeClaim:
            claimName: paperless-consume-pvc
        - name: tessdata
          emptyDir: {}
