apiVersion: v1
kind: ConfigMap
metadata:
  name: paperless-gpt-prompts
  namespace: paperless-drali
data:
  created_date_prompt.tmpl: |
    Return exactly this date and nothing else: 2026-01-01

  title_prompt.tmpl: |
    Generate a short Swedish title for this dental study document.
    Rules:
    - Maximum 7 words
    - Specific clinical topic — not a summary sentence
    - Return ONLY the title, nothing else
    - No punctuation at the end
    - Do not start with Okay, Here, This, Document, Sure, Certainly or similar
    - If it is an OSCE exam, include the session date if visible in the content

    <original_title>{{.Title}}</original_title>
    <content>
    {{.Content}}
    </content>

  correspondent_prompt.tmpl: |
    Identify the source of this Swedish dental document.
    Return ONLY one of these exact options — nothing else:
    KI
    Gothia
    KUT
    Malmö
    Unknown

    <title>{{.Title}}</title>
    <content>{{.Content}}</content>

  tag_prompt.tmpl: |
    You are tagging a Swedish dental study document for the KI Kunskapsprovet exam.

    Read the document content below and return 3 to 6 specific clinical tags in Swedish.
    Tags must be precise dental/medical terms — NOT broad categories.
    Good examples: rotfyllning, parodontal kirurgi, antibiotikaprofylax, OSCE-station, bettskena, sedering, käkledssmärta
    Bad examples: Tandvård, Odontologi, Medicin, Behandling

    Return ONLY the tags, one per line, nothing else. No explanations. No numbering.

    Document title: {{.Title}}

    Document content:
    {{.Content}}

  custom_field_prompt.tmpl: |
    Write a 2-sentence Swedish clinical summary of this dental document.
    Be factual and specific. Maximum 35 words total. No headers. No bullet points.
    Return ONLY valid JSON — no markdown, no code blocks, no explanation.

    {{.CustomFieldsXML}}

    Document: {{.Title}}
    Content: {{.Content}}

    Return exactly this format:
    [{"field": "Ämnessammanfattning", "value": "SUMMARY HERE"}]
