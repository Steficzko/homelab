apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: paperless-gpt
  namespace: paperless-drali
spec:
  podSelector:
    matchLabels:
      app: paperless-gpt
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 8000
      to:
        - podSelector:
            matchLabels:
              app: paperless
    - ports:
        - port: 4000
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
