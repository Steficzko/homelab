apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-gpt
  namespace: paperless-drali
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paperless-gpt
  template:
    metadata:
      labels:
        app: paperless-gpt
    spec:
      containers:
        - name: paperless-gpt
          image: ghcr.io/icereed/paperless-gpt:latest
          env:
            - name: PAPERLESS_BASE_URL
              value: http://paperless-headless:8000
            - name: PAPERLESS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: paperless-gpt-secret
                  key: PAPERLESS_API_TOKEN
            - name: LLM_PROVIDER
              value: openai
            - name: LLM_MODEL
              value: chat
            - name: OPENAI_BASE_URL
              value: http://litellm.ai.svc.cluster.local:4000/v1
            - name: OPENAI_API_KEY
              value: dummy
            - name: AUTO_TAG
              value: paperless-gpt-auto
            - name: LLM_LANGUAGE
              value: English
          resources:
            requests:
              memory: 128Mi
              cpu: "50m"
            limits:
              memory: 256Mi
          ports:
            - containerPort: 8080
