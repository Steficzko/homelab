# Exact host takes precedence over the dental-clinic *.kostikidis.net wildcard
# catch-all (ingress-nginx exact-host priority), so travel.kostikidis.net lands here.
# No DNS record needed — the zone's wildcard CNAME already points at the tunnel.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: travel
  namespace: travel
  annotations:
    # NO cert-manager.io/cluster-issuer HERE — deliberate. The travel-wildcard
    # Certificate below already manages secret travel-wildcard-tls. With this
    # annotation present, cert-manager's ingress-shim ALSO auto-creates a
    # Certificate named after the secret (travel-wildcard-tls), so two objects
    # fight over one secret: the explicit one wins and the shim's copy sits
    # Ready=False forever ("Secret was issued for travel-wildcard ... you might
    # have two conflicting Certificates pointing to the same secret").
    # The explicit Certificate is the one to keep — it also covers the apex,
    # which the shim's copy does not. Re-adding this annotation re-creates the clash.
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["*.kostikidis.net"]
      secretName: travel-wildcard-tls
  rules:
    - host: travel.kostikidis.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: travel, port: {number: 80}}
---
# Cert secrets are namespaced — travel needs its own copy of the wildcard
# (same DNS-01 ClusterIssuer as padle's and dental.clinic's).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: travel-wildcard
  namespace: travel
spec:
  secretName: travel-wildcard-tls
  issuerRef: {name: letsencrypt-prod, kind: ClusterIssuer}
  dnsNames:
    - "*.kostikidis.net"
    - "kostikidis.net"
