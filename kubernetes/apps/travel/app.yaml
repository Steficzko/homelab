# The site is a static Astro build served by nginx. Source of truth:
# github.com/Steficzko/travel — tag v* there and GitHub Actions pushes the image.
#
# STAGING POSTURE: the brand name is provisional and the real domain is not bought
# yet, so nothing here may be indexed. noindex comes from three places (per-page
# meta, robots.txt, and an X-Robots-Tag header set in the image's nginx.conf).
# Access is additionally gated by the Cloudflare Access policy on *.kostikidis.net —
# do NOT add an exemption for this host.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel
  namespace: travel
  labels: {app: travel}
spec:
  # HELD AT 0 2026-08-04: ghcr.io/steficzko/travel:v0.1.1 cannot be pulled
  # (403 from ghcr.io — either the image was never built or the ghcr-pull
  # credential has no access to this package). A pod that cannot start just
  # fires KubeDeploymentReplicasMismatch every 15 minutes.
  # Restore to 1 once `docker pull ghcr.io/steficzko/travel:v0.1.1` works.
  replicas: 0
  selector:
    matchLabels: {app: travel}
  template:
    metadata:
      labels: {app: travel}
    spec:
      containers:
        - name: site
          image: ghcr.io/steficzko/travel:v0.1.1
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 20
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
      imagePullSecrets:
        - name: ghcr-pull
---
apiVersion: v1
kind: Service
metadata:
  name: travel
  namespace: travel
spec:
  selector: {app: travel}
  ports:
    - port: 80
