# The site is a static Astro build served by nginx. Source of truth:
# github.com/Steficzko/travel — tag v* there and GitHub Actions pushes the image.
#
# STAGING POSTURE: the brand name is provisional and the real domain is not bought
# yet, so nothing here may be indexed. noindex comes from three places (per-page
# meta, robots.txt, and an X-Robots-Tag header set in the image's nginx.conf).
# Access is additionally gated by the Cloudflare Access policy on *.kostikidis.net —
# do NOT add an exemption for this host.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel
  namespace: travel
  labels: {app: travel}
spec:
  # TEMPORARY CREDENTIAL 2026-08-04: the shared ghcr-pull PAT is scoped to
  # older repos and gets 403 on this package, so ghcr-pull here holds a
  # personal gh CLI OAuth token instead. It carries repo+workflow scope, which
  # is far more than a pull needs, and it dies whenever `gh auth login` is run
  # again. Replace with a read:packages-only PAT, or make the package public.
  replicas: 1
  selector:
    matchLabels: {app: travel}
  template:
    metadata:
      labels: {app: travel}
    spec:
      containers:
        - name: site
          image: ghcr.io/steficzko/travel:v0.1.1
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 20
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
      imagePullSecrets:
        - name: ghcr-pull
---
apiVersion: v1
kind: Service
metadata:
  name: travel
  namespace: travel
spec:
  selector: {app: travel}
  ports:
    - port: 80
