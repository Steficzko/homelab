apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: readeck
  namespace: readeck
spec:
  podSelector:
    matchLabels:
      app: readeck
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 8000
  egress:
    # Readeck fetches the articles you save, from anywhere on the web.
    - ports:
        - port: 443
        - port: 80
      to:
        - ipBlock:
            cidr: 0.0.0.0/0
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
