apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: readeck-data-pvc
  namespace: readeck
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job.longhorn.io/daily-backup: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
