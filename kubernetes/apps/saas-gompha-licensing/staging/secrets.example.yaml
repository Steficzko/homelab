# DOCUMENTATION ONLY — never applied. The ArgoCD Application excludes
# *.example.yaml from sync (learned the hard way: see Gompha
# ops/k3s/argocd-sops-prune-conflict.md — an applied example file once
# initialised a database with 'changeme').
#
# Real values live in the sibling *.sops.yaml files (SOPS/age). Apply them
# manually at bootstrap:
#   for f in kubernetes/apps/saas-gompha-licensing/staging/*.sops.yaml; do
#     sops -d "$f" | kubectl apply -f -
#   done
#
# THE FIFTH SECRET IS NOT HERE AND NOT IN GIT: licensing-signing-key
# (Ed25519 private key, ADR-019). It is created once, out-of-band, straight
# from openssl into kubectl — see Gompha ops/runbooks/licensing-deploy.md.
# Its custody is deliberately narrower than the SOPS pipeline: not bundled
# with anything, no encrypted copy in git history, exists only in the cluster.
---
apiVersion: v1
kind: Secret
metadata:
  name: licensing-postgres-secret
  namespace: saas-gompha-licensing-staging
type: Opaque
stringData:
  POSTGRES_USER: licensing
  POSTGRES_PASSWORD: REPLACE_32_CHAR_RANDOM
---
apiVersion: v1
kind: Secret
metadata:
  name: licensing-api-secret
  namespace: saas-gompha-licensing-staging
type: Opaque
stringData:
  LICENSING_DATABASE_URL: postgresql://licensing:REPLACE_32_CHAR_RANDOM@licensing-postgres:5432/licensing
---
apiVersion: v1
kind: Secret
metadata:
  name: licensing-mail-master-key
  namespace: saas-gompha-licensing-staging
type: Opaque
data:
  master.key: REPLACE_BASE64_OF_32_RAW_BYTES   # head -c 32 /dev/urandom | base64 -w0
---
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull
  namespace: saas-gompha-licensing-staging
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: REPLACE_DOCKERCONFIGJSON_B64
---
# Added 2026-09-16 with backup.yaml. Its OWN MinIO user, scoped to the
# gompha-licensing-postgres/ prefix only — the clinic's credential is denied
# here by design. User + policy recipe: Gompha ops/runbooks/licensing-deploy.md.
apiVersion: v1
kind: Secret
metadata:
  name: licensing-backup-s3-secret
  namespace: saas-gompha-licensing-staging
type: Opaque
stringData:
  S3_ENDPOINT: http://192.168.1.100:9100
  S3_ACCESS_KEY: gompha-licensing-backup
  S3_SECRET_KEY: REPLACE_32_CHAR_RANDOM
