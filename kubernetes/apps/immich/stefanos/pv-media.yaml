apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-stefanos-media-pv
spec:
  capacity:
    storage: 200Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: 192.168.1.100
    path: /mnt/user/Immich_Database
  mountOptions:
    - hard
    - nfsvers=4.1
