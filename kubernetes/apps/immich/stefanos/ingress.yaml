apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immich-stefanos
  namespace: immich
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - stefanosmobiles.kostikidis.net
      secretName: immich-stefanos-tls
  rules:
    - host: stefanosmobiles.kostikidis.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: immich-stefanos
                port:
                  number: 2283
