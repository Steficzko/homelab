apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-stefanos-library-pv
spec:
  capacity:
    storage: 500Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: 192.168.1.100
    path: /mnt/user/Immich_Database/library
  mountOptions:
    - hard
    - nfsvers=4.1
