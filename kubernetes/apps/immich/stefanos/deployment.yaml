apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-stefanos
  namespace: immich
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-stefanos
  template:
    metadata:
      labels:
        app: immich-stefanos
    spec:
      initContainers:
        - name: wait-for-redis
          image: busybox:1.38
          command: ['sh', '-c', 'until nc -z redis-stefanos.immich.svc.cluster.local 6379; do sleep 2; done']
        - name: wait-for-postgres
          image: busybox:1.38
          command: ['sh', '-c', 'until nc -z postgres.immich.svc.cluster.local 5432; do sleep 2; done']
      containers:
        - name: immich-server
          image: ghcr.io/immich-app/immich-server:release
          env:
            - name: TZ
              value: Europe/Prague
            - name: DB_HOSTNAME
              value: postgres.immich.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_USERNAME
              value: postgres
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-secret
                  key: POSTGRES_PASSWORD
            - name: DB_DATABASE_NAME
              value: immich_stefanos
            - name: REDIS_HOSTNAME
              value: redis-stefanos.immich.svc.cluster.local
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-secret
                  key: REDIS_PASSWORD
            - name: IMMICH_MACHINE_LEARNING_URL
              value: http://immich-ml.immich.svc.cluster.local:3003
          resources:
            requests:
              memory: 1Gi
              cpu: 250m
            limits:
              memory: 4Gi
          startupProbe:
            httpGet:
              path: /api/server/ping
              port: 2283
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/server/ping
              port: 2283
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /api/server/ping
              port: 2283
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: media
              mountPath: /usr/src/app/upload
            - name: thumbs-ssd
              mountPath: /usr/src/app/upload/thumbs
            - name: encoded-ssd
              mountPath: /usr/src/app/upload/encoded-video
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: stefanos-media-pvc
        - name: thumbs-ssd
          persistentVolumeClaim:
            claimName: stefanos-thumbs-ssd-pvc
        - name: encoded-ssd
          persistentVolumeClaim:
            claimName: stefanos-encoded-ssd-pvc
