apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-stefanos
  namespace: immich
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-stefanos
  template:
    metadata:
      labels:
        app: immich-stefanos
    spec:
      affinity:                              # ADR-030 pattern: prefer workers (non-control-plane), soft fallback
        nodeAffinity:                        # 2026-08-29: ~1Gi each; all four Immich instances were on control planes
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      # SEC-12 (2026-10-24): non-root so the Unraid export can root_squash. 99:100 is Unraid's
      # nobody:users, which already owned most Immich files; the rest were chowned on Unraid first.
      securityContext: { runAsUser: 99, runAsGroup: 100, runAsNonRoot: true }
      initContainers:
        - name: wait-for-redis
          image: busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          command: ['sh', '-c', 'until nc -z redis-stefanos.immich.svc.cluster.local 6379; do sleep 2; done']
        - name: wait-for-postgres
          image: busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          command: ['sh', '-c', 'until nc -z postgres.immich.svc.cluster.local 5432; do sleep 2; done']
      containers:
        - name: immich-server
          image: ghcr.io/immich-app/immich-server:v3.3.5@sha256:485d546a2e31d6a8b4db8423fcba5c109de8c218d93410af115fd1ccfc4352a6
          env:
            - name: TZ
              value: Europe/Prague
            - name: DB_HOSTNAME
              value: postgres.immich.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_USERNAME
              value: postgres
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-secret
                  key: POSTGRES_PASSWORD
            - name: DB_DATABASE_NAME
              value: immich_stefanos
            - name: REDIS_HOSTNAME
              value: redis-stefanos.immich.svc.cluster.local
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-secret
                  key: REDIS_PASSWORD
            - name: IMMICH_MACHINE_LEARNING_URL
              value: http://immich-ml.immich.svc.cluster.local:3003
          resources:
            requests:
              memory: 2Gi        # 2026-10-18: 14d p95 1727Mi (CLSTR-28); limit unchanged
              cpu: 250m
            limits:
              memory: 4Gi
          startupProbe:
            httpGet:
              path: /api/server/ping
              port: 2283
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/server/ping
              port: 2283
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ['sh', '-c', 'ls /usr/src/app/upload > /dev/null 2>&1 && ls /usr/src/app/upload/thumbs > /dev/null 2>&1 && ls /usr/src/app/upload/encoded-video > /dev/null 2>&1 && curl -sf -m 5 http://localhost:2283/api/server/ping > /dev/null']
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - name: media
              mountPath: /usr/src/app/upload
            - name: thumbs-ssd
              mountPath: /usr/src/app/upload/thumbs
            - name: encoded-ssd
              mountPath: /usr/src/app/upload/encoded-video
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: stefanos-media-pvc
        - name: thumbs-ssd
          persistentVolumeClaim:
            claimName: stefanos-thumbs-ssd-pvc
        - name: encoded-ssd
          persistentVolumeClaim:
            claimName: stefanos-encoded-ssd-pvc
