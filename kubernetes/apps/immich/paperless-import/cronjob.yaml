# Immich -> Paperless: text-heavy screenshots and photographed documents.
#
# Modelled on martunia's stack 49 (her ADR-0038), with the same two gates and the same
# filename convention, adapted to this cluster:
#   * READ-ONLY towards Immich. A read-only SQL transaction and :ro mounts of the library.
#     No Immich API calls, no writes, no config change.
#   * Immich's own OCR (asset_ocr) only DECIDES what is worth importing. Paperless does the
#     real OCR — the languages here are eng+ell+ces+ara, and Marianna's documents are Czech.
#   * screenshot_* / photo_* filenames drive two things already built: the storage path that
#     puts these on the Unraid array instead of Longhorn, and the per-folder owner workflow.
#
# Census 2026-09-08: stefanos 2,778 candidates / 3.0 GB, marianna 8,401 / 30 GB.
# BATCH caps each run so the consume queue never gets 11k files at once — Paperless needs
# roughly half a minute per document, so the backlog drains over days either way.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: paperless-import
  namespace: immich
spec:
  schedule: "20 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 10800
      backoffLimit: 1
      activeDeadlineSeconds: 3000
      template:
        metadata:
          labels: { app: paperless-import }
        spec:
          restartPolicy: Never
          securityContext: { runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000 }
          containers:
            - name: import
              image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
              env:
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: immich-secret, key: POSTGRES_PASSWORD } }
                - { name: PGHOST,           value: postgres }   # the Service is "postgres"; the POD is immich-postgres
                - { name: PGUSER,           value: postgres }
                - { name: PGOPTIONS,        value: "-c default_transaction_read_only=on" }
                - { name: SCREENSHOT_CHARS, value: "300" }   # no camera EXIF
                - { name: CAMERA_CHARS,     value: "500" }   # camera EXIF present: a scene that
                                                             # merely contains print is not a document
                - { name: BATCH,            value: "5000" }  # full pace: drains the ~11k backlog in ~3 hourly runs. Files pool in consume; Paperless OCRs at its own ~120/h.
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  # K3s admits a new pod to its NetworkPolicy ~30-45s late, so a short job that
                  # talks to a netpol'd service on its first breath gets "Name has no usable
                  # address" and dies. Wait for the DB rather than fail. (Same trap that broke
                  # the dental backup silently.)
                  ok=0
                  for i in $(seq 1 30); do
                    if pg_isready -h "$PGHOST" -U "$PGUSER" -t 3 >/dev/null 2>&1; then ok=1; echo "postgres reachable (try $i)"; break; fi
                    sleep 3
                  done
                  [ "$ok" = 1 ] || { echo "ERROR: immich-postgres unreachable after retries"; exit 1; }

                  total_q=0; total_s=0
                  for pair in "stefanos:immich_stefanos" "marianna:immich_marianna"; do
                    owner="${pair%%:*}"; db="${pair##*:}"
                    src="/immich/$owner"; dst="/consume/$owner"; state="/state/${owner}.state"
                    touch "$state"
                    echo "== $owner ($db) =="

                    # Read-only enforced by PGOPTIONS below, not by begin/commit: with -t -A those
                    # two statements print "BEGIN" and "COMMIT" as data rows, which then land in
                    # the state file as bogus assets.
                    SQL="select a.id,
                           case when e.make is null or e.make = '' then 'screenshot' else 'photo' end,
                           a.\"originalPath\", a.\"originalFileName\",
                           to_char(a.\"fileCreatedAt\", 'YYYY-MM-DD')
                    from asset a
                    left join asset_exif e on e.\"assetId\" = a.id
                    left join asset_ocr  o on o.\"assetId\" = a.id
                    where a.type = 'IMAGE' and a.\"deletedAt\" is null
                    group by a.id, e.make, a.\"originalPath\", a.\"originalFileName\", a.\"fileCreatedAt\"
                    having ( ((e.make is null or e.make = '') and coalesce(sum(length(o.text)),0) >= $SCREENSHOT_CHARS)
                          or ((e.make is not null and e.make <> '') and coalesce(sum(length(o.text)),0) >= $CAMERA_CHARS) );"
                    psql -d "$db" -X -A -F'|' -t -v ON_ERROR_STOP=1 -c "$SQL" > /tmp/cand.txt

                    n=0; q=0; skipped=0
                    while IFS='|' read -r id kind path fname created; do
                      [ -z "${id:-}" ] && continue
                      grep -q "^${id}:" "$state" 2>/dev/null && continue
                      [ "$n" -ge "$BATCH" ] && break

                      # Immich mounts its library at /usr/src/app/upload; we mount the same
                      # export at $src, so strip that prefix to get a path we can read.
                      file="$src/${path#/usr/src/app/upload/}"

                      case "$fname" in
                        IMG-[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]-WA[0-9]*)
                          # WhatsApp received media. Decided 2026-09-11: Immich already holds it
                          # with date and sender context; Paperless copies were 46% of the
                          # stefanos instance and almost all junk OCR. Messenger *screenshots*
                          # (package-named files) still come through and are curated by hand.
                          echo "${id}:skipped-whatsapp" >> "$state"; skipped=$((skipped+1)); continue ;;
                      esac
                      case "$(printf '%s' "$fname" | tr 'A-Z' 'a-z')" in
                        *.heic|*.heif)
                          # Paperless cannot consume HEIC. Recorded so the count stays visible
                          # and a later conversion step can find them.
                          echo "${id}:skipped-heic" >> "$state"; skipped=$((skipped+1)); continue ;;
                        *.dng|*.nrw|*.nef|*.cr2|*.cr3|*.arw|*.raf|*.orf|*.rw2|*.tif|*.tiff)
                          # RAW and 16-bit TIFF: Paperless's PIL parser rejects them ("unable to
                          # preserve more than 8 bits per sample"). 31 of these (DNG, NRW, TIF)
                          # sat in consume forever on 2026-09-11.
                          echo "${id}:skipped-raw" >> "$state"; skipped=$((skipped+1)); continue ;;
                      esac
                      if [ ! -f "$file" ]; then
                        echo "${id}:missing" >> "$state"; skipped=$((skipped+1)); continue
                      fi

                      # Copy to a temp name first: Paperless polls this directory every 15s and
                      # would happily consume a half-written file.
                      if cp "$file" "$dst/.tmp.$id" 2>/dev/null && mv "$dst/.tmp.$id" "$dst/${kind}_${created}_${fname}"; then
                        echo "${id}:queued" >> "$state"; q=$((q+1)); n=$((n+1))
                      else
                        rm -f "$dst/.tmp.$id"; echo "${id}:copy-failed" >> "$state"; skipped=$((skipped+1))
                      fi
                    done < /tmp/cand.txt

                    cand=$(wc -l < /tmp/cand.txt); seen=$(wc -l < "$state")
                    left=$((cand - seen)); [ "$left" -lt 0 ] && left=0
                    echo "   queued this run: $q | skipped: $skipped | remaining: ~$left of $cand"
                    total_q=$((total_q+q)); total_s=$((total_s+skipped))
                  done
                  echo "== done: queued $total_q, skipped $total_s =="
              volumeMounts:
                - { name: immich-stefanos, mountPath: /immich/stefanos, readOnly: true }
                - { name: immich-marianna, mountPath: /immich/marianna, readOnly: true }
                - { name: consume,         mountPath: /consume }
                - { name: state,           mountPath: /state }
              resources: { requests: { memory: 64Mi, cpu: "50m" }, limits: { memory: 256Mi } }
          volumes:
            - { name: immich-stefanos, persistentVolumeClaim: { claimName: stefanos-media-pvc, readOnly: true } }
            - { name: immich-marianna, persistentVolumeClaim: { claimName: marianna-media-pvc, readOnly: true } }
            - { name: consume,         persistentVolumeClaim: { claimName: paperless-consume-pvc } }
            - { name: state,           persistentVolumeClaim: { claimName: paperless-import-state-pvc } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: paperless-import, namespace: immich }
spec:
  podSelector: { matchLabels: { app: paperless-import } }
  policyTypes: [Ingress, Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { app: immich-postgres } } }]
      ports: [{ port: 5432 }]
    - ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
