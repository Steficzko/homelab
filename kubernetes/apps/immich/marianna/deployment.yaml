apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-marianna
  namespace: immich
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-marianna
  template:
    metadata:
      labels:
        app: immich-marianna
    spec:
      initContainers:
        - name: wait-for-redis
          image: busybox:1.38
          command: ['sh', '-c', 'until nc -z redis-marianna.immich.svc.cluster.local 6379; do sleep 2; done']
        - name: wait-for-postgres
          image: busybox:1.38
          command: ['sh', '-c', 'until nc -z postgres.immich.svc.cluster.local 5432; do sleep 2; done']
      containers:
        - name: immich-server
          image: ghcr.io/immich-app/immich-server:v2.7.5@sha256:c15bff75068effb03f4355997d03dc7e0fc58720c2b54ad6f7f10d1bc57efaa5
          env:
            - name: TZ
              value: Europe/Prague
            - name: DB_HOSTNAME
              value: postgres.immich.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_USERNAME
              value: postgres
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-secret
                  key: POSTGRES_PASSWORD
            - name: DB_DATABASE_NAME
              value: immich_marianna
            - name: REDIS_HOSTNAME
              value: redis-marianna.immich.svc.cluster.local
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-secret
                  key: REDIS_PASSWORD
            - name: IMMICH_MACHINE_LEARNING_URL
              value: http://immich-ml.immich.svc.cluster.local:3003
          resources:
            requests:
              memory: 768Mi
              cpu: 250m
            limits:
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /api/server/ping
              port: 2283
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /api/server/ping
              port: 2283
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: media
              mountPath: /usr/src/app/upload
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: marianna-media-pvc
