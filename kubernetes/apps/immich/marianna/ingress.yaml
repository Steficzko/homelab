apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immich-marianna
  namespace: immich
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # `lan` = direct LAN path at home (traefik values, ADR-044 amendment 2026-10-22).
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure,lan
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - mariannamobiles.kostikidis.net
      secretName: immich-marianna-tls
  rules:
    - host: mariannamobiles.kostikidis.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: immich-marianna
                port:
                  number: 2283
