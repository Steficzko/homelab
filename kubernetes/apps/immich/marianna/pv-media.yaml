apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-marianna-media-pv
spec:
  capacity:
    storage: 200Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: 192.168.1.100
    path: /mnt/user/k3s-services/immich_database/marianna
  mountOptions:
    - hard
    - nfsvers=4.1
