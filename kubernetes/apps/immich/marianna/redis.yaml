apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-marianna
  namespace: immich
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis-marianna
  template:
    metadata:
      labels:
        app: redis-marianna
    spec:
      containers:
        - name: redis
          image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
          command:
            - sh
            - -c
            # --maxmemory bounds the BullMQ queue BELOW the cgroup limit. Without it redis
            # grows unbounded and the kernel SIGKILLs it (CONSTRAINT_MEMCG) — and because
            # --save "" means no persistence, that wipes the ENTIRE job queue. redis-lightroom
            # died exactly that way at 03:01 on two consecutive nights (anon-rss 254MB vs the
            # 256Mi limit) when Immich enqueued its nightly batch.
            # noeviction, not an LRU policy: this is a job queue, so evicting keys silently
            # drops work. Refusing the write instead surfaces an enqueue error Immich can retry
            # — partial visible failure beats total silent loss.
            - >-
              redis-server --save "" --requirepass $REDIS_PASSWORD
              --maxmemory 384mb --maxmemory-policy noeviction
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-secret
                  key: REDIS_PASSWORD
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 512Mi   # headroom above --maxmemory 384mb for redis overhead
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a $REDIS_PASSWORD ping
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: redis-marianna
  namespace: immich
spec:
  selector:
    app: redis-marianna
  ports:
    - port: 6379
      targetPort: 6379
