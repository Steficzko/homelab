apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immich-lightroom
  namespace: immich
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - lightroom.kostikidis.net
      secretName: immich-lightroom-tls
  rules:
    - host: lightroom.kostikidis.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: immich-lightroom
                port:
                  number: 2283
