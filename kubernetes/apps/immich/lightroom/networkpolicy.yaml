apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: immich-lightroom
  namespace: immich
spec:
  podSelector:
    matchLabels:
      app: immich-lightroom
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:   # Traefik (CLSTR-29); nginx kept until it is removed
            matchLabels:
              kubernetes.io/metadata.name: traefik
        - namespaceSelector:   # Homepage immich widget (server stats, admin API key)
            matchLabels:
              kubernetes.io/metadata.name: homepage
          podSelector:
            matchLabels:
              app: homepage
      ports:
        - port: 2283
