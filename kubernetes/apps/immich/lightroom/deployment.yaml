apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-lightroom
  namespace: immich
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-lightroom
  template:
    metadata:
      labels:
        app: immich-lightroom
    spec:
      affinity:                              # ADR-030 pattern: prefer workers (non-control-plane), soft fallback
        nodeAffinity:                        # 2026-08-29: this pod is ~1.2Gi and sat on r1 (etcd) at 85% memory
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      # SEC-12 (2026-10-24): non-root so the Unraid export can root_squash. 99:100 is Unraid's
      # nobody:users, which already owned most Immich files; the rest were chowned on Unraid first.
      securityContext: { runAsUser: 99, runAsGroup: 100, runAsNonRoot: true }
      containers:
        - name: immich-server
          image: ghcr.io/immich-app/immich-server:v3.3.5@sha256:485d546a2e31d6a8b4db8423fcba5c109de8c218d93410af115fd1ccfc4352a6
          env:
            - name: TZ
              value: Europe/Prague
            - name: DB_HOSTNAME
              value: postgres.immich.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_USERNAME
              value: postgres
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-secret
                  key: POSTGRES_PASSWORD
            - name: DB_DATABASE_NAME
              value: immich_lightroom
            - name: REDIS_HOSTNAME
              value: redis-lightroom.immich.svc.cluster.local
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-secret
                  key: REDIS_PASSWORD
            - name: IMMICH_MACHINE_LEARNING_URL
              value: http://immich-ml.immich.svc.cluster.local:3003
          resources:
            requests:
              memory: 2.5Gi        # 2026-10-18: 14d p95 2270Mi, max 2748Mi (CLSTR-28); limit unchanged
              cpu: 250m
            limits:
              memory: 6Gi
          startupProbe:
            httpGet:
              path: /api/server/ping
              port: 2283
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/server/ping
              port: 2283
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ['sh', '-c', 'ls /usr/src/app/upload > /dev/null 2>&1 && ls /IMPORT > /dev/null 2>&1 && curl -sf -m 5 http://localhost:2283/api/server/ping > /dev/null']
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - name: media
              mountPath: /usr/src/app/upload
            - name: raw
              mountPath: /IMPORT
              readOnly: true
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: lightroom-media-pvc
        - name: raw
          persistentVolumeClaim:
            claimName: lightroom-raw-pvc
