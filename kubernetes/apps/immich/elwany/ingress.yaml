apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immich-elwany
  namespace: immich
  annotations:
spec:
  ingressClassName: traefik
  rules:
    - host: gallery.teamelwany.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: immich-elwany
                port:
                  number: 2283
