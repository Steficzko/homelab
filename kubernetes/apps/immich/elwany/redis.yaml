apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-elwany
  namespace: immich
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis-elwany
  template:
    metadata:
      labels:
        app: redis-elwany
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command:
            - sh
            - -c
            - redis-server --save "" --requirepass $REDIS_PASSWORD
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-secret
                  key: REDIS_PASSWORD
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a $REDIS_PASSWORD ping
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: redis-elwany
  namespace: immich
spec:
  selector:
    app: redis-elwany
  ports:
    - port: 6379
      targetPort: 6379
