# Immich ML on daedalus (VM 100, GTX 1660, Docker ~/ml/compose.yaml), 192.168.1.47 (TEMP VLAN 1 while the 10G NIC is out, COMP-40; normally 192.168.10.10 VLAN 10). Replaces LXC 111 (2026-10-30).
apiVersion: v1
kind: Service
metadata:
  name: immich-ml-daedalus
  namespace: immich
spec:
  ports:
    - port: 3003
      targetPort: 3003
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: immich-ml-daedalus
  namespace: immich
  labels:
    kubernetes.io/service-name: immich-ml-daedalus
addressType: IPv4
ports:
  - port: 3003
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.1.47   # TEMP 2026-11-19: VLAN 1 while the 10G NIC is out (COMP-40); was 192.168.10.10
