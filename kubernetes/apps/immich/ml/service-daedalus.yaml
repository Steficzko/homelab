# Immich ML on daedalus (VM 100, GTX 1660, Docker ~/ml/compose.yaml), 192.168.10.48 (VLAN 10 since 2026-10-30). Replaces LXC 111 (2026-10-30).
apiVersion: v1
kind: Service
metadata:
  name: immich-ml-daedalus
  namespace: immich
spec:
  ports:
    - port: 3003
      targetPort: 3003
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: immich-ml-daedalus
  namespace: immich
  labels:
    kubernetes.io/service-name: immich-ml-daedalus
addressType: IPv4
ports:
  - port: 3003
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.10.48
