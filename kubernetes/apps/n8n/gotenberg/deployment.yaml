apiVersion: apps/v1
kind: Deployment
metadata:
  name: gotenberg
  namespace: n8n
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gotenberg
  template:
    metadata:
      labels:
        app: gotenberg
    spec:
      containers:
        - name: gotenberg
          image: gotenberg/gotenberg:8.37
          args:
            - gotenberg
            - --api-timeout=30s
            - --chromium-disable-javascript=false
            - --libreoffice-disable-routes=true
            # ADR-038: the brain sends it user-supplied URLs. Chromium must never fetch private
            # ranges (RFC1918, CGNAT/tailnet, loopback) or cluster/LAN DNS names — a pasted link is
            # attacker input. Unraid, pve and the cluster all sit inside these ranges on purpose.
            - --chromium-deny-list=^https?://(10\\.|172\\.(1[6-9]|2[0-9]|3[01])\\.|192\\.168\\.|100\\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\\.|127\\.|0\\.0\\.0\\.0|localhost|\\[::1\\]|[^/]*\\.(svc|cluster\\.local|local|internal|lan|home)(:|/|$))
          ports:
            - containerPort: 3000
          resources:
            requests:
              memory: 256Mi
              cpu: "50m"
            limits:
              memory: 768Mi
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
