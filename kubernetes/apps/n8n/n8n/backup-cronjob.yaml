# Logical backup of n8n state (workflows + credentials) -> MinIO object storage.
# n8n stores everything in SQLite on an RWO Longhorn PVC, so a second pod cannot
# mount the volume while n8n runs. Instead this Job `kubectl exec`s into the live
# n8n pod, runs the n8n CLI export, copies the tarball out, and uploads it.
# Credentials are exported ENCRYPTED — they are only restorable together with
# N8N_ENCRYPTION_KEY (kept in n8n/secret.sops.yaml). Keep the SOPS age key safe.
# Restore on a fresh n8n (same encryption key):
#   n8n import:workflow --separate --input=workflows/
#   n8n import:credentials --input=credentials.json
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: n8n-backup
  namespace: n8n
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: n8n-backup
  namespace: n8n
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: n8n-backup
  namespace: n8n
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: n8n-backup
subjects:
  - kind: ServiceAccount
    name: n8n-backup
    namespace: n8n
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: n8n-backup
  namespace: n8n
spec:
  schedule: "30 * * * *"            # hourly at :30 (staggered from postgres) — dev rollback
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        spec:
          serviceAccountName: n8n-backup
          restartPolicy: Never
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
          initContainers:
            - name: copy-mc
              image: minio/mc:latest          # TODO: pin to a digest
              securityContext:
                runAsUser: 0                  # mc is 0711 root-owned; need root to read+copy it
              command: ["/bin/sh", "-c", "cp /usr/bin/mc /tools/mc && chmod 0755 /tools/mc"]
              volumeMounts:
                - { name: tools, mountPath: /tools }
          containers:
            - name: export
              image: rancher/kubectl:v1.31.5
              envFrom:
                - secretRef: { name: backup-s3-secret }   # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_ENDPOINTS
              env:
                - { name: HOME,      value: /work }
                - { name: BUCKET,    value: app-backups }
                - { name: PREFIX,    value: n8n }
                - { name: RETENTION, value: "7d" }    # 7d of hourly exports = 168 restore points
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  POD=$(kubectl get pod -n n8n -l app=n8n -o jsonpath='{.items[0].metadata.name}')
                  TS=$(date +%Y%m%d-%H%M%S)
                  echo "==> Exporting workflows + credentials from ${POD} ..."
                  kubectl exec -n n8n "$POD" -- sh -c '
                    set -e
                    rm -rf /tmp/n8n-backup && mkdir -p /tmp/n8n-backup/workflows
                    n8n export:workflow --all --separate --output=/tmp/n8n-backup/workflows >/dev/null
                    n8n export:credentials --all --output=/tmp/n8n-backup/credentials.json >/dev/null
                    tar czf /tmp/n8n-backup.tgz -C /tmp/n8n-backup .
                  '
                  kubectl cp -n n8n "$POD:/tmp/n8n-backup.tgz" "/work/n8n-${TS}.tgz"
                  kubectl exec -n n8n "$POD" -- rm -rf /tmp/n8n-backup /tmp/n8n-backup.tgz || true
                  echo "==> Uploading n8n-${TS}.tgz ..."
                  /tools/mc alias set s3 "$AWS_ENDPOINTS" "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY"
                  /tools/mc mb --ignore-existing "s3/${BUCKET}"
                  /tools/mc cp "/work/n8n-${TS}.tgz" "s3/${BUCKET}/${PREFIX}/n8n-${TS}.tgz"
                  echo "==> Pruning > ${RETENTION} old ..."
                  /tools/mc rm --recursive --force --older-than "$RETENTION" "s3/${BUCKET}/${PREFIX}/" || true
                  echo "==> Done: s3://${BUCKET}/${PREFIX}/n8n-${TS}.tgz"
              volumeMounts:
                - { name: tools, mountPath: /tools }
                - { name: work,  mountPath: /work }
          volumes:
            - { name: tools, emptyDir: {} }
            - { name: work,  emptyDir: {} }
