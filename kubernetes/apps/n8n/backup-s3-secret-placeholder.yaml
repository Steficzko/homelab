# Placeholder so the empty Secret exists before the real (SOPS) data is applied.
# IgnoreExtraneous + Prune=false keep ArgoCD selfHeal from stripping the
# out-of-band data from backup-s3-secret.sops.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: backup-s3-secret
  namespace: n8n
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-options: Prune=false
type: Opaque
