# Excluded from ArgoCD (see bootstrap/apps/neo4j.yaml). Apply once by hand from the SOPS
# file. Keys: AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_ENDPOINTS.
# Scoped MinIO user neo4j-backup -> app-backups/neo4j/ only.
apiVersion: v1
kind: Secret
metadata:
  name: backup-s3-secret
  namespace: neo4j
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-options: Prune=false
type: Opaque
