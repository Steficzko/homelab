apiVersion: v1
kind: Namespace
metadata:
  name: neo4j
---
# neo4j-data-v2 replaces the original 20Gi neo4j-data, which reserved 64.5 GB across
# three replicas to hold 526 MB — the single largest waster in the cluster. Kubernetes
# cannot shrink a PVC, so the only route is a new claim, a copy and a cutover. The old
# claim is deliberately NOT deleted here: it stays as the rollback until someone removes
# it by hand after verifying the new one.
#
# 3Gi is ~6x the current data, not a round number. allowVolumeExpansion is true on this
# StorageClass, so growing later is a one-line edit with no downtime, while shrinking is
# this entire dance. Provision small, expand on evidence.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: neo4j-data-v2
  namespace: neo4j
  labels:
    # BOTH of these are required and neither is optional.
    #
    # source=enabled is what makes Longhorn PROPAGATE a PVC's recurring-job
    # labels onto the Volume at all. Without it the daily-backup label sits on
    # the PVC looking correct and the Volume never receives it — verified on
    # this very volume on 2026-09-14, which came back from the migration with
    # no backup label until this line was added.
    recurring-job.longhorn.io/source: "enabled"
    # The explicit per-job label is what actually reaches the backup. The
    # `default` GROUP label does nothing: recurringjob daily-backup has
    # `groups: []`, which is why 13 volumes carrying only the group label have
    # never been backed up once.
    recurring-job.longhorn.io/daily-backup: "enabled"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources: { requests: { storage: 3Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: neo4j, namespace: neo4j }
spec:
  replicas: 1
  strategy: { type: Recreate }        # single RWO volume; Community is single-instance anyway
  selector: { matchLabels: { app: neo4j } }
  template:
    metadata: { labels: { app: neo4j } }
    spec:
      # The Service is named "neo4j", so kubelet injects NEO4J_PORT_7687_TCP_PORT=... which
      # Neo4j's strict config validation reads as the unknown setting PORT.7687.TCP.PORT and
      # crash-loops. Same collision class as paperless; kill the legacy link vars.
      enableServiceLinks: false
      securityContext: { fsGroup: 7474 }   # the "neo4j" user/group in the image
      containers:
        - name: neo4j
          image: neo4j:5-community@sha256:5eb12ad77fa46ab73e23df9ea1f43f5c0f2a79523435577648e046be042b9b93
          envFrom:
            - secretRef: { name: neo4j-auth }        # NEO4J_AUTH=neo4j/<password>
          env:
            # Community edition — set explicitly so an accidental enterprise image can't
            # silently start unlicensed.
            - { name: NEO4J_ACCEPT_LICENSE_AGREEMENT, value: "no" }
            # APOC: the standard procedure library. Needed for online logical export on
            # Community (neo4j-admin dump is offline-only), and load-bearing for graph work.
            # The image auto-downloads the apoc-core jar on first boot -> egress 443 below.
            - { name: NEO4J_PLUGINS, value: '["apoc"]' }
            # Heap and page cache are the two knobs that matter. Sized to the 2Gi request
            # below with headroom: JVM heap 1G, page cache 512M, ~0.5G for the rest.
            - { name: NEO4J_server_memory_heap_initial__size, value: "1G" }
            - { name: NEO4J_server_memory_heap_max__size,     value: "1G" }
            - { name: NEO4J_server_memory_pagecache_size,     value: "512m" }
            # Bind both listeners to all interfaces inside the pod so the Service can reach them.
            - { name: NEO4J_server_default__listen__address, value: "0.0.0.0" }
          ports:
            - { name: http, containerPort: 7474 }    # Browser UI + HTTP API
            - { name: bolt, containerPort: 7687 }    # Bolt protocol (drivers)
          readinessProbe:
            tcpSocket: { port: 7687 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 7687 }
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests: { memory: 2Gi, cpu: "250m" }
            limits:   { memory: 3Gi }               # > heap+pagecache+overhead; JVM must not be OOMKilled
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: neo4j-data-v2 } }
---
apiVersion: v1
kind: Service
metadata: { name: neo4j, namespace: neo4j }
spec:
  selector: { app: neo4j }
  ports:
    - { name: http, port: 7474, targetPort: http }
    - { name: bolt, port: 7687, targetPort: bolt }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: neo4j, namespace: neo4j }
spec:
  podSelector: { matchLabels: { app: neo4j } }
  policyTypes: [Ingress, Egress]
  ingress:
    # Both the HTTP browser (7474) and Bolt (7687) are reached two ways: in-cluster, and
    # over the tailnet via `tailscale serve` on a node — whose traffic arrives from the NODE,
    # not the ingress-nginx namespace. An earlier ingress-nginx-only rule on 7474 blocked the
    # node path, so the browser reset while Bolt worked. Both ports are open in-cluster; the
    # gate is Neo4j's own auth, and nothing reaches the pod from outside except the deliberate
    # tailscale serve.
    - ports: [{ port: 7474 }, { port: 7687 }]
  egress:
    - ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]   # DNS
    - ports: [{ port: 443, protocol: TCP }]                               # APOC plugin download, first boot only
