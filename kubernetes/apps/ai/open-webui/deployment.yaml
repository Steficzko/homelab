apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: ai
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:main
          ports:
            - containerPort: 8080
          env:
            # Try Streacom_ML GPU first, fall back to CPU Ollama in cluster
            - name: OLLAMA_BASE_URLS
              value: "http://ollama-gpu.ai.svc.cluster.local:11434;http://ollama.ai.svc.cluster.local:11434"
            - name: WEBUI_AUTH
              value: "true"
            # Enables RAG with Ollama embeddings (nomic-embed-text model)
            - name: RAG_EMBEDDING_ENGINE
              value: "ollama"
            - name: RAG_OLLAMA_BASE_URL
              value: "http://ollama.ai.svc.cluster.local:11434"
          resources:
            requests:
              memory: 500Mi
              cpu: "250m"
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-pvc
