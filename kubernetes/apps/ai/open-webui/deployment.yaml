apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: ai
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      affinity:                              # ADR-030 pattern: prefer workers, soft fallback
        nodeAffinity:                        # 2026-10-02: CPs at 76-80% mem, w1 at 25% after its 32 GB upgrade
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui@sha256:8b432fe0a65b91116afc7961365c6cca5379cc923171386a96691f3471f3cae9
          ports:
            - containerPort: 8080
          env:
            - name: OLLAMA_BASE_URLS
              value: ""
            - name: WEBUI_AUTH
              value: "true"
            # Built-in sentence-transformers for RAG embeddings (ADR-018)
            - name: RAG_EMBEDDING_ENGINE
              value: ""
            - name: RAG_OLLAMA_BASE_URL
              value: ""
            - name: OPENAI_API_BASE_URL
              value: "http://litellm.ai.svc.cluster.local:4000/v1"
            - name: OPENAI_API_KEY
              value: "dummy"
            - name: AUDIO_STT_ENGINE
              value: "openai"
            - name: AUDIO_STT_OPENAI_API_BASE_URL
              value: "http://litellm.ai.svc.cluster.local:4000/v1"
            - name: AUDIO_STT_OPENAI_API_KEY
              value: "dummy"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              memory: 500Mi
              cpu: "250m"
            limits:
              memory: 3Gi
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-pvc
