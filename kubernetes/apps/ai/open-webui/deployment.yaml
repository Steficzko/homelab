apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: ai
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui@sha256:6a773e5c3a246b65cbe74ce942b294292c0e5f81c138f703d111bc162f7d7c3d
          ports:
            - containerPort: 8080
          env:
            - name: OLLAMA_BASE_URLS
              value: ""
            - name: WEBUI_AUTH
              value: "true"
            # Built-in sentence-transformers for RAG embeddings (ADR-018)
            - name: RAG_EMBEDDING_ENGINE
              value: ""
            - name: RAG_OLLAMA_BASE_URL
              value: ""
            - name: OPENAI_API_BASE_URL
              value: "http://litellm.ai.svc.cluster.local:4000/v1"
            - name: OPENAI_API_KEY
              value: "dummy"
            - name: AUDIO_STT_ENGINE
              value: "openai"
            - name: AUDIO_STT_OPENAI_API_BASE_URL
              value: "http://litellm.ai.svc.cluster.local:4000/v1"
            - name: AUDIO_STT_OPENAI_API_KEY
              value: "dummy"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              memory: 500Mi
              cpu: "250m"
            limits:
              memory: 3Gi
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-pvc
