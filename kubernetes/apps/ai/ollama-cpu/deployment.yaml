apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ai
spec:
  replicas: 1
  strategy:
    type: Recreate  # RWO volume — kill old pod before starting new one
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      affinity:                              # ADR-030 tier-A: prefer workers (non-control-plane), soft fallback
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
            # 2026-10-18 (CLSTR-28): prefer the 32 GiB worker. This is the one 8Gi-limit
            # tenant, and its Longhorn replica already lives on w1 since the g2->w1
            # rebalance. Preferred, not required — it still schedules anywhere.
            - weight: 50
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [k3s-prg-w1]
      containers:
        - name: ollama
          image: ollama/ollama@sha256:dea72d1e22270fe095b68fdf756d2b489d615643c5a2eaebbc5f569181e322d8
          ports:
            - containerPort: 11434
          env:
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"
          readinessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              memory: 4Gi        # sized for a loaded model (chat-fallback), not for idle
              # 2026-08-29: was cpu "2" — see the note in whisper-cpu. This pod idles
              # at ~1m CPU while reserving two cores. The limit below still allows
              # four cores when a fallback inference actually runs.
              cpu: 250m
            limits:
              # 2026-10-18: 14d max 3.85Gi with the fallback model loaded (p95 280Mi
              # idle). 12Gi was 3x the largest thing it has ever held and the single
              # biggest line in w2's 236%-of-RAM limit stack (CLSTR-28).
              memory: 8Gi
              cpu: "4"
          volumeMounts:
            - name: data
              mountPath: /root/.ollama
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ollama-pvc
