# Additive: admit clinic-api (dental-clinic ns) to ollama for on-prem voice
# extraction (saas.dental v0.29.0 voice pipeline). ollama, NOT litellm — the
# app calls ollama directly. Only clinic-api, only :11434.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ollama-from-clinic-api
  namespace: ai
spec:
  podSelector:
    matchLabels: {app: ollama}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: dental-clinic}
          podSelector:
            matchLabels: {app: clinic-api}
        # staging tier (2026-08-02): kostikidis.net runs clinic-api-staging and
        # must reach the SAME on-prem targets, or voice silently fails exactly
        # where it is supposed to be tested first.
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: dental-clinic}
          podSelector:
            matchLabels: {app: clinic-api-staging}
      ports: [{port: 11434}]
