# ExternalName service pointing to Streacom_ML via Tailscale
# Update externalName with Streacom_ML Tailscale IP once the machine is online
apiVersion: v1
kind: Service
metadata:
  name: ollama-gpu
  namespace: ai
spec:
  type: ExternalName
  externalName: STREACOM_ML_TAILSCALE_IP  # replace with actual IP when ready
  ports:
    - port: 11434
