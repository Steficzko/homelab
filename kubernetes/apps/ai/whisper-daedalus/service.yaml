# whisper on daedalus (VM 100 on pve, GTX 1660, Docker ~/ml/compose.yaml), 192.168.10.10 (VLAN 10, router
# DHCP reservation). Replaced whisper-rtx (LXC 114, deleted 2026-10-30). EndpointSlice like
# immich-ml-daedalus, so the address lives in git.
apiVersion: v1
kind: Service
metadata:
  name: whisper-daedalus
  namespace: ai
spec:
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: whisper-daedalus
  namespace: ai
  labels:
    kubernetes.io/service-name: whisper-daedalus
addressType: IPv4
ports:
  - port: 8000
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.10.10
