apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: ai
data:
  config.yaml: |
    model_list:
      - model_name: chat
        litellm_params:
          model: ollama/gemma4:latest
          api_base: http://ollama-gpu.ai.svc.cluster.local:11434
          timeout: 180
      - model_name: gemma4
        litellm_params:
          model: ollama/gemma4:latest
          api_base: http://ollama-gpu.ai.svc.cluster.local:11434
          timeout: 180

      - model_name: DrGemmaQ4
        litellm_params:
          model: ollama/DrGemmaQ4:latest
          api_base: http://192.168.1.227:11434
          timeout: 180
      - model_name: DrGemmaQ8
        litellm_params:
          model: ollama/gemma4-q8:latest
          api_base: http://192.168.1.227:11434
          timeout: 180

      - model_name: chat-fallback
        litellm_params:
          model: ollama/qwen2.5:7b
          api_base: http://ollama.ai.svc.cluster.local:11434
          timeout: 180

      - model_name: whisper
        litellm_params:
          model: openai/Systran/faster-whisper-large-v3
          api_base: http://whisper-gpu.ai.svc.cluster.local:8000/v1
          api_key: dummy
          timeout: 180
      - model_name: whisper-fallback
        litellm_params:
          model: openai/Systran/faster-whisper-large-v3
          api_base: http://whisper.ai.svc.cluster.local:8000/v1
          api_key: dummy
          timeout: 180

    router_settings:
      num_retries: 1
      timeout: 90
      cooldown_time: 60
      fallbacks: [{"chat": ["chat-fallback"]}, {"whisper": ["whisper-fallback"]}]
