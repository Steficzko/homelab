apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: ai
data:
  config.yaml: |
    model_list:
      # `chat` is the wired local GPU, falling back to the in-cluster CPU.
      # Wired in router_settings.fallbacks below, not here.
      #
      # It used to be a three-tier chain with the TUF laptop's RTX 4080 in front.
      # That is reverted as of 2026-09-15 and the TUF is now `chat-tuf`, an
      # opt-in name nothing falls through to. Two measurements killed it:
      #
      #   warm, 2026-09-13:  TUF 1.11s  vs  .224 0.55s
      #   asleep, 2026-09-15: `chat` 39.6s end to end, answered by .224 anyway
      #
      # It is SLOWER than the tier behind it when healthy, because the request
      # crosses a continent to reach it, and it is a laptop in Iraq that was
      # `offline, last seen 8h ago` when this was written. An offline tailnet
      # peer BLACKHOLES rather than refusing (`tx 312 rx 0`), so every call paid
      # timeout x attempts before falling through. Dropping the timeout 180 -> 15
      # cut that from 542s to 40s, which is a fix for the symptom: a first tier
      # that is never the fastest and is usually absent has no business being
      # first. ADR-014 again — do not turn degraded performance into an outage.
      #
      # ollama_chat/ + think:false, NOT ollama/. See the note on gemma4 below.
      - model_name: chat
        litellm_params:
          model: ollama_chat/gemma4:12b
          api_base: http://ollama-gpu.ai.svc.cluster.local:11434
          timeout: 180
          think: false

      # The TUF laptop's RTX 4080 over tailscale, reached at its tailnet IP and
      # NOT via a Service: TM-TUF/cluster/README.md designed a hostNetwork socat
      # bridge on the premise that pods cannot route to 100.64/10. That premise
      # is false — verified 2026-09-13 from pods on w2, g2 and b3, all 200 — so
      # the bridge is unnecessary and is deliberately not deployed.
      #
      # timeout 15 because of the blackhole above: ask for this one by name and
      # you get a fast answer or a fast failure into chat, never a 9-minute hang.
      - model_name: chat-tuf
        litellm_params:
          model: ollama_chat/gemma4:12b
          api_base: http://100.69.56.89:11434
          timeout: 15
          think: false

      # Tier 2 — the wired local GPU. These are the exact params `chat` used
      # before the TUF went in front of it.
      # ollama_chat/ + think:false here too. These were the exact params `chat`
      # carried before the TUF went in front of it, and they were already wrong —
      # this is an inherited bug, not one the chain introduced. Measured
      # 2026-09-14, prompt "Say the word pong":
      #   ollama/ (no think:false)      max_tokens=8   -> EMPTY, 8 tokens burned
      #                                 max_tokens=64  -> "pong", 49 tokens
      #   ollama_chat/ + think:false    any budget     -> "pong", 2 tokens
      # So it wasted ~25x the tokens on hidden thinking and returned nothing at
      # all on a small budget. That matters more now than it used to: this is the
      # tier that serves every request while the TUF laptop is asleep.
      - model_name: chat-gpu
        litellm_params:
          model: ollama_chat/gemma4:12b
          api_base: http://ollama-gpu.ai.svc.cluster.local:11434
          timeout: 180
          think: false
      # All four carry ollama_chat/ + think:false for the same reason chat and
      # chat-json do. They were left on the bare ollama/ route when those two
      # were fixed, and two of them were silently broken by it. Measured
      # 2026-09-15, prompt "Say the word pong":
      #
      #   gemma4     max_tokens=32  -> ''     32 completion tokens burned
      #              max_tokens=256 -> 'Pong' 29 tokens
      #   DrGemmaQ4  max_tokens=32  -> ''     32 tokens burned
      #              max_tokens=256 -> 'pong' 215 tokens
      #   gemma4-26b / DrGemmaQ8    -> 'pong'  2 tokens, unaffected
      #
      # An empty string and a full bill is the worst failure shape available: the
      # call returns 200 and the caller cannot tell it got nothing. The two that
      # were fine are converted too — a route that is only correct because of
      # which model happens to sit behind it is a trap waiting for the next pull.
      - model_name: gemma4
        litellm_params:
          model: ollama_chat/gemma4:12b
          api_base: http://ollama-gpu.ai.svc.cluster.local:11434
          timeout: 180
          think: false
      - model_name: gemma4-26b
        litellm_params:
          model: ollama_chat/gemma4:latest
          api_base: http://ollama-gpu.ai.svc.cluster.local:11434
          timeout: 180
          think: false

      - model_name: DrGemmaQ4
        litellm_params:
          model: ollama_chat/DrGemmaQ4:latest
          api_base: http://ollama-gpu.ai.svc.cluster.local:11434
          timeout: 180
          think: false
      - model_name: DrGemmaQ8
        litellm_params:
          model: ollama_chat/gemma4-q8:latest
          api_base: http://ollama-gpu.ai.svc.cluster.local:11434
          timeout: 180
          think: false

      # qwen3.5-abliterated 9.7B Q4_K_M, pulled 2026-09-15. Additive on purpose:
      # `chat` stays on gemma4:12b until this has more than one afternoon of
      # evidence behind it. Measured head to head on .224 the same day:
      #
      #   throughput   47.8 vs 33.4 tok/s   (+43%, consistent over 5 prompts)
      #   prose        tie
      #   shell/k8s    qwen clearly better - gemma emitted invalid jsonpath
      #   python spec  gemma clearly better - qwen retried 4xx it was told not to
      #
      # So: faster and lighter, quality a wash with different failure modes.
      #
      # temperature pinned. This model ships a DEFAULT OF 1 (gemma and the qwen3
      # 14b both default to 0.6), which is too hot for anything factual, and an
      # inherited default that differs per model is how you get results you
      # cannot reproduce.
      #
      # It cannot share the card with gemma4:12b - 6.59 + 7.56 = 14.15 GB against
      # 12 GB of VRAM - so switching between this and `chat` evicts and reloads,
      # ~8-12s each way. That is the cost of keeping both; it is not a fault.
      - model_name: qwen9b
        litellm_params:
          model: ollama_chat/huihui_ai/qwen3.5-abliterated:9b
          api_base: http://ollama-gpu.ai.svc.cluster.local:11434
          timeout: 180
          think: false
          temperature: 0.6

      - model_name: chat-fallback
        litellm_params:
          model: ollama/gemma3:4b
          api_base: http://ollama.ai.svc.cluster.local:11434
          timeout: 300

      - model_name: json-extract
        litellm_params:
          model: ollama_chat/qwen3:4b   # ollama_chat (not ollama/) — /api/chat handles json_schema + think correctly
          api_base: http://ollama.ai.svc.cluster.local:11434
          timeout: 300
          think: false                  # qwen3 thinking off — JSON pipeline needs answers, not pondering

      - model_name: chat-json
        litellm_params:
          model: ollama_chat/gemma4:12b   # ollama_chat route — respects response_format (constrained JSON decode) + think
          api_base: http://ollama-gpu.ai.svc.cluster.local:11434
          timeout: 180
          think: false                    # gemma4 thinking eats the whole context on long transcripts → empty content

      - model_name: whisper
        litellm_params:
          model: openai/Systran/faster-whisper-large-v3
          api_base: http://whisper-ryzen.ai.svc.cluster.local:8000/v1
          api_key: dummy
          timeout: 600
      - model_name: whisper-fallback
        litellm_params:
          model: openai/Systran/faster-whisper-large-v3
          api_base: http://whisper.ai.svc.cluster.local:8000/v1
          api_key: dummy
          timeout: 600

    router_settings:
      num_retries: 1
      timeout: 90
      cooldown_time: 60
      # chat falls through local GPU -> in-cluster CPU. chat-gpu is kept as an
      # alias of chat so existing callers do not break; nothing falls through to
      # chat-tuf, which is opt-in only, but asking for it by name still degrades
      # into the cluster rather than failing outright.
      fallbacks: [{"chat": ["chat-fallback"]}, {"qwen9b": ["chat-fallback"]}, {"chat-gpu": ["chat-fallback"]}, {"chat-tuf": ["chat", "chat-fallback"]}, {"gemma4": ["chat-fallback"]}, {"whisper": ["whisper-fallback"]}]

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
