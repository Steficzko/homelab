apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: ai
data:
  config.yaml: |
    model_list:
      - model_name: chat
        litellm_params:
          model: ollama/gemma4:latest
          api_base: http://ollama-gpu.ai.svc.cluster.local:11434
          timeout: 5
      - model_name: chat-fallback
        litellm_params:
          model: ollama/qwen2.5:7b
          api_base: http://ollama.ai.svc.cluster.local:11434
          timeout: 60

      - model_name: whisper
        litellm_params:
          model: openai/whisper-1
          api_base: http://whisper-gpu.ai.svc.cluster.local:8000
          api_key: dummy
          timeout: 60
      - model_name: whisper-fallback
        litellm_params:
          model: openai/whisper-1
          api_base: http://whisper.ai.svc.cluster.local:8000
          api_key: dummy
          timeout: 120

    router_settings:
      num_retries: 1
      timeout: 90
      fallbacks: [{"chat": ["chat-fallback"]}, {"whisper": ["whisper-fallback"]}]
