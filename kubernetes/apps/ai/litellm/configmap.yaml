apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: ai
data:
  config.yaml: |
    model_list:
      # 2026-11-21: only abliterated models are kept on .224. gemma4:12b and the
      # other stock models were deleted from .224; every GPU route now serves
      # qwen3-14b-abliterated:q4 (mlabonne abliteration, bartowski Q4_K_M) or
      # qwen3.5-abliterated:9b. ollama_chat/ + think:false everywhere — the bare
      # ollama/ route burns tokens on hidden thinking and returns empty content.
      - model_name: chat
        litellm_params:
          model: ollama_chat/qwen3-14b-abliterated:q4
          api_base: http://ollama-gpu.ai.svc.cluster.local:11434
          timeout: 180
          think: false

      # The TUF laptop's RTX 4080 over tailscale. opt-in only, nothing falls
      # through to it; timeout 15 because an offline tailnet peer blackholes.
      - model_name: chat-tuf
        litellm_params:
          model: ollama_chat/qwen3-14b-abliterated:q4
          api_base: http://100.69.56.89:11434
          timeout: 15
          think: false

      # alias of chat so existing callers do not break
      - model_name: chat-gpu
        litellm_params:
          model: ollama_chat/qwen3-14b-abliterated:q4
          api_base: http://ollama-gpu.ai.svc.cluster.local:11434
          timeout: 180
          think: false

      # Qwen3 14B abliterated (mlabonne) Q4_K_M, imported 2026-11-21 from
      # /mnt/devdata/models/Qwen3-14B-abliterated-mlabonne. Verified on .224:
      # answers with done_reason=stop, no runaway think loop (the huihui variant
      # of this model never terminates its <think> block — do not re-import it).
      # 9.4 GB on the 12 GB card — evicts/reloads against qwen9b, ~8-12s each way.
      - model_name: qwen14b
        litellm_params:
          model: ollama_chat/qwen3-14b-abliterated:q4
          api_base: http://ollama-gpu.ai.svc.cluster.local:11434
          timeout: 180
          think: false
          temperature: 0.6

      # qwen3.5-abliterated 9.7B Q4_K_M, pulled 2026-09-15. 47.8 tok/s vs 33.4 on
      # gemma4:12b; lighter on VRAM. temperature pinned for reproducibility.
      - model_name: qwen9b
        litellm_params:
          model: ollama_chat/huihui_ai/qwen3.5-abliterated:9b
          api_base: http://ollama-gpu.ai.svc.cluster.local:11434
          timeout: 180
          think: false
          temperature: 0.6

      - model_name: chat-fallback
        litellm_params:
          model: ollama/gemma3:4b
          api_base: http://ollama.ai.svc.cluster.local:11434
          timeout: 300

      - model_name: json-extract
        litellm_params:
          model: ollama_chat/qwen3:4b   # ollama_chat (not ollama/) — /api/chat handles json_schema + think correctly
          api_base: http://ollama.ai.svc.cluster.local:11434
          timeout: 300
          think: false                  # qwen3 thinking off — JSON pipeline needs answers, not pondering

      - model_name: chat-json
        litellm_params:
          model: ollama_chat/qwen3-14b-abliterated:q4
          api_base: http://ollama-gpu.ai.svc.cluster.local:11434
          timeout: 180
          think: false

      # whisper = GTX 1660 in daedalus (VM 100, large-v3 int8_float16); falls back to
      # RYZEN CPU via whisper-cpu when the VM is off. Same faster-whisper-server image on
      # both, so the verbose_json shape brain's hallucination filter reads is identical.
      - model_name: whisper
        litellm_params:
          model: openai/Systran/faster-whisper-large-v3
          api_base: http://whisper-daedalus.ai.svc.cluster.local:8000/v1
          api_key: dummy
          timeout: 600

      - model_name: whisper-cpu
        litellm_params:
          model: openai/Systran/faster-whisper-large-v3
          api_base: http://whisper-ryzen.ai.svc.cluster.local:8000/v1
          api_key: dummy
          timeout: 600

      # Anthropic, for the Hermes agents (H2). The key lives only in litellm-secret;
      # agents hold per-agent virtual keys scoped to these two names.
      - model_name: sonnet
        litellm_params:
          model: anthropic/claude-sonnet-5-5
          api_key: os.environ/ANTHROPIC_API_KEY
      - model_name: haiku
        litellm_params:
          model: anthropic/claude-haiku-5-5
          api_key: os.environ/ANTHROPIC_API_KEY

    router_settings:
      num_retries: 1
      timeout: 90
      cooldown_time: 60
      # chat falls through local GPU -> in-cluster CPU. chat-gpu is kept as an
      # alias of chat; nothing falls through to chat-tuf, which is opt-in only.
      fallbacks: [{"chat": ["chat-fallback"]}, {"qwen9b": ["chat-fallback"]}, {"qwen14b": ["chat-fallback"]}, {"chat-gpu": ["chat-fallback"]}, {"chat-tuf": ["chat", "chat-fallback"]}, {"whisper": ["whisper-cpu"]}]

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
