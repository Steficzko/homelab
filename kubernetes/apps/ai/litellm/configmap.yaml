apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: ai
data:
  config.yaml: |
    model_list:
      - model_name: chat
        litellm_params:
          model: ollama/gemma4:latest
          api_base: http://ollama-gpu.ai.svc.cluster.local:11434
          timeout: 5
      - model_name: chat-fallback
        litellm_params:
          model: ollama/qwen2.5:7b
          api_base: http://ollama.ai.svc.cluster.local:11434
          timeout: 60

    router_settings:
      num_retries: 1
      timeout: 90
      fallbacks: [{"chat": ["chat-fallback"]}]
