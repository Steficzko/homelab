apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper
  namespace: ai
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: whisper
  template:
    metadata:
      labels:
        app: whisper
    spec:
      affinity:                              # ADR-030 tier-A: prefer workers (non-control-plane), soft fallback
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: whisper
          image: fedirz/faster-whisper-server@sha256:760e5e43d427dc6cfbbc4731934b908b7de9c7e6d5309c6a1f0c8c923a5b6030
          ports:
            - containerPort: 8000
          env:
            - name: WHISPER__MODEL
              value: large-v3       # best multilingual — Greek, English, Czech
            - name: WHISPER__DEVICE
              value: cpu
            - name: WHISPER__COMPUTE_TYPE
              value: int8           # int8 quantization: 4x faster on CPU with minimal accuracy loss
            - name: WHISPER__LANGUAGE
              value: ""             # empty = auto-detect language per request
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 15
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 180
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              memory: 4Gi
              cpu: "2"
            limits:
              memory: 6Gi
          volumeMounts:
            - name: cache
              mountPath: /root/.cache/huggingface
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: whisper-pvc
