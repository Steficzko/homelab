# Exposed via the kostikidis wildcard Cloudflare tunnel, behind the
# *.kostikidis.net Cloudflare Access wildcard (Erin's own auth is off — see
# deployment.yaml). No bypass policy.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: erin
  namespace: erin
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Traefik (CLSTR-29): no http->https redirect on the tunnel hop and no response
    # buffering by default, so streamed video seeks straight off NFS.
spec:
  ingressClassName: traefik
  tls:
    - hosts: [feed.kostikidis.net]
      secretName: feed-kostikidis-net-tls
  rules:
    - host: feed.kostikidis.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: erin
                port:
                  number: 80
