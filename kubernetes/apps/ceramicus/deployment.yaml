apiVersion: apps/v1
kind: Deployment
metadata:
  name: ceramicus
  namespace: ceramicus
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ceramicus
  template:
    metadata:
      labels:
        app: ceramicus
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: ceramicus
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: ceramicus
          image: ghcr.io/steficzko/ceramicus-site:c4f93445bfc00bfe08cb0c7e4b9727dcebc564f6
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: 32Mi
              cpu: "10m"
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
