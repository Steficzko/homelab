apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ceramicus
  namespace: ceramicus
spec:
  podSelector:
    matchLabels:
      app: ceramicus
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 80
  egress: []
