apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog
  namespace: blog
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blog
  template:
    metadata:
      labels:
        app: blog
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: blog
      containers:
        - name: blog
          image: ghcr.io/steficzko/kostikidis-blog:1a729ce08dd4f3b3c272bc5eb670122ca292628a@sha256:ab88d5d6773071a88dada80ea52c0481705e5d2f1616a94976d9c8194ce3bf5c
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: 32Mi
              cpu: "10m"
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
