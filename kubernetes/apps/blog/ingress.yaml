apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blog
  namespace: blog
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - www.kostikidis.net
      secretName: blog-tls
  rules:
    - host: www.kostikidis.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blog
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blog-apex-redirect
  namespace: blog
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Same as the old nginx permanent-redirect: 301 to the www root, path dropped.
    traefik.ingress.kubernetes.io/router.middlewares: blog-apex-to-www@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - kostikidis.net
      secretName: blog-apex-tls
  rules:
    - host: kostikidis.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blog
                port:
                  number: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: apex-to-www
  namespace: blog
spec:
  redirectRegex:
    regex: ".*"
    replacement: "https://www.kostikidis.net"
    permanent: true
