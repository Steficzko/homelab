# Warehouse app DB — TEAMELWANY pattern: Postgres is the backend, n8n workflows are the API.
# Schema lives in the NAMO project repo (NAMO/warehouse/schema/), applied with psql out-of-band.
apiVersion: v1
kind: Service
metadata:
  name: warehouse-postgres
  namespace: namo-apps
spec:
  selector:
    app: warehouse-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: warehouse-postgres
  namespace: namo-apps
spec:
  serviceName: warehouse-postgres
  replicas: 1
  selector:
    matchLabels:
      app: warehouse-postgres
  template:
    metadata:
      labels:
        app: warehouse-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_DB, value: warehouse }
            - { name: POSTGRES_USER, value: warehouse }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: warehouse-pg-secret, key: POSTGRES_PASSWORD }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "warehouse"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { memory: 128Mi, cpu: 50m }
            limits:   { memory: 512Mi, cpu: "1" }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn
        resources:
          requests:
            storage: 5Gi
---
# Nightly logical backup -> MinIO (same bucket as the shop, warehouse/ prefix, 30d ILM server-side).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: warehouse-backup
  namespace: namo-apps
spec:
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 10800
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app: warehouse-backup
        spec:
          restartPolicy: Never
          initContainers:
            - name: copy-mc
              image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
              securityContext:
                runAsUser: 0
              command: ["/bin/sh", "-c", "cp /usr/bin/mc /tools/mc && chmod 0755 /tools/mc"]
              volumeMounts:
                - { name: tools, mountPath: /tools }
          containers:
            - name: dump
              image: postgres:16-alpine
              envFrom:
                - secretRef: { name: backup-s3-secret }   # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_ENDPOINTS
              env:
                - { name: HOME,   value: /work }
                - { name: BUCKET, value: namosocks-backups }
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: { name: warehouse-pg-secret, key: POSTGRES_PASSWORD }
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  TS=$(date +%Y%m%d-%H%M%S)
                  /tools/mc alias set s3 "$AWS_ENDPOINTS" "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY"
                  for DB in warehouse warehouse_eu; do
                    pg_dump -h warehouse-postgres -U warehouse "$DB" | gzip -6 > "/work/${DB}-${TS}.sql.gz"
                    /tools/mc cp "/work/${DB}-${TS}.sql.gz" "s3/${BUCKET}/warehouse/${DB}-${TS}.sql.gz"
                  done
              volumeMounts:
                - { name: tools, mountPath: /tools }
                - { name: work, mountPath: /work }
          volumes:
            - { name: tools, emptyDir: {} }
            - { name: work, emptyDir: {} }
