# Warehouse admin UI — one static index.html (built in NAMO/warehouse/webadmin/, synced into the
# ConfigMap by NAMO/warehouse/scripts/deploy_ui.sh) + nginx proxying /api/ -> n8n /webhook/.
# The X-WH-Key header is injected HERE, server-side, so the browser and the HTML never see it —
# direct calls to the n8n webhooks on automation.namosocks.com without the key get 403.
apiVersion: v1
kind: Service
metadata:
  name: warehouse-ui
  namespace: namo-apps
spec:
  selector:
    app: warehouse-ui
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: warehouse-ui-nginx
  namespace: namo-apps
data:
  default.conf.template: |
    server {
      listen 80;
      root /usr/share/nginx/html;
      # Auth lives HERE (not the ingress) so we know WHO logged in: namo sees both regions,
      # bawan only the EU one. /api/me/* is the Middle East DB, /api/eu/* the EU DB.
      auth_basic "Namo warehouse";
      auth_basic_user_file /etc/nginx/htpasswd/auth;
      location = /api/whoami {
        default_type application/json;
        return 200 '{"user":"$remote_user"}';
      }
      location /api/me/ {
        if ($remote_user != "namo") { return 403; }
        proxy_pass http://n8n.namo-apps.svc.cluster.local/webhook/;
        proxy_set_header X-WH-Key "${WH_KEY}";
        proxy_set_header Host $host;
      }
      location /api/eu/ {
        proxy_pass http://n8n.namo-apps.svc.cluster.local/webhook/eu-;
        proxy_set_header X-WH-Key "${WH_KEY}";
        proxy_set_header Host $host;
      }
      # Marketing: Shlink admin API (go.namosocks.com) — key injected here, namo only.
      location /api/shlink/ {
        if ($remote_user != "namo") { return 403; }
        proxy_pass http://shlink.namo-apps.svc.cluster.local/rest/;
        proxy_set_header X-Api-Key "${SHLINK_KEY}";
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: warehouse-ui
  namespace: namo-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: warehouse-ui
  template:
    metadata:
      labels:
        app: warehouse-ui
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          env:
            - name: WH_KEY
              valueFrom:
                secretKeyRef: { name: warehouse-ui-secret, key: WH_KEY }
            - name: SHLINK_KEY
              valueFrom:
                secretKeyRef: { name: namo-shlink-secret, key: INITIAL_API_KEY }
          ports:
            - containerPort: 80
          resources:
            requests: { memory: 16Mi, cpu: 10m }
            limits:   { memory: 64Mi, cpu: 200m }
          volumeMounts:
            - { name: html, mountPath: /usr/share/nginx/html }
            - { name: nginx-conf, mountPath: /etc/nginx/templates }
            - { name: htpasswd, mountPath: /etc/nginx/htpasswd, readOnly: true }
      volumes:
        - name: html
          configMap: { name: warehouse-ui-html }
        - name: nginx-conf
          configMap: { name: warehouse-ui-nginx }
        - name: htpasswd
          secret: { secretName: warehouse-ui-basicauth }
---
# Basic auth moved INTO the pod nginx (per-user region gating needs $remote_user) — the ingress
# only does TLS. Still a stopgap until Cloudflare Access (ADR-003/015).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: warehouse-ui
  namespace: namo-apps
  annotations:
    cert-manager.io/issuer: letsencrypt-http01   # NOT the ClusterIssuer — see issuer.yaml
spec:
  ingressClassName: nginx
  tls:
    - hosts: [warehouse.namosocks.com]
      secretName: warehouse-ui-tls
  rules:
    - host: warehouse.namosocks.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: warehouse-ui
                port:
                  number: 80
