# No TLS block: TLS terminates at Cloudflare, cloudflared reaches this over plain HTTP in-cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: n8n
  namespace: namo-apps
  annotations:
spec:
  ingressClassName: traefik
  rules:
    - host: automation.namosocks.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: n8n
                port:
                  number: 80
