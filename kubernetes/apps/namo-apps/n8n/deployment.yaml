apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: namo-apps
spec:
  replicas: 1
  strategy:
    type: Recreate          # RWO volume
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: n8n
          image: n8nio/n8n:2.27.0
          envFrom:
            - secretRef:
                name: namo-n8n-secret     # N8N_ENCRYPTION_KEY
          env:
            - name: N8N_HOST
              value: automation.namosocks.com
            - name: N8N_PORT
              value: "5678"
            - name: N8N_PROTOCOL
              value: https
            - name: WEBHOOK_URL
              value: https://automation.namosocks.com/
            - name: GENERIC_TIMEZONE
              value: Asia/Baghdad          # Namo's clock, not ours
            - name: N8N_TRUST_PROXY
              value: "true"                # behind cloudflared -> ingress-nginx
            - name: N8N_DIAGNOSTICS_ENABLED
              value: "false"
            # Execution history. These were previously unset and running on n8n's
            # defaults, which already saved both successes and errors — stating
            # them explicitly so the retention is visible in the manifest rather
            # than inherited.
            - name: EXECUTIONS_DATA_SAVE_ON_ERROR
              value: all
            - name: EXECUTIONS_DATA_SAVE_ON_SUCCESS
              value: all                    # keep: a Woo webhook that SUCCEEDED
                                            # but wrote the wrong thing is only
                                            # diagnosable from its success run
            # the one real gap: nothing pruned this before, and the PVC has no
            # backup CronJob, so the history is neither bounded nor durable
            - name: EXECUTIONS_DATA_PRUNE
              value: "true"
            - name: EXECUTIONS_DATA_MAX_AGE
              value: "336"                  # hours = 14 days
          resources:
            requests: { memory: 256Mi, cpu: 100m }
            limits:   { memory: 1Gi,   cpu: 500m }
          readinessProbe:
            httpGet: { path: /healthz, port: 5678 }
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 5678 }
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: n8n-data-pvc
