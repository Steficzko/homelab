apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-data-pvc
  namespace: namo-apps
  labels:
    recurring-job.longhorn.io/daily-backup: "enabled"
    recurring-job.longhorn.io/source: "enabled"   # Longhorn copies PVC recurring-job labels to the volume only with this
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn   # explicit: two default StorageClasses exist in this cluster
  resources:
    requests:
      storage: 5Gi
