apiVersion: apps/v1
kind: Deployment
metadata:
  name: shlink-ui
  namespace: namo-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shlink-ui
  template:
    metadata:
      labels:
        app: shlink-ui
    spec:
      containers:
        - name: shlink-web-client
          image: shlinkio/shlink-web-client:4.4.0
          env:
            # Pre-wire the server so Namo never has to paste a URL or an API key.
            - name: SHLINK_SERVER_URL
              value: https://go.namosocks.com
            - name: SHLINK_SERVER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: namo-shlink-secret
                  key: INITIAL_API_KEY
            - name: SHLINK_SERVER_NAME
              value: Namo Socks
          ports:
            - containerPort: 8080
          resources:
            requests: { memory: 32Mi, cpu: 10m }
            limits:   { memory: 128Mi, cpu: 200m }
