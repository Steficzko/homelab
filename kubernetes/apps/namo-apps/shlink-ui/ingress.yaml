# The UI ships the API key to the browser, so it must not be public. Cloudflare Access would be
# the right gate but needs account-level permission we do not have (ADR-003); basic auth until then.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shlink-ui
  namespace: namo-apps
  annotations:
    # Basic auth (realm "Namo links") on the existing shlink-ui-basicauth htpasswd
    # secret, via Traefik middleware (CLSTR-29).
    traefik.ingress.kubernetes.io/router.middlewares: namo-apps-shlink-ui-auth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: links.namosocks.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shlink-ui
                port:
                  number: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: shlink-ui-auth
  namespace: namo-apps
spec:
  basicAuth:
    secret: shlink-ui-basicauth   # single key `auth`, htpasswd lines (same secret nginx used)
    realm: Namo links
