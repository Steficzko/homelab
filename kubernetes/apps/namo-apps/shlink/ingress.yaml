# go.namosocks.com = the public short-link host. Short URLs MUST be publicly reachable, so this
# ingress is deliberately unauthenticated; the admin API is protected by the API key.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shlink
  namespace: namo-apps
spec:
  ingressClassName: nginx
  rules:
    - host: go.namosocks.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shlink
                port:
                  number: 80
