# Only the ingress controller may reach these apps; they may talk out (APIs, webhooks) and to DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: namo-apps
  namespace: namo-apps
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
