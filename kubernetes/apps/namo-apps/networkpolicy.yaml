# Only the ingress controller may reach these apps; they may talk out (APIs, webhooks) and to DNS.
# Also allowed (warehouse app, 2026-07-31): same-namespace traffic (n8n -> warehouse-postgres,
# warehouse-ui nginx -> n8n) and the namosocks namespace (Woo order webhooks -> n8n, in-cluster).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: namo-apps
  namespace: namo-apps
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: namosocks
        - podSelector: {}
