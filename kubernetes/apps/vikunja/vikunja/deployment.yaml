apiVersion: apps/v1
kind: Deployment
metadata:
  name: vikunja
  namespace: vikunja
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vikunja
  template:
    metadata:
      labels:
        app: vikunja
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: vikunja
          image: vikunja/vikunja:2.6.0
          envFrom:
            - secretRef:
                name: vikunja-secret        # VIKUNJA_SERVICE_JWTSECRET
          env:
            - { name: VIKUNJA_SERVICE_PUBLICURL, value: "https://todo.kostikidis.net" }
            - { name: VIKUNJA_DATABASE_TYPE, value: "sqlite" }
            - { name: VIKUNJA_DATABASE_PATH, value: "/data/vikunja.db" }
            - { name: VIKUNJA_FILES_BASEPATH, value: "/data/files" }
            - { name: VIKUNJA_SERVICE_TIMEZONE, value: "Europe/Athens" }
            # behind Cloudflare Access — registration open so you/family can sign up
            # past the Access login; flip to "false" once accounts exist.
            - { name: VIKUNJA_SERVICE_ENABLEREGISTRATION, value: "false" }   # account exists; block new signups (defense-in-depth behind CF Access)
          ports:
            - containerPort: 3456
          readinessProbe:
            httpGet: { path: /api/v1/info, port: 3456 }
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /api/v1/info, port: 3456 }
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests: { memory: 128Mi, cpu: "50m" }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vikunja-data
