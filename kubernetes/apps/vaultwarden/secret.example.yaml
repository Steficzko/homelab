apiVersion: v1
kind: Secret
metadata:
  name: vaultwarden-secret
  namespace: vaultwarden
stringData:
  # Required: bcrypt hash of your admin password
  # Generate with: echo -n "your-password" | htpasswd -niB admin | cut -d: -f2
  ADMIN_TOKEN: "REPLACE_ME_BCRYPT_HASH"

  # Optional: SMTP for invitations and emergency access emails
  # SMTP_HOST: "smtp.example.com"
  # SMTP_PORT: "587"
  # SMTP_USERNAME: "REPLACE_ME"
  # SMTP_PASSWORD: "REPLACE_ME"
  # SMTP_FROM: "vaultwarden@kostikidis.net"

  # Optional: Bitwarden push notifications (mobile sync)
  # PUSH_INSTALLATION_ID: "REPLACE_ME"
  # PUSH_INSTALLATION_KEY: "REPLACE_ME"
