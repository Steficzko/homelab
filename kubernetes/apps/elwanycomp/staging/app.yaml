# Deployed via ArgoCD (bootstrap: elwanycomp-staging.yaml).
# ElwanyComp: one FastAPI/uvicorn process serving the pages and the JSON API, SQLite (WAL) on the
# Longhorn claim at /data. Runtime contract: the app repo's Dockerfile header.
#
# Secrets (applied by hand by the owner, see README.md; never in git as plaintext):
#   elwanycomp-pepper (SOPS)  key `pepper`: ELWANYCOMP_PIN_PEPPER, >= 32 random bytes, base64.
#                             Labelled velero.io/exclude-from-backup so it never sits in the same
#                             MinIO as the DB backups. Missing Secret = the pod does not start.
#   ghcr-pull (SOPS)          the image package is private.
#
# The app refuses to start in prod (ERR-REF-003) if PUBLIC_ORIGIN, STAFF_ORIGIN, CLIENT_IP_HEADER or
# the pepper is empty, or while the replaced ORIGIN is still set. Migrations run in-process at
# start-up, before it serves; the startup probe covers that.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elwanycomp
  namespace: elwanycomp-staging
  labels: {app: elwanycomp}
spec:
  replicas: 1                  # SQLite on an RWO volume, in-process rate limiting: exactly one pod
  strategy: {type: Recreate}   # RollingUpdate would need two pods on one RWO volume
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app: elwanycomp}
  template:
    metadata:
      labels: {app: elwanycomp}
    spec:
      automountServiceAccountToken: false   # the app never calls the Kubernetes API
      enableServiceLinks: false
      imagePullSecrets: [{name: ghcr-pull}]
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001                      # makes /data writable for uid/gid 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          # Tag AND digest, bumped together by a homelab PR (rollback = git revert of that PR).
          image: ghcr.io/steficzko/elwanycomp:sha-a486627b4dda-20261125@sha256:a529230fc43203715a00c341367f2249d4afa2143a573f782daad41da7bbbcb8
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000, name: http}]
          env:
            - {name: ELWANYCOMP_ENV, value: "prod"}
            # Two hostnames, one pod (app repo docs/specs/hosts.md). Each must equal its Ingress host
            # in ingress.yaml (keep in lockstep). ELWANYCOMP_ORIGIN is replaced by these two: the app
            # refuses to start (ERR-REF-003) while it is still set.
            - {name: ELWANYCOMP_PUBLIC_ORIGIN, value: "https://comp-test.teamelwany.com"}
            - {name: ELWANYCOMP_STAFF_ORIGIN, value: "https://comp-test-staff.teamelwany.com"}
            # Set by Cloudflare at the edge. uvicorn runs with --no-proxy-headers, and the
            # NetworkPolicy admits only Traefik, and the router is on the dedicated `comp` entrypoint only,
            # which from outside the cluster only the tunnel reaches (ingress.yaml).
            - {name: ELWANYCOMP_CLIENT_IP_HEADER, value: "CF-Connecting-IP"}
            - {name: ELWANYCOMP_DB, value: "/data/elwanycomp.db"}
            - name: ELWANYCOMP_PIN_PEPPER
              valueFrom: {secretKeyRef: {name: elwanycomp-pepper, key: pepper}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          resources:
            # Photos stage 1 (app repo DEPLOY-NOTES D19, teams.md 5.3): a 2 MiB public sign-up is held
            # about 3 times over while parsed and the send bucket admits 30 at once, so under 200 MiB
            # on top of the app's own use; 256Mi was not enough. D19: request 256Mi, limit 768Mi.
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 768Mi}         # house style: no CPU limit
          # Start-up: settings, migrations, housekeeping, then serve. Up to 60 s.
          startupProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 2
            failureThreshold: 30
            timeoutSeconds: 2
          # Liveness on /livez (process only), never on /healthz: a DB hiccup must not kill-loop.
          livenessProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 2
          # Readiness on /healthz (opens the DB, checks the schema version).
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: elwanycomp-data}
        - name: tmp
          # TMPDIR, SQLite temp files and the snapshot/restore scratch (app repo docs/specs/snapshot.md 4.2).
          # Disk-backed on purpose: the snapshot command refuses tmpfs, ramfs or overlay scratch. Lands on
          # the node's ext4 NVMe, which Longhorn's default disk shares, so the cap matters; 1536Mi = the
          # app's SCRATCH_LIMIT, and going over evicts the pod. No container ephemeral-storage
          # request/limit: this sizeLimit already caps the scratch, the root filesystem is read-only, and
          # no workload in this repo sets one.
          emptyDir: {sizeLimit: 1536Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: elwanycomp
  namespace: elwanycomp-staging
  labels: {app: elwanycomp}
spec:
  selector: {app: elwanycomp}
  ports: [{name: http, port: 8000, targetPort: http}]
