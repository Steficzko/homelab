# Deployed via ArgoCD (bootstrap: elwanycomp.yaml).
# Additive over networkpolicy-default-deny.yaml. Every flow below is an explicit grant.
#
# elwanycomp: in from Traefik only, on the container port. No egress beyond the default-deny
# DNS grant: the app makes no outbound calls (no mail, no webhooks, no external APIs).
# Traefik-only ingress is half of what makes CF-Connecting-IP trustworthy; the other half is
# the Ingress router sitting on Traefik's `web` entrypoint only (ingress.yaml), which only the
# tunnel reaches (the LAN LoadBalancer exposes `lan`/`trusted`, not `web`). Cloudflare sets
# that header.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: elwanycomp
  namespace: elwanycomp
spec:
  podSelector:
    matchLabels: {app: elwanycomp}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: traefik}
      ports: [{port: 8000, protocol: TCP}]
