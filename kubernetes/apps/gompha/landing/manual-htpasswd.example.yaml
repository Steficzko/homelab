# Shape of the real secret (manual-htpasswd.sops.yaml, applied by hand — see
# manual-ingress.yaml header). Key MUST be `auth` (ingress-nginx auth-file).
apiVersion: v1
kind: Secret
metadata:
  name: manual-htpasswd
  namespace: gompha
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-options: Prune=false
type: Opaque
stringData:
  auth: "clinic:$apr1$REPLACE_ME"   # openssl passwd -apr1 '<password>'
