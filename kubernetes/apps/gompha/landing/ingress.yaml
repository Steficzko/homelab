# gompha.com apex + www. Exact hosts — ingress-nginx gives these precedence over the
# *.gompha.com tenant wildcard (dental-clinic ns). The landing shadows tenants in exactly
# ONE path: /manual, via manual-ingress.yaml (cookie-gated staff manual).
# HTTP-only: gompha.com is in a separate CF account with no cert-manager DNS-01 token,
# so TLS terminates at Cloudflare's edge and the tunnel reaches the ingress over HTTP.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: landing
  namespace: gompha
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # Security response headers — see security-headers.yaml for values and why.
    nginx.ingress.kubernetes.io/custom-headers: "gompha/landing-security-headers"
spec:
  ingressClassName: nginx
  rules:
    - host: gompha.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: landing
                port:
                  number: 80
    - host: www.gompha.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: landing
                port:
                  number: 80
    # /manual on these hosts and on tenant subdomains lives in manual-ingress.yaml
    # (separate object kept for the path carve; auth is a cookie gate in the landing pod).
