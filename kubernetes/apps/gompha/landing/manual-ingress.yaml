# Staff manual at /manual — apex AND tenant subdomains (e.g. <slug>.gompha.com/manual).
# SEPARATE Ingress object kept for the path carve, even though the password
# moved: auth is now a cookie gate in the landing pod's own nginx (nginx.yaml,
# manual-gate secret) so browsers can SAVE the password — ingress basic-auth
# prompts are unsaveable in Telegram's in-app browser and flaky on old Android.
# The basic-auth annotations and the manual-htpasswd secret were removed
# 2026-08-18.
#
# Path-steal note: the *.gompha.com rule carves /manual out of the tenant-app
# wildcard owned by kubernetes/apps/dental.clinic/ingress.yaml (longest-prefix
# wins at nginx level). Back-reference added there. If a tenant SPA ever routes
# /manual client-side, it loses that route cluster-wide.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: landing-manual
  namespace: gompha
  annotations:
    # Security response headers — see security-headers.yaml. Set separately here
    # because this is its own Ingress object: /manual would otherwise be the one
    # bare path on the apex, and it is the only one behind a gate. It also spans
    # *.gompha.com, so tenant subdomains get the headers on /manual too.
    traefik.ingress.kubernetes.io/router.middlewares: gompha-landing-security-headers@kubernetescrd
    # Traefik ranks routers by rule length unless told otherwise. 20 beats the
    # dental-clinic *.gompha.com tenant wildcard (10), so <slug>.gompha.com/manual
    # lands here, and loses to every exact host (auto., licensing-staging., app-staging.
    # rules are >= 36 chars) so their /manual stays theirs — the ingress-nginx behaviour.
    traefik.ingress.kubernetes.io/router.priority: "20"
spec:
  ingressClassName: traefik
  rules:
    - host: gompha.com
      http:
        paths:
          - path: /manual
            pathType: Prefix
            backend:
              service:
                name: landing
                port:
                  number: 80
    - host: "*.gompha.com"
      http:
        paths:
          - path: /manual
            pathType: Prefix
            backend:
              service:
                name: landing
                port:
                  number: 80
