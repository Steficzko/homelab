    one shared stylesheet instead of triplicating this block per page. */\n:root{\n
    \ --ink:#06182e; --ink-2:#0a2a52; --navy:#002F6C;\n  --body:#233247;\n  --teal:#0FA697;
    --teal-bright:#14C8B6; --teal-text:#0A7D70;\n  --gold:#C9871A; --gold-bright:#E5A83B;\n
