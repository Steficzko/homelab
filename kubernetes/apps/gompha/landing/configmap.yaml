  reveal.js: |
    // Progressive scroll-reveal, shared by every page. No deps.
    document.documentElement.classList.add('js');
    (function(){
      var els = document.querySelectorAll('.reveal, .stagger');
      if (!('IntersectionObserver' in window)) { els.forEach(function(e){e.classList.add('in');}); return; }
      var io = new IntersectionObserver(function(entries){
        entries.forEach(function(en){ if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } });
      }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });
      els.forEach(function(e){ io.observe(e); });
    })();
  roadmap.html: "<!DOCTYPE html>\n<html lang=\"en\" class=\"no-js\">\n<head>\n<meta
    charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<meta
    name=\"robots\" content=\"noindex\">\n<title>Roadmap — Gompha</title>\n<meta name=\"description\"
    content=\"What's shipped, what's building, and what's next in Gompha — the dental
    PMS. An honest built-vs-planned roadmap, updated per release.\">\n<link rel=\"preconnect\"
    href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\"
    crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap\"
    rel=\"stylesheet\">\n<link rel=\"stylesheet\" href=\"style.css?v=5\">\n</head>\n<body>\n\n<nav>\n
    \ <div class=\"wrap nav-in\">\n    <div class=\"logo\"><a href=\"index.html\">G<span
    class=\"socket\"></span>mpha</a></div>\n    <div class=\"nav-links\">\n      <a
    href=\"index.html#capabilities\">Capabilities</a>\n      <a href=\"roadmap.html\"
    class=\"active\">Roadmap</a>\n      <a href=\"scale.html\">Scaling &amp; ownership</a>\n
    \     <a href=\"safety.html\">Data safety</a>\n      <a href=\"index.html#demos\">Live
    demos</a>\n      <a href=\"mailto:hello@gompha.com\" class=\"btn btn-primary\"
    style=\"padding:10px 20px\">Get in touch</a>\n    </div>\n  </div>\n</nav>\n\n<header
    class=\"hero short\">\n  <div class=\"glow g1\"></div><div class=\"glow g2\"></div>\n
    \ <div class=\"wrap\">\n    <span class=\"pill anim d1\">\U0001F9B7 <span>Currently
    live: <b>v0.27.0</b></span></span>\n    <h1 class=\"anim d2\">The roadmap</h1>\n
    \   <p class=\"tagline anim d3\">Everything Gompha can do today, what we're building
    right now, and what's next — labelled honestly. If it says <em>Planned</em>, it
    isn't built yet. No vaporware in the \"shipped\" column.</p>\n  </div>\n</header>\n\n<section
    class=\"tight\">\n  <div class=\"wrap\">\n    <div class=\"tl-legend reveal\">\n
    \     <span><i class=\"dot done\"></i> Shipped &amp; live</span>\n      <span><i
    class=\"dot build\"></i> Building now</span>\n      <span><i class=\"dot plan\"></i>
    Planned / next</span>\n    </div>\n\n    <!-- SHIPPED -->\n    <div class=\"phase
    reveal\">\n      <h2><span class=\"badge done\">Shipped</span> Live today in a
    real clinic</h2>\n      <p class=\"lede\">Running in production at v0.27.0 — over
    twenty releases, zero image drift. This is the software you can log into right
    now.</p>\n      <ul class=\"tl\">\n        <li class=\"done\"><span class=\"ver\">v0.4
    · odontogram</span><h4>Two-layer tooth chart</h4><p>Crown work, root work and
    tooth state per tooth, over time, with per-doctor provenance colors. Later: a
    children's (deciduous) chart and full chart history (v0.15).</p></li>\n        <li
    class=\"done\"><span class=\"ver\">core · the moat</span><h4>The deal ledger</h4><p>Every
    charge stores the agreed price vs the standard price, who approved the discount,
    and the reason in plain words. The negotiation becomes clinic-wide data.</p></li>\n
    \       <li class=\"done\"><span class=\"ver\">v0.5 · perio + stock</span><h4>Perio
    charting &amp; the cost floor</h4><p>Pocket depths per visit drawn as a trend
    line; materials tie to procedures so each case shows its real material cost floor
    — your honest bargaining line.</p></li>\n        <li class=\"done\"><span class=\"ver\">v0.6
    → v0.20 · scheduling</span><h4>Scheduling built for a real chair</h4><p>Room-grid
    day view with hard double-booking protection, the panorama week wall (7 day-columns),
    patient arrival + punctuality tracking, and a reception mobile pass.</p></li>\n
    \       <li class=\"done\"><span class=\"ver\">v0.8 · inventory</span><h4>Inventory
    control</h4><p>Packs &amp; pieces, locked-FX cost that never revalues on a recount,
    per-doctor or clinic ownership, expiry/batch and low-stock alerts.</p></li>\n
    \       <li class=\"done\"><span class=\"ver\">v0.6 → v0.17 · cases</span><h4>Per-case
    procedures &amp; print docs</h4><p>Cases built from procedure line-items with
    per-doctor catalogs; multi-session tracking; printable treatment plan, budget
    and insurance note; medical intake.</p></li>\n        <li class=\"done\"><span
    class=\"ver\">v0.16 · financials</span><h4>Income attribution &amp; partnership
    P&amp;L</h4><p>Per-doctor income attribution and an Earnings screen, with money-privacy
    walls so each doctor's numbers stay their own. Append-only money, void-only, honest
    balances.</p></li>\n        <li class=\"done\"><span class=\"ver\">core · money
    reality</span><h4>Dual currency, done right</h4><p>IQD + USD with an admin \"FX
    of the day.\" Every row stores its amount, currency and the rate used — totals
    don't drift when the rate moves.</p></li>\n        <li class=\"done\"><span class=\"ver\">v0.7
    · roles</span><h4>Role-shaped interfaces, one codebase</h4><p>Doctor mobile-clinical,
    reception web-scheduling, admin config + money, and a maintenance role walled
    off from all patient data by default-deny authz.</p></li>\n        <li class=\"done\"><span
    class=\"ver\">v0.22 · sessions</span><h4>Session management &amp; your devices</h4><p>Role-aware
    session lengths, device capture and a \"Your devices\" panel — sign a lost phone
    out from anywhere. Security-audited before ship.</p></li>\n        <li class=\"done\"><span
    class=\"ver\">v0.21 · reminders</span><h4>Tap-to-send appointment reminders</h4><p>Reception
    taps a patient to send a reminder over WhatsApp, Viber or a call — defaults to
    WhatsApp when a number's on file.</p></li>\n        <li class=\"done\"><span class=\"ver\">infra
    · safety</span><h4>Encrypted backups &amp; tenant isolation</h4><p>Hourly age-encrypted
    backups; row-level security forced on every tenant table so no clinic can ever
    see another's data.</p></li>\n        <li class=\"done\"><span class=\"ver\">v0.24
    · solo mode</span><h4>Solo Mode</h4><p>One setting folds away the multi-user machinery
    — role pickers, per-doctor splits, reception — for a clean one-person clinic.
    Live, with its own <a href=\"https://demosolo.gompha.com\">public demo</a> (v0.27).</p></li>\n
    \       <li class=\"done\"><span class=\"ver\">v0.25 · portability</span><h4>Export
    &amp; import your data</h4><p>Self-serve export of your whole clinic to a portable
    bundle, and provider-assisted import into a fresh tenant — references remapped,
    money verbatim. \"Leave a practice, take your data.\" <a href=\"scale.html\">Details
    →</a></p></li>\n      </ul>\n    </div>\n\n    <!-- BUILDING -->\n    <div class=\"phase
    reveal\">\n      <h2><span class=\"badge build\">Building</span> In progress right
    now</h2>\n      <p class=\"lede\">Spec locked, partly built, landing in upcoming
    releases.</p>\n      <ul class=\"tl\">\n        <li class=\"build\"><span class=\"ver\">odontogram
    v2</span><h4>Richer clinical charting</h4><p>Ortho spans (retainer / wire / aligner),
    a planned-treatment state, mixed-dentition ghost teeth, and a doctor→reception
    print-request handoff. First pieces already shipping.</p></li>\n        <li class=\"build\"><span
    class=\"ver\">auth hardening</span><h4>Trusted devices, PIN &amp; OTP</h4><p>Per-staff
    PIN, email OTP on a new device, trusted-device memory and a bot check — plus an
    audit log of who booked and who took each payment.</p></li>\n        <li class=\"build\"><span
    class=\"ver\">portability v2</span><h4>Single-doctor data slice</h4><p>Whole-clinic
    export/import is live; next is exporting one doctor's own slice (their patients
    + history) with owner consent, so a doctor who leaves can take theirs.</p></li>\n
    \       <li class=\"build\"><span class=\"ver\">i18n</span><h4>Arabic translation</h4><p>The
    Arabic/RTL switch is already live; filling in the full translation is ongoing.</p></li>\n
    \     </ul>\n    </div>\n\n    <!-- PLANNED -->\n    <div class=\"phase reveal\">\n
    \     <h2><span class=\"badge plan\">Planned</span> What's next</h2>\n      <p
    class=\"lede\">Designed and on the board — not yet built. Listed so you can see
    where Gompha is going, not what it pretends to be.</p>\n      <ul class=\"tl\">\n
    \       <li class=\"plan\"><span class=\"ver\">the cherry</span><h4>Voice → deal
    note</h4><p>Dictate a chair-side note in your own words → a structured encounter
    and deal, with the discount reason and the next appointment pulled out. Hands
    stay on the patient. This is the headline moat feature — and it's zero code today.</p></li>\n
    \       <li class=\"plan\"><span class=\"ver\">imaging</span><h4>In-app X-ray
    &amp; photo viewer</h4><p>Imaging IDs already link to the record; the on-card
    viewer that pulls the image from your local image server is still to build.</p></li>\n
    \       <li class=\"plan\"><span class=\"ver\">onboarding</span><h4>Self-serve
    clinic setup</h4><p>A guided wizard that stands up a new clinic — rooms, doctors,
    catalog — without a hand-run CLI.</p></li>\n        <li class=\"plan\"><span class=\"ver\">inventory
    phase 2</span><h4>Procedure recipes &amp; auto-decrement</h4><p>Define each procedure's
    material recipe once; stock draws down automatically as cases are done.</p></li>\n
    \       <li class=\"plan\"><span class=\"ver\">commercial</span><h4>White-label
    &amp; self-host</h4><p>Your brand, colors and domain; and an on-your-own-box option
    for operators who want it — with licensing to match.</p></li>\n        <li class=\"plan\"><span
    class=\"ver\">growth</span><h4>QR patient onboarding &amp; recall</h4><p>Patients
