    name=\"description\" content=\"How Gompha keeps your clinic's data safe: hard
    tenant isolation, encrypted backups, walled access by role, session control, and
    a no-hostage promise.\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link
    rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap\"
