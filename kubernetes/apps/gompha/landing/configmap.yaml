    <!DOCTYPE html>
    <html lang="en" class="no-js">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Founders — Gompha</title>
    <meta name="description" content="Who built Gompha — the people behind the dental practice management system.">
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
    /* founders — page-local, no other page uses it */
    .founder-grid{display:grid;grid-template-columns:1fr 1fr;gap:26px;max-width:920px;margin:0 auto}
    @media(max-width:760px){.founder-grid{grid-template-columns:1fr}}
    .founder{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:34px;display:flex;flex-direction:column}
    .founder .avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--teal));display:flex;align-items:center;justify-content:center;font-family:var(--heading-font);font-weight:900;color:#fff;font-size:26px;margin-bottom:18px}
    .founder .role{font-family:var(--heading-font);font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal-text)}
    .founder h3{font-size:23px;margin:6px 0 10px}
    .founder p{font-size:15.5px;color:var(--body);margin-bottom:10px}
    .founder .links{margin-top:auto;padding-top:12px}
    .founder .links a{margin-right:16px;font-size:14.5px}
    </style>
    </head>
    <body>

    <header class="hero short">
      <div class="glow g1"></div><div class="glow g2"></div>
      <div class="wrap">
        <div class="logo anim d1" style="color:#fff;margin-bottom:22px">G<span class="socket"></span>mpha</div>
        <h1 class="anim d2">The people behind Gompha</h1>
        <p class="tagline anim d3">Gompha is built by a small team who actually sit in the clinic — a builder who ships the software and a dentist who runs the chair it's shaped around.</p>
      </div>
    </header>

    <section>
      <div class="wrap">
        <div class="founder-grid stagger">
          <div class="founder">
            <div class="avatar">S</div>
            <span class="role">Founder · Technical</span>
            <h3>Stefanos Kostikidis</h3>
            <p>Designed, built and operates Gompha end-to-end — the FastAPI/Postgres backend, the React app, and the Kubernetes platform it runs on (a 5-node HA cluster with drilled cross-country disaster recovery). Self-taught infrastructure and product engineer with a two-decade operator's career and formal grounding in cybernetics and applied informatics.</p>
            <p>Every architecture decision is recorded in public — verifiable engineering over hype.</p>
            <div class="links">
              <a href="https://github.com/Steficzko/homelab">Portfolio (public GitOps) →</a>
              <a href="https://kostikidis.net">kostikidis.net</a>
              <a href="mailto:kostikidis.network@gmail.com">Email</a>
            </div>
          </div>
          <div class="founder">
            <div class="avatar">A</div>
            <span class="role">Co-founder · Clinical</span>
            <h3>Dr. Ali Adnan</h3>
            <p>The oral surgeon Gompha is built around. He runs a real practice in Erbil and shapes every clinical decision in the app — the odontogram, the perio chart, the deal ledger and how the chair actually works day to day.</p>
            <ul style="list-style:none;margin:0 0 4px;color:var(--body);font-size:14.5px">
              <li>▪️ MSc in Oral Surgery — UIC Barcelona</li>
              <li>▪️ EAO-certified in implant dentistry</li>
            </ul>
            <div class="links">
              <a href="https://www.linkedin.com/in/ali-adnan-49469774">LinkedIn →</a>
              <a href="mailto:aliadnan@uic.es">aliadnan@uic.es</a>
            </div>
          </div>
        </div>

        <p style="text-align:center;max-width:640px;margin:44px auto 0;color:var(--body);font-size:16px">
          <strong>Who built it:</strong> Gompha is designed and developed by Stefanos Kostikidis, in close partnership with Dr.&nbsp;Ali Adnan, whose practice is its first home.
        </p>
      </div>
    </section>

    <footer>
      <div class="wrap">
        <div class="base" style="border:none">© 2026 Gompha · Your practice, anchored.</div>
      </div>
    </footer>

    <script src="reveal.js"></script>
    </body>
    </html>
  index.html: "<!DOCTYPE html>\n<html lang=\"en\" class=\"no-js\">\n<head>\n<meta
    charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<meta
    name=\"robots\" content=\"noindex\">\n<title>Gompha — Your practice, anchored.</title>\n<meta
    name=\"description\" content=\"Gompha is the dental practice management system
    that anchors your tooth chart, schedule, cases and deal ledger into one record
    — built for clinics that negotiate.\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link
    rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap\"
    rel=\"stylesheet\">\n<link rel=\"stylesheet\" href=\"style.css\">\n</head>\n<body>\n\n<nav>\n
    \ <div class=\"wrap nav-in\">\n    <div class=\"logo\"><a href=\"index.html\">G<span
    class=\"socket\"></span>mpha</a></div>\n    <div class=\"nav-links\">\n      <a
    href=\"index.html#capabilities\">Capabilities</a>\n      <a href=\"roadmap.html\">Roadmap</a>\n
    \     <a href=\"scale.html\">Scaling &amp; ownership</a>\n      <a href=\"safety.html\">Data
    safety</a>\n      <a href=\"index.html#demos\">Live demos</a>\n      <a href=\"index.html#contact\"
    class=\"btn btn-primary\" style=\"padding:10px 20px\">Join the waitlist</a>\n
    \   </div>\n  </div>\n</nav>\n\n<!-- HERO -->\n<header class=\"hero\">\n  <div
    class=\"glow g1\"></div><div class=\"glow g2\"></div>\n  <div class=\"wrap hero-grid\">\n
    \   <div class=\"hero-copy\">\n      <span class=\"pill anim d1\">\U0001F9B7 <span><b>Live
    v0.22.3</b> — running in a real Erbil clinic</span></span>\n      <h1 class=\"anim
    d2\">Your practice, anchored.</h1>\n      <p class=\"tagline anim d3\">Gompha
    holds your tooth chart, your schedule, every case and every negotiated deal in
    one record — and remembers who approved the price and why. Nothing floats loose.
    Nothing gets forgotten.</p>\n      <div class=\"cta-row anim d4\">\n        <a
    href=\"index.html#demos\" class=\"btn btn-primary\">Try a live demo</a>\n        <a
    href=\"roadmap.html\" class=\"btn btn-ghost\">See the roadmap →</a>\n      </div>\n
    \     <p class=\"trust anim d4\">Built for cash &amp; bargaining markets — where
    the price is a conversation, not a list.</p>\n    </div>\n    <div class=\"appwin
    anim d3\">\n      <div class=\"appwin-bar\"><span class=\"td r\"></span><span
    class=\"td y\"></span><span class=\"td g\"></span><span class=\"appwin-url\">blanca.gompha.com
    › patient · tooth chart</span></div>\n      <div class=\"appwin-body\">\n        <div
    class=\"appwin-cap\">Two-layer odontogram <span class=\"pin\">live screen</span></div>\n
    \       <img src=\"odontogram.svg\" alt=\"Gompha two-layer tooth chart — crowns,
    root canals, an implant, a bridge and a missing tooth, each with a provenance
    dot\" width=\"568\" height=\"172\" loading=\"lazy\">\n        <div class=\"od-key\">\n
    \         <span><i style=\"background:#2b6cb0\"></i>crown</span>\n          <span><i
    style=\"background:#d9534f\"></i>root canal</span>\n          <span><i style=\"background:#5b7185\"></i>implant</span>\n
    \         <span><i style=\"background:#1a7f37\"></i>in-house</span>\n          <span><i
    style=\"background:#2563eb\"></i>external</span>\n          <span><i style=\"background:#9aa0a6\"></i>planned</span>\n
    \       </div>\n      </div>\n    </div>\n  </div>\n</header>\n\n<!-- ANCHOR THESIS
    -->\n<section id=\"thesis\">\n  <div class=\"wrap\">\n    <div class=\"sec-head
    reveal\">\n      <span class=\"eyebrow\">The name</span>\n      <h2>Gomphosis
    — the joint that anchors every tooth</h2>\n      <p>In anatomy, <em>gomphosis</em>
    is the peg-in-socket bond that locks each tooth solidly into the jaw — the reason
    a healthy tooth doesn't move. Gompha does the same for your practice: it anchors
    the four things that usually float loose into one record.</p>\n    </div>\n    <div
    class=\"id-grid stagger\">\n      <div class=\"id-card\"><span class=\"tag\">Tooth</span><h3>Two-layer
    odontogram</h3><p>Crown, root and state per tooth, tracked over time with per-doctor
    provenance colors.</p></div>\n      <div class=\"id-card\"><span class=\"tag\">Patient</span><h3>The
    full timeline</h3><p>History, perio trends, charges, debt and contact — one continuous,
    anchored record.</p></div>\n      <div class=\"id-card\"><span class=\"tag\">Case</span><h3>Procedures
    &amp; sessions</h3><p>Every case assembled from procedure line-items that book,
    schedule and follow the patient through.</p></div>\n      <div class=\"id-card\"><span
    class=\"tag\">Deal</span><h3>The negotiated price</h3><p>Agreed vs standard price,
    who approved it, and the human reason — held, not forgotten.</p></div>\n    </div>\n
    \ </div>\n</section>\n\n<!-- CAPABILITIES -->\n<section id=\"capabilities\" style=\"background:var(--bg-alt)\">\n
    \ <div class=\"wrap\">\n    <div class=\"sec-head reveal\">\n      <span class=\"eyebrow\">What
    it does</span>\n      <h2>A PMS shaped like your chair, not a spreadsheet</h2>\n
    \     <p>Everything a modern clinic needs — with the parts Western software forgot.
    Everything below is <strong>live today</strong>. What's coming lives on the <a
    href=\"roadmap.html\">roadmap</a>.</p>\n    </div>\n    <div class=\"feat-grid
    stagger\">\n      <div class=\"feat\"><span class=\"ico\">\U0001F9B7</span><h3>Two-layer
    odontogram <span class=\"ship\">Shipped</span></h3><p>A real tooth chart: crown
    work, root work and tooth state over time — plus a children's (deciduous) chart
    and full history. Most regional tools have no chart at all.</p></div>\n      <div
    class=\"feat\"><span class=\"ico\">\U0001F91D</span><h3>The deal ledger <span
    class=\"ship\">Shipped</span></h3><p>Capture the <em>negotiated</em> price, the
    approver and the reason. The negotiation becomes data you can see across the whole
    clinic.</p></div>\n      <div class=\"feat\"><span class=\"ico\">\U0001F9FE</span><h3>Per-case
    procedures <span class=\"ship\">Shipped</span></h3><p>Build a case from procedure
    line-items — clinical, lab or material-linked. Per-doctor catalogs, with per-procedure
    income attribution baked in.</p></div>\n      <div class=\"feat\"><span class=\"ico\">\U0001F4E6</span><h3>Inventory
    control <span class=\"ship\">Shipped</span></h3><p>Real stock: packs &amp; pieces,
    locked-FX cost that never revalues on a recount, per-doctor or clinic ownership,
    expiry/batch, low-stock alerts.</p></div>\n      <div class=\"feat\"><span class=\"ico\">\U0001F4B0</span><h3>Cost
    floor on every deal <span class=\"ship\">Shipped</span></h3><p>Materials tie to
    procedures, so each case shows its real cost floor — your honest bargaining line,
    right on the sheet.</p></div>\n      <div class=\"feat\"><span class=\"ico\">\U0001F4CA</span><h3>Perio
    charting <span class=\"ship\">Shipped</span></h3><p>Pocket depths per visit, drawn
    as a trend line — see the mouth improving, not just today's numbers.</p></div>\n
    \     <div class=\"feat\"><span class=\"ico\">\U0001F5D3️</span><h3>Room-grid
    scheduling <span class=\"ship\">Shipped</span></h3><p>Reception sees rooms as
    columns, doctors color-coded, with hard double-booking protection and an emergency
    override. Plus a 7-day panorama week wall.</p></div>\n      <div class=\"feat\"><span
    class=\"ico\">⏱️</span><h3>Agenda, arrival &amp; punctuality <span class=\"ship\">Shipped</span></h3><p>Doctor's
    mobile day list with a countdown to the next patient; reception checks patients
    in, waiting-room panel, running-late cascade flags reception instantly.</p></div>\n
    \     <div class=\"feat\"><span class=\"ico\">\U0001F4B5</span><h3>Dual currency,
    done right <span class=\"ship\">Shipped</span></h3><p>IQD + USD with an \"FX of
    the day.\" Every row stores the rate used, so totals stay honest as rates move.</p></div>\n
    \     <div class=\"feat\"><span class=\"ico\">\U0001F4C8</span><h3>Income &amp;
    partnership P&amp;L <span class=\"ship\">Shipped</span></h3><p>Per-doctor income
    attribution and an Earnings screen — money-privacy walls keep each doctor's numbers
    their own.</p></div>\n      <div class=\"feat\"><span class=\"ico\">\U0001F510</span><h3>Sessions
    &amp; your devices <span class=\"ship\">Shipped</span></h3><p>Role-aware session
    lengths, device capture, and a \"Your devices\" panel — sign a lost phone out
    from anywhere.</p></div>\n      <div class=\"feat\"><span class=\"ico\">\U0001F5E3️</span><h3>Voice
    → deal note <span class=\"ship soon\">Planned</span></h3><p>Dictate a chair-side
    note → structured encounter and deal, hands on the patient. The moat feature —
    spec'd, not yet built.</p></div>\n    </div>\n  </div>\n</section>\n\n<!-- PRODUCT
    SHOWCASE -->\n<section id=\"screens\">\n  <div class=\"wrap\">\n    <div class=\"sec-head
    reveal\">\n      <span class=\"eyebrow\">See the real screens</span>\n      <h2>Not
    a spreadsheet with a logo</h2>\n      <p>Actual Gompha screens — the periodontal
    chart trends the mouth over time, and reception drives the day on a room-by-room
    grid.</p>\n    </div>\n    <div class=\"showcase stagger\">\n      <div class=\"appwin\">\n
    \       <div class=\"appwin-bar\"><span class=\"td r\"></span><span class=\"td
    y\"></span><span class=\"td g\"></span><span class=\"appwin-url\">blanca.gompha.com
    › patient · perio chart</span></div>\n        <div class=\"appwin-body\">\n          <div
    class=\"appwin-cap\">Periodontal line chart <span class=\"pin\">upper · buccal</span></div>\n
    \         <img src=\"perio.svg\" alt=\"Periodontal line chart — gingival margin
    and pocket-depth lines over each tooth, with two deep pockets and bleeding sites
    flagged red\" width=\"568\" height=\"150\" loading=\"lazy\">\n          <div class=\"od-key\">\n
    \           <span><i style=\"background:#d97706\"></i>gingival margin</span>\n
    \           <span><i style=\"background:#2b6cb0\"></i>pocket bottom</span>\n            <span><i
    style=\"background:#d9534f\"></i>deep pocket / bleeding</span>\n          </div>\n
    \       </div>\n      </div>\n      <div class=\"appwin\">\n        <div class=\"appwin-bar\"><span
    class=\"td r\"></span><span class=\"td y\"></span><span class=\"td g\"></span><span
    class=\"appwin-url\">blanca.gompha.com › reception · schedule</span></div>\n        <div
    class=\"appwin-body\">\n          <div class=\"appwin-cap\">Room-grid schedule
    <span class=\"pin\">rooms as columns</span></div>\n          <div class=\"sched\">\n
    \           <div class=\"sh\"></div>\n            <div class=\"sh\"><span class=\"rdot\"
    style=\"background:#4363d8\"></span>Room 1</div>\n            <div class=\"sh\"><span
    class=\"rdot\" style=\"background:#e6194b\"></span>Room 2</div>\n            <div
    class=\"sh\"><span class=\"rdot\" style=\"background:#3cb44b\"></span>Room 3</div>\n\n
    \           <div class=\"tcol t\">09:00</div>\n            <div class=\"cell\"><div
    class=\"appt\" style=\"background:#4363d8;top:2px;height:64px\">Layla H.<small>Crown
    prep · Dr. Ali</small></div></div>\n            <div class=\"cell\"><div class=\"appt\"
    style=\"background:#e6194b;top:2px;height:30px\">Omar K.<small>Check-up</small></div></div>\n
    \           <div class=\"cell\"><div class=\"appt\" style=\"background:#3cb44b;top:2px;height:98px\">Sara
    M.<small>Implant · Dr. Zana</small></div></div>\n\n            <div class=\"tcol
    t\">09:30</div>\n            <div class=\"cell\"></div>\n            <div class=\"cell\"><div
    class=\"appt\" style=\"background:#f58231;top:2px;height:64px\">Dana T.<small>Perio
    · Dr. Nma</small></div></div>\n            <div class=\"cell\"></div>\n\n            <div
    class=\"tcol t\">10:00</div>\n            <div class=\"cell\"><div class=\"appt\"
    style=\"background:#e6194b;top:2px;height:30px\">Zaid A.<small>Filling</small></div></div>\n
    \           <div class=\"cell\"></div>\n            <div class=\"cell\"><div class=\"appt\"
    style=\"background:#4363d8;top:2px;height:64px\">Hiba S.<small>Whitening · Dr.
    Ali</small></div></div>\n\n            <div class=\"tcol t\">10:30</div>\n            <div
    class=\"cell\"><div class=\"appt\" style=\"background:#3cb44b;top:2px;height:64px\">Yusuf
    R.<small>Extraction · Dr. Zana</small></div></div>\n            <div class=\"cell\"><div
    class=\"appt\" style=\"background:#f58231;top:2px;height:30px\">Nour F.<small>Review</small></div></div>\n
    \           <div class=\"cell\"></div>\n          </div>\n        </div>\n      </div>\n
    \   </div>\n  </div>\n</section>\n\n<!-- MOBILE / DOCTOR PHONE -->\n<section id=\"mobile\"
    style=\"background:var(--bg-alt)\">\n  <div class=\"wrap\">\n    <div class=\"mobwrap\">\n
    \     <div class=\"txt mob-copy reveal\">\n        <span class=\"eyebrow\">In
    the doctor's pocket</span>\n        <h2 style=\"font-size:clamp(28px,3.6vw,40px);margin:12px
    0\">The chair-side app, built phone-first</h2>\n        <p style=\"font-size:17px;color:var(--body)\">The
    doctor never touches a desktop. Their whole day is a vertical, distraction-free
    feed — current patient on top, a live countdown to the next, and one tap into
    treatment. <em>Scroll the phone →</em></p>\n        <ul class=\"mob-list\">\n
    \         <li><b>In the chair</b> — who you're treating, an elapsed timer, and
    whether you can take your time or someone's waiting.</li>\n          <li><b>Next
    patient + countdown</b> — and a \"waiting outside\" flag the second reception
    checks them in.</li>\n          <li><b>One-tap start</b> — locks the phone to
    that patient so nothing gets fat-fingered mid-treatment.</li>\n          <li><b>Running-late
    signal</b> — tell the front desk +15 / +30 without leaving the chair.</li>\n        </ul>\n
    \     </div>\n      <div class=\"reveal\" style=\"justify-self:center\">\n        <div
    class=\"phone\">\n          <div class=\"island\"></div>\n          <div class=\"phone-screen\">\n
    \           <div class=\"da\">\n              <div class=\"da-head\">\n                <div
    class=\"top\">\n                  <span class=\"l\">G<span class=\"socket\"></span>mpha</span>\n
    \                 <span class=\"who\"><span class=\"av\">A</span> Dr. Ali</span>\n
    \               </div>\n                <div class=\"da-tabs\"><span class=\"on\">Today</span><span>Patients</span></div>\n
    \             </div>\n              <div class=\"da-body\">\n                <div
    class=\"da-card now\">\n                  <h3>In the chair <span class=\"da-pill
    late\">running late 6m</span></h3>\n                  <div class=\"da-nm\">Layla
    Hama</div>\n                  <div class=\"da-sub\">09:00–09:45 · Zirconia crown
    · tooth 11</div>\n                  <div class=\"da-timer over\">51:12</div>\n
    \                 <div class=\"da-slack warn\">Next patient waiting 4 min — time
    to wrap up.</div>\n                  <a href=\"#mobile\" class=\"da-btn\" onclick=\"return
    false\">Resume focus</a>\n                  <div class=\"da-chips\"><span>Tell
    reception</span><span class=\"da-chip\">+15m</span><span class=\"da-chip\">+30m</span></div>\n
    \               </div>\n                <div class=\"da-card\">\n                  <h3>Next
    patient</h3>\n                  <div class=\"da-nm\">Omar Khalid <span class=\"da-pill
    wait\">waiting 6 min</span></div>\n                  <div class=\"da-sub\">09:45
    · Check-up &amp; scale</div>\n                  <div class=\"da-timer\">08:32</div>\n
    \                 <a href=\"#mobile\" class=\"da-btn dark\" onclick=\"return false\">Start
    meeting</a>\n                </div>\n                <div class=\"da-card\">\n
    \                 <h3>Waiting outside</h3>\n                  <div class=\"da-row\"><span><span
    class=\"rn\">Omar Khalid</span><br><span class=\"rs\">in waiting 6 min · since
    09:39</span></span></div>\n                  <div class=\"da-row\"><span><span
    class=\"rn\">Sara Mahmoud</span><br><span class=\"rs\">in waiting 2 min · 10:15
    appt</span></span></div>\n                </div>\n                <div class=\"da-card\">\n
    \                 <h3>Today</h3>\n                  <div class=\"da-row\"><span><span
    class=\"rn\">Sara Mahmoud</span><br><span class=\"rs\">10:15–11:00 · Implant ·
    Room 3</span></span><span class=\"chev\">›</span></div>\n                  <div
    class=\"da-row\"><span><span class=\"rn\">Hiba Salih</span><br><span class=\"rs\">11:15
    · Whitening</span></span><span class=\"chev\">›</span></div>\n                  <div
    class=\"da-row\"><span><span class=\"rn\">Zaid Ahmed</span><br><span class=\"rs\">11:45
    · Filling · approx 15m late</span></span><span class=\"chev\">›</span></div>\n
    \                 <div class=\"da-row done\"><span><span class=\"rn\">Dana Tariq</span><br><span
    class=\"rs\">08:30 · done · Perio review</span></span><span class=\"chev\">›</span></div>\n
    \               </div>\n                <div class=\"da-card\">\n                  <h3>My
    blocked time</h3>\n                  <div class=\"da-row\"><span><span class=\"rn\">Today
    13:00–14:00</span><br><span class=\"rs\">Lunch</span></span></div>\n                  <a
    href=\"#mobile\" class=\"da-btn\" onclick=\"return false\" style=\"background:transparent;color:#002F6C;border:1.5px
    solid #cdd8e6\">Block time</a>\n                </div>\n              </div>\n
    \           </div>\n          </div>\n        </div>\n        <p class=\"phone-cap\">The
    reception view is its own phone-tuned screen too.</p>\n      </div>\n    </div>\n
    \ </div>\n</section>\n\n<!-- DEAL LEDGER SPOTLIGHT -->\n<section id=\"ledger\">\n
    \ <div class=\"wrap\">\n    <div class=\"spot reveal\">\n      <div>\n        <span
    class=\"moat\">The moat</span>\n        <h2>No other PMS remembers the deal</h2>\n
    \       <p>Dentrix and Open Dental assume a fixed price list. But in the real
    world, the price is negotiated — a discount for a cousin, a free cleaning, a cash
    rate. Gompha anchors that: what was agreed, who approved it, and why.</p>\n        <p>Next
    time that patient walks in, the whole clinic knows the story — not just the doctor
    who made the deal.</p>\n        <a href=\"index.html#demos\" class=\"btn btn-gold\">See
    it in the live demo</a>\n      </div>\n      <div class=\"sheet\">\n        <div
    class=\"row\"><span class=\"k\">Procedure</span><span class=\"v\">Zirconia crown
    · tooth 11</span></div>\n        <div class=\"row\"><span class=\"k\">Standard
    price</span><span class=\"strike\">$450</span></div>\n        <div class=\"row\"><span
    class=\"k\">Agreed price</span><span class=\"agreed\">$380</span></div>\n        <div
    class=\"row\"><span class=\"k\">Cost floor (materials)</span><span class=\"v\">$120</span></div>\n
    \       <div class=\"row\"><span class=\"k\">Approved by</span><span class=\"v\">Dr.
    Ali</span></div>\n        <div class=\"row\"><span class=\"k\">Currency</span><span
    class=\"v\">USD @ FX 1,500</span></div>\n        <div class=\"ctx\">\"70 off —
    Hiba's cousin, paying cash today, added free polish.\"</div>\n      </div>\n    </div>\n
    \ </div>\n</section>\n\n<!-- COMPARE -->\n<section id=\"compare\" style=\"background:var(--bg-alt)\">\n
    \ <div class=\"wrap\">\n    <div class=\"sec-head reveal\">\n      <span class=\"eyebrow\">Why
    Gompha wins</span>\n      <h2>Built for how you actually run the chair</h2>\n
    \     <p>Dentrix is built for an insurance claim. EasyClinic is a calendar with
    invoices. Gompha is built for the deal.</p>\n    </div>\n    <div class=\"cmp
    reveal\">\n      <table>\n        <thead>\n          <tr><th>Capability</th><th
    class=\"us\">Gompha</th><th>Dentrix / Open Dental</th><th>Regional tools</th></tr>\n
    \       </thead>\n        <tbody>\n          <tr><td>Negotiated-price deal ledger</td><td
    class=\"us\">✓</td><td class=\"n\">✕ fixed list</td><td class=\"n\">✕</td></tr>\n
    \         <tr><td>Two-layer visual odontogram</td><td class=\"us\">✓</td><td class=\"y\">✓
    (legacy)</td><td class=\"n\">✕ no chart</td></tr>\n          <tr><td>Per-case
    procedures + inventory link</td><td class=\"us\">✓</td><td class=\"y\">✓ (heavy)</td><td
    class=\"n\">✕</td></tr>\n          <tr><td>Dual currency (IQD+USD, FX/day)</td><td
    class=\"us\">✓</td><td class=\"n\">✕</td><td>partial</td></tr>\n          <tr><td>Cost-floor
    bargaining assistant</td><td class=\"us\">✓</td><td class=\"n\">✕</td><td class=\"n\">✕</td></tr>\n
    \         <tr><td>Doctor-mobile + reception-web shells</td><td class=\"us\">✓</td><td
    class=\"n\">✕ desktop-bound</td><td>partial</td></tr>\n          <tr><td>Made
    for cash / bargaining markets</td><td class=\"us\">✓</td><td class=\"n\">✕ insurance-first</td><td>partial</td></tr>\n
    \         <tr><td>Cloud, subdomain-per-clinic, white-label</td><td class=\"us\">✓</td><td
    class=\"n\">✕</td><td>partial</td></tr>\n        </tbody>\n      </table>\n    </div>\n
    \ </div>\n</section>\n\n<!-- DEMOS -->\n<section id=\"demos\">\n  <div class=\"wrap\">\n
    \   <div class=\"sec-head reveal\">\n      <span class=\"eyebrow\">Try it live</span>\n
    \     <h2>Two demos — pick the one that fits your clinic</h2>\n      <p>Both run
    the real software with seeded data. Pick a role and walk straight in — no signup.</p>\n
    \   </div>\n    <div class=\"demo-grid stagger\">\n      <div class=\"demo-card\">\n
    \       <span class=\"kind\">Multi-doctor clinic</span>\n        <h3>The clinic
    demo</h3>\n        <p>A busy practice: several doctors, reception, rooms and the
    full financial picture — how Gompha runs a real chair-heavy clinic.</p>\n        <ul>\n
    \         <li>Pick a role: doctor, reception, admin or maintenance</li>\n          <li>Room-grid
    schedule + panorama week wall</li>\n          <li>Deal ledger, inventory and per-doctor
    P&amp;L</li>\n        </ul>\n        <a href=\"https://demo.gompha.com\" class=\"btn
    btn-primary\">Open the clinic demo →</a>\n      </div>\n      <div class=\"demo-card
    solo\">\n        <span class=\"kind\">Single-doctor practice</span>\n        <h3>The
    solo demo</h3>\n        <p>One dentist, one chair, no reception desk. The same
    engine with the multi-user machinery folded away — just the chart, the deals and
    money in / money out.</p>\n        <ul>\n          <li>One login — you're the
    whole clinic</li>\n          <li>Money collapses to a simple in / out / drawer</li>\n
    \         <li>Grow into the full clinic when you hire</li>\n        </ul>\n        <a
    href=\"https://demosolo.gompha.com\" class=\"btn btn-gold\">Open the solo demo
    →</a>\n        <p class=\"flag\">⚑ Solo mode is on the roadmap — this demo goes
    live with it. See <a href=\"scale.html\">Scaling &amp; ownership</a>.</p>\n      </div>\n
    \   </div>\n  </div>\n</section>\n\n<!-- PRICING -->\n<section id=\"pricing\"
    style=\"background:var(--bg-alt)\">\n  <div class=\"wrap\">\n    <div class=\"sec-head
    reveal\">\n      <span class=\"eyebrow\">Pricing</span>\n      <h2>One clinic,
    one subdomain, one fair price</h2>\n      <p>Priced per clinic by size — never
    per seat. Start solo, grow to a full clinic on the same account.</p>\n    </div>\n
    \   <div class=\"price-grid stagger\">\n      <div class=\"plan\">\n        <h3>Solo</h3>\n
    \       <div class=\"amt\">$—<small>/mo</small></div>\n        <p class=\"note\">Single
    dentist, one chair.</p>\n        <ul>\n          <li>Odontogram + perio charting</li>\n
    \         <li>Deal ledger &amp; debtors</li>\n          <li>Scheduling + doctor
    agenda</li>\n          <li>Inventory + dual currency</li>\n          <li>Money
    in / out / drawer</li>\n        </ul>\n        <a href=\"index.html#contact\"
    class=\"btn btn-ghost\">Request pricing</a>\n      </div>\n      <div class=\"plan
    feat-plan\">\n        <h3>Clinic</h3>\n        <div class=\"amt\">$—<small>/mo</small></div>\n
    \       <p class=\"note\">Multi-doctor, multi-room practice.</p>\n        <ul>\n
    \         <li>Everything in Solo</li>\n          <li>Rooms, shared-room scheduling</li>\n
    \         <li>Per-case procedures + catalogs</li>\n          <li>Roles: doctor
    / reception / admin</li>\n          <li>Per-doctor income &amp; P&amp;L</li>\n
    \       </ul>\n        <a href=\"index.html#contact\" class=\"btn btn-primary\">Request
    pricing</a>\n      </div>\n      <div class=\"plan\">\n        <h3>Pro · White-label</h3>\n
    \       <div class=\"amt\">Custom</div>\n        <p class=\"note\">Your brand,
    your colors, your domain.</p>\n        <ul>\n          <li>Everything in Clinic</li>\n
    \         <li>White-label branding <span class=\"ship soon\">Planned</span></li>\n
    \         <li>Self-host / on-prem option <span class=\"ship soon\">Planned</span></li>\n
    \         <li>Voice notes &amp; X-ray viewer <span class=\"ship soon\">Planned</span></li>\n
    \         <li>Dedicated onboarding</li>\n        </ul>\n        <a href=\"index.html#contact\"
    class=\"btn btn-gold\">Talk to us</a>\n      </div>\n    </div>\n    <p class=\"indicative\">Prices
    are indicative — final pricing quoted on request, tailored to chairs and clinic
    size.</p>\n  </div>\n</section>\n\n<!-- CONTACT / WAITLIST -->\n<section id=\"contact\">\n
    \ <div class=\"wrap\">\n    <div class=\"sec-head reveal\">\n      <span class=\"eyebrow\">Get
    in</span>\n      <h2>Join the waitlist</h2>\n      <p>Be one of the first clinics
    on Gompha. Ask for pricing, book a walkthrough, or get early access.</p>\n    </div>\n
    \   <!-- ponytail: mailto action = zero backend. Swap for a real form endpoint
    when you have one. -->\n    <form class=\"form reveal\" action=\"mailto:kostikidis.network@gmail.com\"
    method=\"post\" enctype=\"text/plain\">\n      <label for=\"name\">Name</label>\n
    \     <input id=\"name\" name=\"name\" required placeholder=\"Dr. Jane Doe\">\n
    \     <label for=\"clinic\">Clinic</label>\n      <input id=\"clinic\" name=\"clinic\"
    placeholder=\"Clinic name &amp; city\">\n      <label for=\"email\">Email</label>\n
    \     <input id=\"email\" name=\"email\" type=\"email\" required placeholder=\"you@clinic.com\">\n
    \     <label for=\"interest\">I'm interested in</label>\n      <select id=\"interest\"
    name=\"interest\">\n        <option>Joining the waitlist</option>\n        <option>Pricing
    for my clinic</option>\n        <option>A live walkthrough</option>\n        <option>Solo
    practice (single doctor)</option>\n        <option>White-label / self-host</option>\n
    \     </select>\n      <label for=\"msg\">Anything else?</label>\n      <textarea
    id=\"msg\" name=\"message\" placeholder=\"How many chairs, doctors, and what you
    use today…\"></textarea>\n      <button type=\"submit\" class=\"btn btn-primary\">Request
    early access</button>\n      <p class=\"fine\">No spam. We'll only reach out about
    Gompha.</p>\n    </form>\n  </div>\n</section>\n\n<footer>\n  <div class=\"wrap\">\n
    \   <div class=\"fcols\">\n      <div class=\"fcol\" style=\"max-width:280px\">\n
