apiVersion: v1
kind: ConfigMap
metadata:
  name: landing-html
  namespace: gompha
data:
  # Gompha landing page (self-contained; inline CSS+JS). High-contrast + animations, v0.9 features. 2026-07-05.
  index.html: |
    <!DOCTYPE html>
    <html lang="en" class="no-js">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gompha — Your practice, anchored.</title>
    <meta name="description" content="Gompha is the dental practice management system that anchors your tooth chart, schedule, cases and deal ledger into one record — built for clinics that negotiate.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
    :root{
      /* High-contrast palette */
      --ink:#06182e;          /* headings — near-black navy */
      --ink-2:#0a2a52;
      --navy:#002F6C;         /* existing app token */
      --body:#233247;         /* body text — ~11:1 on white */
      --teal:#0FA697;         /* signature fill */
      --teal-bright:#14C8B6;
      --teal-text:#0A7D70;    /* AA teal for text/links on white */
      --gold:#C9871A;         /* deeper gold for contrast */
      --gold-bright:#E5A83B;
      --bg:#ffffff;
      --bg-alt:#EAF1F7;
      --card:#ffffff;
      --line:#D3DEEA;
      --heading-font:'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
      --body-font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    }
    :root[data-theme="dark"], html:not([data-theme="light"]) {}
    @media (prefers-color-scheme: dark){
      :root:not([data-theme="light"]){
        --ink:#f2f7ff; --ink-2:#dbe8ff; --navy:#8fb4ff;
        --body:#c6d6ec; --teal-text:#3ee0d0;
        --bg:#06142b; --bg-alt:#0b2038; --card:#0f2340; --line:#274a74;
      }
    }
    :root[data-theme="dark"]{
      --ink:#f2f7ff; --ink-2:#dbe8ff; --navy:#8fb4ff;
      --body:#c6d6ec; --teal-text:#3ee0d0;
      --bg:#06142b; --bg-alt:#0b2038; --card:#0f2340; --line:#274a74;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{font-family:var(--body-font);color:var(--body);background:var(--bg);line-height:1.65;-webkit-font-smoothing:antialiased;font-size:16.5px}
    h1,h2,h3,h4{font-family:var(--heading-font);color:var(--ink);line-height:1.12;letter-spacing:-.02em}
    a{color:var(--teal-text);text-decoration:none;font-weight:600}
    .wrap{max-width:1140px;margin:0 auto;padding:0 24px}
    .btn{display:inline-block;padding:15px 28px;border-radius:12px;font-family:var(--heading-font);font-weight:800;font-size:15px;cursor:pointer;border:none;transition:transform .16s ease,box-shadow .16s ease,background .16s ease}
    .btn:hover{transform:translateY(-3px)}
    .btn-primary{background:var(--teal);color:#022b26;box-shadow:0 10px 24px -8px rgba(15,166,151,.7)}
    .btn-primary:hover{background:var(--teal-bright)}
    .btn-ghost{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.55)}
    .btn-ghost:hover{border-color:#fff;background:rgba(255,255,255,.12)}
    .btn-gold{background:var(--gold-bright);color:#3a2600;box-shadow:0 10px 24px -8px rgba(229,168,59,.6)}
    .eyebrow{font-family:var(--heading-font);font-weight:800;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--teal-text)}

    /* logo socket */
    .logo{font-family:var(--heading-font);font-weight:900;font-size:24px;color:var(--ink);letter-spacing:-.02em;display:inline-flex;align-items:center}
    .socket{display:inline-flex;align-items:center;justify-content:center;width:.8em;height:.8em;border:.14em solid var(--teal);border-radius:50%;margin:0 .03em;position:relative;top:.03em}
    .socket:after{content:"";width:.28em;height:.28em;background:var(--teal);border-radius:50%}

    /* NAV */
    nav{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
    .nav-in{display:flex;align-items:center;justify-content:space-between;height:68px}
    .nav-links{display:flex;gap:30px;align-items:center}
    .nav-links a{color:var(--body);font-weight:600;font-size:15px}
    .nav-links a:hover{color:var(--ink)}
    @media(max-width:780px){.nav-links a:not(.btn){display:none}}

    /* HERO */
    .hero{background:linear-gradient(135deg,#00204d 0%,#013a6b 48%,#0a7d72 130%);color:#fff;padding:104px 0 116px;position:relative;overflow:hidden}
    .hero .glow{position:absolute;border-radius:50%;filter:blur(10px);pointer-events:none;opacity:.5}
    .hero .g1{right:-140px;top:-90px;width:460px;height:460px;background:radial-gradient(circle,rgba(45,212,196,.55),transparent 68%);animation:float 11s ease-in-out infinite}
    .hero .g2{left:-120px;bottom:-160px;width:420px;height:420px;background:radial-gradient(circle,rgba(66,133,244,.35),transparent 70%);animation:float 14s ease-in-out infinite reverse}
    .hero h1{color:#fff;font-size:clamp(40px,6.4vw,68px);font-weight:900;max-width:15ch;text-shadow:0 2px 24px rgba(0,0,0,.25)}
    .hero .tagline{font-size:clamp(19px,2.4vw,24px);color:#e2eeff;margin:24px 0 36px;max-width:56ch;font-weight:500}
    .hero .cta-row{display:flex;gap:14px;flex-wrap:wrap}
    .hero .pill{display:inline-flex;align-items:center;gap:8px;background:rgba(45,212,196,.16);border:1px solid rgba(45,212,196,.5);color:#c7fff6;padding:8px 16px;border-radius:999px;font-size:13px;font-weight:700;margin-bottom:28px}
    .hero .pill b{color:#fff}
    .hero .trust{margin-top:44px;color:#bcd2ef;font-size:14.5px;font-weight:500}

    /* SECTIONS */
    section{padding:92px 0}
    .sec-head{text-align:center;max-width:760px;margin:0 auto 56px}
    .sec-head h2{font-size:clamp(29px,4vw,42px);font-weight:900;margin:12px 0}
    .sec-head p{font-size:18.5px;color:var(--body)}

    /* anchor cards */
    .id-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
    @media(max-width:900px){.id-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:480px){.id-grid{grid-template-columns:1fr}}
    .id-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;position:relative;overflow:hidden;transition:transform .2s ease,box-shadow .2s ease,border-color .2s}
    .id-card:hover{transform:translateY(-4px);box-shadow:0 20px 44px -22px rgba(3,32,58,.5);border-color:var(--teal)}
    .id-card .tag{font-family:var(--heading-font);font-weight:800;font-size:12px;letter-spacing:.05em;color:#022b26;background:var(--teal-bright);display:inline-block;padding:4px 11px;border-radius:6px;text-transform:uppercase}
    .id-card h3{margin:16px 0 8px;font-size:20px}
    .id-card p{font-size:15px;color:var(--body)}

    /* Feature grid */
    .feat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
    @media(max-width:900px){.feat-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:560px){.feat-grid{grid-template-columns:1fr}}
    .feat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;transition:transform .2s ease,box-shadow .2s ease,border-color .2s;position:relative}
    .feat:hover{transform:translateY(-5px);box-shadow:0 22px 48px -22px rgba(3,32,58,.55);border-color:var(--teal)}
    .feat .ico{font-size:30px;margin-bottom:14px;display:block}
    .feat h3{font-size:18.5px;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .feat p{font-size:15px;color:var(--body)}
    .ship{font-family:var(--heading-font);font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#022b26;background:var(--teal-bright);padding:3px 8px;border-radius:5px}
    .ship.new{background:var(--gold-bright);color:#3a2600}
    .ship.soon{background:transparent;color:var(--teal-text);border:1.5px solid var(--teal-text)}

    /* Deal spotlight */
    .spot{background:linear-gradient(135deg,var(--navy) 0%,#012a5c 100%);color:#fff;border-radius:24px;padding:56px;display:grid;grid-template-columns:1.1fr 1fr;gap:46px;align-items:center;box-shadow:0 30px 70px -34px rgba(0,20,50,.7)}
    :root[data-theme="dark"] .spot, html:not([data-theme="light"]) .spot{background:linear-gradient(135deg,#04122b,#0a2247)}
    @media(max-width:820px){.spot{grid-template-columns:1fr;padding:34px}}
    .spot h2{color:#fff;font-size:clamp(27px,3.4vw,37px);font-weight:900}
    .spot p{color:#d9e6fb;font-size:17px;margin:16px 0}
    .spot .moat{display:inline-block;background:var(--gold-bright);color:#3a2600;font-family:var(--heading-font);font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:6px 13px;border-radius:6px;margin-bottom:8px}
    .sheet{background:#fff;border-radius:16px;padding:26px;color:#233247;box-shadow:0 34px 66px -30px rgba(0,0,0,.7)}
    .sheet .row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #e8eef5;font-size:15px}
    .sheet .row:last-child{border-bottom:none}
    .sheet .k{color:#5a6b82}
    .sheet .v{font-weight:700;color:#0b2647}
    .sheet .strike{text-decoration:line-through;color:#94a3b8;font-weight:600}
    .sheet .agreed{color:#0A7D70;font-weight:900;font-size:17px}
    .sheet .ctx{background:#eafaf8;border-left:3px solid var(--teal);padding:11px 13px;border-radius:6px;font-size:14px;font-style:italic;color:#0b2647;margin-top:8px}

    /* Compare table */
    .cmp{overflow-x:auto;border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 40px -28px rgba(3,32,58,.4)}
    table{border-collapse:collapse;width:100%;min-width:700px;background:var(--card)}
    th,td{text-align:left;padding:17px 18px;border-bottom:1px solid var(--line);font-size:15px;color:var(--body)}
    thead th{font-family:var(--heading-font);color:var(--ink);font-weight:800;font-size:14px}
    thead th.us{background:var(--teal);color:#022b26}
    tbody td:first-child{color:var(--ink);font-weight:700}
    td.y{color:var(--teal-text);font-weight:800}
    td.n{color:#adbccf}
    tbody td.us{background:color-mix(in srgb,var(--teal) 15%,transparent);font-weight:800;color:var(--teal-text)}

    /* Pricing */
    .price-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;align-items:stretch}
    @media(max-width:820px){.price-grid{grid-template-columns:1fr}}
    .plan{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:34px;display:flex;flex-direction:column;transition:transform .2s ease,box-shadow .2s}
    .plan:hover{transform:translateY(-4px);box-shadow:0 22px 48px -24px rgba(3,32,58,.5)}
    .plan.feat-plan{border:2px solid var(--teal);box-shadow:0 26px 54px -26px rgba(15,166,151,.6);position:relative}
    .plan.feat-plan:before{content:"Most popular";position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:var(--gold-bright);color:#3a2600;font-family:var(--heading-font);font-weight:800;font-size:12px;padding:5px 15px;border-radius:999px}
    .plan h3{font-size:22px}
    .plan .amt{font-family:var(--heading-font);font-weight:900;color:var(--ink);font-size:36px;margin:14px 0 4px}
    .plan .amt small{font-size:15px;color:var(--body);font-weight:600}
    .plan .note{font-size:13.5px;color:var(--body);margin-bottom:18px}
    .plan ul{list-style:none;margin:16px 0 26px;flex:1}
    .plan li{padding:9px 0 9px 27px;position:relative;font-size:15px;color:var(--body)}
    .plan li:before{content:"✓";position:absolute;left:0;color:var(--teal-text);font-weight:900}
    .plan .btn{width:100%;text-align:center}
    .plan .btn-ghost{color:var(--ink);border-color:var(--line)}
    .plan .btn-ghost:hover{border-color:var(--teal);background:transparent}
    .indicative{text-align:center;color:var(--body);font-size:14px;margin-top:24px}

    /* Contact */
    #contact{background:linear-gradient(135deg,#00204d 0%,#013a6b 100%);color:#fff}
    #contact h2{color:#fff}
    #contact .sec-head p{color:#d9e6fb}
    .form{max-width:560px;margin:0 auto;background:var(--card);border-radius:20px;padding:36px;box-shadow:0 34px 70px -30px rgba(0,0,0,.5)}
    .form label{display:block;font-family:var(--heading-font);font-weight:700;font-size:14px;color:var(--ink);margin:15px 0 6px}
    .form input,.form select,.form textarea{width:100%;padding:14px 15px;border:1.5px solid var(--line);border-radius:11px;font-family:var(--body-font);font-size:15px;background:var(--bg);color:var(--ink)}
    .form input:focus,.form select:focus,.form textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,166,151,.2)}
    .form textarea{min-height:92px;resize:vertical}
    .form .btn{width:100%;margin-top:24px}
    .form .fine{text-align:center;font-size:13px;color:var(--body);margin-top:14px}

    footer{background:#04122b;color:#a7bcda;padding:44px 0;text-align:center;font-size:14px}
    footer .logo{color:#fff;margin-bottom:10px}
    footer .logo .socket{border-color:#fff}
    footer .logo .socket:after{background:#fff}
    footer a{color:#d9e6fb}

    /* ANIMATIONS */
    @keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(-24px,26px)}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
    @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(15,166,151,.5)}50%{box-shadow:0 0 0 5px rgba(15,166,151,0)}}
    .hero .anim{opacity:0;animation:fadeUp .7s cubic-bezier(.2,.7,.2,1) forwards}
    .hero .d1{animation-delay:.05s}.hero .d2{animation-delay:.18s}.hero .d3{animation-delay:.32s}.hero .d4{animation-delay:.46s}
    .socket{animation:pulse 2.6s ease-out infinite}
    /* scroll reveal (progressive: only hides when JS is active) */
    .js .reveal{opacity:0;transform:translateY(26px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.2,1)}
    .js .reveal.in{opacity:1;transform:none}
    .js .stagger>*{opacity:0;transform:translateY(24px);transition:opacity .55s ease,transform .55s cubic-bezier(.2,.7,.2,1)}
    .js .stagger.in>*{opacity:1;transform:none}
    .js .stagger.in>*:nth-child(2){transition-delay:.07s}
    .js .stagger.in>*:nth-child(3){transition-delay:.14s}
    .js .stagger.in>*:nth-child(4){transition-delay:.21s}
    .js .stagger.in>*:nth-child(5){transition-delay:.28s}
    .js .stagger.in>*:nth-child(6){transition-delay:.35s}
    .js .stagger.in>*:nth-child(7){transition-delay:.42s}
    .js .stagger.in>*:nth-child(8){transition-delay:.49s}
    .js .stagger.in>*:nth-child(9){transition-delay:.56s}
    @media (prefers-reduced-motion: reduce){
      *{animation:none!important;transition:none!important}
      .js .reveal,.js .stagger>*,.hero .anim{opacity:1!important;transform:none!important}
      html{scroll-behavior:auto}
    }
    </style>
    </head>
    <body>

    <nav>
      <div class="wrap nav-in">
        <div class="logo">G<span class="socket"></span>mpha</div>
        <div class="nav-links">
          <a href="#capabilities">Capabilities</a>
          <a href="#ledger">The Deal Ledger</a>
          <a href="#compare">Compare</a>
          <a href="#pricing">Pricing</a>
          <a href="#contact" class="btn btn-primary" style="padding:10px 20px">Join the waitlist</a>
        </div>
      </div>
    </nav>

    <!-- HERO -->
    <header class="hero">
      <div class="glow g1"></div><div class="glow g2"></div>
      <div class="wrap">
        <span class="pill anim d1">🦷 <span><b>v0.9</b> — now with per-case procedures + inventory</span></span>
        <h1 class="anim d2">Your practice, anchored.</h1>
        <p class="tagline anim d3">Gompha holds your tooth chart, your schedule, every case and every negotiated deal in one record — and remembers who approved the price and why. Nothing floats loose. Nothing gets forgotten.</p>
        <div class="cta-row anim d4">
          <a href="#contact" class="btn btn-primary">Join the waitlist</a>
          <a href="https://demo.gompha.com" class="btn btn-ghost">See the live demo →</a>
        </div>
        <p class="trust anim d4">Built for cash &amp; bargaining markets — where the price is a conversation, not a list.</p>
      </div>
    </header>

    <!-- ANCHOR THESIS -->
    <section id="thesis">
      <div class="wrap">
        <div class="sec-head reveal">
          <span class="eyebrow">The name</span>
          <h2>Gomphosis — the joint that anchors every tooth</h2>
          <p>In anatomy, <em>gomphosis</em> is the peg-in-socket bond that locks each tooth solidly into the jaw — the reason a healthy tooth doesn't move. Gompha does the same for your practice: it anchors the four things that usually float loose into one record.</p>
        </div>
        <div class="id-grid stagger">
          <div class="id-card"><span class="tag">Tooth</span><h3>Two-layer odontogram</h3><p>Crown, root and state per tooth, tracked over time with per-doctor provenance colors.</p></div>
          <div class="id-card"><span class="tag">Patient</span><h3>The full timeline</h3><p>History, perio trends, charges, debt and contact — one continuous, anchored record.</p></div>
          <div class="id-card"><span class="tag">Case</span><h3>Procedures &amp; sessions</h3><p>Every case assembled from procedure line-items that book, schedule and follow the patient through.</p></div>
          <div class="id-card"><span class="tag">Deal</span><h3>The negotiated price</h3><p>Agreed vs standard price, who approved it, and the human reason — held, not forgotten.</p></div>
        </div>
      </div>
    </section>

    <!-- CAPABILITIES -->
    <section id="capabilities" style="background:var(--bg-alt)">
      <div class="wrap">
        <div class="sec-head reveal">
          <span class="eyebrow">What it does</span>
          <h2>A PMS shaped like your chair, not a spreadsheet</h2>
          <p>Everything a modern clinic needs — with the parts Western software forgot. All of the below is <strong>live today</strong>.</p>
        </div>
        <div class="feat-grid stagger">
          <div class="feat"><span class="ico">🦷</span><h3>Two-layer odontogram <span class="ship">Shipped</span></h3><p>A real tooth chart: crown work, root work and tooth state over time — not a checklist. Most regional tools have no chart at all.</p></div>
          <div class="feat"><span class="ico">🤝</span><h3>The deal ledger <span class="ship">Shipped</span></h3><p>Capture the <em>negotiated</em> price, the approver and the reason. The negotiation becomes data you can see across the whole clinic.</p></div>
          <div class="feat"><span class="ico">🧾</span><h3>Per-case procedures <span class="ship new">New in v0.9</span></h3><p>Build a case from procedure line-items — clinical, lab, or material-linked. Per-doctor catalogs, and per-procedure income attribution baked in.</p></div>
          <div class="feat"><span class="ico">📦</span><h3>Inventory control <span class="ship new">New</span></h3><p>Real stock: packs &amp; pieces, locked-FX cost that never revalues on a recount, per-doctor or clinic ownership, expiry/batch, low-stock alerts.</p></div>
          <div class="feat"><span class="ico">💰</span><h3>Cost floor on every deal <span class="ship">Shipped</span></h3><p>Materials tie to procedures, so each case shows its real cost floor — your honest bargaining line, right on the sheet.</p></div>
          <div class="feat"><span class="ico">📊</span><h3>Perio charting <span class="ship">Shipped</span></h3><p>Pocket depths per visit, drawn as a trend line — see the mouth improving, not just today's numbers.</p></div>
          <div class="feat"><span class="ico">🗓️</span><h3>Room-grid scheduling <span class="ship">Shipped</span></h3><p>Reception sees rooms as columns, doctors color-coded, with hard double-booking protection and an emergency override.</p></div>
          <div class="feat"><span class="ico">⏱️</span><h3>Doctor agenda + countdown <span class="ship">Shipped</span></h3><p>Mobile day list, current patient on top, a countdown to the next — with a running-late cascade that flags reception instantly.</p></div>
          <div class="feat"><span class="ico">🔒</span><h3>Patient-focus lock <span class="ship">Shipped</span></h3><p>Hit <em>Start</em> and the phone goes kiosk-mode on that one patient. No fat-finger navigation mid-treatment.</p></div>
          <div class="feat"><span class="ico">💵</span><h3>Dual currency, done right <span class="ship">Shipped</span></h3><p>IQD + USD with an "FX of the day." Every row stores the rate used, so totals stay honest as rates move.</p></div>
          <div class="feat"><span class="ico">👥</span><h3>Role-shaped interfaces <span class="ship">Shipped</span></h3><p>Doctor mobile-clinical, reception web-scheduling, admin-config, maintenance walled from all patient data — one codebase.</p></div>
          <div class="feat"><span class="ico">📈</span><h3>Partnership financials <span class="ship soon">Coming</span></h3><p>Per-doctor P&amp;L with privacy, owner splits, renter/visitor models, scoped expenses and monthly reports. Spec locked, building now.</p></div>
        </div>
      </div>
    </section>

    <!-- DEAL LEDGER SPOTLIGHT -->
    <section id="ledger">
      <div class="wrap">
        <div class="spot reveal">
          <div>
            <span class="moat">The moat</span>
            <h2>No other PMS remembers the deal</h2>
            <p>Dentrix and Open Dental assume a fixed price list. But in the real world, the price is negotiated — a discount for a cousin, a free cleaning, a cash rate. Gompha anchors that: what was agreed, who approved it, and why.</p>
            <p>Next time that patient walks in, the whole clinic knows the story — not just the doctor who made the deal.</p>
            <a href="#contact" class="btn btn-gold">See it on your data</a>
          </div>
          <div class="sheet">
            <div class="row"><span class="k">Procedure</span><span class="v">Zirconia crown · tooth 11</span></div>
            <div class="row"><span class="k">Standard price</span><span class="strike">$450</span></div>
            <div class="row"><span class="k">Agreed price</span><span class="agreed">$380</span></div>
            <div class="row"><span class="k">Cost floor (materials)</span><span class="v">$120</span></div>
