apiVersion: v1
kind: ConfigMap
metadata:
  name: landing-html
  namespace: gompha
data:
  # Gompha landing page (self-contained index.html; inline CSS). Built 2026-07-05.
  # Swap to a built image / PVC only if the page grows separate CSS/JS/image assets.
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gompha — Your practice, anchored.</title>
    <meta name="description" content="Gompha is the dental practice management system that anchors your tooth chart, schedule and deal ledger into one record — and remembers every negotiated price and who approved it.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- ponytail: Google Fonts link works because this is hosted on your own domain, not a CSP-locked artifact. Falls back to system-ui offline. -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
    :root{
      --ink:#002F6C;        /* Root Navy — existing app token */
      --ink-2:#0a2450;
      --teal:#14B8A6;       /* Anchor Teal — signature */
      --teal-deep:#0E9285;
      --gold:#E5A83B;       /* Crown — premium accent */
      --enamel:#F5F9FA;
      --slate:#475569;
      --line:#E2E8F0;
      --white:#ffffff;
      --card:#ffffff;
      --heading:'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
      --body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --enamel:#0a1526; --white:#0f1e38; --card:#12233f;
        --slate:#a9b8d0; --line:#20365c; --ink:#eaf1ff; --ink-2:#cfe0ff;
      }
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{font-family:var(--body);color:var(--slate);background:var(--enamel);line-height:1.6;-webkit-font-smoothing:antialiased}
    h1,h2,h3,h4{font-family:var(--heading);color:var(--ink);line-height:1.15;letter-spacing:-.02em}
    a{color:var(--teal-deep);text-decoration:none}
    .wrap{max-width:1120px;margin:0 auto;padding:0 24px}
    .btn{display:inline-block;padding:14px 26px;border-radius:12px;font-family:var(--heading);font-weight:700;font-size:15px;cursor:pointer;border:none;transition:transform .15s ease,box-shadow .15s ease}
    .btn:hover{transform:translateY(-2px)}
    .btn-primary{background:var(--teal);color:#04211d;box-shadow:0 8px 20px -6px rgba(20,184,166,.5)}
    .btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
    .btn-gold{background:var(--gold);color:#3a2600;box-shadow:0 8px 20px -6px rgba(229,168,59,.5)}
    .eyebrow{font-family:var(--heading);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal-deep)}

    /* Logo: the "o" as a gomphosis socket — teal ring with a seated center dot */
    .logo{font-family:var(--heading);font-weight:800;font-size:23px;color:var(--ink);letter-spacing:-.02em;display:inline-flex;align-items:center}
    .socket{display:inline-flex;align-items:center;justify-content:center;width:.82em;height:.82em;border:2.5px solid var(--teal);border-radius:50%;margin:0 .02em;position:relative;top:.04em}
    .socket:after{content:"";width:.30em;height:.30em;background:var(--teal);border-radius:50%}

    /* NAV */
    nav{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--enamel) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
    .nav-in{display:flex;align-items:center;justify-content:space-between;height:66px}
    .nav-links{display:flex;gap:28px;align-items:center}
    .nav-links a{color:var(--slate);font-weight:500;font-size:15px}
    .nav-links a:hover{color:var(--ink)}
    @media(max-width:760px){.nav-links a:not(.btn){display:none}}

    /* HERO */
    .hero{background:linear-gradient(135deg,var(--ink) 0%,var(--ink-2) 55%,var(--teal-deep) 140%);color:#fff;padding:96px 0 108px;position:relative;overflow:hidden}
    .hero:after{content:"";position:absolute;right:-120px;top:-80px;width:420px;height:420px;background:radial-gradient(circle,rgba(20,184,166,.35),transparent 70%);pointer-events:none}
    .hero h1{color:#fff;font-size:clamp(38px,6vw,64px);font-weight:800;max-width:15ch}
    .hero .tagline{font-size:clamp(19px,2.4vw,23px);color:#c7d6f0;margin:22px 0 34px;max-width:54ch}
    .hero .cta-row{display:flex;gap:14px;flex-wrap:wrap}
    .hero .pill{display:inline-block;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#dbe7ff;padding:7px 15px;border-radius:999px;font-size:13px;font-weight:600;margin-bottom:26px}
    .hero .trust{margin-top:40px;color:#9fb3d6;font-size:14px}

    /* SECTIONS */
    section{padding:88px 0}
    .sec-head{text-align:center;max-width:730px;margin:0 auto 54px}
    .sec-head h2{font-size:clamp(28px,4vw,40px);font-weight:800;margin:12px 0}
    .sec-head p{font-size:18px}

    /* anchor cards */
    .id-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
    @media(max-width:900px){.id-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:480px){.id-grid{grid-template-columns:1fr}}
    .id-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;position:relative;overflow:hidden}
    .id-card .tag{font-family:var(--heading);font-weight:800;font-size:12px;letter-spacing:.06em;color:#04211d;background:var(--teal);display:inline-block;padding:3px 10px;border-radius:6px;text-transform:uppercase}
    .id-card h3{margin:16px 0 8px;font-size:20px}
    .id-card p{font-size:15px}

    /* Feature grid */
    .feat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
    @media(max-width:900px){.feat-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:560px){.feat-grid{grid-template-columns:1fr}}
    .feat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;transition:transform .18s ease,box-shadow .18s ease}
    .feat:hover{transform:translateY(-4px);box-shadow:0 18px 40px -20px rgba(0,47,108,.35)}
    .feat .ico{font-size:28px;margin-bottom:14px}
    .feat h3{font-size:18px;margin-bottom:8px}
    .feat p{font-size:15px}

    /* Deal spotlight */
    .spot{background:var(--ink);color:#fff;border-radius:24px;padding:52px;display:grid;grid-template-columns:1.1fr 1fr;gap:44px;align-items:center}
    @media(max-width:820px){.spot{grid-template-columns:1fr;padding:34px}}
    .spot h2{color:#fff;font-size:clamp(26px,3.4vw,36px);font-weight:800}
    .spot p{color:#c7d6f0;font-size:17px;margin:16px 0}
    .spot .moat{display:inline-block;background:var(--gold);color:#3a2600;font-family:var(--heading);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:5px 12px;border-radius:6px;margin-bottom:8px}
    .sheet{background:#fff;border-radius:16px;padding:24px;color:var(--slate);box-shadow:0 30px 60px -30px rgba(0,0,0,.6)}
    .sheet .row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #eef2f6;font-size:15px}
    .sheet .row:last-child{border-bottom:none}
    .sheet .k{color:#64748b}
    .sheet .v{font-weight:600;color:#0f2745}
    .sheet .strike{text-decoration:line-through;color:#94a3b8;font-weight:500}
    .sheet .agreed{color:var(--teal-deep);font-weight:800}
    .sheet .ctx{background:#f1f8f7;border-left:3px solid var(--teal);padding:10px 12px;border-radius:6px;font-size:14px;font-style:italic;color:#0f2745;margin-top:6px}

    /* Compare table */
    .cmp{overflow-x:auto;border:1px solid var(--line);border-radius:16px}
    table{border-collapse:collapse;width:100%;min-width:680px;background:var(--card)}
    th,td{text-align:left;padding:16px 18px;border-bottom:1px solid var(--line);font-size:15px}
    thead th{font-family:var(--heading);color:var(--ink);font-weight:700;font-size:14px}
    thead th.us{background:var(--teal);color:#04211d}
    tbody td:first-child{color:var(--ink);font-weight:600}
    td.y{color:var(--teal-deep);font-weight:700}
    td.n{color:#cbd5e1}
    tbody td.us{background:color-mix(in srgb,var(--teal) 10%,transparent);font-weight:700;color:var(--teal-deep)}

    /* Pricing */
    .price-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;align-items:stretch}
    @media(max-width:820px){.price-grid{grid-template-columns:1fr}}
    .plan{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:32px;display:flex;flex-direction:column}
    .plan.feat-plan{border:2px solid var(--teal);box-shadow:0 24px 50px -24px rgba(20,184,166,.4);position:relative}
    .plan.feat-plan:before{content:"Most popular";position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:var(--gold);color:#3a2600;font-family:var(--heading);font-weight:700;font-size:12px;padding:4px 14px;border-radius:999px}
    .plan h3{font-size:22px}
    .plan .amt{font-family:var(--heading);font-weight:800;color:var(--ink);font-size:34px;margin:14px 0 4px}
    .plan .amt small{font-size:15px;color:var(--slate);font-weight:500}
    .plan .note{font-size:13px;color:var(--slate);margin-bottom:18px}
    .plan ul{list-style:none;margin:16px 0 26px;flex:1}
    .plan li{padding:8px 0 8px 26px;position:relative;font-size:15px}
    .plan li:before{content:"✓";position:absolute;left:0;color:var(--teal-deep);font-weight:800}
    .plan .btn{width:100%;text-align:center}
    .indicative{text-align:center;color:var(--slate);font-size:14px;margin-top:22px}

    /* Contact */
    #contact{background:linear-gradient(135deg,var(--ink) 0%,var(--ink-2) 100%);color:#fff}
    #contact h2{color:#fff}
    #contact .sec-head p{color:#c7d6f0}
    .form{max-width:560px;margin:0 auto;background:var(--card);border-radius:20px;padding:34px}
    .form label{display:block;font-family:var(--heading);font-weight:600;font-size:14px;color:var(--ink);margin:14px 0 6px}
    .form input,.form select,.form textarea{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:11px;font-family:var(--body);font-size:15px;background:var(--enamel);color:var(--ink)}
    .form textarea{min-height:90px;resize:vertical}
    .form .btn{width:100%;margin-top:22px}
    .form .fine{text-align:center;font-size:13px;color:var(--slate);margin-top:14px}

    footer{background:var(--ink-2);color:#9fb3d6;padding:40px 0;text-align:center;font-size:14px}
    footer .logo{color:#fff;margin-bottom:10px}
    footer a{color:#c7d6f0}
    </style>
    </head>
    <body>

    <nav>
      <div class="wrap nav-in">
        <div class="logo">G<span class="socket"></span>mpha</div>
        <div class="nav-links">
          <a href="#capabilities">Capabilities</a>
          <a href="#ledger">The Deal Ledger</a>
          <a href="#compare">Compare</a>
          <a href="#pricing">Pricing</a>
          <a href="#contact" class="btn btn-primary" style="padding:9px 18px">Join the waitlist</a>
        </div>
      </div>
    </nav>

    <!-- HERO -->
    <header class="hero">
      <div class="wrap">
        <span class="pill">🦷 Dental practice management, built around the deal</span>
        <h1>Your practice, anchored.</h1>
        <p class="tagline">Gompha holds your tooth chart, your schedule and every negotiated deal in one record — and remembers who approved the price and why. Nothing floats loose. Nothing gets forgotten.</p>
        <div class="cta-row">
          <a href="#contact" class="btn btn-primary">Join the waitlist</a>
          <!-- ponytail: point at your existing seeded demo tenant; no new domain needed -->
          <a href="https://demo.gompha.com" class="btn btn-ghost" style="color:#fff;border-color:rgba(255,255,255,.3)">See the live demo →</a>
        </div>
        <p class="trust">Built for cash &amp; bargaining markets — where the price is a conversation, not a list.</p>
      </div>
    </header>

    <!-- ANCHOR THESIS -->
    <section id="thesis">
      <div class="wrap">
        <div class="sec-head">
          <span class="eyebrow">The name</span>
          <h2>Gomphosis — the joint that anchors every tooth</h2>
          <p>In anatomy, <em>gomphosis</em> is the peg-in-socket bond that locks each tooth solidly into the jaw — the reason a healthy tooth doesn't move. Gompha does the same for your practice: it anchors the four things that usually float loose into one record.</p>
        </div>
        <div class="id-grid">
          <div class="id-card"><span class="tag">Tooth</span><h3>Two-layer odontogram</h3><p>Crown, root and state per tooth, tracked over time with per-doctor provenance colors.</p></div>
          <div class="id-card"><span class="tag">Patient</span><h3>The full timeline</h3><p>History, perio trends, charges, debt and contact — one continuous, anchored record.</p></div>
          <div class="id-card"><span class="tag">Plan</span><h3>Treatment &amp; sessions</h3><p>Multi-session plans that book, schedule and follow the patient through.</p></div>
          <div class="id-card"><span class="tag">Deal</span><h3>The negotiated price</h3><p>Agreed vs standard price, who approved it, and the human reason — held, not forgotten.</p></div>
        </div>
      </div>
    </section>

    <!-- CAPABILITIES -->
    <section id="capabilities" style="background:color-mix(in srgb,var(--teal) 5%,var(--enamel))">
      <div class="wrap">
        <div class="sec-head">
          <span class="eyebrow">What it does</span>
          <h2>A PMS shaped like your chair, not a spreadsheet</h2>
          <p>Everything a modern clinic needs — with the parts Western software forgot.</p>
        </div>
        <div class="feat-grid">
          <div class="feat"><div class="ico">🦷</div><h3>Two-layer odontogram</h3><p>A real tooth chart: crown work, root work and tooth state over time — not a checklist. Most regional tools have no chart at all.</p></div>
          <div class="feat"><div class="ico">🤝</div><h3>The deal ledger</h3><p>Capture the <em>negotiated</em> price, the approver and the reason. The negotiation becomes data you can see across the whole clinic.</p></div>
          <div class="feat"><div class="ico">📊</div><h3>Perio charting</h3><p>Pocket depths per visit, drawn as a trend line — see the mouth improving, not just today's numbers.</p></div>
          <div class="feat"><div class="ico">📦</div><h3>Stock &amp; cost floor</h3><p>Tie materials to services so each treatment shows its real cost floor — your honest bargaining line.</p></div>
          <div class="feat"><div class="ico">🗓️</div><h3>Room-grid scheduling</h3><p>Reception sees rooms as columns, doctors color-coded, with hard double-booking protection and an emergency override.</p></div>
          <div class="feat"><div class="ico">⏱️</div><h3>Doctor agenda + countdown</h3><p>Mobile day list, current patient on top, a countdown to the next — with a running-late cascade that flags reception instantly.</p></div>
          <div class="feat"><div class="ico">🔒</div><h3>Patient-focus lock</h3><p>Hit <em>Start</em> and the phone goes kiosk-mode on that one patient. No fat-finger navigation mid-treatment.</p></div>
          <div class="feat"><div class="ico">💵</div><h3>Dual currency, done right</h3><p>IQD + USD with an "FX of the day." Every row stores the rate used, so totals stay honest as rates move.</p></div>
          <div class="feat"><div class="ico">👥</div><h3>Role-shaped interfaces</h3><p>Doctor mobile-clinical, reception web-scheduling, admin-config, maintenance walled from all patient data — one codebase.</p></div>
        </div>
      </div>
    </section>

    <!-- DEAL LEDGER SPOTLIGHT -->
    <section id="ledger">
      <div class="wrap">
        <div class="spot">
          <div>
            <span class="moat">The moat</span>
            <h2>No other PMS remembers the deal</h2>
            <p>Dentrix and Open Dental assume a fixed price list. But in the real world, the price is negotiated — a discount for a cousin, a free cleaning, a cash rate. Gompha anchors that: what was agreed, who approved it, and why.</p>
            <p>Next time that patient walks in, the whole clinic knows the story — not just the doctor who made the deal.</p>
            <a href="#contact" class="btn btn-gold">See it on your data</a>
          </div>
          <div class="sheet">
            <div class="row"><span class="k">Service</span><span class="v">Zirconia crown · tooth 11</span></div>
            <div class="row"><span class="k">Standard price</span><span class="strike">$450</span></div>
            <div class="row"><span class="k">Agreed price</span><span class="agreed">$380</span></div>
            <div class="row"><span class="k">Cost floor (materials)</span><span class="v">$120</span></div>
            <div class="row"><span class="k">Approved by</span><span class="v">Dr. Ali</span></div>
            <div class="row"><span class="k">Currency</span><span class="v">USD @ FX 1,500</span></div>
            <div class="ctx">"70 off — Hiba's cousin, paying cash today, added free polish."</div>
          </div>
        </div>
      </div>
    </section>

    <!-- COMPARE -->
    <section id="compare" style="background:color-mix(in srgb,var(--teal) 5%,var(--enamel))">
      <div class="wrap">
        <div class="sec-head">
          <span class="eyebrow">Why Gompha wins</span>
          <h2>Built for how you actually run the chair</h2>
          <p>Dentrix is built for an insurance claim. EasyClinic is a calendar with invoices. Gompha is built for the deal.</p>
        </div>
        <div class="cmp">
          <table>
            <thead>
              <tr><th>Capability</th><th class="us">Gompha</th><th>Dentrix / Open Dental</th><th>Regional tools</th></tr>
            </thead>
            <tbody>
              <tr><td>Negotiated-price deal ledger</td><td class="us">✓</td><td class="n">✕ fixed list</td><td class="n">✕</td></tr>
              <tr><td>Two-layer visual odontogram</td><td class="us">✓</td><td class="y">✓ (legacy)</td><td class="n">✕ no chart</td></tr>
              <tr><td>Dual currency (IQD+USD, FX/day)</td><td class="us">✓</td><td class="n">✕</td><td>partial</td></tr>
              <tr><td>Cost-floor bargaining assistant</td><td class="us">✓</td><td class="n">✕</td><td class="n">✕</td></tr>
              <tr><td>Doctor-mobile + reception-web shells</td><td class="us">✓</td><td class="n">✕ desktop-bound</td><td>partial</td></tr>
              <tr><td>Made for cash / bargaining markets</td><td class="us">✓</td><td class="n">✕ insurance-first</td><td>partial</td></tr>
              <tr><td>Cloud, subdomain-per-clinic, white-label</td><td class="us">✓</td><td class="n">✕</td><td>partial</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- PRICING -->
    <section id="pricing">
      <div class="wrap">
        <div class="sec-head">
          <span class="eyebrow">Pricing</span>
          <h2>One clinic, one subdomain, one fair price</h2>
          <p>Hosted and managed, or self-hosted on your own server. No per-claim fees, no surprises.</p>
        </div>
        <div class="price-grid">
          <div class="plan">
            <h3>Solo</h3>
            <div class="amt">$—<small>/mo</small></div>
            <p class="note">Single dentist, one chair.</p>
            <ul>
              <li>Odontogram + perio charting</li>
              <li>Deal ledger &amp; debtors</li>
              <li>Scheduling + doctor agenda</li>
              <li>Dual currency</li>
              <li>Email support</li>
            </ul>
            <a href="#contact" class="btn btn-ghost">Request pricing</a>
          </div>
          <div class="plan feat-plan">
            <h3>Clinic</h3>
            <div class="amt">$—<small>/mo</small></div>
            <p class="note">Multi-doctor, multi-room practice.</p>
            <ul>
              <li>Everything in Solo</li>
              <li>Rooms, shared-room scheduling</li>
              <li>Roles: doctor / reception / admin</li>
              <li>Stock + cost floor</li>
              <li>Patient timeline &amp; panorama</li>
              <li>Priority support</li>
            </ul>
            <a href="#contact" class="btn btn-primary">Request pricing</a>
          </div>
          <div class="plan">
            <h3>Pro · White-label</h3>
            <div class="amt">Custom</div>
            <p class="note">Your brand, your colors, your domain.</p>
            <ul>
              <li>Everything in Clinic</li>
              <li>White-label branding</li>
              <li>Self-host / on-prem option</li>
              <li>Voice → deal notes (roadmap)</li>
              <li>Photos &amp; X-ray viewer (roadmap)</li>
              <li>Dedicated onboarding</li>
            </ul>
            <a href="#contact" class="btn btn-gold">Talk to us</a>
          </div>
        </div>
        <p class="indicative">Prices are indicative — final pricing quoted on request, tailored to chairs and clinic size.</p>
      </div>
    </section>

    <!-- CONTACT / WAITLIST -->
    <section id="contact">
      <div class="wrap">
        <div class="sec-head">
          <span class="eyebrow">Get in</span>
          <h2>Join the waitlist</h2>
          <p>Be one of the first clinics on Gompha. Ask for pricing, book a walkthrough, or get early access.</p>
        </div>
        <!-- ponytail: mailto action = zero backend. Swap the action for a real form endpoint (Formspree/API) when you have one. -->
        <form class="form" action="mailto:kostikidis.network@gmail.com" method="post" enctype="text/plain">
          <label for="name">Name</label>
          <input id="name" name="name" required placeholder="Dr. Jane Doe">
          <label for="clinic">Clinic</label>
          <input id="clinic" name="clinic" placeholder="Clinic name &amp; city">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required placeholder="you@clinic.com">
          <label for="interest">I'm interested in</label>
          <select id="interest" name="interest">
            <option>Joining the waitlist</option>
            <option>Pricing for my clinic</option>
            <option>A live walkthrough</option>
            <option>White-label / self-host</option>
          </select>
          <label for="msg">Anything else?</label>
          <textarea id="msg" name="message" placeholder="How many chairs, doctors, and what you use today…"></textarea>
          <button type="submit" class="btn btn-primary">Request early access</button>
          <p class="fine">No spam. We'll only reach out about Gompha.</p>
        </form>
      </div>
    </section>

    <footer>
      <div class="wrap">
