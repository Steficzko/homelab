    cost floors</b><span class=\"toggle off\"></span></div>\n        <div class=\"prow\"><b>Tooth
    chart &amp; scheduling</b><span class=\"toggle\"></span></div>\n      </div>\n
    \   </div>\n  </div>\n</section>\n\n<!-- 5. TENANT MODEL -->\n<section>\n  <div
    class=\"wrap\">\n    <div class=\"sec-head reveal\">\n      <span class=\"eyebrow\">How
    it's built to scale</span>\n      <h2>One clinic, one subdomain, isolated by design</h2>\n
    \     <p>Every clinic is its own tenant on its own subdomain, with row-level security
    forced at the database so no clinic can ever see another's data. That's what makes
    both solo and multi-branch honest.</p>\n    </div>\n    <div class=\"id-grid stagger\">\n
    \     <div class=\"id-card\"><span class=\"tag\">Live</span><h3>Subdomain per
