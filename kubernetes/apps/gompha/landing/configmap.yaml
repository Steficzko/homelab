    doctor app UI (light, mirrors the real app) */\n.da{font-family:var(--body-font);color:#17324f;background:#eef2f7;min-height:100%}\n.da-head{position:sticky;top:0;z-index:3;background:#002F6C;color:#fff;padding:30px
