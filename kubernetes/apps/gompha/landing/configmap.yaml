  founders.html: |
    <!DOCTYPE html>
    <html lang="en" class="no-js">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Founders — Gompha</title>
    <meta name="description" content="Who built Gompha — the people behind the dental practice management system.">
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=5">
    <style>
    /* founders — page-local, no other page uses it */
    .founder-grid{display:grid;grid-template-columns:1fr 1fr;gap:26px;max-width:920px;margin:0 auto}
    @media(max-width:760px){.founder-grid{grid-template-columns:1fr}}
    .founder{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:34px;display:flex;flex-direction:column}
    .founder .avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--teal));display:flex;align-items:center;justify-content:center;font-family:var(--heading-font);font-weight:900;color:#fff;font-size:26px;margin-bottom:18px}
    .founder .role{font-family:var(--heading-font);font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal-text)}
    .founder h3{font-size:23px;margin:6px 0 10px}
    .founder p{font-size:15.5px;color:var(--body);margin-bottom:10px}
    .founder .links{margin-top:auto;padding-top:12px}
    .founder .links a{margin-right:16px;font-size:14.5px}
    </style>
    </head>
    <body>

    <header class="hero short">
      <div class="glow g1"></div><div class="glow g2"></div>
      <div class="wrap">
        <div class="logo anim d1" style="color:#fff;margin-bottom:22px">G<span class="socket"></span>mpha</div>
        <h1 class="anim d2">The people behind Gompha</h1>
        <p class="tagline anim d3">Gompha is built by a small team who actually sit in the clinic — a builder who ships the software and a dentist who runs the chair it's shaped around.</p>
      </div>
    </header>

    <section>
      <div class="wrap">
        <div class="founder-grid stagger">
          <div class="founder">
            <div class="avatar">S</div>
            <span class="role">Founder · Builds the product</span>
            <h3>Stefanos Kostikidis</h3>
            <p>Stefanos built the whole of Gompha — the app doctors and reception use every day, and the servers it runs on — and keeps it running. A self-taught engineer with a two-decade background running real, on-the-ground operations, he builds software for real clinics, not a spec sheet.</p>
            <p>His way of working is simple: keep it honest, keep it reliable, and fix the real problem — not the first one that looks easy.</p>
            <div class="links">
              <a href="https://github.com/Steficzko/homelab">Portfolio (public GitOps) →</a>
              <a href="https://kostikidis.net">kostikidis.net</a>
              <a href="mailto:kostikidis.network@gmail.com">Email</a>
            </div>
          </div>
          <div class="founder">
            <div class="avatar">A</div>
            <span class="role">Co-founder · Clinical</span>
            <h3>Dr. Ali Adnan</h3>
            <p>Oral surgeon and co-owner of <strong>Blanca Dental Care</strong> in Erbil — Gompha's pilot clinic. He shapes every clinical decision in the app — the tooth chart, the perio chart, the deal ledger and how the chair actually works day to day.</p>
            <ul style="list-style:none;margin:0 0 4px;color:var(--body);font-size:14.5px">
              <li>▪️ MSc in Oral Surgery — UIC Barcelona</li>
              <li>▪️ EAO-certified in implant dentistry</li>
            </ul>
            <div class="links">
              <a href="https://www.linkedin.com/in/ali-adnan-49469774">LinkedIn →</a>
              <a href="mailto:aliadnan@uic.es">aliadnan@uic.es</a>
            </div>
          </div>
        </div>

        <p style="text-align:center;max-width:640px;margin:44px auto 0;color:var(--body);font-size:16px">
          <strong>Who built it:</strong> Gompha is designed and developed by Stefanos Kostikidis, in close partnership with Dr.&nbsp;Ali Adnan, whose practice is its first home.
        </p>
      </div>
    </section>

    <footer>
      <div class="wrap">
        <div class="base" style="border:none">© 2026 Gompha · Your practice, anchored.</div>
      </div>
    </footer>

    <script src="reveal.js?v=5"></script>
    </body>
    </html>
  heroanim.js: |
    // Hero chart animation. Two live-looking charts share the window:
    //  1) ODONTOGRAM — a wave sweeps L->R then R->L (back and forth), each tooth
    //     flickering through crown/filling/bridge/root-canal/implant/missing, then
    //     settling into a charted mouth.
    //  2) PERIO — after the sweep it FLIPS to the periodontal chart, whose pocket
    //     bars move up and down (deeper/shallower), red where deep.
    // Then it flips back and loops. Honours prefers-reduced-motion (odo, static).
    (function () {
      var svg = document.getElementById('hero-odo');
      if (!svg) return;
      var NS = 'http://www.w3.org/2000/svg';

      /* ---------------- odontogram state ---------------- */
      var C = { crown: '#2b6cb0', implant: '#12a3ba', inlay: '#e0a13c', onlay: '#7b6cc9', bridge: '#2f9e5f' };
      var ENDO = '#d9534f', WHITE = '#ffffff', GREEN = '#1a7f37', BLUE = '#2563eb', GRAY = '#9aa0a6';
      var PAL = [C.crown, C.inlay, C.onlay, C.implant, C.bridge];
      var FINAL = {
        '16': { crown: C.crown, endo: true, dot: GREEN }, '14': { crown: C.inlay, dot: GREEN },
        '11': { crown: C.crown, dot: BLUE }, '21': { crown: C.crown, dot: GRAY },
        '24': { missing: true }, '26': { crown: C.implant, implant: true, dot: GREEN },
        '46': { crown: C.inlay, dot: BLUE }, '47': { endo: true, dot: GREEN },
        '36': { crown: C.onlay, dot: GREEN }, '31': { crown: C.crown, dot: BLUE },
        '34': { crown: C.bridge, dot: GREEN }, '35': { crown: C.bridge, dot: GREEN }
      };
      function apply(g, s) {
        s = s || {};
        var crown = g.querySelector('.crown'), shine = g.querySelector('.shine');
        var screw = g.querySelector('.screw'), thread = g.querySelector('.thread');
        var xm = g.querySelector('.xmark'), dot = g.querySelector('.dot');
        var roots = g.querySelectorAll('.root'), gone = !!(s.implant || s.missing);
        for (var i = 0; i < roots.length; i++) { roots[i].setAttribute('fill', s.endo ? ENDO : WHITE); roots[i].style.display = gone ? 'none' : ''; }
        screw.style.display = s.implant ? '' : 'none'; thread.style.display = s.implant ? '' : 'none';
        crown.style.display = s.missing ? 'none' : ''; crown.setAttribute('fill', s.crown || WHITE);
        shine.style.display = s.crown ? '' : 'none'; xm.style.display = s.missing ? '' : 'none';
        if (s.dot) { dot.setAttribute('fill', s.dot); dot.style.display = ''; } else dot.style.display = 'none';
      }
      var teeth = [].slice.call(svg.querySelectorAll('.tooth'));
      var bridges = [].slice.call(svg.querySelectorAll('.bridge'));
      var byCol = {};
      teeth.forEach(function (g) { (byCol[g.dataset.i] = byCol[g.dataset.i] || []).push(g); });
      function settleAll() { teeth.forEach(function (g) { apply(g, FINAL[g.dataset.fdi]); }); bridges.forEach(function (b) { b.style.display = ''; }); }
      function blankAll() { teeth.forEach(function (g) { apply(g, {}); }); bridges.forEach(function (b) { b.style.display = 'none'; }); }

      /* ---------------- build perio chart (bars that move up/down) ---------------- */
      var GUM = 42, MM = 8.5, X0 = 17, SLOT = 33, MIDGAP = 14;
      var FDI = ['18','17','16','15','14','13','12','11','21','22','23','24','25','26','27','28'];
      var BASE = [3,2,2,3,2,2,2,3,2,3,2,2,3,5,6,4];
      function cx(i) { return X0 + (i + 0.5) * SLOT + (i >= 8 ? MIDGAP : 0); }
      function el(tag, attrs) { var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); return e; }

      var perioSvg = el('svg', { id: 'hero-perio', viewBox: '0 0 568 172', role: 'img',
        'aria-label': 'Periodontal chart: pocket-depth bars per tooth moving up and down, red where deep.' });
      perioSvg.appendChild(el('line', { x1: 16, y1: GUM, x2: 552, y2: GUM, stroke: '#7d8b93', 'stroke-dasharray': '3 3', opacity: '.6' }));
      [3, 6, 9].forEach(function (m) { perioSvg.appendChild(el('line', { x1: 16, y1: GUM + m * MM, x2: 552, y2: GUM + m * MM, stroke: '#d3deea' })); });
      perioSvg.appendChild(el('text', { x: 8, y: GUM - 4, 'font-size': 9, 'font-weight': 700, fill: '#7d8b93', 'font-family': 'Inter,sans-serif' })).textContent = 'gum';
      var bars = [], dots = [];
      FDI.forEach(function (f, i) {
        var r = el('rect', { x: cx(i) - 7, y: GUM, width: 14, height: 0, rx: 3, fill: C.crown });
        perioSvg.appendChild(r); bars.push(r);
        var t = el('text', { x: cx(i), y: 162, 'font-size': 10, 'font-weight': 600, fill: '#7d8b93', 'text-anchor': 'middle', 'font-family': 'Inter,sans-serif' });
        t.textContent = f; perioSvg.appendChild(t);
      });
      var pline = el('polyline', { fill: 'none', stroke: '#0a2a52', 'stroke-width': 1.5, opacity: '.5', points: '' });
      perioSvg.appendChild(pline);
      FDI.forEach(function (f, i) { var d = el('circle', { r: 2.5, fill: C.crown, cx: cx(i), cy: GUM }); perioSvg.appendChild(d); dots.push(d); });

      /* ---------------- wrap both charts + swap legend/title/url ---------------- */
      var body = svg.parentNode;
      var legendOdo = svg.nextElementSibling && svg.nextElementSibling.classList.contains('od-key') ? svg.nextElementSibling : null;
      var odoWrap = document.createElement('div'); odoWrap.className = 'hero-chart';
      body.insertBefore(odoWrap, svg); odoWrap.appendChild(svg); if (legendOdo) odoWrap.appendChild(legendOdo);
      var perioWrap = document.createElement('div'); perioWrap.className = 'hero-chart'; perioWrap.style.display = 'none';
      perioWrap.appendChild(perioSvg);
      var AR = document.documentElement.lang === 'ar';
      var T = AR
        ? { odo: 'مخطط الأسنان ثنائي الطبقة', perio: 'مخطط اللثة',
            leg: '<span><i style="background:#2b6cb0"></i>عمق الجيب</span><span><i style="background:#d9534f"></i>عميق ≥5 مم</span><span><i style="background:#0a2a52"></i>خط اللثة</span>' }
        : { odo: 'Two-layer odontogram', perio: 'Periodontal chart',
            leg: '<span><i style="background:#2b6cb0"></i>pocket depth</span><span><i style="background:#d9534f"></i>deep ≥5&nbsp;mm</span><span><i style="background:#0a2a52"></i>gum-line trend</span>' };
      var legendPerio = document.createElement('div'); legendPerio.className = 'od-key';
      legendPerio.innerHTML = T.leg;
      perioWrap.appendChild(legendPerio); body.appendChild(perioWrap);

      var title = document.getElementById('hero-title');
      var url = document.querySelector('.appwin-url'); // domain path — kept English both langs
      function setMode(m) {
        if (m === 'perio') {
          odoWrap.style.display = 'none'; perioWrap.style.display = '';
          if (title) title.textContent = T.perio;
          if (url) url.textContent = 'demo.gompha.com › patient · perio chart';
        } else {
          perioWrap.style.display = 'none'; odoWrap.style.display = '';
          if (title) title.textContent = T.odo;
          if (url) url.textContent = 'demo.gompha.com › patient · tooth chart';
        }
      }

      // Reduce-motion: don't FREEZE (users kept seeing a dead chart) — run a CALM
      // variant instead: no rapid flicker, teeth just fill in gently and the perio
      // bars drift slowly. Still animated, but nothing jarring/strobing.
      var CALM = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

      /* ---------------- perio motion (bars up & down) ---------------- */
      var perioRAF = null, perioT0 = 0;
      var AMP = CALM ? 0.6 : 1.15, SPD = CALM ? 0.0009 : 0.0016;
      function perioFrame(now) {
        if (!perioT0) perioT0 = now;
        var t = now - perioT0, pts = [];
        for (var i = 0; i < bars.length; i++) {
          var depth = BASE[i] + AMP * Math.sin(t * SPD + i * 0.55);
          if (depth < 1) depth = 1;
          var h = depth * MM, deep = depth >= 5, col = deep ? ENDO : C.crown;
          bars[i].setAttribute('height', h); bars[i].setAttribute('fill', col);
          var cy = GUM + h; dots[i].setAttribute('cy', cy); dots[i].setAttribute('fill', col);
          pts.push(cx(i) + ',' + cy);
        }
        pline.setAttribute('points', pts.join(' '));
        perioRAF = requestAnimationFrame(perioFrame);
      }
      function startPerio() { perioT0 = 0; perioRAF = requestAnimationFrame(perioFrame); }
      function stopPerio() { if (perioRAF) cancelAnimationFrame(perioRAF); perioRAF = null; }

      /* ---------------- odontogram sweep ---------------- */
      var timers = [];
      function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
      function flick(g, fin) {
        if (CALM) { later(function () { apply(g, fin); }, 40); return; } // gentle: straight to final
        var frames = [{ crown: PAL[0] }, { crown: PAL[1], endo: true }, { crown: PAL[2] },
          { crown: C.implant, implant: true }, { missing: true }, { crown: PAL[4] }];
        frames.forEach(function (f, k) { later(function () { apply(g, f); }, k * 90); });
        later(function () { apply(g, fin); }, frames.length * 90);
      }
      var STEP = CALM ? 150 : 120, FLICK = CALM ? 120 : 6 * 90 + 60;
      function pass(order, done) {
        order.forEach(function (col, k) {
          later(function () { (byCol[col] || []).forEach(function (g) { flick(g, FINAL[g.dataset.fdi]); }); }, k * STEP);
        });
        later(function () { bridges.forEach(function (b) { b.style.display = ''; }); done && done(); }, order.length * STEP + FLICK);
      }
      var FWD = [], REV = [];
      for (var c = 0; c < 16; c++) { FWD.push(c); REV.push(15 - c); }

      var PERIO_MS = 5200, PAUSE = 900;
      function cycle() {
        setMode('odo'); blankAll();
        pass(FWD, function () {                        // sweep left -> right
          later(function () {
            pass(REV, function () {                    // sweep right -> left (back)
              later(function () {                      // flip to perio
                setMode('perio'); startPerio();
                later(function () { stopPerio(); cycle(); }, PERIO_MS); // flip back & loop
              }, PAUSE);
            });
          }, 500);
        });
      }

      var started = false;
      function start() { if (started) return; started = true; cycle(); }
      if ('IntersectionObserver' in window) {
        var io = new IntersectionObserver(function (e) { e.forEach(function (x) { if (x.isIntersecting) { io.disconnect(); start(); } }); }, { threshold: 0.1 });
        io.observe(svg);
      }
      setTimeout(start, 800); // guaranteed start (hero is above the fold)
    })();
  index.ar.html: "<!DOCTYPE html>\n<html lang=\"ar\" dir=\"rtl\" class=\"no-js\">\n<head>\n<meta
    charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<meta
    name=\"robots\" content=\"noindex\">\n<title>جومفا — عيادتك، راسخة.</title>\n<meta
    name=\"description\" content=\"جومفا هو نظام إدارة عيادات الأسنان الذي يجمع مخطط
    الأسنان والمواعيد والحالات وسجل الاتفاقات في سجل واحد — مصمَّم للعيادات التي تتفاوض
    على الأسعار.\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link
    rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap\"
    rel=\"stylesheet\">\n<link rel=\"stylesheet\" href=\"style.css?v=5\">\n</head>\n<body>\n\n<nav>\n
    \ <div class=\"wrap nav-in\">\n    <div class=\"logo\"><a href=\"index.ar.html\">G<span
    class=\"socket\"></span>mpha</a></div>\n    <div class=\"nav-links\">\n      <a
    href=\"index.ar.html#capabilities\">المزايا</a>\n      <a href=\"roadmap.html\">خارطة
    الطريق</a>\n      <a href=\"scale.html\">التوسّع والملكية</a>\n      <a href=\"safety.html\">أمان
    البيانات</a>\n      <a href=\"index.ar.html#demos\">تجارب حيّة</a>\n      <a href=\"index.html\"
    class=\"langtoggle\">EN</a>\n      <a href=\"mailto:hello@gompha.com\" class=\"btn
    btn-primary\" style=\"padding:10px 20px\">تواصل معنا</a>\n    </div>\n  </div>\n</nav>\n\n<!--
    HERO -->\n<header class=\"hero\">\n  <div class=\"glow g1\"></div><div class=\"glow
    g2\"></div>\n  <div class=\"wrap hero-grid\">\n    <div class=\"hero-copy\">\n
    \     <span class=\"pill anim d1\">\U0001F9B7 <span>النسخة <b>v0.27.0</b> قيد
    التشغيل — في عيادة حقيقية بأربيل</span></span>\n      <h1 class=\"anim d2\">عيادتك،
    راسخة.</h1>\n      <p class=\"tagline anim d3\">يجمع جومفا مخطط أسنانك، ومواعيدك،
    وكل حالة، وكل اتفاق سعر في سجل واحد — ويتذكّر من وافق على السعر ولماذا. لا شيء
    يضيع، ولا شيء يُنسى.</p>\n      <div class=\"cta-row anim d4\">\n        <a href=\"index.ar.html#demos\"
    class=\"btn btn-primary\">جرّب تجربة حيّة</a>\n        <a href=\"roadmap.html\"
    class=\"btn btn-ghost\">← اطّلع على خارطة الطريق</a>\n      </div>\n      <p class=\"trust
    anim d4\">مصمَّم لأسواق النقد والمساومة — حيث السعر حوار، لا قائمة ثابتة.</p>\n
    \   </div>\n    <div class=\"appwin anim d3\">\n      <div class=\"appwin-bar\"><span
    class=\"td r\"></span><span class=\"td y\"></span><span class=\"td g\"></span><span
    class=\"appwin-url\" dir=\"ltr\">demo.gompha.com › patient · tooth chart</span></div>\n
    \     <div class=\"appwin-body\">\n        <div class=\"appwin-cap\"><span id=\"hero-title\">مخطط
    الأسنان ثنائي الطبقة</span> <span class=\"pin\">شاشة حيّة</span></div>\n        <svg
    id=\"hero-odo\" viewBox=\"0 0 568 172\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"
    aria-label=\"Animated tooth chart building itself: each tooth cycles through crowns,
    fillings, bridges, root canals, implants and missing teeth, then settles.\"><line
    x1=\"16\" y1=\"83\" x2=\"552\" y2=\"83\" stroke=\"#d3deea\"/><text x=\"6\" y=\"87\"
    font-size=\"10\" font-weight=\"700\" fill=\"#7d8b93\" font-family=\"Inter,sans-serif\">R</text><text
    x=\"562\" y=\"87\" font-size=\"10\" font-weight=\"700\" fill=\"#7d8b93\" text-anchor=\"end\"
    font-family=\"Inter,sans-serif\">L</text><g class=\"tooth\" data-fdi=\"18\" data-i=\"0\"><g
    transform=\"translate(33.5 70) scale(0.75 -0.75) translate(-20 0)\"><path class=\"root\"
    d=\"M17 30 Q16 50 20 55 Q24 50 23 30 Z\" fill=\"#ffffff\" stroke=\"#7d8b93\" stroke-width=\"1.3\"/><path
    class=\"root\" d=\"M9 30 Q7 56 11 63 Q15 56 15 30 Z\" fill=\"#ffffff\" stroke=\"#7d8b93\"
    stroke-width=\"1.3\"/><path class=\"root\" d=\"M25 30 Q25 56 29 63 Q33 56 31 30
    Z\" fill=\"#ffffff\" stroke=\"#7d8b93\" stroke-width=\"1.3\"/><path class=\"screw\"
    d=\"M15 30 h10 v24 l-5 8 l-5 -8 Z\" fill=\"#5b7185\" style=\"display:none\"/><path
    class=\"thread\" d=\"M15 35 h10 M15 40 h10 M15 45 h10 M15 50 h10\" fill=\"none\"
    stroke=\"#fff\" stroke-width=\"1.4\" style=\"display:none\"/><path class=\"crown\"
    d=\"M6 30 L6 16 Q6 11 11 11 L15 14 L20 11 L25 14 L29 11 Q34 11 34 16 L34 30 Z\"
    fill=\"#ffffff\" stroke=\"#7d8b93\" stroke-width=\"1.3\"/><path class=\"shine\"
    d=\"M9 12 Q20 8 31 12\" fill=\"none\" stroke=\"rgba(255,255,255,.55)\" stroke-width=\"1\"
    style=\"display:none\"/><path class=\"xmark\" d=\"M7 8 L33 60 M33 8 L7 60\" fill=\"none\"
    stroke=\"#9aa6ad\" stroke-width=\"2\" stroke-linecap=\"round\" style=\"display:none\"/></g><circle
    class=\"dot\" cx=\"33.5\" cy=\"56.5\" r=\"3.6\" fill=\"#1a7f37\" stroke=\"#fff\"
    stroke-width=\"1\" style=\"display:none\"/><text x=\"33.5\" y=\"10\" font-size=\"10\"
    font-weight=\"600\" fill=\"#7d8b93\" text-anchor=\"middle\" font-family=\"Inter,sans-serif\">18</text></g><g
    class=\"tooth\" data-fdi=\"17\" data-i=\"1\"><g transform=\"translate(66.5 70)
    scale(0.75 -0.75) translate(-20 0)\"><path class=\"root\" d=\"M17 30 Q16 50 20
    55 Q24 50 23 30 Z\" fill=\"#ffffff\" stroke=\"#7d8b93\" stroke-width=\"1.3\"/><path
    class=\"root\" d=\"M9 30 Q7 56 11 63 Q15 56 15 30 Z\" fill=\"#ffffff\" stroke=\"#7d8b93\"
    stroke-width=\"1.3\"/><path class=\"root\" d=\"M25 30 Q25 56 29 63 Q33 56 31 30
    Z\" fill=\"#ffffff\" stroke=\"#7d8b93\" stroke-width=\"1.3\"/><path class=\"screw\"
    d=\"M15 30 h10 v24 l-5 8 l-5 -8 Z\" fill=\"#5b7185\" style=\"display:none\"/><path
    class=\"thread\" d=\"M15 35 h10 M15 40 h10 M15 45 h10 M15 50 h10\" fill=\"none\"
    stroke=\"#fff\" stroke-width=\"1.4\" style=\"display:none\"/><path class=\"crown\"
    d=\"M6 30 L6 16 Q6 11 11 11 L15 14 L20 11 L25 14 L29 11 Q34 11 34 16 L34 30 Z\"
    fill=\"#ffffff\" stroke=\"#7d8b93\" stroke-width=\"1.3\"/><path class=\"shine\"
    d=\"M9 12 Q20 8 31 12\" fill=\"none\" stroke=\"rgba(255,255,255,.55)\" stroke-width=\"1\"
    style=\"display:none\"/><path class=\"xmark\" d=\"M7 8 L33 60 M33 8 L7 60\" fill=\"none\"
    stroke=\"#9aa6ad\" stroke-width=\"2\" stroke-linecap=\"round\" style=\"display:none\"/></g><circle
    class=\"dot\" cx=\"66.5\" cy=\"56.5\" r=\"3.6\" fill=\"#1a7f37\" stroke=\"#fff\"
    stroke-width=\"1\" style=\"display:none\"/><text x=\"66.5\" y=\"10\" font-size=\"10\"
    font-weight=\"600\" fill=\"#7d8b93\" text-anchor=\"middle\" font-family=\"Inter,sans-serif\">17</text></g><g
