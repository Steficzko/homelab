    reveal\">\n      <div class=\"txt\">\n        <span class=\"ship\">Solo Mode —
    Live</span>\n        <h3>Solo: you are the whole clinic</h3>\n        <p>One login,
    one chair. No role pickers, no per-doctor splits, no reception desk. Money collapses
    to a plain <em>in / out / drawer</em>. The chart, the deals and the schedule —
    nothing else in the way.</p>\n        <p>The multi-doctor engine runs a real four-doctor
    clinic; Solo Mode folds it away for a one-person practice. It's <strong>live now</strong>
    — walk through it at the <a href=\"https://demosolo.gompha.com\">solo demo</a>.</p>\n
    \     </div>\n      <div class=\"panel\">\n        <div class=\"prow\"><b>Reception
    desk</b><span class=\"toggle off\"></span></div>\n        <div class=\"prow\"><b>Multiple
    doctors</b><span class=\"toggle off\"></span></div>\n        <div class=\"prow\"><b>Per-doctor
    P&amp;L splits</b><span class=\"toggle off\"></span></div>\n        <div class=\"prow\"><b>Tooth
    chart &amp; deals</b><span class=\"toggle\"></span></div>\n        <div class=\"prow\"><b>Money:
    in / out / drawer</b><span class=\"toggle\"></span></div>\n      </div>\n    </div>\n
    \   <div class=\"split rev reveal\">\n      <div class=\"txt\">\n        <span
    class=\"ship\">Multi-doctor — Live</span>\n        <h3>Clinic: doctors, reception,
    rooms</h3>\n        <p>Add doctors and a front desk and the full machinery appears:
    room-grid scheduling, shared-room partitioning, per-doctor catalogs and income
    attribution, and the money-privacy walls that keep each doctor's numbers their
    own.</p>\n        <p>Upscaling from solo to a clinic is a deliberate one-time
    step — ownership and income are reconciled cleanly, not silently flipped. Downscaling
    never deletes: modules soft-disable so the history and audit trail stay intact.</p>\n
    \     </div>\n      <div class=\"panel\">\n        <div class=\"prow\"><b>Reception
    desk</b><span class=\"toggle\"></span></div>\n        <div class=\"prow\"><b>Multiple
    doctors</b><span class=\"toggle\"></span></div>\n        <div class=\"prow\"><b>Rooms
    &amp; shared-room scheduling</b><span class=\"toggle\"></span></div>\n        <div
    class=\"prow\"><b>Per-doctor P&amp;L splits</b><span class=\"toggle\"></span></div>\n
    \       <div class=\"prow\"><b>Walled maintenance role</b><span class=\"toggle\"></span></div>\n
    \     </div>\n    </div>\n  </div>\n</section>\n\n<!-- 2. NEVER HOSTAGE -->\n<section
    style=\"background:var(--bg-alt)\">\n  <div class=\"wrap\">\n    <div class=\"sec-head
    reveal\">\n      <span class=\"eyebrow\">Your data, your data</span>\n      <h2>Your
    records are never held hostage</h2>\n      <p>Software should never be a hostage
    negotiation. Reads always work, and full clinic export &amp; import are live today.</p>\n
    \   </div>\n    <div class=\"feat-grid stagger\">\n      <div class=\"feat\"><span
    class=\"ico\">\U0001F513</span><h3>Reads always work <span class=\"ship\">Live</span></h3><p>Stop
    paying and writing pauses — but you can always <em>read</em> your whole clinic.
    Even a suspended or expired account keeps full read access to every record. No
    one locks you out of your own history.</p></div>\n      <div class=\"feat\"><span
    class=\"ico\">\U0001F4E4</span><h3>Self-serve export <span class=\"ship\">Live</span></h3><p>Download
    your entire clinic as a portable bundle — structured data plus human-readable
    CSVs — on your own, whenever you want. Works even in read-only mode.</p></div>\n
    \     <div class=\"feat\"><span class=\"ico\">\U0001F4E5</span><h3>Clean import
    <span class=\"ship\">Live</span></h3><p>Bring that bundle into a fresh Gompha
    tenant with every reference remapped correctly. Money travels verbatim and is
    never re-valued; secrets are scrubbed on the way out.</p></div>\n    </div>\n
    \ </div>\n</section>\n\n<!-- 3. LEAVE A PRACTICE -->\n<section>\n  <div class=\"wrap\">\n
    \   <div class=\"split reveal\">\n      <div class=\"txt\">\n        <span class=\"ship\">Whole-clinic:
    Live · doctor-slice: Planned</span>\n        <h3>Leave a practice — take your
    data</h3>\n        <p>Taking a <em>whole clinic</em> to a new tenant works today.
    Taking a single doctor's slice — their patients, their charts, their history —
    is the next step, so a doctor who moves on doesn't walk away empty-handed.</p>\n
    \       <p>Gompha's portability works on two axes: <b>scope</b> — the whole clinic
    or a single doctor's slice; and <b>category</b> — clinical only, or clinical plus
    the money. You choose what leaves.</p>\n        <p>And it's <b>consented</b>:
    an employed doctor exporting their own slice is off by default until the clinic
    owner grants it — scoped, expiring and audited. It reconciles \"his data, his
    clients\" with the clinic's right to control who walks out with what.</p>\n      </div>\n
    \     <div class=\"panel\">\n        <div class=\"prow\"><b>Whole clinic</b><span
    style=\"color:var(--teal-text);font-weight:800\">or a single doctor</span></div>\n
