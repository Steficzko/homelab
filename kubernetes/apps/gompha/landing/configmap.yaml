    UI',Roboto,sans-serif;\n  --body-font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;\n}\n@media
    (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    --ink:#f2f7ff;
