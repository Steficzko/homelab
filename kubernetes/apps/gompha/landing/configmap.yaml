    \     <a href=\"index.html#contact\" class=\"btn btn-primary\" style=\"padding:10px
    20px\">Join the waitlist</a>\n    </div>\n  </div>\n</nav>\n\n<header class=\"hero
    short\">\n  <div class=\"glow g1\"></div><div class=\"glow g2\"></div>\n  <div
    class=\"wrap\">\n    <span class=\"pill anim d1\">\U0001F512 <span>Your clinic's
    data, kept yours</span></span>\n    <h1 class=\"anim d2\">Data safety</h1>\n    <p
    class=\"tagline anim d3\">Patient records are the most sensitive thing a clinic
    holds. Gompha is built so your data is isolated from every other clinic, backed
    up, walled off by role, and never held hostage — here's exactly how.</p>\n  </div>\n</header>\n\n<!--
    CORE GUARANTEES -->\n<section>\n  <div class=\"wrap\">\n    <div class=\"sec-head
    reveal\">\n      <span class=\"eyebrow\">The foundations</span>\n      <h2>Four
    things we don't compromise on</h2>\n      <p>These are live in the software today
    — not a policy page, but how it's actually built.</p>\n    </div>\n    <div class=\"feat-grid
    stagger\">\n      <div class=\"feat\"><span class=\"ico\">\U0001F9F1</span><h3>Hard
    tenant isolation <span class=\"ship\">Live</span></h3><p>Every clinic is its own
    tenant on its own subdomain, with row-level security forced at the database itself.
    A clinic literally cannot query another clinic's records — it's enforced below
    the app, not just inside it.</p></div>\n      <div class=\"feat\"><span class=\"ico\">\U0001F5C4️</span><h3>Encrypted
    backups <span class=\"ship\">Live</span></h3><p>Your data is backed up every hour,
    encrypted with a modern age key before it ever leaves the server, and stored off
    the main box. A bad day doesn't mean a lost clinic.</p></div>\n      <div class=\"feat\"><span
    class=\"ico\">\U0001F6AA</span><h3>Walled access by role <span class=\"ship\">Live</span></h3><p>People
    only see what their job needs. Maintenance configures the software with <em>zero</em>
    access to any patient data; reception can take money but never see clinic totals;
    each doctor's earnings stay their own.</p></div>\n      <div class=\"feat\"><span
    class=\"ico\">\U0001F4F1</span><h3>Session &amp; device control <span class=\"ship\">Live</span></h3><p>Sessions
    time out by role, every device is recorded, and a \"Your devices\" panel lets
    you sign a lost or stolen phone out from anywhere — instantly.</p></div>\n    </div>\n
    \ </div>\n</section>\n\n<!-- NO HOSTAGE -->\n<section style=\"background:var(--bg-alt)\">\n
    \ <div class=\"wrap\">\n    <div class=\"spot reveal\">\n      <div>\n        <span
    class=\"moat\">The promise</span>\n        <h2>Your data is never held hostage</h2>\n
    \       <p>If you ever stop paying, writing pauses — but you can always <em>read</em>
    your entire clinic. Even a suspended or expired account keeps full read access
    to every record. No one locks you out of your own history to force a renewal.</p>\n
    \       <p>And you'll be able to take it with you: self-serve export of your whole
    clinic, and clean import into a new tenant, are on the way — <span class=\"ship
    soon\">Planned</span>. Full story on <a href=\"scale.html\">Scaling &amp; ownership</a>.</p>\n
    \       <a href=\"index.html#contact\" class=\"btn btn-gold\">Ask us anything
    about it</a>\n      </div>\n      <div class=\"sheet\">\n        <div class=\"row\"><span
    class=\"k\">Read your records</span><span class=\"agreed\">Always — even if unpaid</span></div>\n
    \       <div class=\"row\"><span class=\"k\">Backups</span><span class=\"v\">Hourly
    · encrypted · off-box</span></div>\n        <div class=\"row\"><span class=\"k\">Clinic
    isolation</span><span class=\"v\">Row-level, database-enforced</span></div>\n
    \       <div class=\"row\"><span class=\"k\">Export your data</span><span class=\"v\">Planned
    — self-serve</span></div>\n        <div class=\"row\"><span class=\"k\">Passwords
    / secrets</span><span class=\"v\">Hashed · never exported</span></div>\n      </div>\n
    \   </div>\n  </div>\n</section>\n\n<!-- HOW MONEY & RECORDS ARE PROTECTED -->\n<section>\n
    \ <div class=\"wrap\">\n    <div class=\"sec-head reveal\">\n      <span class=\"eyebrow\">Under
    the hood</span>\n      <h2>Records that can't quietly change on you</h2>\n      <p>Trust
    in a clinic system comes from knowing the history is honest and the boundaries
    hold.</p>\n    </div>\n    <div class=\"id-grid stagger\">\n      <div class=\"id-card\"><span
    class=\"tag\">Live</span><h3>Append-only money</h3><p>Payments aren't edited or
    deleted — they're voided, leaving a trail. Balances are derived, so the ledger
    can't silently drift.</p></div>\n      <div class=\"id-card\"><span class=\"tag\">Live</span><h3>Money-privacy
    walls</h3><p>Who can see totals, costs and earnings is enforced per role — a receptionist
    posts a payment without ever seeing the clinic's numbers.</p></div>\n      <div
    class=\"id-card\"><span class=\"tag\">Live</span><h3>Consent to share</h3><p>Patients
    belong to a doctor; another doctor gets access only through a request the owner
    approves — scoped and audited, not open by default.</p></div>\n      <div class=\"id-card\"><span
    class=\"tag\">Building</span><h3>Who-did-what audit</h3><p>A per-staff activity
    log — who booked, who took each payment — so accountability is on the record,
    not on memory.</p></div>\n    </div>\n    <p class=\"indicative\" style=\"max-width:680px;margin:40px
    auto 0\">Gompha is built for a cash, real-world market — we focus on concrete
    safety (isolation, encryption, backups, walled access), not compliance paperwork.
    Have a specific security question for your clinic? <a href=\"index.html#contact\">Just
    ask.</a></p>\n  </div>\n</section>\n\n<!-- CTA STRIP -->\n<section class=\"strip\">\n
    \ <div class=\"wrap reveal\">\n    <h2>Safe enough to trust with your whole clinic</h2>\n
