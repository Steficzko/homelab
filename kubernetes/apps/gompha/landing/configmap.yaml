    auto;padding:0 24px}\n.narrow{max-width:820px}\n.btn{display:inline-block;padding:15px
    28px;border-radius:12px;font-family:var(--heading-font);font-weight:800;font-size:15px;cursor:pointer;border:none;transition:transform
    .16s ease,box-shadow .16s ease,background .16s ease}\n.btn:hover{transform:translateY(-3px)}\n.btn-primary{background:var(--teal);color:#022b26;box-shadow:0
