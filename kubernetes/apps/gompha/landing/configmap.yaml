    \ --bg:#06142b; --bg-alt:#0b2038; --card:#0f2340; --line:#274a74;\n}\n*{box-sizing:border-box;margin:0;padding:0}\nhtml{scroll-behavior:smooth}\n\n/*
    ---- Arabic / RTL ---- */\nhtml[dir=\"rtl\"]{--heading-font:'Cairo',system-ui,-apple-system,'Segoe
