    *{letter-spacing:normal !important}\n[dir=\"rtl\"] h1,[dir=\"rtl\"] h2,[dir=\"rtl\"]
    h3,[dir=\"rtl\"] h4{line-height:1.3}\n[dir=\"rtl\"] .eyebrow,[dir=\"rtl\"] .ship,[dir=\"rtl\"]
    .badge,[dir=\"rtl\"] .kind,[dir=\"rtl\"] .pin,[dir=\"rtl\"] .moat,[dir=\"rtl\"]
    .tag{text-transform:none}\n[dir=\"rtl\"] .appwin-url{direction:ltr}\n.langtoggle{font-family:var(--heading-font);font-weight:800;font-size:14px;color:var(--teal-text);border:1.5px
    solid var(--line);border-radius:8px;padding:6px 11px}\n.langtoggle:hover{border-color:var(--teal)}\nbody{font-family:var(--body-font);color:var(--body);background:var(--bg);line-height:1.65;-webkit-font-smoothing:antialiased;font-size:16.5px;overflow-x:hidden}\n/*
