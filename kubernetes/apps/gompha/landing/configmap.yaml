    \   </div>\n  </div>\n</header>\n\n<!-- 1. SOLO → MANY -->\n<section>\n  <div
    class=\"wrap\">\n    <div class=\"sec-head reveal\">\n      <span class=\"eyebrow\">Up
    and down</span>\n      <h2>One chair or ten — the same account grows with you</h2>\n
    \     <p>You don't pick a \"size\" and get boxed in. Solo mode hides the multi-user
    machinery; the day you hire, you switch it on.</p>\n    </div>\n    <div class=\"split
    reveal\">\n      <div class=\"txt\">\n        <span class=\"ship soon\">Solo mode
    — Planned</span>\n        <h3>Solo: you are the whole clinic</h3>\n        <p>One
    login, one chair. No role pickers, no per-doctor splits, no reception desk. Money
    collapses to a plain <em>in / out / drawer</em>. The chart, the deals and the
    schedule — nothing else in the way.</p>\n        <p>The multi-doctor engine is
    already live in a real four-doctor clinic today. Solo mode is the setting that
    folds it away for a one-person practice — it's on the <a href=\"roadmap.html\">build
    list now</a>, and it powers the upcoming solo demo.</p>\n      </div>\n      <div
    class=\"panel\">\n        <div class=\"prow\"><b>Reception desk</b><span class=\"toggle
    off\"></span></div>\n        <div class=\"prow\"><b>Multiple doctors</b><span
    class=\"toggle off\"></span></div>\n        <div class=\"prow\"><b>Per-doctor
    P&amp;L splits</b><span class=\"toggle off\"></span></div>\n        <div class=\"prow\"><b>Tooth
    chart &amp; deals</b><span class=\"toggle\"></span></div>\n        <div class=\"prow\"><b>Money:
    in / out / drawer</b><span class=\"toggle\"></span></div>\n      </div>\n    </div>\n
    \   <div class=\"split rev reveal\">\n      <div class=\"txt\">\n        <span
    class=\"ship\">Multi-doctor — Live</span>\n        <h3>Clinic: doctors, reception,
    rooms</h3>\n        <p>Add doctors and a front desk and the full machinery appears:
    room-grid scheduling, shared-room partitioning, per-doctor catalogs and income
    attribution, and the money-privacy walls that keep each doctor's numbers their
    own.</p>\n        <p>Upscaling from solo to a clinic is a deliberate one-time
    step — ownership and income are reconciled cleanly, not silently flipped. Downscaling
    never deletes: modules soft-disable so the history and audit trail stay intact.</p>\n
    \     </div>\n      <div class=\"panel\">\n        <div class=\"prow\"><b>Reception
    desk</b><span class=\"toggle\"></span></div>\n        <div class=\"prow\"><b>Multiple
    doctors</b><span class=\"toggle\"></span></div>\n        <div class=\"prow\"><b>Rooms
    &amp; shared-room scheduling</b><span class=\"toggle\"></span></div>\n        <div
    class=\"prow\"><b>Per-doctor P&amp;L splits</b><span class=\"toggle\"></span></div>\n
    \       <div class=\"prow\"><b>Walled maintenance role</b><span class=\"toggle\"></span></div>\n
    \     </div>\n    </div>\n  </div>\n</section>\n\n<!-- 2. NEVER HOSTAGE -->\n<section
    style=\"background:var(--bg-alt)\">\n  <div class=\"wrap\">\n    <div class=\"sec-head
    reveal\">\n      <span class=\"eyebrow\">Your data, your data</span>\n      <h2>Your
    records are never held hostage</h2>\n      <p>Software should never be a hostage
    negotiation. Two rules — one already live, one on the way.</p>\n    </div>\n    <div
    class=\"feat-grid stagger\">\n      <div class=\"feat\"><span class=\"ico\">\U0001F513</span><h3>Reads
    always work <span class=\"ship\">Live</span></h3><p>Stop paying and writing pauses
    — but you can always <em>read</em> your whole clinic. Even a suspended or expired
    account keeps full read access to every record. No one locks you out of your own
    history.</p></div>\n      <div class=\"feat\"><span class=\"ico\">\U0001F4E4</span><h3>Self-serve
    export <span class=\"ship soon\">Planned</span></h3><p>Download your entire clinic
    as a portable bundle — structured data plus human-readable CSVs — on your own,
    whenever you want. Works even in read-only mode.</p></div>\n      <div class=\"feat\"><span
    class=\"ico\">\U0001F4E5</span><h3>Clean import <span class=\"ship soon\">Planned</span></h3><p>Bring
    that bundle into a fresh Gompha tenant with every reference remapped correctly.
    Money travels verbatim and is never re-valued; secrets are scrubbed on the way
    out.</p></div>\n    </div>\n  </div>\n</section>\n\n<!-- 3. LEAVE A PRACTICE -->\n<section>\n
    \ <div class=\"wrap\">\n    <div class=\"split reveal\">\n      <div class=\"txt\">\n
    \       <span class=\"ship soon\">Planned</span>\n        <h3>Leave a practice
    — take your data</h3>\n        <p>A doctor's patients are the doctor's relationships.
    When someone moves on, they should be able to take their slice — their patients,
    their charts, their history — not walk away empty-handed.</p>\n        <p>Gompha's
    portability works on two axes: <b>scope</b> — the whole clinic or a single doctor's
    slice; and <b>category</b> — clinical only, or clinical plus the money. You choose
    what leaves.</p>\n        <p>And it's <b>consented</b>: an employed doctor exporting
    their own slice is off by default until the clinic owner grants it — scoped, expiring
    and audited. It reconciles \"his data, his clients\" with the clinic's right to
    control who walks out with what.</p>\n      </div>\n      <div class=\"panel\">\n
    \       <div class=\"prow\"><b>Whole clinic</b><span style=\"color:var(--teal-text);font-weight:800\">or
    a single doctor</span></div>\n        <div class=\"prow\"><b>Clinical records</b><span
    style=\"color:var(--teal-text);font-weight:800\">✓ always</span></div>\n        <div
    class=\"prow\"><b>Financials</b><span style=\"color:var(--body)\">opt in</span></div>\n
    \       <div class=\"prow\"><b>Passwords &amp; secrets</b><span style=\"color:#adbccf\">✕
    scrubbed</span></div>\n        <div class=\"prow\"><b>Owner consent</b><span style=\"color:var(--gold);font-weight:800\">required</span></div>\n
    \     </div>\n    </div>\n  </div>\n</section>\n\n<!-- 4. MODULES ON/OFF -->\n<section
    style=\"background:var(--bg-alt)\">\n  <div class=\"wrap\">\n    <div class=\"sec-head
    reveal\">\n      <span class=\"eyebrow\">Only what you use</span>\n      <h2>Turn
    reception, financials and stock on or off</h2>\n      <p>Not every clinic wants
    every module. A solo dentist doesn't need a reception view; a doctor who doesn't
    touch stock shouldn't see it.</p>\n    </div>\n    <div class=\"split reveal\">\n
    \     <div class=\"txt\">\n        <h3>Shaped to the clinic, two ways</h3>\n        <p><b>Today,
    by role <span class=\"ship\">Live</span></b> — interfaces are already shaped per
    person: maintenance is walled off from all patient data, reception can post money
    but never see clinic totals, doctors get a clinical mobile view with no admin
    clutter.</p>\n        <p><b>Next, by setting <span class=\"ship soon\">Planned</span></b>
    — a per-clinic switch turns whole modules on or off: no reception desk, collapse
    the financials, hide per-doctor costs. Visibility only — it stays simple, never
    a tangle of per-button permissions.</p>\n      </div>\n      <div class=\"panel\">\n
    \       <div class=\"prow\"><b>Reception desk</b><span class=\"toggle\"></span></div>\n
    \       <div class=\"prow\"><b>Financials &amp; P&amp;L</b><span class=\"toggle\"></span></div>\n
    \       <div class=\"prow\"><b>Stock / inventory</b><span class=\"toggle off\"></span></div>\n
    \       <div class=\"prow\"><b>Per-doctor cost floors</b><span class=\"toggle
    off\"></span></div>\n        <div class=\"prow\"><b>Tooth chart &amp; scheduling</b><span
    class=\"toggle\"></span></div>\n      </div>\n    </div>\n  </div>\n</section>\n\n<!--
    5. TENANT MODEL -->\n<section>\n  <div class=\"wrap\">\n    <div class=\"sec-head
    reveal\">\n      <span class=\"eyebrow\">How it's built to scale</span>\n      <h2>One
    clinic, one subdomain, isolated by design</h2>\n      <p>Every clinic is its own
    tenant on its own subdomain, with row-level security forced at the database so
    no clinic can ever see another's data. That's what makes both solo and multi-branch
    honest.</p>\n    </div>\n    <div class=\"id-grid stagger\">\n      <div class=\"id-card\"><span
    class=\"tag\">Live</span><h3>Subdomain per clinic</h3><p>yourclinic.gompha.com
    — your own space, your own data, hard-isolated from every other tenant.</p></div>\n
    \     <div class=\"id-card\"><span class=\"tag\">Live</span><h3>Row-level security</h3><p>Isolation
    enforced in the database itself, not just the app — a clinic literally cannot
    query another's records.</p></div>\n      <div class=\"id-card\"><span class=\"tag\">Planned</span><h3>White-label</h3><p>Your
    brand, colors and domain on top of the same engine — an upgrade, not a rebuild.</p></div>\n
    \     <div class=\"id-card\"><span class=\"tag\">Planned</span><h3>Multi-branch
    chains</h3><p>Two or more locations under one operator, priced per branch. Rare
    today, real as clinics grow.</p></div>\n    </div>\n  </div>\n</section>\n\n<!--
    CTA STRIP -->\n<section class=\"strip\">\n  <div class=\"wrap reveal\">\n    <h2>Try
    the size that fits you</h2>\n    <p>Walk through the multi-doctor clinic today.
    The single-doctor demo goes live with solo mode.</p>\n    <div class=\"cta-row\">\n
