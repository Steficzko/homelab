    ANCHOR THESIS -->\n<section id=\"thesis\">\n  <div class=\"wrap\">\n    <div class=\"sec-head
    reveal\">\n      <span class=\"eyebrow\">الاسم</span>\n      <h2>الغومفوزس — المفصل
    الذي يثبّت كل سِنّ</h2>\n      <p>في علم التشريح، «الغومفوزس» هو الرباط الذي يثبّت
    كل سِنّ بإحكام في الفك — السبب في أن السِّنّ السليم لا يتحرك. جومفا يفعل الشيء
    نفسه لعيادتك: يثبّت الأشياء الأربعة التي عادةً ما تضيع في سجل واحد.</p>\n    </div>\n
