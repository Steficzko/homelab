    span{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;color:var(--body)}\n.dot{width:12px;height:12px;border-radius:50%;display:inline-block}\n.dot.done{background:var(--teal)}\n.dot.build{background:var(--gold)}\n.dot.plan{background:transparent;border:2px
    solid var(--teal-text)}\n.phase{margin:0 auto 48px;max-width:900px}\n.phase>h2{display:flex;align-items:center;gap:12px;font-size:26px;margin-bottom:6px}\n.phase>p.lede{color:var(--body);font-size:16px;margin-bottom:22px;padding-left:28px}\n.phase
    .badge{font-family:var(--heading-font);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:5px
    11px;border-radius:6px}\n.badge.done{background:var(--teal);color:#022b26}\n.badge.build{background:var(--gold-bright);color:#3a2600}\n.badge.plan{background:transparent;color:var(--teal-text);border:1.5px
    solid var(--teal-text)}\n.tl{list-style:none;border-left:2px solid var(--line);margin-left:6px;padding-left:0}\n.tl
    li{position:relative;padding:0 0 26px 30px}\n.tl li:before{content:\"\";position:absolute;left:-7px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--line)}\n.tl
    li.done:before{background:var(--teal)}\n.tl li.build:before{background:var(--gold)}\n.tl
    li.plan:before{background:var(--bg);border:2px solid var(--teal-text);left:-8px}\n.tl
    li .ver{font-family:var(--heading-font);font-weight:800;color:var(--ink);font-size:15px}\n.tl
    li h4{font-size:16.5px;margin:2px 0 4px;color:var(--ink)}\n.tl li p{font-size:14.5px;color:var(--body)}\n\n/*
    Split feature rows (scale page) */\n.split{display:grid;grid-template-columns:1fr
    1fr;gap:44px;align-items:center;margin:0 auto 30px}\n.split.rev .txt{order:2}\n@media(max-width:820px){.split{grid-template-columns:1fr;gap:24px}.split.rev
    .txt{order:0}}\n.split .txt h3{font-size:24px;margin:8px 0 12px}\n.split .txt
    p{font-size:16px;margin-bottom:12px}\n.panel{background:var(--card);border:1px
    solid var(--line);border-radius:18px;padding:26px;box-shadow:0 20px 46px -26px
    rgba(3,32,58,.4)}\n.panel .prow{display:flex;justify-content:space-between;align-items:center;padding:12px
    0;border-bottom:1px solid var(--line);font-size:15px;color:var(--body)}\n.panel
    .prow:last-child{border-bottom:none}\n.panel .prow b{color:var(--ink);font-family:var(--heading-font)}\n.toggle{width:40px;height:22px;border-radius:999px;background:var(--teal);position:relative;flex:none}\n.toggle.off{background:var(--line)}\n.toggle:after{content:\"\";position:absolute;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0
    1px 3px rgba(0,0,0,.3);right:2px}\n.toggle.off:after{right:auto;left:2px}\n\n/*
    Pricing */\n.price-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;align-items:stretch}\n@media(max-width:820px){.price-grid{grid-template-columns:1fr}}\n.plan{background:var(--card);border:1px
    solid var(--line);border-radius:20px;padding:34px;display:flex;flex-direction:column;transition:transform
    .2s ease,box-shadow .2s}\n.plan:hover{transform:translateY(-4px);box-shadow:0
    22px 48px -24px rgba(3,32,58,.5)}\n.plan.feat-plan{border:2px solid var(--teal);box-shadow:0
    26px 54px -26px rgba(15,166,151,.6);position:relative}\n.plan.feat-plan:before{content:\"Most
    popular\";position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:var(--gold-bright);color:#3a2600;font-family:var(--heading-font);font-weight:800;font-size:12px;padding:5px
    15px;border-radius:999px}\n.plan h3{font-size:22px}\n.plan .amt{font-family:var(--heading-font);font-weight:900;color:var(--ink);font-size:36px;margin:14px
    0 4px}\n.plan .amt small{font-size:15px;color:var(--body);font-weight:600}\n.plan
    .note{font-size:13.5px;color:var(--body);margin-bottom:18px}\n.plan ul{list-style:none;margin:16px
    0 26px;flex:1}\n.plan li{padding:9px 0 9px 27px;position:relative;font-size:15px;color:var(--body)}\n.plan
    li:before{content:\"✓\";position:absolute;left:0;color:var(--teal-text);font-weight:900}\n.plan
    .btn{width:100%;text-align:center}\n.plan .btn-ghost{color:var(--ink);border-color:var(--line)}\n.plan
    .btn-ghost:hover{border-color:var(--teal);background:transparent}\n.indicative{text-align:center;color:var(--body);font-size:14px;margin-top:24px}\n\n/*
    Contact */\n#contact{background:linear-gradient(135deg,#00204d 0%,#013a6b 100%);color:#fff}\n#contact
    h2{color:#fff}\n#contact .sec-head p{color:#d9e6fb}\n.form{max-width:560px;margin:0
    auto;background:var(--card);border-radius:20px;padding:36px;box-shadow:0 34px
    70px -30px rgba(0,0,0,.5)}\n.form label{display:block;font-family:var(--heading-font);font-weight:700;font-size:14px;color:var(--ink);margin:15px
    0 6px}\n.form input,.form select,.form textarea{width:100%;padding:14px 15px;border:1.5px
    solid var(--line);border-radius:11px;font-family:var(--body-font);font-size:15px;background:var(--bg);color:var(--ink)}\n.form
    input:focus,.form select:focus,.form textarea:focus{outline:none;border-color:var(--teal);box-shadow:0
    0 0 3px rgba(15,166,151,.2)}\n.form textarea{min-height:92px;resize:vertical}\n.form
    .btn{width:100%;margin-top:24px}\n.form .fine{text-align:center;font-size:13px;color:var(--body);margin-top:14px}\n\n/*
    CTA strip */\n.strip{background:var(--bg-alt);text-align:center}\n.strip h2{font-size:clamp(26px,3.4vw,38px);margin-bottom:14px}\n.strip
    p{font-size:18px;max-width:640px;margin:0 auto 26px}\n.strip .cta-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}\n\nfooter{background:#04122b;color:#a7bcda;padding:44px
    0;font-size:14px}\nfooter .fcols{display:flex;justify-content:space-between;flex-wrap:wrap;gap:28px;margin-bottom:24px}\nfooter
    .logo{color:#fff}\nfooter .logo .socket{border-color:#fff}\nfooter .logo .socket:after{background:#fff}\nfooter
    a{color:#d9e6fb;display:block;padding:4px 0}\nfooter .fcol h5{font-family:var(--heading-font);color:#fff;font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}\nfooter
    .base{text-align:center;border-top:1px solid #14304f;padding-top:20px;color:#7f9ac0}\n\n/*
    ANIMATIONS */\n@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(-24px,26px)}}\n@keyframes
    fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}\n@keyframes
    pulse{0%,100%{box-shadow:0 0 0 0 rgba(15,166,151,.5)}50%{box-shadow:0 0 0 5px
    rgba(15,166,151,0)}}\n.hero .anim{opacity:0;animation:fadeUp .7s cubic-bezier(.2,.7,.2,1)
    forwards}\n.hero .d1{animation-delay:.05s}.hero .d2{animation-delay:.18s}.hero
    .d3{animation-delay:.32s}.hero .d4{animation-delay:.46s}\n.socket{animation:pulse
    2.6s ease-out infinite}\n.js .reveal{opacity:0;transform:translateY(26px);transition:opacity
    .6s ease,transform .6s cubic-bezier(.2,.7,.2,1)}\n.js .reveal.in{opacity:1;transform:none}\n.js
    .stagger>*{opacity:0;transform:translateY(24px);transition:opacity .55s ease,transform
    .55s cubic-bezier(.2,.7,.2,1)}\n.js .stagger.in>*{opacity:1;transform:none}\n.js
    .stagger.in>*:nth-child(2){transition-delay:.07s}\n.js .stagger.in>*:nth-child(3){transition-delay:.14s}\n.js
    .stagger.in>*:nth-child(4){transition-delay:.21s}\n.js .stagger.in>*:nth-child(5){transition-delay:.28s}\n.js
    .stagger.in>*:nth-child(6){transition-delay:.35s}\n.js .stagger.in>*:nth-child(7){transition-delay:.42s}\n.js
    .stagger.in>*:nth-child(8){transition-delay:.49s}\n.js .stagger.in>*:nth-child(9){transition-delay:.56s}\n@media
    (prefers-reduced-motion: reduce){\n  *{animation:none!important;transition:none!important}\n
    \ .js .reveal,.js .stagger>*,.hero .anim{opacity:1!important;transform:none!important}\n
    \ html{scroll-behavior:auto}\n}\n\n.appwin-body svg#hero-odo{display:block;width:100%;height:auto;aspect-ratio:568/172}\n"
