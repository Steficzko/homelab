apiVersion: apps/v1
kind: Deployment
metadata:
  name: landing
  namespace: gompha
spec:
  replicas: 1
  selector:
    matchLabels:
      app: landing
  template:
    metadata:
      labels:
        app: landing
    spec:
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
            # sibling of the docroot — nesting under the read-only html mount
            # would EROFS the pod; nginx serves it via `alias` (nginx.yaml)
            - name: manual
              mountPath: /usr/share/manual
              readOnly: true
          resources:
            requests:
              memory: 16Mi
              cpu: 5m
            limits:
              memory: 64Mi
              cpu: 100m
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: html
          configMap:
            name: landing-html
        - name: nginx-conf
          configMap:
            name: landing-nginx
        - name: manual
          configMap:
            name: landing-manual
