apiVersion: apps/v1
kind: Deployment
metadata:
  name: landing
  namespace: gompha
spec:
  replicas: 1
  selector:
    matchLabels:
      app: landing
  template:
    metadata:
      labels:
        app: landing
    spec:
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          ports:
            - containerPort: 80
          env:
            # The manual gate password (nginx.yaml cookie check). envsubst'd
            # into the config template by the stock image entrypoint. Secret is
            # SOPS-applied by hand, like manual-htpasswd was — see
            # manual-gate.example.yaml.
            - name: MANUAL_KEY
              valueFrom:
                secretKeyRef:
                  name: manual-gate
                  key: MANUAL_KEY
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
            # templates, not conf.d: the stock entrypoint envsubsts
            # *.template → /etc/nginx/conf.d (which must stay writable)
            - name: nginx-conf
              mountPath: /etc/nginx/templates
              readOnly: true
            - name: manual-login
              mountPath: /usr/share/manual-login
              readOnly: true
            # sibling of the docroot — nesting under the read-only html mount
            # would EROFS the pod; nginx serves it via `alias` (nginx.yaml)
            - name: manual
              mountPath: /usr/share/manual
              readOnly: true
          resources:
            requests:
              memory: 16Mi
              cpu: 5m
            limits:
              memory: 64Mi
              cpu: 100m
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: html
          configMap:
            name: landing-html
        - name: nginx-conf
          configMap:
            name: landing-nginx
            items:
              - key: default.conf.template
                path: default.conf.template
        - name: manual-login
          configMap:
            name: landing-nginx
            items:
              - key: login.html
                path: login.html
        - name: manual
          configMap:
            name: landing-manual
