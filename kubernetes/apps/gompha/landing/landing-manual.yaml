    <div class="crumb"><a href="index.html">Gompha Manual</a></div>
    <div class="draft">Draft — this manual describes the upcoming version of Gompha.</div>
    <hr />
    <p>tags: [task, milestone-1, screen/person-link, root, support]
    screen: Invite link / Password reset link (popup)</p>
    <hr />
    <h1>Give Someone a New Link</h1>
    <p><strong>For the owner.</strong> On a person's card, on the people and access step of <a href="set-up-your-clinic.html">Set-Up-Your-Clinic</a>.</p>
    <p>This is the answer to <strong>both</strong> of these:</p>
    <ul>
    <li><em>"The invite link got lost — I never sent it, or they deleted the message."</em></li>
    <li><em>"He has forgotten his password."</em></li>
    </ul>
    <p>They are the same button. Gompha decides which kind of link to make from where that person is
    stuck, so you do not have to.</p>
    <h2>Steps</h2>
    <ol>
    <li>Find the person's card on the people step.</li>
    <li>In the row of buttons at the bottom of the card, press either:</li>
    <li><strong>New invite link</strong> — shown for someone still marked <strong>Invited</strong>, who has never set a
         password, or</li>
    <li><strong>New password link</strong> — shown for someone who is already using Gompha.</li>
    <li>A popup opens in the middle of the screen (on a phone it fills the screen), headed <strong>Invite
       link</strong> or <strong>Password reset link</strong>. It tells you which one you are about to make and how long it
       lasts:</li>
    <li><em>"They have never set a password, so this is a fresh invitation. Valid for 48 hours, and it
         works once."</em></li>
    <li><em>"They already have an account, so this lets them set a new password. Valid for 1 hour, and
         it works once."</em></li>
    <li>Read the blue box before you press anything:<blockquote>
    <p>Nothing is emailed. Pressing <strong>Issue link</strong> creates the link here, and you deliver it —
    WhatsApp, SMS or in person.</p>
    </blockquote>
    </li>
    <li>Press <strong>Issue link</strong>.</li>
    <li>The link appears in a box with a <strong>Copy link</strong> button beside it. Press <strong>Copy link</strong> — the
       button changes to <strong>Copied</strong>.</li>
    <li><strong>Send it to that person now.</strong> WhatsApp, SMS, or hand them the phone.</li>
    <li>Press <strong>Done</strong>.</li>
    </ol>
    <h2>Copy it before you leave — there is no second chance at the same link</h2>
    <p>The popup says so, in an amber box, at the moment it matters:</p>
    <blockquote>
    <p><strong>Copy it now.</strong> Only a scrambled copy is kept, so this link cannot be shown again — if you
    leave this page without it, issue another one.</p>
    </blockquote>
    <p>That is literal. Gompha keeps only a fingerprint of the link, enough to check it once when it is
    used and not enough to rebuild it. Nobody can look it up afterwards — not the owner, not support,
    not us.</p>
    <p><strong>This is no longer a disaster.</strong> Lose it and you simply press the button again. Pressing <strong>Issue
    another</strong> or coming back to the card makes a fresh one.</p>
    <p>While you stay on the setup screen, the link you just made also sits on the person's card as a
    small <strong>Copy invite link</strong> / <strong>Copy password link</strong> button, so you can copy it a second time
    without issuing anything. Leave the screen and that button goes.</p>
    <h2>What the person does with it</h2>
    <ul>
    <li>An <strong>invite link</strong> opens <strong>Join the clinic</strong>, where they choose their own password —
      <a href="activate-your-account.html">Activate-Your-Account</a>.</li>
    <li>A <strong>password link</strong> opens <strong>Choose a new password</strong> — <a href="reset-your-password.html">Reset-Your-Password</a>. Using it signs
      them out of every other device.</li>
    </ul>
    <h2>What can go wrong</h2>
    <table>
    <thead>
    <tr>
    <th>On screen</th>
    <th>What it means</th>
    <th>What to do</th>
    </tr>
    </thead>
    <tbody>
    <tr>
    <td>The button is greyed out and says <strong>Archived people cannot be given a link — they cannot sign in.</strong></td>
    <td>The person has been archived.</td>
    <td>Archiving is deliberate and cannot be undone in this version. See <a href="archive-a-person.html">Archive-a-Person</a>.</td>
    </tr>
    <tr>
    <td>The button is greyed out and says <strong>Needs the clinic link.</strong></td>
    <td>The device cannot reach the server.</td>
    <td>See <a href="working-offline.html">Working-Offline</a>.</td>
    </tr>
    <tr>
    <td><strong>No connection — this needs the clinic link. Nothing changed; try again when it is back.</strong></td>
    <td>The connection dropped as you pressed.</td>
    <td>No link was made. Try again when the strip at the top clears.</td>
    </tr>
    <tr>
    <td><strong>The clinic is read-only until the licence is renewed. Nothing changed.</strong></td>
    <td>The clinic licence has lapsed.</td>
    <td>See <a href="what-your-licence-covers.html">What-Your-Licence-Covers</a>.</td>
    </tr>
    <tr>
    <td><strong>This person is deactivated — reactivate them first</strong></td>
    <td>Same as the first row, from the server.</td>
    <td>As above.</td>
    </tr>
    </tbody>
    </table>
    <h2>An older link you already sent keeps working</h2>
    <p>Issuing a new link does <strong>not</strong> kill the old one. If you sent an invite yesterday and issue
    another today, either of them still activates the account until it expires or one of them is used.
    That is why the popup says <em>"An earlier link you already sent keeps working until it expires."</em></p>
    <h2>Why it works this way</h2>
    <p><strong>One button, not two.</strong> "Resend the invitation" and "he forgot his password" feel like different
    problems to the person asking, but they are one question — <em>this person cannot get in, let them
    in</em>. The server looks at whether they ever set a password and picks the right kind. A receptionist
    should not have to know the difference.</p>
    <p><strong>Nothing is emailed, on purpose.</strong> Sending mail as the clinic needs a mail setup that is
    deliberately not switched on yet. Half-configured mail lands in spam and nobody finds out until an
    invite is silently lost. A link you can see and must send is worse-looking and far more reliable
    than one that quietly failed.</p>
    <p><strong>A reset lasts one hour; an invite lasts 48.</strong> A reset link opens a live account with a real
    history behind it, so it is worth more to a thief than an invitation to an account nobody has used
    yet. The more valuable key gets the shorter life.</p>
    <p><strong>Only a fingerprint is stored.</strong> If Gompha kept the link itself, then anyone who reached the
    database — including us — could walk into any account. Storing something that can only ever be
    checked, never read back, is what makes "we cannot recover it" a security feature rather than an
    apology.</p>
    <p><strong>Before this existed, a forgotten password was permanent.</strong> No email is sent, the link cannot be
    recovered, and re-adding the person fails because their email is already in use. A doctor who
    forgot his password was locked out for good. This button is the whole of the recovery path.</p>
    <p>Next: <a href="fix-a-persons-details.html">Fix-a-Persons-Details</a> · <a href="archive-a-person.html">Archive-a-Person</a> · <a href="add-a-staff-member.html">Add-a-Staff-Member</a> · <a href="home.html">Home</a></p>
    </div></body></html>
