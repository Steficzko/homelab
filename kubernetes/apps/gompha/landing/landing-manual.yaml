    </style></head><body><div class="wrap">
    <div class="crumb"><a href="index.html">Gompha Manual</a></div>
    <div class="draft">Draft — this manual describes the upcoming version of Gompha.</div>
    <hr />
    <p>tags: [task, milestone-1, screen/person-details, root]
    screen: Edit details (popup)</p>
    <hr />
    <h1>Fix a Person's Details</h1>
    <p><strong>For the owner.</strong> On a person's card, on the people and access step of <a href="set-up-your-clinic.html">Set-Up-Your-Clinic</a>.</p>
    <p>You can correct <strong>their name</strong> and <strong>their email</strong>. That is the whole of it — and the email is the
    one that matters, because the email is how they sign in.</p>
    <h2>Steps</h2>
    <ol>
    <li>Find the person's card on the people step.</li>
    <li>Press <strong>Edit details</strong> in the row of buttons at the bottom of the card.</li>
    <li>A popup opens in the middle of the screen (on a phone it fills the screen), headed <strong>Edit
       details</strong>, with the person's name and role at the top.</li>
    <li><strong>Full name</strong> — type it as colleagues should see it. Arabic and Kurdish are fine.</li>
    <li><strong>Email</strong> — always typed left to right. Under the field it says <em>"This is how they sign in.
       Fixing a typo here is safe — changing it grants nothing on its own."</em></li>
    <li>Press <strong>Save changes</strong>.</li>
    <li>A green line confirms it saved.</li>
    </ol>
    <p><strong>Change nothing and press Save</strong> and you get <em>"Nothing to save — change something first."</em> That is
    not a fault.</p>
    <h2>If you changed the email, issue a new link</h2>
    <p>The moment you edit the address, a blue box appears:</p>
    <blockquote>
    <p>After saving a new address, issue a fresh link and send it there — the old one points at the
    same person, so an unused link still works.</p>
    </blockquote>
    <p>And after saving, the confirmation says:</p>
    <blockquote>
    <p>Saved. The new address still needs a fresh link before they can sign in — issue one from their
    card.</p>
    </blockquote>
    <p>So: <strong>fix the email, then press New invite link on the same card</strong> and send it to the corrected
    address. <a href="give-someone-a-new-link.html">Give-Someone-a-New-Link</a>.</p>
    <h2>What you cannot change here</h2>
    <ul>
    <li><strong>Their role.</strong> An admin doctor cannot be turned into a receptionist on screen.</li>
    <li><strong>Which doctor an assistant works under.</strong> Choose that correctly when you add her
      (<a href="add-a-staff-member.html">Add-a-Staff-Member</a>).</li>
    <li><strong>A doctor's colour.</strong> That stays on the card itself, one press away —
      <a href="choose-a-doctor-colour.html">Choose-a-Doctor-Colour</a>. The popup tells you so.</li>
    <li><strong>What they can see.</strong> The five access sections are on the card too —
      <a href="set-what-each-person-can-see.html">Set-What-Each-Person-Can-See</a>.</li>
    </ul>
    <h2>What can go wrong</h2>
    <table>
    <thead>
    <tr>
    <th>On screen</th>
    <th>What it means</th>
    <th>What to do</th>
    </tr>
    </thead>
    <tbody>
    <tr>
    <td><strong>Enter a valid email.</strong></td>
    <td>The address has no <code>@</code>, or no dot after it.</td>
    <td>Retype it.</td>
    </tr>
    <tr>
    <td><strong>Enter a name.</strong></td>
    <td>The name field is empty.</td>
    <td>Type the name.</td>
    </tr>
    <tr>
    <td><strong>A staff member with this email already exists</strong></td>
    <td>Somebody else in this clinic already uses that address.</td>
    <td>Check the grid — you may be looking at a duplicate of the same person.</td>
    </tr>
    <tr>
    <td><strong>No connection — this needs the clinic link. Nothing changed; try again when it is back.</strong></td>
    <td>The device cannot reach the server.</td>
    <td>Nothing was saved. See <a href="working-offline.html">Working-Offline</a>.</td>
    </tr>
    <tr>
    <td><strong>The clinic is read-only until the licence is renewed. Nothing changed.</strong></td>
    <td>The licence has lapsed.</td>
    <td>See <a href="what-your-licence-covers.html">What-Your-Licence-Covers</a>.</td>
    </tr>
    </tbody>
    </table>
    <h2>Why it works this way</h2>
    <p><strong>The email had to become editable.</strong> A typo in an address used to strand the account for good:
    nothing is emailed, the invite link cannot be recovered, and adding the person again fails because
    that address is already taken. One mistyped character cost a person their account. Now it is a
    correction.</p>
    <p><strong>Changing the address grants nothing by itself.</strong> Moving an account to a new email does not let
    anybody in — they still have to hold a valid link and set a password. That is why editing it is a
    safe, ordinary action rather than a dangerous one.</p>
    <p><strong>Only two fields, deliberately.</strong> A popup that could change a role or a supervising doctor as
    casually as a spelling is how somebody quietly gains access nobody meant to give them. The changes
    that move what a person can <em>see</em> are separate, visible, and recorded.</p>
    <p>Next: <a href="give-someone-a-new-link.html">Give-Someone-a-New-Link</a> · <a href="archive-a-person.html">Archive-a-Person</a> · <a href="roles-and-access.html">Roles-and-Access</a> · <a href="home.html">Home</a></p>
    </div></body></html>
  "give-someone-a-new-link.html": |
