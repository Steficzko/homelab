    </style></head><body><div class="wrap">
    <div class="crumb"><a href="index.html">Gompha Manual</a></div>
    <div class="draft">Draft — this manual describes the upcoming version of Gompha.</div>
    <hr />
    <h2>tags: [concept, milestone-1, licence]</h2>
    <h1>What Your Licence Covers</h1>
    <p>Gompha is licensed per clinic. The licence records two things that staff actually meet: <strong>how many
    doctors the clinic may have</strong>, and <strong>whether the clinic may make changes at all</strong>.</p>
    <h2>Doctor seats are counted; reception and assistants are not</h2>
    <ul>
    <li><strong>Admin doctors and associate doctors each have their own limit.</strong> Two separate counts, not one
      pooled number — so a clinic licensed for one admin doctor and three associates cannot quietly
      turn that into four admin doctors.</li>
    <li><strong>Receptionists and assistants are unlimited.</strong> Add as many as the clinic employs.</li>
    <li><strong>An invited doctor already occupies a seat</strong>, from the moment the invite is created and before
      they have ever signed in. A seat you have promised to somebody is not free.</li>
    </ul>
    <p>When there is no seat left, adding a doctor is refused on the spot with a message you can act on:</p>
    <blockquote>
    <p>More doctors than your licence allows — contact us</p>
    </blockquote>
    <p>or, when the limit is simply reached:</p>
    <blockquote>
    <p>Doctor seats for role '…' are at the licence limit</p>
    </blockquote>
    <p>Nothing is half-created. See <a href="add-a-staff-member.html">Add-a-Staff-Member</a>.</p>
    <h2>A seat is a person, not a device</h2>
    <p>One doctor, on his phone, on the chair-side tablet and at the front desk, is <strong>one</strong> seat. Seats
    count people, not screens. This is also why nobody should share a login: two people on one seat
    destroys the record of who did what (<a href="roles-and-access.html">Roles-and-Access</a>).</p>
    <h2>If the licence lapses: read-only</h2>
    <p>When a licence runs out, the clinic does <strong>not</strong> stop working and nothing is deleted. It becomes
    <strong>read-only</strong>:</p>
    <ul>
    <li><strong>Everything can still be read.</strong> Every record already saved stays exactly as it is.</li>
    <li><strong>Nothing new can be saved.</strong> Any attempt shows a calm grey box with a padlock:</li>
    </ul>
    <blockquote>
    <p><strong>The clinic is read-only.</strong> The licence needs renewing before anything can be changed.
    Everything already saved is safe.</p>
    </blockquote>
    <p>Renew, and full use returns. Nothing has to be re-entered.</p>
    <p><strong>What that looks like at the desk.</strong> Buttons that would save something go grey. Opening a popup to
    add a person, issue a link, edit details or archive somebody shows the padlock box, and the action
    button is dead. A change you press anyway comes back with <em>"The clinic is read-only until the
    licence is renewed. Nothing changed."</em> — and <strong>nothing did change</strong>. There is no queue of pending
    work waiting to go in; there is nothing to clean up afterwards.</p>
    <p>If a code appears with it, the one that means this is <strong>GMP-1201</strong>:</p>
    <blockquote>
    <p>The clinic licence has expired, so nothing can be saved right now. Everything already saved is
    safe.</p>
    </blockquote>
    <p>That is the code the running version actually gives for it. The padlock box says the same thing in
    words, so you can tell a licence refusal from a permission refusal without reading the number at
    all. See <a href="error-codes.html">Error-Codes</a>.</p>
    <p><strong>Read-only is not the same as offline.</strong> Offline means this device cannot reach the server;
    read-only means the server is fine and is waiting on a renewal. The two look similar on purpose —
    both are calm, informational, never red — but they are told apart by the icon and the wording. See
    <a href="working-offline.html">Working-Offline</a>.</p>
    <h2>The only warning is a small date beside the Gompha mark</h2>
    <p><strong>The owner — and only the owner — sees the expiry date</strong> beside the word <em>Gompha</em> at the top left
    of every signed-in screen, next to the version number: <em>expires 31 Aug</em>. It is quiet grey most of the
    year, turns to a warning colour with a small triangle <strong>inside the last 30 days</strong>, and to an error
    colour once the date has passed. Everybody else sees the version number alone.</p>
    <p>That chip is the whole of the warning. <strong>There is no message, no email and no reminder</strong>, and the
    quiet automatic renewal behind it is not built yet.</p>
    <p><strong>Practical consequence: keep track of the renewal date outside the app as well.</strong> Nobody except
    the owner can see it, and he only sees it if he looks at the corner of the screen. Speak to us
    before it falls due.</p>
    <p><strong>This is not hypothetical.</strong> The licence on the clinic now running at
    https://app-staging.gompha.com <strong>runs out on 31 August 2026</strong>. On that day, without a renewal, the
    padlock box appears and nothing further can be saved. Nothing is lost when it does.</p>
    <h2>Buying and renewing happen outside the app</h2>
    <p>There is no billing screen, no invoice, no card form and no self-serve upgrade in Gompha, and there
    is not going to be one. Renewals, extra doctor seats and bespoke arrangements are agreed the way
    clinics here actually buy: a conversation, by phone or WhatsApp.</p>
    <h2>Why it works this way</h2>
    <p><strong>Only doctors are counted.</strong> Doctors are what a dental practice is sized by. Capping receptionists
    would push a clinic straight into sharing one front-desk login, which is worse for the clinic and
    worse for the record than any licensing benefit.</p>
    <p><strong>Expiry never destroys work.</strong> A clinic that lost data over a late payment would be right never to
    trust the software again. Read-only stops new work; it never touches old work.</p>
    <p><strong>Named seats, not "however many are logged in right now".</strong> Counting simultaneous users needs a
    live connection to police it, and the whole point of Gompha's licence design is that the clinic keeps
    working when the link to us is down. Counting people instead of connections is what makes that
    possible.</p>
    <p><strong>The clinic's entitlements live in the licence, not in the software.</strong> Every clinic here bargains a
    different real price, so a bespoke arrangement must be a licence we issue for that clinic — never a
    change to the code and never a special version. That is why a limit can be raised without anybody
    deploying anything.</p>
    <p>Next: <a href="roles-and-access.html">Roles-and-Access</a> · <a href="working-offline.html">Working-Offline</a> · <a href="error-codes.html">Error-Codes</a> · <a href="home.html">Home</a></p>
    </div></body></html>
  "whats-not-here-yet.html": |
    <!doctype html><html lang="en"><head><meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Whats Not Here Yet · Gompha Manual</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Sans+Arabic&display=swap" rel="stylesheet">
    <style>
    body{margin:0;background:#FAF8F4;color:#3D3A34;font:15px/1.65 "IBM Plex Sans","IBM Plex Sans Arabic",sans-serif}
    .wrap{max-width:760px;margin:0 auto;padding:40px 24px 80px}
    a{color:#2E5D51} .dead{color:#98917F;border-bottom:1px dashed #C9C2B2}
    h1,h2,h3{line-height:1.3} h1{font-size:26px}
    code{background:#F1EDE6;border-radius:5px;padding:2px 6px}
    .crumb{font-size:13px;color:#98917F;margin-bottom:28px} .crumb a{color:#6B655A;text-decoration:none}
    .draft{background:#F3EDDC;color:#6A5A32;border-radius:9px;padding:9px 14px;font-size:13px;margin-bottom:26px}
