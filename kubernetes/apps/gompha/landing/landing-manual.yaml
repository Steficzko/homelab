    <div class="crumb"><a href="index.html">Gompha Manual</a></div>
    <div class="draft">Draft — this manual describes the upcoming version of Gompha.</div>
    <hr />
    <p>tags: [task, milestone-1, screen/welcome, root]
    screen: Welcome (setup)</p>
    <hr />
    <h1>Set Up Your Clinic</h1>
    <p><strong>For the owner only.</strong> This is the screen the owner (root) lands on straight after signing in.
    Nobody else can reach it; a doctor or a receptionist who tries is sent to their own page.</p>
    <p>It takes about five minutes. Everything saves as you go, so you can stop and come back.</p>
    <h2>What you are looking at</h2>
    <ul>
    <li><strong>Across the top:</strong> the green <strong>G</strong> mark and the word <strong>Gompha</strong> on the left, with a small
      <strong>powered by Steficzko</strong> under it — that is the maker's credit, and it opens their page in a new
      tab if you press it. On the right, a <strong>gear icon</strong> that opens <a href="switch-to-dark-mode.html">Switch-to-Dark-Mode</a> and <strong>Sign
      out</strong>. There is no menu down the side. That is deliberate: during setup there is nothing to
      navigate to yet.</li>
    <li><strong>Under that, three named boxes</strong> showing where you are:</li>
    <li><strong>Permissions</strong> — who the users are</li>
    <li><strong>Rooms</strong> — rooms &amp; hours</li>
    <li><strong>Financials</strong> — opens with the money module</li>
    </ul>
    <p>The one you are on is outlined and filled; a finished one shows a tick; <strong>Financials stays
      dimmed and cannot be opened</strong>, because the money module does not exist yet
      (<a href="whats-not-here-yet.html">Whats-Not-Here-Yet</a>).</p>
    <h2>Step 1 — the greeting</h2>
    <p>The heading reads <strong>"Welcome, <your name>."</strong></p>
    <p>Two cards sit under it:</p>
    <ul>
    <li><strong>Your own card</strong>, with your initials, your name, your email and a green <strong>ROOT</strong> badge. Check
      the name and email are right — and if they are not, they can be corrected on the next step
      (<a href="fix-a-persons-details.html">Fix-a-Persons-Details</a>).</li>
    <li><strong>"Before you start — have everyone's email ready"</strong>, listing what to collect: each doctor's
      email, reception's email, and each assistant's email <em>plus which doctor they work under</em>.</li>
    </ul>
    <p>Collect those before you press the button. Adding people is much faster with the list in front of
    you.</p>
    <p>Press <strong>Start — add the team →</strong> at the bottom.</p>
    <h2>Step 2 — people and access</h2>
    <p>The heading reads <strong>"Who works here, and what can each see?"</strong> This is the main work of Milestone 1
    and it has its own pages:</p>
    <ul>
    <li><a href="add-a-staff-member.html">Add-a-Staff-Member</a> — adding each person and delivering their invite</li>
    <li><a href="set-what-each-person-can-see.html">Set-What-Each-Person-Can-See</a> — the five access sections</li>
    <li><a href="choose-a-doctor-colour.html">Choose-a-Doctor-Colour</a> — the colour each doctor gets</li>
    </ul>
    <p>Each person's card also carries three buttons of its own, for when something needs fixing:
    <a href="give-someone-a-new-link.html">Give-Someone-a-New-Link</a>, <a href="fix-a-persons-details.html">Fix-a-Persons-Details</a> and <a href="archive-a-person.html">Archive-a-Person</a>.</p>
    <p>When the team is in, press <strong>Continue to rooms →</strong> at the bottom right. <strong>← Back</strong> returns to the
    greeting.</p>
    <h2>Step 3 — rooms</h2>
    <p>The heading reads <strong>"Register the clinic's rooms"</strong>. See <a href="add-the-clinic-rooms.html">Add-the-Clinic-Rooms</a>.</p>
    <p>Press <strong>Finish setup →</strong> at the bottom right. That takes you into the app.</p>
    <p>Setup is never sealed shut. Come back whenever you need to — see below.</p>
    <h2>Where Finish setup takes you</h2>
    <p>Into the app as a doctor: <strong>your own treatment list</strong>, until you have worked through that once too
    (<a href="set-up-your-treatment-list.html">Set-Up-Your-Treatment-List</a>). After that, the same short home page everyone else gets —
    <strong>"You're signed in"</strong>, your role, and the list of rooms you just named. In Milestone 1 there is
    nothing else behind it yet (<a href="whats-not-here-yet.html">Whats-Not-Here-Yet</a>).</p>
    <h2>Getting back to setup later</h2>
    <p>There is no menu item for it, and once the clinic's details are saved the plain address takes you
    into the app rather than back to Welcome.</p>
    <p><strong>Add <code>/welcome</code> to the end of the clinic address</strong> — <code>https://app-staging.gompha.com/welcome</code> —
    and you land back on the setup screen with everything you already entered in place. Use that
    whenever you need to add a person, fix an email, issue somebody a new link, change access, or add a
    room. <strong>Bookmark it.</strong></p>
    <p><strong>⚠ verify</strong> — this is what the running version does; a button back into setup is owed.</p>
    <h2>Why it works this way</h2>
    <p><strong>Setup is not the app with a form dropped into it.</strong> There is no side menu here because none of
    those destinations exist for you yet, and a menu full of dead links is how software teaches people
    not to trust it. The chrome appears when there is something behind it.</p>
    <p><strong>Three named steps, not "Step 1 of 3" circles.</strong> You should be able to see at a glance what the
    setup is <em>about</em> — people, rooms, money — not merely how far through it you are. It is also why
    Financials is shown at all: you know the money module is a real part of the plan, and you know it
    is not here yet.</p>
    <p><strong>Everything saves as you pressed it.</strong> There is no final <strong>Save</strong> on this screen. Each change is
    sent to the server the moment you make it, and if one fails you get a plain sentence saying so and
    the control goes back to what it was. Nothing waits in the browser to be lost.</p>
    <p>Next: <a href="add-a-staff-member.html">Add-a-Staff-Member</a> · <a href="clinic-admin.html">Clinic-Admin</a> · <a href="home.html">Home</a></p>
    </div></body></html>
