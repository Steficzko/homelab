    <div class="crumb"><a href="index.html">Gompha Manual</a></div>
    <div class="draft">Draft — this manual describes the upcoming version of Gompha.</div>
    <hr />
    <h2>tags: [concept, milestone-1, support]</h2>
    <h1>Working Offline</h1>
    <p><strong>Read this page before the first "the internet is down" phone call.</strong> Most support calls will be
    this one, and almost none of them are faults.</p>
    <h2>The one sentence</h2>
    <p><strong>Offline in Gompha means looking, not working.</strong> You can read what is already on your screen. You
    cannot add, change or save anything until the connection is back — and <strong>nothing you had done is
    lost</strong>, because Gompha never accepts a change it has not actually saved.</p>
    <h2>How you know you are offline</h2>
    <p><strong>A slim grey strip appears across the very top of the screen:</strong></p>
    <blockquote>
    <p>No connection — viewing cached data, read-only.</p>
    </blockquote>
    <p>It is deliberately calm — grey, small, never red, never a pop-up. It is telling you something, not
    warning you about a fault.</p>
    <p>Inside a screen you get the same message in a soft grey box with a small signal icon:</p>
    <blockquote>
    <p><strong>No connection — viewing cached data, read-only.</strong> You can review what is set up; adding or
    changing anything needs the clinic link. Nothing is lost.</p>
    </blockquote>
    <p>On the setup screens the buttons go grey and the line at the bottom changes from <em>"Changes save as
    you go"</em> to <strong>"Read-only while offline"</strong>.</p>
    <h2>What happens if you try to change something anyway</h2>
    <p>You get a plain sentence, and <strong>nothing is saved</strong>. Adding a person offline says:</p>
    <blockquote>
    <p>No connection — adding a person needs the clinic link.</p>
    </blockquote>
    <p>Saving a treatment offline says:</p>
    <blockquote>
    <p><strong>No connection — this can't be saved yet.</strong> Your entries are still here; try again when the link
    is back.</p>
    </blockquote>
    <p>And it means it: what you typed stays on the screen, so when the link returns you press <strong>Save</strong>
    once and it goes in (<a href="add-a-treatment.html">Add-a-Treatment</a>). On the treatment list itself, the buttons that write —
    <strong>+ Add a treatment</strong>, <strong>+ New category</strong>, the drag handle, the actions in the <strong>⋮</strong> menu — go grey
    while the link is down, and hovering one says <em>"Needs the clinic link."</em></p>
    <p>There is no half-saved person, no half-saved treatment, no queue, and nothing to clean up
    afterwards. Do it again when the connection is back.</p>
    <h2>What being offline does <em>not</em> do</h2>
    <ul>
    <li><strong>It does not sign you out.</strong> A dropped link is not a sign-out. Your session survives; you carry
      on when the connection returns. Only a genuine sign-out, or a session that has expired, sends you
      back to the sign-in screen (<a href="passwords-and-sessions.html">Passwords-and-Sessions</a>).</li>
    <li><strong>It does not lose anything.</strong> Everything you had saved before the link dropped is on the server.</li>
    <li><strong>It does not mean the clinic's data is gone.</strong> It means this device cannot reach it right now.</li>
    </ul>
    <h2>What to actually do</h2>
    <ol>
    <li><strong>Wait.</strong> Most drops last seconds. The strip disappears by itself when the link returns.</li>
    <li>If a screen shows the offline box, press <strong>Try again</strong> or <strong>Retry</strong> when the strip has gone.</li>
    <li>If it stays down, check the clinic's own internet the way you always do. Gompha cannot fix a
       dead link, and it will not pretend the link is alive.</li>
    </ol>
    <h2>The honest limit in Milestone 1</h2>
    <p><strong>Milestone 1 keeps no copy of your data on the device.</strong> So:</p>
    <ul>
    <li>If the app is <strong>already open</strong>, what is on screen stays readable, and you get the calm strip.</li>
    <li>If you <strong>reload the page, or open the app fresh, while offline</strong>, you get the <em>browser's</em> "cannot
      reach this site" page rather than Gompha at all. Not a fault, and nothing is damaged. Reload once
      the link is back.</li>
    </ul>
    <p>The stored-on-the-device reading copy — a doctor's own patients and the day's schedule, readable
    when the link is down — arrives with the schedule and patient modules. Until then, treat Gompha as
    needing the connection to open at all.</p>
    <h2>The four things a screen can be showing you</h2>
    <p>They look different on purpose. Confusing two of them is what makes staff distrust the app.</p>
    <table>
    <thead>
    <tr>
    <th>What you see</th>
    <th>What it means</th>
    </tr>
    </thead>
    <tbody>
    <tr>
    <td><strong>Grey placeholder shapes</strong> where text and boxes will be</td>
    <td>Loading. The data is on its way. Never a spinning circle — a shape that matches what is arriving tells you it <em>is</em> arriving.</td>
    </tr>
    <tr>
    <td><strong>A dashed box</strong> saying <em>"No rooms yet"</em> or <em>"No one added yet"</em></td>
    <td>Empty. It loaded fine, and there genuinely is nothing there yet.</td>
    </tr>
    <tr>
    <td><strong>A soft red box</strong> saying <em>"Couldn't load this"</em> with a <strong>Try again</strong></td>
    <td>Something failed. The details went to the log, not to your screen. Nothing was lost. It often carries a code and a <strong>Report this</strong> link — please send it (<a href="when-something-goes-wrong.html">When-Something-Goes-Wrong</a>).</td>
    </tr>
    <tr>
    <td><strong>A calm grey box</strong> saying <em>"No connection"</em></td>
    <td>Offline. Read-only, informational. Not a fault.</td>
    </tr>
    </tbody>
    </table>
    <p><strong>An empty day and an unreachable server must never look the same.</strong> A receptionist seeing an empty
    schedule has to know instantly whether the day is free or the device cannot see it.</p>
    <h2>The other read-only: a lapsed licence</h2>
    <p>Occasionally you will see a grey box with a <strong>padlock</strong>, not a signal icon:</p>
    <blockquote>
    <p><strong>The clinic is read-only.</strong> The licence needs renewing before anything can be changed.
    Everything already saved is safe.</p>
    </blockquote>
    <p>That is not a connection problem — see <a href="what-your-licence-covers.html">What-Your-Licence-Covers</a>. The connection is fine;
    Gompha is waiting on a renewal. Reading still works.</p>
    <p><strong>The quick way to tell them apart:</strong> a signal icon and the word <em>connection</em> means your internet;
    a <strong>padlock</strong> means the licence. Neither is red, and neither loses anything.</p>
    <h2>Why it works this way</h2>
    <p><strong>The clinic asked for it.</strong> The requirement was for the schedule to be <em>the most accurate thing in
    the building</em> — always the latest state on every device, no stale copies. You cannot have that and
    also let six devices book appointments independently while the internet is down. Given the choice,
    the clinic chose accuracy.</p>
    <p><strong>The alternative is worse than an inconvenience.</strong> If devices accepted bookings offline, two
    receptionists offline at once would each promise the same 10:00 slot, and the app would later have
    to pick a winner. Somebody's patient arrives to no appointment. Refusing to book is visible and
    immediately understood; a double booking is invisible until the patient is standing at the desk.</p>
    <p><strong>"No connection" is a state, not an error.</strong> Painting it red would teach staff that red means
    "ignore it", and then a real error gets ignored too.</p>
    <p><strong>Nothing is ever half-saved.</strong> Every change is a single request the server either accepted or did
    not. There is no draft on the device that could be lost, so "did that save?" always has a
    straight answer.</p>
    <p><strong>Availability is bought with better connections, not with copies.</strong> The work goes into making the
    link reliable — a spare route into the clinic, monitoring from outside the building — rather than
    into copies of the record on six devices that then have to be reconciled. During a full outage staff
    can look but not book, and that trade was accepted deliberately.</p>
    <p>Next: <a href="whats-not-here-yet.html">Whats-Not-Here-Yet</a> · <a href="what-your-licence-covers.html">What-Your-Licence-Covers</a> · <a href="when-something-goes-wrong.html">When-Something-Goes-Wrong</a> ·
    <a href="install-the-app-on-a-phone.html">Install-the-App-on-a-Phone</a> · <a href="home.html">Home</a></p>
    </div></body></html>
