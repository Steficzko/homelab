    <div class="draft">Draft — this manual describes the upcoming version of Gompha.</div>
    <hr />
    <p>tags: [task, milestone-1, screen/add-person, root]
    screen: Add a person</p>
    <hr />
    <h1>Add a Staff Member</h1>
    <p><strong>For the owner only.</strong> On the <strong>people and access</strong> step of <a href="set-up-your-clinic.html">Set-Up-Your-Clinic</a>.</p>
    <p>Add each person once. You add the <em>person</em>, not their password — they choose that themselves from
    the link you send (<a href="activate-your-account.html">Activate-Your-Account</a>).</p>
    <h2>Steps</h2>
    <ol>
    <li>Press <strong>+ Add person</strong> at the top of the people step. (The very first time, the button sits
       inside a dashed box headed <strong>No one added yet</strong> and reads <strong>+ Add the first person</strong>.)</li>
    <li>A popup opens in the middle of the screen, headed <strong>Add a person</strong>. On a phone it fills the
       screen.</li>
    <li><strong>Full name</strong> — type it as colleagues should see it. Arabic and Kurdish are fine.</li>
    <li><strong>Email</strong> — this is what the person types to sign in, so get it right. Under the field it says
       <em>"Stored now; the invite is delivered by hand until email is set up."</em></li>
    <li><strong>Role</strong> — pick one of four: <strong>Admin doctor</strong>, <strong>Associate doctor</strong>, <strong>Receptionist</strong>,
       <strong>Assistant</strong>. The box starts on <em>Associate doctor</em>. <a href="roles-and-access.html">Roles-and-Access</a> explains the
       difference.</li>
    <li><strong>Supervising doctor</strong> — this field appears <strong>only when you pick Assistant</strong>, and it is
       required. Choose the doctor she works under. If you have not added any doctors yet the field is
       greyed out and says <em>"Add a doctor first — an assistant works under one."</em> So <strong>add the doctors
       before the assistants.</strong></li>
    <li>Press <strong>Create invite</strong>.</li>
    </ol>
    <h2>Then: send the link, or the person cannot get in</h2>
    <p>The popup does not just close. It changes to <strong>Invite created</strong> and shows:</p>
    <ul>
    <li>a line reading <em>"<name> is added as <Role> and needs to set a password."</em></li>
    <li>a note that email is not set up yet, and that you must send the link yourself</li>
    <li><strong>the invite link itself, with a Copy link button beside it</strong></li>
    </ul>
    <p><strong>Copy the link and send it to that person now</strong> — WhatsApp, SMS, or read it out and let them type
    it. Then choose:</p>
    <ul>
    <li><strong>Add another</strong> — the popup goes back to a blank form for the next person</li>
    <li><strong>Done</strong> — the popup closes</li>
    </ul>
    <p>The person now appears in the grid with an <strong>Invited</strong> badge and a small <strong>Copy invite link</strong>
    button on their card, so you can copy the link again without re-creating anything.</p>
    <blockquote>
    <p><strong>This exact link is only recoverable while you stay on this screen.</strong> Gompha stores nothing that
    can reproduce it — only a fingerprint used to check it once. Reload the page or sign out and the
    <strong>Copy invite link</strong> button goes.</p>
    <p><strong>That is no longer a problem.</strong> Press <strong>New invite link</strong> on their card and you get a fresh one,
    as often as you like — <a href="give-someone-a-new-link.html">Give-Someone-a-New-Link</a>.</p>
    </blockquote>
    <h2>What can go wrong</h2>
    <table>
    <thead>
    <tr>
    <th>On screen</th>
    <th>What it means</th>
    <th>What to do</th>
    </tr>
    </thead>
    <tbody>
    <tr>
    <td><strong>A staff member with this email already exists</strong></td>
    <td>That email is already in the clinic.</td>
    <td>Check the grid. They may already be listed as <em>Invited</em>.</td>
    </tr>
    <tr>
    <td><strong>More doctors than your licence allows — contact us</strong></td>
    <td>Your licence covers fewer doctors than you are trying to add.</td>
    <td>See <a href="what-your-licence-covers.html">What-Your-Licence-Covers</a>. Contact us to raise it.</td>
    </tr>
    <tr>
    <td><strong>Doctor seats for role '…' are at the licence limit</strong></td>
    <td>Same thing, stated by role. Admin doctors and associate doctors are counted separately.</td>
    <td>As above.</td>
    </tr>
    <tr>
    <td><strong>No active licence — no doctor seats available</strong></td>
    <td>The clinic has no valid licence recorded right now.</td>
    <td>Contact support. Reception and assistants can still be added.</td>
    </tr>
    <tr>
    <td><strong>Choose the supervising doctor.</strong></td>
    <td>You picked Assistant and left the doctor blank.</td>
    <td>Pick the doctor.</td>
    </tr>
    <tr>
    <td><strong>No connection — adding a person needs the clinic link.</strong></td>
    <td>The device cannot reach the server.</td>
    <td>See <a href="working-offline.html">Working-Offline</a>. Nothing was saved; add them again when the link is back.</td>
    </tr>
    </tbody>
    </table>
    <p><strong>An invited person counts against your doctor seats from the moment you create the invite</strong>, not
    from when they first sign in. That is intentional: a seat you have promised to someone is not free.</p>
    <h2>If you got something wrong</h2>
    <p>Every card carries its own buttons along the bottom. Nothing here is a one-way door except the last
    one.</p>
    <table>
    <thead>
    <tr>
    <th>What happened</th>
    <th>The button</th>
    <th>Page</th>
    </tr>
    </thead>
    <tbody>
    <tr>
    <td>The invite link was lost, or they forgot their password</td>
    <td><strong>New invite link</strong> / <strong>New password link</strong></td>
    <td><a href="give-someone-a-new-link.html">Give-Someone-a-New-Link</a></td>
    </tr>
    <tr>
    <td>A typo in the name or the email</td>
    <td><strong>Edit details</strong></td>
    <td><a href="fix-a-persons-details.html">Fix-a-Persons-Details</a></td>
    </tr>
    <tr>
    <td>They never joined, or they have left</td>
    <td><strong>Archive</strong></td>
    <td><a href="archive-a-person.html">Archive-a-Person</a></td>
    </tr>
    </tbody>
    </table>
    <p><strong>The one thing you still cannot change is which doctor an assistant works under.</strong> Choose it
    correctly here — it has no button yet, and it moves everything she can see at once.</p>
    <h2>Why it works this way</h2>
    <p><strong>The owner creates people; people create their own passwords.</strong> No shared first password ever
    circulates, and there is no moment when someone else knows your password.</p>
    <p><strong>Reception and assistants are not counted against your licence; doctors are.</strong> Doctors are what a
    dental practice is sized by, and capping receptionists would only push a clinic into sharing one
    front-desk login — which destroys the record of who did what. See <a href="what-your-licence-covers.html">What-Your-Licence-Covers</a>.</p>
    <p><strong>An assistant must have exactly one supervising doctor, and nobody else has one.</strong> Half of an
    assistant's access is defined by the words "her doctor's" — her doctor's patients, her doctor's
    schedule. Without a named doctor those permissions have no meaning, so the app refuses to create
    her without one. Changing it later moves everything she can see to a different doctor at once,
    which is why it is not an ordinary edit.</p>
    <p><strong>Nobody is deleted.</strong> A doctor who leaves is archived. The treatments he recorded are part of a
    patient's medical history and cannot be allowed to vanish with his account.
    <a href="archive-a-person.html">Archive-a-Person</a>.</p>
    <p>Next: <a href="give-someone-a-new-link.html">Give-Someone-a-New-Link</a> · <a href="set-what-each-person-can-see.html">Set-What-Each-Person-Can-See</a> · <a href="choose-a-doctor-colour.html">Choose-a-Doctor-Colour</a> ·
    <a href="roles-and-access.html">Roles-and-Access</a></p>
    </div></body></html>
