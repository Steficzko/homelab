    </style></head><body><div class="wrap">
    <div class="crumb"><a href="index.html">Gompha Manual</a></div>
    <div class="draft">Draft — this manual describes the upcoming version of Gompha.</div>
    <hr />
    <h2>tags: [concept, milestone-1]</h2>
    <h1>Roles and Access</h1>
    <p>Gompha has <strong>four roles</strong> and, separately, <strong>one owner</strong>. The role sets sensible starting access;
    the owner can change any of it per person.</p>
    <h2>The four roles</h2>
    <table>
    <thead>
    <tr>
    <th>Role</th>
    <th>Who it is</th>
    <th>Can manage people and rooms?</th>
    </tr>
    </thead>
    <tbody>
    <tr>
    <td><strong>Admin doctor</strong></td>
    <td>A doctor who also runs the clinic</td>
    <td><strong>Yes</strong></td>
    </tr>
    <tr>
    <td><strong>Associate doctor</strong></td>
    <td>A doctor who treats patients but does not run the place</td>
    <td>No</td>
    </tr>
    <tr>
    <td><strong>Receptionist</strong></td>
    <td>Front desk</td>
    <td>No</td>
    </tr>
    <tr>
    <td><strong>Assistant</strong></td>
    <td>Works alongside one named doctor</td>
    <td>No</td>
    </tr>
    </tbody>
    </table>
    <p><strong>Only an admin doctor can add people, change what they can see, or add rooms.</strong> An associate
    doctor, a receptionist and an assistant cannot see the staff list at all — not a greyed-out button,
    the screen simply is not theirs.</p>
    <h2>The owner (root)</h2>
    <p>One person in each clinic is the <strong>owner</strong>, shown with a green <strong>ROOT</strong> badge. The owner:</p>
    <ul>
    <li>is always an <strong>admin doctor</strong> as well,</li>
    <li>is created when the clinic is first set up, not invited like everyone else,</li>
    <li>lands on the <strong>Welcome</strong> setup screen instead of the ordinary home screen until the clinic's
      details are saved, and like any doctor on <strong>his own treatment list</strong> after that
      (<a href="set-up-your-clinic.html">Set-Up-Your-Clinic</a>, <a href="set-up-your-treatment-list.html">Set-Up-Your-Treatment-List</a>),</li>
    <li>cannot be deactivated while they are the only owner.</li>
    </ul>
    <p><strong>Root is the ownership relationship with Gompha</strong>, not a job title. It is who decides who the users
    are. The clinical roles above are the jobs.</p>
    <h2>An assistant works under exactly one doctor</h2>
    <p>An assistant must be given a <strong>supervising doctor</strong> when she is created, and she is the only role
    that has one. Her card shows it as <em>"Assistant · under Dr …"</em>.</p>
    <p>This is not decoration. Half her permissions read <em>"her doctor's"</em> — her doctor's patients, her
    doctor's schedule (<a href="set-what-each-person-can-see.html">Set-What-Each-Person-Can-See</a>). Change the doctor and everything she can see
    moves at once, which is why it is a deliberate, recorded change rather than an ordinary edit. <strong>In
    Milestone 1 it cannot be changed on screen at all</strong>, so choose it correctly when you add her.</p>
    <p><strong>Her view only exists while his account does.</strong> Everything she sees <em>through</em> her doctor is there
    only while his account is live and in use:</p>
    <ul>
    <li><strong>He is archived</strong> → she stops seeing his side of the clinic in the same instant, even if she is
      already signed in on a tablet. Her own account keeps working; there is simply nothing of his left
      in it.</li>
    <li><strong>He has not opened his invite yet</strong> → she sees nothing of his either, because there is no active
      doctor for her to be attached to. It appears the moment he sets his password
      (<a href="activate-your-account.html">Activate-Your-Account</a>).</li>
    </ul>
    <p>If a new assistant reports that she "can't see anything", check her doctor's card first. That is
    almost always the answer.</p>
    <h2>What each person can see</h2>
    <p>Five sections, each set to All, Own or None, per person. That is its own page:
    <a href="set-what-each-person-can-see.html">Set-What-Each-Person-Can-See</a>.</p>
    <p><strong>One of the five already does something today.</strong> <strong>Financial information</strong> decides whether a
    person sees prices on a treatment list. Set to <strong>None</strong> — which is the normal setting for reception
    and for an assistant — a price shows as <strong>Hidden</strong> behind a small padlock, and cannot be typed. The
    other four are recorded and take effect as their modules arrive.</p>
    <h2>A doctor's treatment list is his own, and no setting opens it</h2>
    <p>Prices, times and the treatments themselves belong to <strong>one named doctor</strong>
    (<a href="set-up-your-treatment-list.html">Set-Up-Your-Treatment-List</a>). There is no access level — not All, not the owner's, not an
    admin doctor's — that lets one doctor open another's list. It is not a permission that has been
    left switched off; the screen does not exist and the server refuses the request
    (<code>GMP-1316</code>, <a href="error-codes.html">Error-Codes</a>).</p>
    <p>An assistant is the one exception in the design: what she may read follows her supervising doctor,
    so the treatments in her reach are his. In this version she has no screen to reach them from.</p>
    <h2>One person, one account</h2>
    <p>A person is one account, however many devices they use. A doctor on his phone, on the chair-side
    tablet and at the front desk is <strong>one</strong> person and <strong>one</strong> licensed seat, not three
    (<a href="what-your-licence-covers.html">What-Your-Licence-Covers</a>).</p>
    <p><strong>Never share a login.</strong> With a shared account the record of who did what becomes worthless, and
    that record is the only thing that can answer "who changed this patient's note?".</p>
    <h2>Nobody is deleted</h2>
    <p>A person who leaves is <strong>archived</strong>, never erased. Their sessions stop working immediately and they
    can no longer sign in, but the record of what they did stays — a treatment recorded by a doctor is
    part of a patient's medical history and cannot leave with him.</p>
    <p>The owner does this from an <strong>Archive</strong> button on the person's card. There is no Delete anywhere in
    Gompha. See <a href="archive-a-person.html">Archive-a-Person</a> — and read it before pressing, because <strong>bringing an archived
    person back is not in this version</strong>.</p>
    <h2>Every action is recorded</h2>
    <p>Gompha keeps a permanent, append-only record of who did what: a person invited, a password reset, a
    permission changed, a supervisor changed, a room created. It records <strong>which</strong> fields changed, never
    their values — the record of a change must not become a second copy of the data it describes.</p>
    <p><strong>There is no screen for reading it yet in Milestone 1.</strong> The owner controls who <em>will</em> be able to
    read it, and by default that is admin doctors as well as the owner.</p>
    <h2>Why it works this way</h2>
    <p><strong>Role first, then per-person adjustment.</strong> A role that could not be adjusted would force every
    clinic into one shape, and every Iraqi clinic is arranged slightly differently. A role that carried
    <em>no</em> defaults would leave someone deciding twenty switches for each new hire, at the moment when
    they are most likely to click "All" to get it over with.</p>
    <p><strong>Managing people is limited to admin doctors, not "everyone senior".</strong> Whoever can grant access can
    grant themselves access to everything. That has to be a short list.</p>
    <p><strong>Nobody is locked out permanently by accident.</strong> The owner can mint anyone a fresh link at any
    time (<a href="give-someone-a-new-link.html">Give-Someone-a-New-Link</a>) and can correct a wrong email
    (<a href="fix-a-persons-details.html">Fix-a-Persons-Details</a>). Losing access to an account has to be a decision, never a typo.</p>
    <p>Next: <a href="set-what-each-person-can-see.html">Set-What-Each-Person-Can-See</a> · <a href="add-a-staff-member.html">Add-a-Staff-Member</a> · <a href="clinic-admin.html">Clinic-Admin</a> · <a href="home.html">Home</a></p>
    </div></body></html>
