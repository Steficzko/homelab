    <div class="crumb"><a href="index.html">Gompha Manual</a></div>
    <div class="draft">Draft — this manual describes the upcoming version of Gompha.</div>
    <hr />
    <p>tags: [task, milestone-1, screen/error, support]
    screen: Couldn't load this (error box)</p>
    <hr />
    <h1>When Something Goes Wrong</h1>
    <p>When part of a screen fails to load, Gompha shows a soft red box:</p>
    <blockquote>
    <p><strong>Couldn't load this.</strong> Nothing was lost. <strong>Try again</strong>.</p>
    </blockquote>
    <p>Under it there is a <strong>Retry</strong> button, and — when the server told the app what went wrong — a short
    line like this:</p>
    <blockquote>
    <p><code>GMP-1304 · 7F3A9C21</code>   <strong>Report this</strong></p>
    </blockquote>
    <p>Those two things are the whole point of this page. <strong>Please send them.</strong> Thirty seconds of your
    time turns "the app is broken" into something we can find in a second.</p>
    <h2>Steps</h2>
    <ol>
    <li><strong>Press Retry first.</strong> Most failures are a hiccup and it works the second time. If it does, you
       are done — there is nothing to tell us.</li>
    <li>If it fails again, <strong>read the code out to whoever you are telling</strong>: it is short and it is
       meant to be said down a phone. <code>GMP</code> then four digits.</li>
    <li>Press <strong>Report this</strong>.</li>
    <li>Your own email program opens with a message already written to <strong>support@gompha.com</strong>. The
       subject is <em>Gompha problem GMP-…</em>.</li>
    <li>The message starts with <strong>"What were you doing when this happened?"</strong> and a blank space.
       <strong>Write one sentence there.</strong> "I pressed Continue to rooms and it did this" is worth more than
       everything else in the mail.</li>
    <li>Leave the lines below the dashes exactly as they are. Press send.</li>
    </ol>
    <p>If <strong>Report this</strong> does not appear, the server did not give a code. Press <strong>Retry</strong>, and if it
    keeps failing, tell us which screen you were on and roughly when.</p>
    <p><strong>If we ask which version you are on</strong>, it is the small grey number beside the word <em>Gompha</em> at the
    top left of the screen, for example <code>v0.1.14</code>. Everybody can see it.</p>
    <h2>What the email contains, and what it does not</h2>
    <p>The message carries <strong>four identifiers and nothing else</strong>:</p>
    <table>
    <thead>
    <tr>
    <th>Line</th>
    <th>What it is</th>
    </tr>
    </thead>
    <tbody>
    <tr>
    <td><code>code</code></td>
    <td>The kind of thing that went wrong, e.g. <code>GMP-1304</code>. See <a href="error-codes.html">Error-Codes</a>.</td>
    </tr>
    <tr>
    <td><code>reference</code></td>
    <td>A short block of characters naming <strong>this one attempt</strong>, e.g. <code>7F3A9C21</code>.</td>
    </tr>
    <tr>
    <td><code>screen</code></td>
    <td>Which screen it happened on — a short fixed word such as <code>rooms</code> or <code>home</code>.</td>
    </tr>
    <tr>
    <td><code>time</code></td>
    <td>When.</td>
    </tr>
    </tbody>
    </table>
    <p><strong>No patient name. No clinical note. No password. Nothing typed into the page.</strong> Whatever you
    write in the blank space at the top is yours; the app harvests nothing from the screen.</p>
    <p>It leaves from <strong>your own mailbox</strong>, using your own email program. Gompha does not send it and
    cannot: nothing about your email account is inside the app. That also means that if there is no
    email set up on that phone, <strong>Report this</strong> may do nothing — in that case read the code and the
    reference to whoever you are telling, or photograph the line.</p>
    <h2>The two numbers, and why there are two</h2>
    <ul>
    <li><strong>The code</strong> says <em>what kind of problem</em>. It is stable: <code>GMP-1201</code> means the same thing today and
      next year, in every clinic. It is what tells anyone reading it whether this is something you can
      fix yourself. <a href="error-codes.html">Error-Codes</a> lists them all.</li>
    <li><strong>The reference</strong> says <em>which attempt</em>. It matches this exact request in our records, so we can
      read the full story of what happened without you having to describe it, and without any of your
      clinic's data ever leaving the building.</li>
    </ul>
    <h2>Not every message is a fault</h2>
    <p>Three things look like problems and are not. Do not send those.</p>
    <ul>
    <li><strong>"No connection — viewing cached data, read-only."</strong> The internet dropped. <a href="working-offline.html">Working-Offline</a>.</li>
    <li><strong>"The clinic is read-only."</strong> The licence needs renewing. <a href="what-your-licence-covers.html">What-Your-Licence-Covers</a>.</li>
    <li><strong>A plain sentence under a field</strong> — a name left blank, an email with no <code>@</code>, a password too
      short. Fix it and carry on.</li>
    </ul>
    <h2>Why it works this way</h2>
    <p><strong>A clinic can only report what it can see.</strong> Before the code was on screen, the only thing anyone
    could say was "it does not work", and a problem that breaks one workflow three hundred times a week
    never reaches anybody who could fix it. A code and a reference are what make a real report possible
    from a busy front desk.</p>
    <p><strong>The detail stays here, not in the email.</strong> Everything about what actually happened is already
    written down on our side, and the reference points straight at it. That is what lets the message be
    four short lines — an email leaves the clinic, and a patient's details must never be in one.</p>
    <p><strong>It opens your own email rather than sending for you.</strong> It arrives from the clinic, so we know who
    it is without putting your clinic's identity in the message; you can add a sentence no automatic
    report could ever guess; and it needs no connection to anything of ours to work.</p>
    <p>Next: <a href="error-codes.html">Error-Codes</a> · <a href="working-offline.html">Working-Offline</a> · <a href="home.html">Home</a></p>
    </div></body></html>
