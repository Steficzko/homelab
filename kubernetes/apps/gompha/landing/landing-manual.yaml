    <div class="draft">Draft — this manual describes the upcoming version of Gompha.</div>
    <hr />
    <p>tags: [task, milestone-1, phone]
    screen: Home screen install</p>
    <hr />
    <h1>Install the App on a Phone</h1>
    <p>Gompha is a website that behaves like an app. There is nothing to download from an app store. You
    add it to the phone's home screen and it opens in its own window, without the browser's address bar.</p>
    <h2>On Android (Chrome)</h2>
    <ol>
    <li>Open <strong>https://app-staging.gompha.com</strong> in Chrome.</li>
    <li>Press the <strong>⋮</strong> menu at the top right.</li>
    <li>Choose <strong>Install app</strong>, or <strong>Add to Home screen</strong> if that is what your Chrome calls it.</li>
    <li>Confirm. A <strong>Gompha</strong> icon appears with your other apps.</li>
    </ol>
    <h2>On iPhone or iPad (Safari)</h2>
    <ol>
    <li>Open <strong>https://app-staging.gompha.com</strong> in <strong>Safari</strong>. It must be Safari — Chrome on an iPhone
       cannot add to the home screen.</li>
    <li>Press the <strong>Share</strong> button (the square with the arrow going up), at the bottom of the screen on
       a phone and the top on an iPad.</li>
    <li>Scroll down and choose <strong>Add to Home Screen</strong>.</li>
    <li>Press <strong>Add</strong>. A <strong>Gompha</strong> icon appears on the home screen.</li>
    </ol>
    <p><strong>⚠ verify</strong> — the icon that iOS shows on the home screen has not been checked on a real iPhone. If
    it appears as a small picture of the page rather than the green Gompha mark, that is cosmetic; the
    app itself works. Report it.</p>
    <h2>What installing does and does not give you</h2>
    <p><strong>It does give you:</strong></p>
    <ul>
    <li>Its own icon and its own window, with no address bar taking up space</li>
    <li>One tap instead of typing an address</li>
    <li>The correct size and colours for the phone</li>
    </ul>
    <p><strong>It does not give you offline use.</strong> This is the part staff misread. Opening the installed app
    without a connection gives the browser's <em>cannot reach this site</em> page, not Gompha. Nothing is
    broken and nothing is lost — the app simply needs the clinic server to show you anything at all.
    Read <a href="working-offline.html">Working-Offline</a>; it matters more than this page does.</p>
    <h2>Why it works this way</h2>
    <p><strong>No app store.</strong> An app store version would mean a review queue between a fix and the clinic
    having it, plus store rules about payments the product deliberately stays clear of. A website
    updates the moment it is deployed, and every device gets the same version.</p>
    <p><strong>Install it anyway, even though it looks optional.</strong> A phone that has the app on its home screen
    is a phone that has been given permission to behave like an app — which is what appointment
    reminders will need later. A clinic that skips this step discovers it the day a reminder does not
    arrive.</p>
    <p>Next: <a href="working-offline.html">Working-Offline</a> · <a href="switch-to-dark-mode.html">Switch-to-Dark-Mode</a> · <a href="home.html">Home</a></p>
    </div></body></html>
  "organise-your-treatment-list.html": |
    <!doctype html><html lang="en"><head><meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Organise Your Treatment List · Gompha Manual</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Sans+Arabic&display=swap" rel="stylesheet">
    <style>
    body{margin:0;background:#FAF8F4;color:#3D3A34;font:15px/1.65 "IBM Plex Sans","IBM Plex Sans Arabic",sans-serif}
    .wrap{max-width:760px;margin:0 auto;padding:40px 24px 80px}
    a{color:#2E5D51} .dead{color:#98917F;border-bottom:1px dashed #C9C2B2}
    h1,h2,h3{line-height:1.3} h1{font-size:26px}
    code{background:#F1EDE6;border-radius:5px;padding:2px 6px}
    .crumb{font-size:13px;color:#98917F;margin-bottom:28px} .crumb a{color:#6B655A;text-decoration:none}
