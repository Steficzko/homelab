    <div class="crumb"><a href="index.html">Gompha Manual</a></div>
    <div class="draft">Draft — this manual describes the upcoming version of Gompha.</div>
    <hr />
    <h2>tags: [roadmap]</h2>
    <h1>Roadmap</h1>
    <p>Things that are decided but <strong>not live</strong>. One line each. No dates. Nothing here is usable today,
    and nothing here should be shown to a clinic as a feature.</p>
    <p>When one of these ships, it leaves this page and becomes a real page in the vault.</p>
    <h2>Decided, not built</h2>
    <ul>
    <li>The app is online-first: the server is the single source of truth for every write, and there is
      no writable offline replica. Offline means viewing cached data, read-only — see
      <a href="working-offline.html">Working-Offline</a>.</li>
    <li>Licensing and provisioning service — designed, no code (<code>docs/specs/licensing.md</code>).</li>
    <li>The licence itself is checked on the device and does not need the internet — but that is
      separate from the app's data, which does need a connection to book, take payments or add notes.</li>
    <li>A lapsed licence turns the app read-only; the 3-day grace before that happens is a licence
      allowance, not an offline data buffer.</li>
    <li>What a clinic may do is carried in its own licence, so a deal never needs a new release.</li>
    <li>Staff seats are counted per role — so many doctors, so many assistants, so many receptionists.</li>
    <li>A seat is a person, not a device: one person on a phone, a tablet and the front desk is one seat.</li>
    <li>Clinics that buy their own branding get their own domain and look.</li>
    <li>Email from the system is sent using the clinic's own mail account, switched on only after a test
      message actually arrives.</li>
    <li>No billing, invoicing or payment inside the product — money is arranged out of band, as clinics
      here actually buy.</li>
    </ul>
    <h2>Not yet designed</h2>
    <p>Everything else — patients, appointments, the tooth chart, treatments, payments, the day view,
    the phone app. Nothing has been specified, so nothing is promised here.</p>
    <p>Back to <a href="home.html">Home</a>.</p>
    </div></body></html>
