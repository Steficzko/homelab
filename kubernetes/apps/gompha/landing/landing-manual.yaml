    <div class="crumb"><a href="index.html">Gompha Manual</a></div>
    <div class="draft">Draft — this manual describes the upcoming version of Gompha.</div>
    <hr />
    <p>tags: [task, milestone-1, screen/services, doctor]
    screen: Your treatments (services &amp; timings)</p>
    <hr />
    <h1>Set Up Your Treatment List</h1>
    <p><strong>For doctors only.</strong> This is your own list of the treatments you do, with your price and how long
    each one takes. Nobody else's list is on it, and no other doctor can see yours
    (<a href="roles-and-access.html">Roles-and-Access</a>).</p>
    <h2>Where it is</h2>
    <ul>
    <li><strong>Until you have finished it once, it opens by itself every time you sign in.</strong> You do not have
      to look for it.</li>
    <li><strong>Afterwards:</strong> press the <strong>gear</strong> at the top right, and under <strong>Your work</strong> press
      <strong>Set up services &amp; timings</strong>.</li>
    </ul>
    <p>"Finished once" means you reached the end and pressed <strong>Finish</strong>. Pressing <strong>Later</strong> does not count
    — it lets you past for that sign-in, and the screen opens again next time.</p>
    <p>Receptionists and assistants have no such screen and no button for it. That is correct.</p>
    <h2>What you are looking at</h2>
    <p>Across the top: <strong>1 · Your treatments</strong> and <strong>2 · Your materials</strong>. Two named steps, not a wizard
    you are trapped in.</p>
    <p>Under the greeting:</p>
    <ul>
    <li>a <strong>search box</strong> — <em>Search a name or a code</em></li>
    <li><strong>+ Add a treatment</strong> and <strong>+ New category</strong></li>
    <li><strong>your list</strong>, one treatment per line</li>
    <li>at the bottom, <strong>Later</strong> and <strong>Continue →</strong></li>
    </ul>
    <p>Each line shows, left to right on a computer: the <strong>treatment name</strong>, the <strong>chair time</strong>, the
    <strong>price</strong>, and a faint <strong>≈</strong> figure in the other currency. On a phone the same line wraps into two:
    name and price on top, code and time underneath.</p>
    <p>Where a price or a chair time has never been filled in, the line says <strong>Add price</strong> or <strong>Add chair
    time</strong> instead, in the same size as a real figure. It is an empty field, not a mistake.</p>
    <p>Above the list, if any are unpriced, one grey sentence counts them: <em>"5 treatments have no price
    yet."</em></p>
    <p><strong>If your list is empty</strong>, you get a dashed box saying <strong>Your list is empty</strong> with one button, and
    under it three faint example lines marked <strong>EXAMPLE</strong> — <em>Cleaning / Scaling</em>, <em>Composite Filling</em>,
    <em>Diagnosis</em>. They are there to show you the shape of a line. They are not yours, they are not real
    prices, and pressing them does nothing.</p>
    <h2>Steps</h2>
    <ol>
    <li>Sign in. If the treatment list does not open by itself, press the <strong>gear</strong> → <strong>Set up services
       &amp; timings</strong>.</li>
    <li>Read down the list. If there is anything on it already, it was typed in from a price sheet you
       gave us — see below.</li>
    <li>Press any line to open it and correct it. <a href="add-a-treatment.html">Add-a-Treatment</a>.</li>
    <li>Press <strong>+ Add a treatment</strong> for anything you do that is missing.</li>
    <li>Fill in every <strong>Add price</strong> and <strong>Add chair time</strong> you can see.</li>
    <li>Press <strong>Continue →</strong>. Step 2, <strong>Your materials</strong>, has nothing to do today — it is a sentence
       telling you what will live there when inventory arrives.</li>
    <li>Press <strong>Finish</strong>. You land on the plain <strong>"You're signed in"</strong> page.</li>
    </ol>
    <p>Nothing here is final. You can change any of it, any day.</p>
    <h2>If your list arrived already filled in</h2>
    <p>Most doctors' lists are not empty on the first sign-in. Before the clinic went live we typed in the
    price sheet each doctor gave us.</p>
    <ul>
    <li><strong>Open a line and look at the bottom of the box.</strong> A small grey note says where the row came
      from, and <em>"Your sheet said: …"</em> — the original wording, kept so you can check we read it right.</li>
    <li><strong>Blanks are deliberate.</strong> Where the sheet had no price, or no time, or something we could not
      read, the field was left empty rather than guessed. That is what <strong>Add price</strong> and <strong>Add chair
      time</strong> are marking. <strong>An empty price is not zero and not free.</strong></li>
    <li><strong>Anything you have already changed yourself is never overwritten.</strong> If we load a corrected sheet
      later, rows you have edited are left exactly as you left them.</li>
    <li><strong>A treatment you do that is not on the list is yours to add.</strong> Where a sheet was unclear — the
      same treatment written twice with two different prices, for instance — we deliberately did not
      choose for you. Press <strong>+ Add a treatment</strong> and put in the one you actually use, with the price
      you actually charge. <strong>This is not missing data and there is nothing for us to fix.</strong></li>
    <li><strong>Treatments you told us you no longer offer are not gone.</strong> They are under <strong>Recently deleted</strong>
      at the bottom of the list, and one press brings any of them back.
      <a href="delete-and-restore-a-treatment.html">Delete-and-Restore-a-Treatment</a>.</li>
    </ul>
    <h2>What this list does not do yet</h2>
    <ul>
    <li><strong>Reception cannot book from it yet</strong>, because there is no schedule yet. The list is being built
      now so that it is ready and correct on the day the schedule arrives.</li>
    <li><strong>The owner cannot open another doctor's list</strong>, not even to help. Ask the doctor to open his own.</li>
    <li><strong>Prices follow access.</strong> If someone's <strong>Financial information</strong> is set to <strong>None</strong>, they see the
      word <strong>Hidden</strong> with a small padlock where a price would be, on any list they can reach
      (<a href="set-what-each-person-can-see.html">Set-What-Each-Person-Can-See</a>).</li>
    </ul>
    <h2>Why it works this way</h2>
    <p><strong>Your list, not the clinic's.</strong> Two doctors in one clinic charge different prices, work at
    different speeds and call the same treatment by different names. An earlier design had one shared
    clinic list; it was withdrawn because it forced doctors to agree on wording before anyone could
    book. Nobody has to negotiate with a colleague to add a line to his own list.</p>
    <p><strong>The screen keeps coming back until you finish it.</strong> <strong>Later</strong> is real and always works, but it
    lasts for that sign-in only. There is deliberately no <em>"don't show this again"</em>: a doctor with no
    treatments cannot be booked once the schedule lands, and a box he dismissed in his first week would
    be a poor reason for that.</p>
    <p><strong>We fill in what we can read, and stop there.</strong> Where a price sheet is ambiguous, guessing puts a
    number in front of a patient that no one at the clinic chose. The doctor is the only person who can
    settle it, so the blank is left for him — and it shows up as <strong>Add price</strong>, every time he opens the
    screen, until he does.</p>
    <p>Next: <a href="add-a-treatment.html">Add-a-Treatment</a> · <a href="organise-your-treatment-list.html">Organise-Your-Treatment-List</a> ·
    <a href="delete-and-restore-a-treatment.html">Delete-and-Restore-a-Treatment</a> · <a href="doctor.html">Doctor</a> · <a href="home.html">Home</a></p>
    </div></body></html>
  "set-what-each-person-can-see.html": |
    <!doctype html><html lang="en"><head><meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Set What Each Person Can See · Gompha Manual</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Sans+Arabic&display=swap" rel="stylesheet">
    <style>
    body{margin:0;background:#FAF8F4;color:#3D3A34;font:15px/1.65 "IBM Plex Sans","IBM Plex Sans Arabic",sans-serif}
    .wrap{max-width:760px;margin:0 auto;padding:40px 24px 80px}
    a{color:#2E5D51} .dead{color:#98917F;border-bottom:1px dashed #C9C2B2}
    h1,h2,h3{line-height:1.3} h1{font-size:26px}
    code{background:#F1EDE6;border-radius:5px;padding:2px 6px}
    .crumb{font-size:13px;color:#98917F;margin-bottom:28px} .crumb a{color:#6B655A;text-decoration:none}
    .draft{background:#F3EDDC;color:#6A5A32;border-radius:9px;padding:9px 14px;font-size:13px;margin-bottom:26px}
    table{border-collapse:collapse} td,th{border:1px solid #E9E3D8;padding:7px 12px;text-align:left}
    </style></head><body><div class="wrap">
    <div class="crumb"><a href="index.html">Gompha Manual</a></div>
    <div class="draft">Draft — this manual describes the upcoming version of Gompha.</div>
    <hr />
    <p>tags: [task, milestone-1, screen/permissions, root]
    screen: Who works here, and what can each see?</p>
    <hr />
    <h1>Set What Each Person Can See</h1>
    <p><strong>For the owner only.</strong> The <strong>people and access</strong> step of <a href="set-up-your-clinic.html">Set-Up-Your-Clinic</a>.</p>
    <p>Every person in the clinic gets one card. On each card there are <strong>five sections</strong>, and each
    section is set to <strong>All</strong>, <strong>Own</strong> or <strong>None</strong>.</p>
    <h2>What a card shows</h2>
    <p>Reading down a card:</p>
    <ul>
    <li><strong>Initials, name and email</strong> at the top. A doctor's initials sit on a soft wash of their
      schedule colour.</li>
    <li><strong>A grey badge with the role</strong>, and for an assistant, <em>"· under <doctor's name>"</em> after it.</li>
    <li><strong>A green ROOT badge</strong> on the owner's own card.</li>
    <li><strong>An Invited badge</strong> on anyone who has not set their password yet, plus a <strong>Copy invite link</strong>
      button while it is still available (<a href="add-a-staff-member.html">Add-a-Staff-Member</a>).</li>
    <li><strong>The five sections</strong>, each with its own <strong>All / Own / None</strong> control.</li>
    <li><strong>Doctor colour</strong>, on doctors only (<a href="choose-a-doctor-colour.html">Choose-a-Doctor-Colour</a>).</li>
    </ul>
    <h2>Steps</h2>
    <ol>
    <li>Find the person's card in the grid.</li>
    <li>Find the section you want to change.</li>
    <li>Press <strong>All</strong>, <strong>Own</strong> or <strong>None</strong>.</li>
    </ol>
    <p>That is the whole action. <strong>There is no Save button</strong> — the change is sent to the server as you
    press it. The line at the bottom of the step reads <em>"Changes save as you go"</em>.</p>
    <p>If a change cannot be saved, a red strip appears at the top of the step reading <strong>"Couldn't save
    that change. Nothing was lost."</strong> with the reason, and the button springs back to what it was.
    Nothing is left half-set.</p>
    <h2>The five sections</h2>
    <table>
    <thead>
    <tr>
    <th>Section</th>
    <th>What it covers</th>
    </tr>
    </thead>
    <tbody>
    <tr>
    <td><strong>Financial information</strong></td>
    <td>The clinic's and a doctor's own money — takings, profit and loss</td>
    </tr>
    <tr>
    <td><strong>Patient financial record</strong></td>
    <td>What a patient owes and has paid</td>
    </tr>
    <tr>
    <td><strong>Schedule</strong></td>
    <td>The appointment book</td>
    </tr>
    <tr>
    <td><strong>Patients as contacts</strong></td>
    <td>A patient's name and phone number, enough to call and confirm</td>
    </tr>
    <tr>
    <td><strong>Patients as medical</strong></td>
    <td>The clinical record — the treatments and the notes</td>
    </tr>
    </tbody>
    </table>
    <h2>What All, Own and None mean</h2>
    <ul>
    <li><strong>All</strong> — everyone's.</li>
    <li><strong>None</strong> — nothing at all.</li>
    <li><strong>Own</strong> — <em>their doctor's</em>, and this is the one worth being precise about:</li>
    <li>for a <strong>doctor</strong>, "own" means his own,</li>
    <li>for an <strong>assistant</strong>, "own" means the doctor she works under,</li>
    <li>for a <strong>receptionist</strong>, "own" means <strong>nothing</strong>, because she is attached to no doctor. Do not
        use <strong>Own</strong> for reception. Use <strong>All</strong> or <strong>None</strong>.</li>
    </ul>
    <h2>The starting point per role</h2>
    <p>Picking a role fills the five sections in for you. These are sensible starting values, not rules:
    change any of them.</p>
    <table>
    <thead>
    <tr>
    <th></th>
    <th>Financial information</th>
    <th>Patient financial record</th>
    <th>Schedule</th>
    <th>Patients as contacts</th>
    <th>Patients as medical</th>
    </tr>
    </thead>
    <tbody>
    <tr>
    <td><strong>Admin doctor</strong></td>
    <td>Own</td>
    <td>All</td>
    <td>All</td>
    <td>All</td>
    <td>All</td>
    </tr>
    <tr>
    <td><strong>Associate doctor</strong></td>
    <td>Own</td>
    <td>Own</td>
    <td>All</td>
    <td>Own</td>
    <td>Own</td>
    </tr>
    <tr>
    <td><strong>Receptionist</strong></td>
    <td>None</td>
    <td>All</td>
    <td>All</td>
    <td>All</td>
    <td>None</td>
    </tr>
    <tr>
    <td><strong>Assistant</strong></td>
    <td>None</td>
    <td>Own</td>
    <td>Own</td>
    <td>Own</td>
    <td>Own</td>
    </tr>
    </tbody>
    </table>
    <p><strong>When you change one away from its starting value, the button is underlined and carries a small
    coloured dot</strong>, and hovering it says <em>"Changed from the default"</em>. The legend under the grid spells
    this out. It means you can scan a whole clinic's worth of cards and see instantly where this clinic
    does something unusual.</p>
    <h2>What these settings do today</h2>
    <p><strong>They are recorded, and they take effect on each screen as that screen ships.</strong> In Milestone 1
    there is no schedule and no patient record, so there is nothing yet for <strong>None</strong> to hide.
    <a href="whats-not-here-yet.html">Whats-Not-Here-Yet</a> explains the sequence. Setting them now is not busywork: the later modules
    read these values from the start rather than having access bolted on afterwards.</p>
    <h2>Why it works this way</h2>
    <p><strong>Five sections, not one "can see patients" switch.</strong> A receptionist must ring a patient to confirm
    tomorrow's appointment, and must never read his clinical notes. A name and a phone number are a
    different thing from a medical record, and one switch cannot separate them. Splitting money the
    same way is the other half: what a patient owes is front-desk work; what the clinic earns is not.</p>
    <p><strong>An admin doctor's own money defaults to Own, not All.</strong> Two admin doctors are equals, not
    partners in each other's earnings. Personal takings stay personal unless the owner decides
    otherwise.</p>
    <p><strong>An assistant's Financial information starts at None.</strong> For her, "own" would mean <em>her doctor's</em>
    earnings. That may be exactly right in some clinics, but it must be a decision the owner makes on
    purpose, never a default that quietly hands it over.</p>
    <p><strong>The same word governs money and clinical data.</strong> One rule for what "own" means, applied to all
    five sections, so nobody has to remember an exception.</p>
    <p><strong>A hidden button is not access control.</strong> Access is decided on the server on every request, never
    by which buttons a screen happens to draw. Someone who tampers with the page in their browser gains
    nothing, because the screen was never what was stopping them. As each module arrives, the same
    five values are also enforced inside the database itself, one layer below the app — so a mistake in
    the app cannot open a door the database still holds shut.</p>
    <p>Next: <a href="roles-and-access.html">Roles-and-Access</a> · <a href="add-a-staff-member.html">Add-a-Staff-Member</a> · <a href="home.html">Home</a></p>
    </div></body></html>
  "sign-in.html": |
    <!doctype html><html lang="en"><head><meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Sign In · Gompha Manual</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Sans+Arabic&display=swap" rel="stylesheet">
    <style>
    body{margin:0;background:#FAF8F4;color:#3D3A34;font:15px/1.65 "IBM Plex Sans","IBM Plex Sans Arabic",sans-serif}
    .wrap{max-width:760px;margin:0 auto;padding:40px 24px 80px}
    a{color:#2E5D51} .dead{color:#98917F;border-bottom:1px dashed #C9C2B2}
    h1,h2,h3{line-height:1.3} h1{font-size:26px}
    code{background:#F1EDE6;border-radius:5px;padding:2px 6px}
    .crumb{font-size:13px;color:#98917F;margin-bottom:28px} .crumb a{color:#6B655A;text-decoration:none}
    .draft{background:#F3EDDC;color:#6A5A32;border-radius:9px;padding:9px 14px;font-size:13px;margin-bottom:26px}
    table{border-collapse:collapse} td,th{border:1px solid #E9E3D8;padding:7px 12px;text-align:left}
    </style></head><body><div class="wrap">
    <div class="crumb"><a href="index.html">Gompha Manual</a></div>
    <div class="draft">Draft — this manual describes the upcoming version of Gompha.</div>
    <hr />
    <p>tags: [task, milestone-1, screen/login]
    screen: Sign in</p>
    <hr />
    <h1>Sign In and Out</h1>
    <p>Everyone starts here. One screen, two fields.</p>
    <h2>Sign in</h2>
    <ol>
    <li>Open <strong>https://app-staging.gompha.com</strong> in the browser (Chrome or Safari, phone or desktop).</li>
    <li>You get a small card in the middle of the screen with the green <strong>G</strong> mark above it and the
       heading <strong>Sign in</strong>.</li>
    <li>Type your work email in <strong>Email</strong>. It is always typed left to right, even on an Arabic
       keyboard.</li>
    <li>Type your password in <strong>Password</strong>. The small eye button at the right-hand end of the field
       shows what you typed, in case of a mistyped character.</li>
    <li>Press <strong>Sign in</strong>.</li>
    </ol>
    <p>Where you land depends on who you are:</p>
    <ul>
    <li><strong>The owner (root)</strong>, before the clinic's details are saved, lands on the setup screen,
      <strong>Welcome</strong>. See <a href="set-up-your-clinic.html">Set-Up-Your-Clinic</a>.</li>
    <li><strong>Any doctor</strong>, including the owner once setup is done, lands on <strong>his own treatment list</strong> —
      every sign-in, until he has worked through it once and pressed <strong>Finish</strong>.
      See <a href="set-up-your-treatment-list.html">Set-Up-Your-Treatment-List</a>.</li>
    <li><strong>Everyone else</strong>, and every doctor who has finished that, lands on a short page that says
      <em>"You're signed in"</em>, names your role, and lists the clinic's rooms. In Milestone 1 that is all
      there is. See <a href="whats-not-here-yet.html">Whats-Not-Here-Yet</a>.</li>
    </ul>
    <p>Both screens carry the Gompha mark top-left with <strong>powered by Steficzko</strong> beneath it, and the same
    credit again at the very bottom of the page. It is the maker's name, and pressing it opens their
    page in a new tab. Nothing about your clinic is in it.</p>
    <p><strong>No password yet?</strong> You cannot sign in until you have set one from your invite link. See
    <a href="activate-your-account.html">Activate-Your-Account</a>.</p>
    <p><strong>Forgotten your password?</strong> Ask the clinic owner — no email is sent. See
    <a href="reset-your-password.html">Reset-Your-Password</a>.</p>
    <h2>Sign out</h2>
    <ol>
    <li>Press the <strong>gear icon in the top-right corner</strong> of the screen.</li>
    <li>A popup opens in the middle of the screen, headed <strong>Settings</strong>. On a phone it fills the screen.</li>
    <li><strong>Sign out</strong> is the button at the bottom of that popup.</li>
    </ol>
    <p>Signing out ends the session on the server, not only in this browser. Closing the tab is <em>not</em>
    signing out.</p>
    <h2>What the messages mean</h2>
    <table>
    <thead>
    <tr>
    <th>On screen</th>
    <th>What it means</th>
    <th>What to do</th>
    </tr>
    </thead>
    <tbody>
    <tr>
    <td><strong>Invalid email or password.</strong></td>
    <td>One of the two is wrong. The app deliberately does not say which.</td>
    <td>Retype the password. Then check the email spelling.</td>
    </tr>
    <tr>
    <td><strong>Too many attempts — wait a moment and try again.</strong></td>
    <td>Too many tries in a short time, from this account or this clinic's connection.</td>
    <td>Wait about a minute and try again. Nothing is locked or damaged.</td>
    </tr>
    <tr>
    <td><strong>No connection — viewing cached data, read-only.</strong></td>
    <td>The device cannot reach the clinic server.</td>
    <td>See <a href="working-offline.html">Working-Offline</a>. You cannot sign in while offline.</td>
    </tr>
    <tr>
    <td><strong>Your password was changed. Sign in with your new password.</strong></td>
    <td>You just finished a reset.</td>
    <td>Sign in normally.</td>
    </tr>
    <tr>
    <td><strong>Invalid email or password</strong>, when you are certain both are right</td>
    <td>Your account may have been archived — an archived person cannot sign in.</td>
    <td>Ask the owner. See <a href="archive-a-person.html">Archive-a-Person</a>.</td>
    </tr>
    </tbody>
    </table>
    <h2>Why it works this way</h2>
    <p><strong>"Invalid email or password" never says which one was wrong.</strong> If it did, anyone could type
    addresses into the sign-in box until one produced a different message, and learn who works at the
    clinic. The same reason is why <a href="reset-your-password.html">Reset-Your-Password</a> always says the same reassuring thing
    whatever address you type.</p>
    <p><strong>Signing out really ends the session.</strong> In the first version of Gompha, a session lived in the
    browser, so a person who had left the clinic could still be signed in on a tablet nobody
    remembered. Now the session is a record on the server: ending it there ends it everywhere that
    cookie is used.</p>
    <p><strong>The password is checked on the server, never in the browser.</strong> So is every rule about what you
    may see. A button being missing from a screen is not what stops access; the server refusing is.</p>
    <p>Next: <a href="passwords-and-sessions.html">Passwords-and-Sessions</a> · <a href="roles-and-access.html">Roles-and-Access</a> · <a href="home.html">Home</a></p>
    </div></body></html>
  "switch-to-dark-mode.html": |
    <!doctype html><html lang="en"><head><meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Switch to Dark Mode · Gompha Manual</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Sans+Arabic&display=swap" rel="stylesheet">
    <style>
    body{margin:0;background:#FAF8F4;color:#3D3A34;font:15px/1.65 "IBM Plex Sans","IBM Plex Sans Arabic",sans-serif}
    .wrap{max-width:760px;margin:0 auto;padding:40px 24px 80px}
    a{color:#2E5D51} .dead{color:#98917F;border-bottom:1px dashed #C9C2B2}
    h1,h2,h3{line-height:1.3} h1{font-size:26px}
    code{background:#F1EDE6;border-radius:5px;padding:2px 6px}
    .crumb{font-size:13px;color:#98917F;margin-bottom:28px} .crumb a{color:#6B655A;text-decoration:none}
    .draft{background:#F3EDDC;color:#6A5A32;border-radius:9px;padding:9px 14px;font-size:13px;margin-bottom:26px}
    table{border-collapse:collapse} td,th{border:1px solid #E9E3D8;padding:7px 12px;text-align:left}
    </style></head><body><div class="wrap">
    <div class="crumb"><a href="index.html">Gompha Manual</a></div>
    <div class="draft">Draft — this manual describes the upcoming version of Gompha.</div>
    <hr />
    <p>tags: [task, milestone-1, screen/settings]
    screen: Settings</p>
    <hr />
    <h1>Switch to Dark Mode (and Change the Size)</h1>
    <p>Anyone can do this, on any screen, at any time. Both switches are personal to the device you are
    holding.</p>
    <h2>Steps</h2>
    <ol>
    <li>Press the <strong>gear icon in the top-right corner</strong>.</li>
    <li>A popup opens in the middle of the screen, headed <strong>Settings</strong>. On a phone it fills the screen.</li>
    <li>Under <strong>Appearance</strong>, choose <strong>Light</strong>, <strong>Dark</strong> or <strong>System</strong>.</li>
    <li><strong>System</strong> follows the phone's or laptop's own setting, so the app goes dark in the evening
         with everything else.</li>
    <li>Under <strong>Display density</strong>, choose <strong>Comfortable</strong> or <strong>Compact</strong>.</li>
    <li><strong>Comfortable</strong> — bigger touch targets. Right for phones and chair-side tablets. This is the
         starting setting.</li>
    <li><strong>Compact</strong> — tighter, fits more on screen. Right for the front-desk desktop.</li>
    <li>Close the popup by pressing outside it, or with the close control at its top.</li>
    </ol>
    <p>The change happens at once. There is nothing to save.</p>
    <h2>Where the setting is kept</h2>
    <p><strong>On that device only.</strong> The popup says so: <em>"These settings stay on this device."</em></p>
    <ul>
    <li>The front desk can run <strong>Compact + Light</strong> while the same person's phone runs <strong>Comfortable +
      Dark</strong>.</li>
    <li>It survives closing the browser and signing out.</li>
    <li>It does <strong>not</strong> follow you to another device, and it does not change what anyone else sees.</li>
    </ul>
    <h2>What else is in this popup</h2>
    <ul>
    <li><strong>Your work — Set up services &amp; timings.</strong> Doctors only. It re-opens your own treatment list
      whenever you want it, however finished it is. <a href="set-up-your-treatment-list.html">Set-Up-Your-Treatment-List</a>.</li>
    <li><strong>Sign out</strong>, at the bottom. See <a href="sign-in.html">Sign-In</a>.</li>
    </ul>
    <p>Reception and assistants see the two appearance switches and Sign out, and nothing else.</p>
    <h2>Why it works this way</h2>
    <p><strong>Density is a choice, not a guess about your screen.</strong> Screen width is a poor guide to how the
    device is actually used: a chair-side tablet lives on a bracket at arm's length and needs big
    targets, while a 13-inch laptop at reception wants everything visible at once. The clinic runs mixed
    hardware, so staff choose rather than being measured.</p>
    <p><strong>Per device, not per person.</strong> The front desk machine is used by whoever is standing at it, and it
    should not change size when the shift changes.</p>
    <p><strong>Dark mode is a real theme, not a filter over a light one.</strong> Every colour in Gompha has a dark
    counterpart chosen for it, so a doctor's colour and a warning still mean the same thing at 9pm as at
    9am.</p>
    <p>Next: <a href="sign-in.html">Sign-In</a> · <a href="install-the-app-on-a-phone.html">Install-the-App-on-a-Phone</a> · <a href="home.html">Home</a></p>
    </div></body></html>
