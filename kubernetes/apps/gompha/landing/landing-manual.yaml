    </style></head><body><div class="wrap">
    <div class="crumb"><a href="index.html">Gompha Manual</a></div>
    <div class="draft">Draft — this manual describes the upcoming version of Gompha.</div>
    <hr />
    <p>tags: [task, milestone-1, screen/permissions, root]
    screen: Doctor colour (on a person's card)</p>
    <hr />
    <h1>Choose a Doctor Colour</h1>
    <p><strong>For the owner only.</strong> At the bottom of a <strong>doctor's</strong> card, on the people and access step of
    <a href="set-up-your-clinic.html">Set-Up-Your-Clinic</a>.</p>
    <p>Each doctor gets one colour. Later, on the schedule, that colour is how staff tell one doctor's
    column from another at a glance.</p>
    <h2>Steps</h2>
    <ol>
    <li>Find the doctor's card on the people step.</li>
    <li>At the bottom of the card, past the five access sections, is a row labelled <strong>Doctor colour</strong>
       with a strip of twelve small coloured squares.</li>
    <li>Press the colour you want. The chosen one gets a dark ring and a tick, and the name of the
       colour appears under the strip.</li>
    </ol>
    <p>The change saves immediately. There is no Save button.</p>
    <h2>What you will notice</h2>
    <ul>
    <li><strong>A doctor already has a colour when you add them.</strong> The app hands out the next unused one from
      the twelve, so you never have to do this at all unless you want a particular doctor on a
      particular colour.</li>
    <li><strong>The twelve colours are:</strong> Teal, Amber, Violet, Coral, Blue, Green, Rose, Slate, Sky, Olive,
      Plum, Indigo. Hovering a square tells you which is which.</li>
    <li><strong>A colour already used by another doctor is faded, marked <em>"in use"</em>, and cannot be pressed.</strong>
      Two doctors never share a colour.</li>
    <li><strong>Non-doctors have no colour row at all.</strong> Reception and assistants do not appear on the schedule
      as columns, so a colour would mean nothing.</li>
    <li><strong>An archived doctor keeps his colour</strong>, and it stays out of use (<a href="archive-a-person.html">Archive-a-Person</a>).</li>
    <li><strong>If all twelve are taken</strong>, a thirteenth doctor is added with <strong>No colour yet</strong> under the strip.
      Free one up by moving another doctor, or talk to us.</li>
    </ul>
    <p><strong>A doctor's colour also tints his own card.</strong> The five access controls on that card take his
    colour, so with a dozen cards on screen you can see at a glance whose settings you are changing.
    The words <strong>All / Own / None</strong> and their small monochrome gauge carry the setting itself — the
    colour only says <em>whose card this is</em>.</p>
    <h2>Why it works this way</h2>
    <p><strong>Twelve chosen colours, not a colour wheel.</strong> They are picked to stay readable side by side, in
    light and in dark mode, on the old tablets as well as a new phone. A free colour picker produces
    two near-identical blues in different doctors' hands, and then a receptionist books into the wrong
    column.</p>
    <p><strong>Colour is never the only signal.</strong> A red/green colour-blind dentist cannot separate two columns
    by hue, so every colour here also carries a name, a tick and a written label. The same rule holds
    everywhere in Gompha: colour adds, it never carries meaning alone.</p>
    <p><strong>One colour per clinic, enforced by the server.</strong> The screen fades a taken colour out, and the
    server refuses a clash even if something got past the screen. Two doctors on the same colour would
    make a shared-room schedule unreadable exactly when it is busiest.</p>
    <p><strong>The colour on the card is a deepened version of the dot, not the dot itself.</strong> Several of the
    twelve are too light to put white text on. Rather than dropping those colours, the card uses a
    darker shade of the same hue behind any text, so every doctor's card stays comfortably readable in
    light and dark mode.</p>
    <p>Next: <a href="set-what-each-person-can-see.html">Set-What-Each-Person-Can-See</a> · <a href="add-the-clinic-rooms.html">Add-the-Clinic-Rooms</a> · <a href="home.html">Home</a></p>
    </div></body></html>
  "clinic-admin.html": |
    <!doctype html><html lang="en"><head><meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Clinic Admin · Gompha Manual</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Sans+Arabic&display=swap" rel="stylesheet">
    <style>
    body{margin:0;background:#FAF8F4;color:#3D3A34;font:15px/1.65 "IBM Plex Sans","IBM Plex Sans Arabic",sans-serif}
    .wrap{max-width:760px;margin:0 auto;padding:40px 24px 80px}
    a{color:#2E5D51} .dead{color:#98917F;border-bottom:1px dashed #C9C2B2}
    h1,h2,h3{line-height:1.3} h1{font-size:26px}
    code{background:#F1EDE6;border-radius:5px;padding:2px 6px}
    .crumb{font-size:13px;color:#98917F;margin-bottom:28px} .crumb a{color:#6B655A;text-decoration:none}
    .draft{background:#F3EDDC;color:#6A5A32;border-radius:9px;padding:9px 14px;font-size:13px;margin-bottom:26px}
    table{border-collapse:collapse} td,th{border:1px solid #E9E3D8;padding:7px 12px;text-align:left}
    </style></head><body><div class="wrap">
    <div class="crumb"><a href="index.html">Gompha Manual</a></div>
    <div class="draft">Draft — this manual describes the upcoming version of Gompha.</div>
    <hr />
    <h2>tags: [role, milestone-1, root]</h2>
    <h1>Clinic Admin (Admin Doctor and Owner)</h1>
    <p>In Milestone 1 this is <strong>the only role with real work to do</strong>. The clinic exists in Gompha because
    the owner sets it up.</p>
    <h2>When you sign in</h2>
    <p>You sign in at <strong>https://app-staging.gompha.com</strong> like everyone else (<a href="sign-in.html">Sign-In</a>). <strong>Until the
    clinic setup is finished, you land on Welcome</strong> — the setup screen — not on an ordinary home page.</p>
    <p>Once the clinic's details are saved, that stops: from then on you land where any doctor lands —
    <strong>on your own treatment list</strong> until you have finished that once, and on the plain "You're signed
    in" page after that. <a href="set-up-your-treatment-list.html">Set-Up-Your-Treatment-List</a>.</p>
    <p>Across the top: the Gompha mark on the left, a <strong>gear</strong> on the right. <strong>No menu down the side.</strong>
    Under that, three named boxes: <strong>Permissions</strong>, <strong>Rooms</strong>, <strong>Financials</strong> (dimmed, not built yet).</p>
    <p>Your whole day-one job is those first two boxes.</p>
    <h2>Your work, in order</h2>
    <ol>
    <li><strong>Read the greeting and check your own card.</strong> Your name, your email, a green ROOT badge.
       Collect the emails it asks you for before you go further — each doctor's, reception's, and each
       assistant's along with which doctor she works under.</li>
    <li><strong>Add the doctors first.</strong> <a href="add-a-staff-member.html">Add-a-Staff-Member</a>. Assistants cannot be created until a doctor
       exists to attach them to.</li>
    <li><strong>Add reception and the assistants.</strong></li>
    <li><strong>Send every invite link as you create it.</strong> No email is sent. The link is shown once, on the
       screen, with a <strong>Copy link</strong> button. Leave the screen without copying it and that link is gone
       for good — but you can mint a fresh one from their card whenever you like
       (<a href="give-someone-a-new-link.html">Give-Someone-a-New-Link</a>). Sending it as you go is still the habit worth having.</li>
    <li><strong>Adjust access where this clinic is different.</strong> <a href="set-what-each-person-can-see.html">Set-What-Each-Person-Can-See</a>. The role
       already filled sensible values in; you only touch what differs.</li>
    <li><strong>Set doctor colours</strong> if the automatic ones are not what you want.
       <a href="choose-a-doctor-colour.html">Choose-a-Doctor-Colour</a>.</li>
    <li><strong>Name the rooms.</strong> <a href="add-the-clinic-rooms.html">Add-the-Clinic-Rooms</a>.</li>
    <li><strong>Finish setup.</strong></li>
    </ol>
    <h2>Coming back later</h2>
    <p>There is no menu item for setup, and once the clinic's details are saved the plain address no
    longer takes you there either.</p>
    <p><strong>To get back to Welcome, add <code>/welcome</code> to the end of the clinic address</strong> — so
    <code>https://app-staging.gompha.com/welcome</code>. Everything you entered is still there, and that is how
    you add a person, mint a fresh link or change access next month. Bookmark it.</p>
    <p><strong>⚠ verify</strong> — this is what the running version does. A button back into setup is owed; until it
    exists, the address is the only way in, and it is worth writing on a card at the desk.</p>
    <h2>What you can do that nobody else can</h2>
    <ul>
    <li>Add people, and decide what each of them can see</li>
    <li><strong>Get anybody back in</strong> — a fresh invite or password link, on demand
      (<a href="give-someone-a-new-link.html">Give-Someone-a-New-Link</a>)</li>
    <li><strong>Correct a name or an email</strong>, including your own (<a href="fix-a-persons-details.html">Fix-a-Persons-Details</a>)</li>
    <li><strong>Archive somebody who has left</strong> (<a href="archive-a-person.html">Archive-a-Person</a>)</li>
    <li>Add and rename rooms</li>
    <li>Give a doctor their schedule colour</li>
    <li>Reach the setup screen at all</li>
    </ul>
    <p><strong>You are the clinic's support desk for passwords.</strong> Nobody can be emailed a reset, so when a
    doctor cannot get in, he asks <em>you</em>, and you press one button. Make sure the staff know that on
    day one — otherwise they wait for an email that is never coming.</p>
    <h2>What you cannot do in Milestone 1</h2>
    <p>Worth knowing before you type, because none of these have a button yet:</p>
    <ul>
    <li><strong>Bring an archived person back.</strong> Archiving is one-way in this version — read
      <a href="archive-a-person.html">Archive-a-Person</a> before you press it.</li>
    <li><strong>Change a person's role</strong>, or <strong>which doctor an assistant works under</strong>.</li>
    <li><strong>Read the record of who did what.</strong> It is being kept; there is no screen for it yet.</li>
    <li><strong>Open another doctor's treatment list</strong> — not even to help him, and not even as the owner. Each
      doctor's prices and times are his own (<a href="set-up-your-treatment-list.html">Set-Up-Your-Treatment-List</a>).</li>
    </ul>
    <p>Talk to us for any of those. None of them are lost causes — they simply have no screen in this
    version.</p>
    <h2>A second admin doctor is not a second owner</h2>
    <p>You can give another doctor the <strong>Admin doctor</strong> role. In this milestone that does <strong>not</strong> give them
    the setup screen: <strong>only the owner reaches Welcome</strong>, so in practice you remain the only person who
    can add people and rooms. Plan for that.</p>
    <h2>You are also a doctor, and you have your own list</h2>
    <p>If you treat patients, you have exactly the same treatment list as every other doctor — your
    prices, your times, invisible to everybody else. Doing yours first is worth it: you will be the one
    answering the others' questions about theirs. <a href="set-up-your-treatment-list.html">Set-Up-Your-Treatment-List</a>.</p>
    <h2>What is not here yet</h2>
    <p>No schedule, no patients, no money, no inventory. <a href="whats-not-here-yet.html">Whats-Not-Here-Yet</a> is the page to show anyone
    who goes looking.</p>
    <p>Next: <a href="set-up-your-clinic.html">Set-Up-Your-Clinic</a> · <a href="give-someone-a-new-link.html">Give-Someone-a-New-Link</a> · <a href="roles-and-access.html">Roles-and-Access</a> ·
    <a href="what-your-licence-covers.html">What-Your-Licence-Covers</a> · <a href="home.html">Home</a></p>
    </div></body></html>
  "delete-and-restore-a-treatment.html": |
    <!doctype html><html lang="en"><head><meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Delete and Restore a Treatment · Gompha Manual</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Sans+Arabic&display=swap" rel="stylesheet">
    <style>
    body{margin:0;background:#FAF8F4;color:#3D3A34;font:15px/1.65 "IBM Plex Sans","IBM Plex Sans Arabic",sans-serif}
    .wrap{max-width:760px;margin:0 auto;padding:40px 24px 80px}
    a{color:#2E5D51} .dead{color:#98917F;border-bottom:1px dashed #C9C2B2}
    h1,h2,h3{line-height:1.3} h1{font-size:26px}
    code{background:#F1EDE6;border-radius:5px;padding:2px 6px}
    .crumb{font-size:13px;color:#98917F;margin-bottom:28px} .crumb a{color:#6B655A;text-decoration:none}
    .draft{background:#F3EDDC;color:#6A5A32;border-radius:9px;padding:9px 14px;font-size:13px;margin-bottom:26px}
    table{border-collapse:collapse} td,th{border:1px solid #E9E3D8;padding:7px 12px;text-align:left}
    </style></head><body><div class="wrap">
    <div class="crumb"><a href="index.html">Gompha Manual</a></div>
    <div class="draft">Draft — this manual describes the upcoming version of Gompha.</div>
    <hr />
    <p>tags: [task, milestone-1, screen/services, doctor]
    screen: Your treatments (delete, undo, recently deleted)</p>
    <hr />
    <h1>Delete and Restore a Treatment</h1>
    <p><strong>For doctors only</strong>, on your own list (<a href="set-up-your-treatment-list.html">Set-Up-Your-Treatment-List</a>). Nothing on this page can
    lose you anything permanently.</p>
    <h2>Delete one</h2>
    <ol>
    <li>Press the <strong>⋮</strong> at the right of the line and choose <strong>Delete treatment</strong> — or open the treatment
       and press <strong>Delete treatment</strong> at the bottom left (<a href="add-a-treatment.html">Add-a-Treatment</a>).</li>
    <li>The line itself becomes the question: <em>Delete "…"? Reception can't book it after this.
       Appointments already booked keep the name.</em></li>
    <li>Press <strong>Delete</strong>. <strong>Keep it</strong> is the safe answer and is the one already selected — a stray
       Enter never deletes anything.</li>
    </ol>
    <h2>Undo it</h2>
    <p>Right after a delete, a strip appears above the list: <em>Deleted "…"</em> with <strong>Undo</strong>. Press it and the
    treatment comes straight back, in its place.</p>
    <p>The strip goes away after about twenty seconds. That is not your last chance.</p>
    <h2>Get one back later</h2>
    <p>At the bottom of the list is <strong>Recently deleted (N)</strong>. Press it. Every treatment you have deleted
    is listed, newest first, with the date it went, and a <strong>Restore</strong> button on each.</p>
    <ul>
    <li>If you have since made a <strong>new</strong> treatment with the same name, the old one cannot come back under
      it. Rename the new one first, then restore.</li>
    <li>If your list was set up from a price sheet you gave us, the treatments you told us you no longer
      offer are sitting here too. Restore any you still do.</li>
    </ul>
    <h2>What deleting does and does not do</h2>
    <ul>
    <li><strong>Reception cannot book it</strong> once booking exists.</li>
    <li><strong>Appointments already booked keep the name they were booked with.</strong> Deleting a treatment never
      reaches back into work already recorded.</li>
    <li><strong>It is not erased.</strong> Every deleted treatment stays in <strong>Recently deleted</strong> with its price and
      its times intact.</li>
    <li><strong>Nobody else notices.</strong> It is your list; no other doctor's list changes.</li>
    </ul>
    <h2>Why it works this way</h2>
    <p><strong>Nothing in Gompha is truly deleted.</strong> People are archived (<a href="archive-a-person.html">Archive-a-Person</a>), rooms are
    archived, treatments are kept. A clinic that has lost something it cannot get back stops trusting
    the software — and a medical record that quietly loses history is worse than an untidy list.</p>
    <p><strong>The confirmation happens in the row, not in a box in the middle of the screen.</strong> You keep seeing
    the treatment you are about to delete, in the list it lives in, while you decide.</p>
    <p><strong>Undo comes first, confirmation second.</strong> One confirmation, then a real way back for twenty
    seconds, then a permanent way back in <strong>Recently deleted</strong>. Chains of "are you sure?" boxes train
    people to press <em>yes</em> without reading.</p>
    <p>Next: <a href="set-up-your-treatment-list.html">Set-Up-Your-Treatment-List</a> · <a href="organise-your-treatment-list.html">Organise-Your-Treatment-List</a> · <a href="home.html">Home</a></p>
    </div></body></html>
  "doctor.html": |
    <!doctype html><html lang="en"><head><meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Doctor · Gompha Manual</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Sans+Arabic&display=swap" rel="stylesheet">
    <style>
    body{margin:0;background:#FAF8F4;color:#3D3A34;font:15px/1.65 "IBM Plex Sans","IBM Plex Sans Arabic",sans-serif}
    .wrap{max-width:760px;margin:0 auto;padding:40px 24px 80px}
    a{color:#2E5D51} .dead{color:#98917F;border-bottom:1px dashed #C9C2B2}
    h1,h2,h3{line-height:1.3} h1{font-size:26px}
    code{background:#F1EDE6;border-radius:5px;padding:2px 6px}
    .crumb{font-size:13px;color:#98917F;margin-bottom:28px} .crumb a{color:#6B655A;text-decoration:none}
    .draft{background:#F3EDDC;color:#6A5A32;border-radius:9px;padding:9px 14px;font-size:13px;margin-bottom:26px}
    table{border-collapse:collapse} td,th{border:1px solid #E9E3D8;padding:7px 12px;text-align:left}
    </style></head><body><div class="wrap">
    <div class="crumb"><a href="index.html">Gompha Manual</a></div>
    <div class="draft">Draft — this manual describes the upcoming version of Gompha.</div>
    <hr />
    <h2>tags: [role, milestone-1]</h2>
    <h1>Doctor</h1>
    <p>Covers both <strong>Admin doctor</strong> and <strong>Associate doctor</strong>. The difference between them is who may manage
    staff, not what happens when you sign in.</p>
    <h2>Set your account up first</h2>
    <p>You will be sent a link by the owner, by WhatsApp or in person — <strong>not by email</strong>. Open it and choose
    your own password. <a href="activate-your-account.html">Activate-Your-Account</a>.</p>
    <p>Nobody, including us, can tell you your password afterwards. <a href="passwords-and-sessions.html">Passwords-and-Sessions</a>.</p>
    <h2>When you sign in</h2>
    <ol>
    <li>Open <strong>https://app-staging.gompha.com</strong> and sign in (<a href="sign-in.html">Sign-In</a>).</li>
    <li>You are taken to <strong>your own treatment list</strong> — the treatments you do, your prices and how long
       each one takes. This keeps happening on every sign-in until you have worked through it once and
       pressed <strong>Finish</strong>. <a href="set-up-your-treatment-list.html">Set-Up-Your-Treatment-List</a>.</li>
    <li>After that you land on a short page headed <strong>"You're signed in"</strong>, which tells you your role and
       lists the clinic's <strong>rooms</strong>. Your treatment list is then one press away: the <strong>gear</strong> at the top
       right → <strong>Set up services &amp; timings</strong>.</li>
    </ol>
    <p>At the top right is a <strong>gear</strong> for <a href="switch-to-dark-mode.html">Switch-to-Dark-Mode</a>, your treatment list, and <strong>Sign out</strong>.</p>
    <h2>Your treatment list is the work Milestone 1 asks of you</h2>
    <p>It is the only screen in Gompha today that is yours rather than the clinic's, and it is what
    reception will book from when the schedule arrives. Getting it right now is the whole job.</p>
    <ul>
    <li><a href="set-up-your-treatment-list.html">Set-Up-Your-Treatment-List</a> — where it is, what the list shows, and what to do about rows that
      came from your own price sheet</li>
    <li><a href="add-a-treatment.html">Add-a-Treatment</a> — name, price in dollars or dinar, chair and working time, multi-visit work</li>
    <li><a href="organise-your-treatment-list.html">Organise-Your-Treatment-List</a> — categories and your own order</li>
    <li><a href="delete-and-restore-a-treatment.html">Delete-and-Restore-a-Treatment</a> — nothing is lost, ever</li>
    </ul>
    <p><strong>No other doctor can see it, and neither can the owner.</strong> If something on your list needs
    correcting, only you can do it.</p>
    <h2>What is coming for you, and is not here yet</h2>
    <p>No schedule, no patient list, no patient card, no tooth chart, no notes, no X-rays, no earnings.
    None of it exists — and none of it is a permission problem or a misconfiguration.
    <a href="whats-not-here-yet.html">Whats-Not-Here-Yet</a>.</p>
    <h2>What has already been decided about your access</h2>
    <p>The owner has set five things for you, and they take effect as each module arrives
    (<a href="set-what-each-person-can-see.html">Set-What-Each-Person-Can-See</a>):</p>
    <ul>
    <li><strong>Financial information</strong> — normally <strong>Own</strong>, so your own earnings are yours. Two doctors in the
      same clinic are not automatically partners in each other's money. This is the one setting that
      already bites today: set to <strong>None</strong>, prices on your own treatment list show as <strong>Hidden</strong> behind
      a padlock.</li>
    <li><strong>Schedule</strong> — normally <strong>All</strong>: doctors see the whole clinic's book.</li>
    <li><strong>Patients</strong> — an admin doctor normally sees <strong>All</strong>; an associate doctor normally sees <strong>Own</strong>.</li>
    </ul>
    <p>If any of that is wrong for how this clinic works, ask the owner. It is one press on a card, and it
    takes effect immediately.</p>
    <h2>Practical things worth knowing now</h2>
    <ul>
    <li><strong>Install it on your phone.</strong> You will be working from your phone once the schedule lands, and the
      install is what later lets reminders reach you. <a href="install-the-app-on-a-phone.html">Install-the-App-on-a-Phone</a>.</li>
    <li><strong>You will be signed out after 12 hours.</strong> Normal. Sign in again.</li>
    <li><strong>A dropped connection does not sign you out</strong>, and it does not lose anything.
      <a href="working-offline.html">Working-Offline</a>.</li>
    <li><strong>You get a colour.</strong> It is how your column is recognised on the schedule when it arrives. The
      owner sets it, from twelve. <a href="choose-a-doctor-colour.html">Choose-a-Doctor-Colour</a>.</li>
    <li><strong>Forgot your password? Message the owner, not us.</strong> No email is sent by Gompha. The owner
      presses one button and sends you a fresh link. <a href="reset-your-password.html">Reset-Your-Password</a>.</li>
    <li><strong>If a screen shows a code like <code>GMP-1304</code>, press Report this.</strong> It takes thirty seconds and it
      is the only way a problem reaches anyone who can fix it. <a href="when-something-goes-wrong.html">When-Something-Goes-Wrong</a>.</li>
    </ul>
    <p>Next: <a href="sign-in.html">Sign-In</a> · <a href="working-offline.html">Working-Offline</a> · <a href="roles-and-access.html">Roles-and-Access</a> · <a href="home.html">Home</a></p>
    </div></body></html>
  "dual-currency-money.html": |
    <!doctype html><html lang="en"><head><meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Dual Currency Money · Gompha Manual</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Sans+Arabic&display=swap" rel="stylesheet">
    <style>
    body{margin:0;background:#FAF8F4;color:#3D3A34;font:15px/1.65 "IBM Plex Sans","IBM Plex Sans Arabic",sans-serif}
    .wrap{max-width:760px;margin:0 auto;padding:40px 24px 80px}
    a{color:#2E5D51} .dead{color:#98917F;border-bottom:1px dashed #C9C2B2}
    h1,h2,h3{line-height:1.3} h1{font-size:26px}
    code{background:#F1EDE6;border-radius:5px;padding:2px 6px}
    .crumb{font-size:13px;color:#98917F;margin-bottom:28px} .crumb a{color:#6B655A;text-decoration:none}
    .draft{background:#F3EDDC;color:#6A5A32;border-radius:9px;padding:9px 14px;font-size:13px;margin-bottom:26px}
    table{border-collapse:collapse} td,th{border:1px solid #E9E3D8;padding:7px 12px;text-align:left}
    </style></head><body><div class="wrap">
    <div class="crumb"><a href="index.html">Gompha Manual</a></div>
    <div class="draft">Draft — this manual describes the upcoming version of Gompha.</div>
    <hr />
    <h2>tags: [concept, milestone-1, screen/services]</h2>
    <h1>Money in Two Currencies</h1>
    <p>Gompha holds <strong>no payments, no balances and no Income and Expenses</strong> yet. The only money in the
    software today is <strong>a price on a doctor's own treatment</strong> (<a href="add-a-treatment.html">Add-a-Treatment</a>) — and the way that
    price is stored is the rule everything later will follow, so it is worth reading once.</p>
    <h2>One side is typed, the other is worked out</h2>
    <p>A price is set in <strong>US dollars</strong> or in <strong>Iraqi dinar</strong>. Never both.</p>
    <ul>
    <li>The side you typed carries a small <strong>padlock</strong> and the words <strong>Set by you</strong>. That is the figure
      Gompha keeps.</li>
    <li>The other side says <strong>Converted</strong> and is worked out from the day's rate. On the list it appears
      faintly, after a <strong>≈</strong>.</li>
    <li>Typing into the converted side moves the padlock to it — the padlock, the bold figure and the
      words <strong>Set by you</strong> all move, and the change is announced aloud for anyone using a screen
      reader. A price that silently changed currency is the kind of mistake nobody finds until the end
      of the month.</li>
    </ul>
    <p><strong>A dinar figure you typed is kept exactly as you typed it.</strong> 47,300 stays 47,300. A dinar figure
    <em>converted from dollars</em> is rounded up to the nearest 250, because nobody at a front desk in Erbil
    hands back 30 dinar.</p>
    <h2>Unknown, free and zero are three different things</h2>
    <p>The price control has three buttons — <strong>Unknown · Free · Priced</strong> — and they are not interchangeable.</p>
    <table>
    <thead>
    <tr>
    <th></th>
    <th>What it means</th>
    </tr>
    </thead>
    <tbody>
    <tr>
    <td><strong>Unknown</strong></td>
    <td>Nobody has decided a price yet. The list shows <strong>Add price</strong>.</td>
    </tr>
    <tr>
    <td><strong>Free</strong></td>
    <td>Somebody decided: a line that appears on the bill at nothing.</td>
    </tr>
    <tr>
    <td><strong>Zero</strong></td>
    <td>Not possible. An empty box can never be saved as <code>0</code>.</td>
    </tr>
    </tbody>
    </table>
    <p>This is the reason a treatment can sit on a list for weeks with no price and nothing is broken.
    It is an empty field, not a fault.</p>
    <h2>⚠ No exchange rate has been set yet</h2>
    <p><strong>There is no screen for setting the dollar–dinar rate in the software today</strong>, and no rate has
    been recorded. Until there is one:</p>
    <ul>
    <li>Prices <strong>save perfectly well</strong> in whichever currency you type.</li>
    <li>The converted side stays <strong>empty</strong>, and the screen says so rather than showing a made-up figure.</li>
    <li>Nothing is lost. The converted figure is worked out fresh every time it is shown, so the day a
      rate is set, every price already entered gets its second figure at once.</li>
    </ul>
    <h2>Why it works this way</h2>
    <p><strong>Storing both figures would freeze today's rate into next year's prices.</strong> The dinar moves. A
    price list that quietly kept the rate of the day each line was typed would drift line by line, and
    nobody would be able to say which figure was the real one. Gompha keeps the one a human chose and
    recalculates the other on the spot.</p>
    <p><strong>The rate that was used is written down and never overwritten.</strong> When rates start being recorded,
    each one is kept with its date, for good — money arithmetic has to be reproducible long after the
    person who typed the rate has left the clinic.</p>
    <p>Not built yet: patient balances, payments, receipts, Income and Expenses. See
    <a href="whats-not-here-yet.html">Whats-Not-Here-Yet</a> · <a href="roadmap.html">Roadmap</a> · <a href="home.html">Home</a></p>
    </div></body></html>
  "error-codes.html": |
    <!doctype html><html lang="en"><head><meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Error Codes · Gompha Manual</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Sans+Arabic&display=swap" rel="stylesheet">
    <style>
    body{margin:0;background:#FAF8F4;color:#3D3A34;font:15px/1.65 "IBM Plex Sans","IBM Plex Sans Arabic",sans-serif}
    .wrap{max-width:760px;margin:0 auto;padding:40px 24px 80px}
    a{color:#2E5D51} .dead{color:#98917F;border-bottom:1px dashed #C9C2B2}
    h1,h2,h3{line-height:1.3} h1{font-size:26px}
    code{background:#F1EDE6;border-radius:5px;padding:2px 6px}
    .crumb{font-size:13px;color:#98917F;margin-bottom:28px} .crumb a{color:#6B655A;text-decoration:none}
    .draft{background:#F3EDDC;color:#6A5A32;border-radius:9px;padding:9px 14px;font-size:13px;margin-bottom:26px}
    table{border-collapse:collapse} td,th{border:1px solid #E9E3D8;padding:7px 12px;text-align:left}
    </style></head><body><div class="wrap">
    <div class="crumb"><a href="index.html">Gompha Manual</a></div>
    <div class="draft">Draft — this manual describes the upcoming version of Gompha.</div>
    <hr />
    <h2>tags: [concept, milestone-1, support]</h2>
    <h1>Error Codes</h1>
    <p>Every refusal Gompha makes carries a code: <strong><code>GMP</code> and four digits</strong>. It is short on purpose —
    short enough to say down a phone, in a second language, over a busy waiting room.</p>
    <p><strong>A code names the kind of problem. It never changes.</strong> <code>GMP-1201</code> will mean the same thing next
    year and in every clinic that runs Gompha. Beside it you will usually see a <strong>reference</strong> — a short
    block of characters naming that one attempt. How to send them to us: <a href="when-something-goes-wrong.html">When-Something-Goes-Wrong</a>.</p>
    <h2>How to read the number</h2>
    <p>The first two digits say which family the problem is in, so you know who can fix it before you
    read any further.</p>
    <table>
    <thead>
    <tr>
    <th>Family</th>
    <th>What it is about</th>
    <th>Who fixes it</th>
    </tr>
    </thead>
    <tbody>
    <tr>
    <td><strong>10xx</strong></td>
    <td>Signing in, links, passwords</td>
    <td>You, or the owner</td>
    </tr>
    <tr>
    <td><strong>11xx</strong></td>
    <td>What you are allowed to do</td>
    <td>The owner</td>
    </tr>
    <tr>
    <td><strong>12xx</strong></td>
    <td>The clinic's licence</td>
    <td>Us, by phone</td>
    </tr>
    <tr>
    <td><strong>13xx</strong></td>
    <td>Something about what was typed or asked for</td>
    <td>You</td>
    </tr>
    <tr>
    <td><strong>14xx</strong></td>
    <td>Our machinery</td>
    <td>Us</td>
    </tr>
    <tr>
    <td><strong>19xx</strong></td>
    <td>Something we did not expect</td>
    <td>Us</td>
    </tr>
    </tbody>
    </table>
    <h2>The full list</h2>
    <p>The sentence in the middle column is exactly what Gompha shows.</p>
    <table>
    <thead>
    <tr>
    <th>Code</th>
    <th>What it says</th>
    <th>What it means</th>
    </tr>
    </thead>
    <tbody>
    <tr>
    <td><strong>GMP-1001</strong></td>
    <td>That email and password do not match.</td>
    <td>One of the two is wrong; it will not say which. <a href="sign-in.html">Sign-In</a></td>
    </tr>
    <tr>
    <td><strong>GMP-1002</strong></td>
    <td>Please sign in again.</td>
    <td>The session ended — usually 12 hours, or you were signed out elsewhere. <a href="passwords-and-sessions.html">Passwords-and-Sessions</a></td>
    </tr>
    <tr>
    <td><strong>GMP-1003</strong></td>
    <td>This link is no longer valid. Ask for a new one.</td>
    <td>An invite or reset link that is used up or expired. <a href="give-someone-a-new-link.html">Give-Someone-a-New-Link</a></td>
    </tr>
    <tr>
    <td><strong>GMP-1004</strong></td>
    <td>That password is too easy to guess.</td>
    <td>Too short, too repetitive, or in a known public breach. <a href="passwords-and-sessions.html">Passwords-and-Sessions</a></td>
    </tr>
    <tr>
    <td><strong>GMP-1101</strong></td>
    <td>Your access does not cover this.</td>
    <td>Your role or your access settings do not include this. <a href="roles-and-access.html">Roles-and-Access</a></td>
    </tr>
    <tr>
    <td><strong>GMP-1102</strong></td>
    <td>Only a clinic admin can change people and access.</td>
    <td>Adding people and setting access is the owner's job.</td>
    </tr>
    <tr>
    <td><strong>GMP-1103</strong></td>
    <td>The clinic owner's account cannot be changed this way.</td>
    <td>The ROOT account is protected. <a href="archive-a-person.html">Archive-a-Person</a></td>
    </tr>
    <tr>
    <td><strong>GMP-1201</strong></td>
    <td>The clinic licence has expired, so nothing can be saved right now. Everything already saved is safe.</td>
    <td>Read-only. Nothing is lost; call us. <a href="what-your-licence-covers.html">What-Your-Licence-Covers</a></td>
    </tr>
    <tr>
    <td><strong>GMP-1202</strong></td>
    <td>The licence has no free seat for that role.</td>
    <td>You are adding a doctor beyond what the licence covers. <a href="add-a-staff-member.html">Add-a-Staff-Member</a></td>
    </tr>
    <tr>
    <td><strong>GMP-1301</strong></td>
    <td>That is already taken.</td>
    <td>An email or a room name that is in use here.</td>
    </tr>
    <tr>
    <td><strong>GMP-1302</strong></td>
    <td>That is not here any more.</td>
    <td>It was archived or removed while you had the screen open.</td>
    </tr>
    <tr>
    <td><strong>GMP-1303</strong></td>
    <td>Some of that could not be accepted.</td>
    <td>A field was blank, malformed, or not allowed.</td>
    </tr>
    <tr>
    <td><strong>GMP-1304</strong></td>
    <td>Too many tries. Wait a moment and try again.</td>
    <td>Deliberate slowing-down. Wait about a minute. Nothing is locked or damaged.</td>
    </tr>
    <tr>
    <td><strong>GMP-1305</strong></td>
    <td>Someone else changed this while you were editing. Reload to see the newest version, then make your change again.</td>
    <td>Two devices on the same treatment. <a href="add-a-treatment.html">Add-a-Treatment</a></td>
    </tr>
    <tr>
    <td><strong>GMP-1307</strong></td>
    <td>A price needs a currency and an amount. Set the currency, or mark the treatment free.</td>
    <td>Half a price. <a href="dual-currency-money.html">Dual-Currency-Money</a></td>
    </tr>
    <tr>
    <td><strong>GMP-1308</strong></td>
    <td>That time cannot be saved. It must be at least one minute, and the shortest time cannot be longer than the longest.</td>
    <td>A chair or working time typed as 0, or a range the wrong way round. <a href="add-a-treatment.html">Add-a-Treatment</a></td>
    </tr>
    <tr>
    <td><strong>GMP-1309</strong></td>
    <td>A part cannot itself be a treatment that has parts. Pick a single-visit treatment.</td>
    <td>Multi-visit work, one level deep. <a href="add-a-treatment.html">Add-a-Treatment</a></td>
    </tr>
    <tr>
    <td><strong>GMP-1311</strong></td>
    <td>You already have a treatment with that name. Open the one you have.</td>
    <td>Only on <strong>your own</strong> list; another doctor's wording is irrelevant. <a href="add-a-treatment.html">Add-a-Treatment</a></td>
    </tr>
    <tr>
    <td><strong>GMP-1312</strong></td>
    <td>You already have a category with that name here.</td>
    <td><a href="organise-your-treatment-list.html">Organise-Your-Treatment-List</a></td>
    </tr>
    <tr>
    <td><strong>GMP-1313</strong></td>
    <td>Categories go one level deep. A sub-category cannot hold its own sub-categories.</td>
    <td><a href="organise-your-treatment-list.html">Organise-Your-Treatment-List</a></td>
    </tr>
    <tr>
    <td><strong>GMP-1314</strong></td>
    <td>The new order is out of date — it does not list everything you have. Reload, then arrange again.</td>
    <td>Your list changed elsewhere while you were dragging. <a href="organise-your-treatment-list.html">Organise-Your-Treatment-List</a></td>
    </tr>
    <tr>
    <td><strong>GMP-1315</strong></td>
    <td>This list is full. Delete something you no longer use before adding more.</td>
    <td>300 treatments for one doctor. Tell us if you meet it.</td>
    </tr>
    <tr>
    <td><strong>GMP-1316</strong></td>
    <td>That belongs to another doctor's catalogue, so you cannot change it.</td>
    <td>Nobody edits another doctor's list. <a href="roles-and-access.html">Roles-and-Access</a></td>
    </tr>
    <tr>
    <td><strong>GMP-1317</strong></td>
    <td>You now have a live treatment with that name, so this deleted one cannot come back under it. Rename the other one first.</td>
    <td><a href="delete-and-restore-a-treatment.html">Delete-and-Restore-a-Treatment</a></td>
    </tr>
    <tr>
    <td><strong>GMP-1318</strong></td>
    <td>That was already deleted.</td>
    <td>Two presses, or two devices. Nothing went wrong.</td>
    </tr>
    <tr>
    <td><strong>GMP-1319</strong></td>
    <td>This app is out of date. Refresh the page to load the newest version.</td>
    <td>The browser is still running an old copy. Refresh the page.</td>
    </tr>
    <tr>
    <td><strong>GMP-1401</strong></td>
    <td>The clinic server is not reachable right now.</td>
    <td>Tell us. Not the same as your internet being down — see <a href="working-offline.html">Working-Offline</a>.</td>
    </tr>
    <tr>
    <td><strong>GMP-1901</strong></td>
    <td>Something went wrong at our end.</td>
    <td>We did not anticipate this one. Please send it.</td>
    </tr>
    </tbody>
    </table>
    <h2>How refusals are labelled on this version</h2>
    <p>Signing in, adding people, and everything on a doctor's treatment list now name <strong>their own</strong>
    reason, so the code you are shown is the specific one from the table above. Screens built later
    will do the same as they arrive; anywhere that has not been given a specific reason yet falls back
    to the general one for that kind of refusal — <strong>GMP-1002, 1101, 1301, 1302, 1303, 1304</strong>.</p>
    <p><strong>A lapsed licence reports GMP-1201</strong> and also puts a padlock box on the screen reading <em>"The
    clinic is read-only."</em> Padlock means the licence; no padlock means access.
    <a href="what-your-licence-covers.html">What-Your-Licence-Covers</a>.</p>
    <p><strong>⚠ verify</strong> — <code>GMP-1306</code> and <code>GMP-1310</code> are defined but belong to a design that was withdrawn, and
    nothing on a screen produces them today. If one ever reaches you, send it: that is a bug in itself.</p>
    <h2>Why it works this way</h2>
    <p><strong>A code is not decoration.</strong> "Something went wrong" tells nobody anything, and a clinic that reads
    it ten times learns to ignore the eleventh. A code lets a receptionist tell a doctor, a doctor tell
    the owner, and the owner tell us, without any of them having to describe software.</p>
    <p><strong>Codes are never re-used or renumbered.</strong> Once a code has been on a clinic's screen it exists in a
    screenshot, in a support inbox, and on this page. Renumbering it would make every one of those
    disagree with the app. New problems get new numbers.</p>
    <p><strong>Numbered by family, not in the order they were invented.</strong> The first two digits tell you where to
    look before you have read the sentence — which is the difference between a code being useful at the
    front desk and being a number somebody copies out.</p>
    <p>Next: <a href="when-something-goes-wrong.html">When-Something-Goes-Wrong</a> · <a href="working-offline.html">Working-Offline</a> · <a href="what-your-licence-covers.html">What-Your-Licence-Covers</a> · <a href="home.html">Home</a></p>
    </div></body></html>
  "fix-a-persons-details.html": |
    <!doctype html><html lang="en"><head><meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Fix a Persons Details · Gompha Manual</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Sans+Arabic&display=swap" rel="stylesheet">
    <style>
    body{margin:0;background:#FAF8F4;color:#3D3A34;font:15px/1.65 "IBM Plex Sans","IBM Plex Sans Arabic",sans-serif}
    .wrap{max-width:760px;margin:0 auto;padding:40px 24px 80px}
    a{color:#2E5D51} .dead{color:#98917F;border-bottom:1px dashed #C9C2B2}
    h1,h2,h3{line-height:1.3} h1{font-size:26px}
    code{background:#F1EDE6;border-radius:5px;padding:2px 6px}
    .crumb{font-size:13px;color:#98917F;margin-bottom:28px} .crumb a{color:#6B655A;text-decoration:none}
