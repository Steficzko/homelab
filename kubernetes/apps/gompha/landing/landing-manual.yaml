    <td>Sign in only</td>
    </tr>
    <tr>
    <td>An assistant</td>
    <td><a href="assistant.html">Assistant</a></td>
    <td>Sign in only</td>
    </tr>
    </tbody>
    </table>
    <h2>Tasks that work today</h2>
    <p><strong>Getting in</strong></p>
    <ul>
    <li><a href="sign-in.html">Sign-In</a> — the sign-in screen, and how you get signed out</li>
    <li><a href="activate-your-account.html">Activate-Your-Account</a> — you were sent an invite link</li>
    <li><a href="reset-your-password.html">Reset-Your-Password</a> — you forgot it</li>
    </ul>
    <p><strong>Setting the clinic up</strong> (the owner)</p>
    <ul>
    <li><a href="set-up-your-clinic.html">Set-Up-Your-Clinic</a> — the three-step Welcome</li>
    <li><a href="add-a-staff-member.html">Add-a-Staff-Member</a> — add a person and send them their invite</li>
    <li><a href="set-what-each-person-can-see.html">Set-What-Each-Person-Can-See</a> — the five access sections</li>
    <li><a href="choose-a-doctor-colour.html">Choose-a-Doctor-Colour</a> — the colour a doctor gets on the schedule later</li>
    <li><a href="add-the-clinic-rooms.html">Add-the-Clinic-Rooms</a> — name each surgery</li>
    </ul>
    <p><strong>Your own treatments</strong> (each doctor, for himself)</p>
    <ul>
    <li><a href="set-up-your-treatment-list.html">Set-Up-Your-Treatment-List</a> — where it is, and what the list shows</li>
    <li><a href="add-a-treatment.html">Add-a-Treatment</a> — the name, the price, the times, multi-visit work</li>
    <li><a href="organise-your-treatment-list.html">Organise-Your-Treatment-List</a> — categories, your own order, searching</li>
    <li><a href="delete-and-restore-a-treatment.html">Delete-and-Restore-a-Treatment</a> — deleting, undo, and <strong>Recently deleted</strong></li>
    </ul>
    <p><strong>Fixing something on a person's card</strong> (the owner)</p>
    <ul>
    <li><a href="give-someone-a-new-link.html">Give-Someone-a-New-Link</a> — lost invite, or a forgotten password</li>
    <li><a href="fix-a-persons-details.html">Fix-a-Persons-Details</a> — correct a name or an email</li>
    <li><a href="archive-a-person.html">Archive-a-Person</a> — somebody has left</li>
