    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Choose a Doctor Colour · Gompha Manual</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Sans+Arabic&display=swap" rel="stylesheet">
    <style>
    body{margin:0;background:#FAF8F4;color:#3D3A34;font:15px/1.65 "IBM Plex Sans","IBM Plex Sans Arabic",sans-serif}
    .wrap{max-width:760px;margin:0 auto;padding:40px 24px 80px}
    a{color:#2E5D51} .dead{color:#98917F;border-bottom:1px dashed #C9C2B2}
    h1,h2,h3{line-height:1.3} h1{font-size:26px}
    code{background:#F1EDE6;border-radius:5px;padding:2px 6px}
    .crumb{font-size:13px;color:#98917F;margin-bottom:28px} .crumb a{color:#6B655A;text-decoration:none}
