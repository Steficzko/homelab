    <h1>Work Offline</h1>
    <p><strong>Nothing live to document.</strong> There is no app to lose connection with yet.</p>
    <p>This will be the most-used page in the vault, because most support calls will be this. The app is
    online-first (ADR-014): while offline you can look at cached data, but you cannot book, take a
    payment or write a note until the connection is back. When it ships this page gets numbered
    steps: how to tell that a device is offline, what stays safe to do, and what to do while you wait.</p>
    <p>The idea behind it: <a href="working-offline.html">Working-Offline</a></p>
    <p>For: everyone · Back to <a href="home.html">Home</a> · What is coming: <a href="roadmap.html">Roadmap</a></p>
