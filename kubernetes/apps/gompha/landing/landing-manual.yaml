    <div class="crumb"><a href="index.html">Gompha Manual</a></div>
    <div class="draft">Draft — this manual describes the upcoming version of Gompha.</div>
    <hr />
    <p>tags: [task, milestone-1, screen/rooms, root]
    screen: Register the clinic's rooms</p>
    <hr />
    <h1>Add the Clinic Rooms</h1>
    <p><strong>For the owner only.</strong> Step 3 of <a href="set-up-your-clinic.html">Set-Up-Your-Clinic</a>, headed <strong>"Register the clinic's rooms"</strong>.</p>
    <p>Milestone 1 records <strong>room names and nothing else</strong>. Register every surgery, the X-ray room, and
    any shared space.</p>
    <h2>Steps</h2>
    <ol>
    <li>The first time, a dashed box headed <strong>No rooms yet</strong> offers <strong>+ Add the first room</strong>. Press it.
       Afterwards the button at the bottom of the list reads <strong>+ Add room</strong>.</li>
    <li>A dashed row appears with <strong>New room name</strong>. Type the name — Arabic and Kurdish are fine — and
       press <strong>Add</strong>, or just press Enter. <strong>Escape</strong> or <strong>Cancel</strong> abandons it.</li>
    <li>Repeat for each room.</li>
    <li>When the list is complete, press <strong>Finish setup →</strong> at the bottom right.</li>
    </ol>
    <h2>Renaming and removing</h2>
    <ul>
    <li><strong>To rename:</strong> click into the room's name box, edit it, then click away. It saves when the field
      loses focus. If you clear it or change nothing, it snaps back to the old name.</li>
    <li><strong>To remove:</strong> press the <strong>bin icon</strong> at the right-hand end of the row. The room disappears from
      the list.</li>
    </ul>
    <p><strong>Two rooms cannot share a name.</strong> Trying it gives <strong>"A room with this name already exists"</strong>.</p>
    <h2>What you cannot do yet</h2>
    <ul>
    <li><strong>No opening hours.</strong> A room's working hours, and splitting one shared room between two doctors,
      are set on the schedule when the Scheduling module arrives. The screen says so.</li>
    <li><strong>No reordering.</strong> The order rooms appear in is the order you added them.</li>
    </ul>
    <h2>Why it works this way</h2>
    <p><strong>Rooms before appointments.</strong> An appointment happens to a patient, with a doctor, in a room, at a
    time. The room is one of the four things the schedule cannot be drawn without, so it is captured
    before the schedule exists rather than being invented in a hurry on the day the schedule ships.</p>
    <p><strong>Names only, for now.</strong> Opening hours belong on the surface where you can see them against the day
    — a form full of time boxes with no calendar next to it is guesswork. Naming the rooms now costs a
    minute and is never re-entered.</p>
    <p><strong>The bin does not destroy the room.</strong> It marks it as no longer in use and hides it from the list.
    Gompha deletes nothing outright: once the schedule exists, a room that had appointments in it must
    still be nameable in last year's records. A truly deleted room would leave old appointments
    pointing at nothing.</p>
    <p>Next: <a href="set-up-your-clinic.html">Set-Up-Your-Clinic</a> · <a href="whats-not-here-yet.html">Whats-Not-Here-Yet</a> · <a href="home.html">Home</a></p>
    </div></body></html>
