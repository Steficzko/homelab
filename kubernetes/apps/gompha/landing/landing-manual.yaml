    <div class="draft">Draft — this manual describes the upcoming version of Gompha.</div>
    <hr />
    <p>tags: [task, milestone-1, screen/services, doctor]
    screen: Add / edit a treatment (box over the treatment list)</p>
    <hr />
    <h1>Add a Treatment</h1>
    <p><strong>For doctors only</strong>, on your own treatment list (<a href="set-up-your-treatment-list.html">Set-Up-Your-Treatment-List</a>). The same box
    adds a new treatment and edits one you already have.</p>
    <h2>How to open it</h2>
    <ul>
    <li><strong>To add one:</strong> press <strong>+ Add a treatment</strong>. It sits above the list and again at the bottom.</li>
    <li><strong>To change one:</strong> press anywhere on its line.</li>
    <li><strong>To fix one thing quickly:</strong> press the words <strong>Add price</strong> or <strong>Add chair time</strong> on the line —
      the box opens with that field already selected.</li>
    <li><strong>To copy one:</strong> press the <strong>⋮</strong> at the right of a line and choose <strong>Duplicate</strong>. Everything is
      copied except the name, which you type fresh.</li>
    </ul>
    <p>On a phone the box fills the screen. On a computer it sits in the middle, over the list. The list
    never goes away underneath. <strong>Escape</strong>, <strong>Cancel</strong> or the <strong>✕</strong> closes it.</p>
    <h2>The fields, in the order you meet them</h2>
    <p><strong>Treatment name.</strong> The only one that must be filled in. It is yours — another doctor's wording
    does not matter here. If you already have a treatment with the same name, a small note says so and
    lets you carry on; only two <em>live</em> treatments with exactly the same name are refused, and then the
    box tells you to open the one you have.</p>
    <p><strong>Your code.</strong> Optional, up to 40 characters, anything you like. It is used for searching and will
    appear on reports.</p>
    <p><strong>Category.</strong> <em>Not in a category</em> to begin with, then any category you have made, then <strong>New
    category…</strong>, which gives you a box to name one on the spot.
    <a href="organise-your-treatment-list.html">Organise-Your-Treatment-List</a>.</p>
    <p><strong>Price.</strong> Three buttons: <strong>Unknown · Free · Priced</strong>.</p>
    <ul>
    <li><strong>Unknown</strong> means no price is recorded. <em>It is not zero and it is not free.</em></li>
    <li><strong>Free</strong> is a decision — a line that appears on the bill at nothing.</li>
    <li><strong>Priced</strong> opens two rows, <strong>USD</strong> and <strong>IQD</strong>. Type into either one. The row you typed into gets
      a small <strong>padlock</strong> and the words <strong>Set by you</strong>; the other row shows <strong>Converted</strong> and works
      itself out. Typing into the converted row moves the padlock to it.</li>
    </ul>
    <p><strong>Chair time.</strong> Two boxes, <strong>h</strong> and <strong>m</strong> — hours and minutes. Under them are quick buttons:
    15m, 30m, 45m, 1h, 1h 30m, 2h. Typing <code>90</code> into the minutes box turns into <code>1h 30m</code> when you leave
    it. <strong>+ Add a range</strong> turns it into <strong>From / To</strong> for treatments that vary; reception then confirms
    the exact length when booking.</p>
    <p><strong>Working time.</strong> The same control. Chair time is <strong>how long the appointment takes</strong>; working time
    is <strong>how long you are hands-on</strong>. <strong>Leave working time blank and it is the same as chair time</strong> —
    which is the usual answer, and then the line in the list says nothing about it at all.</p>
    <p><strong>This treatment takes more than one visit.</strong> A tick-box. Tick it and you get <strong>Part 1</strong> and <strong>Part
    2</strong>, each with its own name and its own chair time, up to twelve. <strong>↑ Move up</strong> and <strong>↓ Move down</strong>
    put them in order; <strong>Remove part</strong> deletes one. <strong>The price stays on the treatment as a whole</strong>,
    never on the parts.</p>
    <p><strong>A grey note at the very bottom</strong>, on rows that came from the price sheet you gave us: where the
    row came from, and <em>"Your sheet said: …"</em> — the original wording. You cannot edit it, and it does
    not appear on rows you created yourself.</p>
    <h2>Saving</h2>
    <p>Press <strong>Save</strong>. <strong>Cancel</strong> and the <strong>✕</strong> throw the changes away, and if you have typed anything the
    box asks first — <strong>Keep editing</strong> or <strong>Discard</strong>.</p>
    <p>Things it will say instead of saving:</p>
    <table>
    <thead>
    <tr>
    <th>What you see</th>
    <th>What it means</th>
    </tr>
    </thead>
    <tbody>
    <tr>
    <td><strong>No connection — this can't be saved yet.</strong></td>
    <td>Your typing is still on screen. Wait for the link and press Save again. Nothing was half-saved. <a href="working-offline.html">Working-Offline</a></td>
    </tr>
    <tr>
    <td><strong>This treatment changed on another device.</strong></td>
    <td>Somebody — or you, on your phone — saved this row while you had it open. Press <strong>Reload the latest</strong>, look, then make your change again. <strong>Read the sentence after the heading</strong>: the same warning box also carries <em>"You already have a treatment with that name"</em> (<code>GMP-1311</code>), which is not a device clash at all.</td>
    </tr>
    <tr>
    <td><strong>Couldn't save that. Nothing was lost.</strong></td>
    <td>Followed by the reason and a code. <a href="when-something-goes-wrong.html">When-Something-Goes-Wrong</a></td>
    </tr>
    </tbody>
    </table>
    <p><strong>Delete treatment</strong> sits at the bottom left, and only when you are editing an existing one.
    <a href="delete-and-restore-a-treatment.html">Delete-and-Restore-a-Treatment</a>.</p>
    <h2>Why it works this way</h2>
    <p><strong>Unknown, free and zero are three different facts.</strong> A blank box can never be saved as <code>0</code>. A
    missing price means nobody has decided yet; <em>free</em> means somebody decided. If they looked the same,
    a treatment nobody had priced would quietly bill at nothing.</p>
    <p><strong>Only the side you typed is kept.</strong> The dinar–dollar rate moves. Storing both figures would freeze
    today's rate into next year's price list, so Gompha stores the one you set and works the other one
    out fresh each time you look. A dinar figure you typed is kept exactly as typed;
    <a href="dual-currency-money.html">Dual-Currency-Money</a>.</p>
    <p><strong>Hours and minutes, not a box of minutes.</strong> In Dr Ali's words: <em>easier just to choose two hours
    instead of 120 minutes.</em> Doctors who think in minutes are not punished for it — <code>90</code> becomes
    <code>1h 30m</code> by itself.</p>
    <p><strong>A name is yours, not the clinic's.</strong> There is no shared clinic list to match against, and no
    "adopt the existing name" prompt. Two doctors describing the same work differently is normal, and
    forcing them to agree before either can book was the thing that made an earlier design unusable.</p>
    <p>Next: <a href="set-up-your-treatment-list.html">Set-Up-Your-Treatment-List</a> · <a href="organise-your-treatment-list.html">Organise-Your-Treatment-List</a> · <a href="dual-currency-money.html">Dual-Currency-Money</a> ·
    <a href="home.html">Home</a></p>
    </div></body></html>
