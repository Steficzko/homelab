    <div class="crumb"><a href="index.html">Gompha Manual</a></div>
    <div class="draft">Draft — this manual describes the upcoming version of Gompha.</div>
    <hr />
    <p>tags: [task, milestone-1, screen/forgot]
    screen: Reset your password</p>
    <hr />
    <h1>Reset Your Password</h1>
    <h2>Forgotten it? Ask the owner — do not wait for an email</h2>
    <p><strong>Gompha sends no email yet.</strong> So the way back in is a person, not an inbox:</p>
    <ol>
    <li><strong>Tell the clinic owner</strong> you cannot get in. WhatsApp, or walk over.</li>
    <li>They open your card on the setup screen and press <strong>New password link</strong>
       (<a href="give-someone-a-new-link.html">Give-Someone-a-New-Link</a>).</li>
    <li>They send you the link — WhatsApp, SMS, or on their phone in front of you.</li>
    <li>Open it and choose a new password (below).</li>
    </ol>
    <p>It takes about a minute, and it is the whole recovery path. <strong>Nothing of yours is lost while you
    are locked out</strong>: your account, your role and your access settings are untouched.</p>
    <h2>⚠ "Forgot your password?" on the sign-in screen sends nothing</h2>
    <p>The <strong>Forgot your password?</strong> link under the sign-in card still works as a screen, but <strong>no mail
    leaves the building</strong>. If you use it, the app says a link is on its way and nothing will arrive.</p>
    <p>That is not a fault to report — it is email being deliberately switched off until it is set up
    properly (<a href="activate-your-account.html">Activate-Your-Account</a> explains why). <strong>Ask the owner instead.</strong></p>
    <p>For completeness, the screen does this: press <strong>Forgot your password?</strong> → the screen headed
    <strong>Reset your password</strong> → type your work email → press <strong>Send reset link</strong> → the screen changes to
    <strong>Check your email</strong>. The message is the same whatever address you type, on purpose (see <em>Why it
    works this way</em>).</p>
    <h2>Setting the new password</h2>
    <p>Opening a reset link gives you a screen headed <strong>Choose a new password</strong>, with the line <em>"Set a new
    password. Every other signed-in device will be signed out."</em></p>
    <ol>
    <li>Type your name in <strong>Your name</strong>.</li>
    <li>Type the new password twice — <strong>Password</strong> and <strong>Confirm password</strong>
       (<a href="passwords-and-sessions.html">Passwords-and-Sessions</a> has the rules).</li>
    <li>Press <strong>Set new password</strong>.</li>
    </ol>
    <p>You are returned to the sign-in screen with a green confirmation: <em>"Your password was changed. Sign
    in with your new password."</em></p>
    <p><strong>A reset link lasts one hour</strong> and works once. If it has gone stale, ask the owner for another —
    it is one button, and they can press it as often as needed.</p>
    <h2>Why it works this way</h2>
    <p><strong>The screen never tells you whether an address has an account.</strong> Whatever you type, the answer is
    the same. If it said "no such user", anyone could type addresses at it until one came back
    different, and learn who works at this clinic. The reassurance is deliberately vague for that
    reason alone.</p>
    <p><strong>A reset lasts one hour, an invite lasts 48.</strong> A reset link opens a live account with a real
    history behind it, so it is worth more to a thief than an invite to an account that has not been
    used yet. The more valuable key gets the shorter life.</p>
    <p><strong>Using a reset signs out every other device.</strong> If someone else had got into your account, the
    reset is what removes them. A password change that left old sessions alive would change the lock
    and leave the intruder inside.</p>
    <p><strong>Somebody at the clinic can always let you back in.</strong> Nobody can tell you your old password — it
    is not stored in any form anyone can read, including us. What the owner can do is mint you a fresh
    way to set a new one. That is the difference between a password nobody can recover and an account
    nobody can recover, and only the first of the two is meant to be true.</p>
    <p>Next: <a href="sign-in.html">Sign-In</a> · <a href="give-someone-a-new-link.html">Give-Someone-a-New-Link</a> · <a href="passwords-and-sessions.html">Passwords-and-Sessions</a> · <a href="home.html">Home</a></p>
    </div></body></html>
