    <h1>Gompha Manual</h1>
    <p><strong>Version: Milestone 1 · checked against image <code>clinic-v0.1.14</code> · Stamped 2026-08-20 (pass 2)</strong></p>
    <blockquote>
    <h3>This manual covers Milestone 1 only</h3>
    <p>Milestone 1 is <strong>sign-in, people and access, rooms</strong>, and <strong>a doctor's own treatment list</strong>.
    That is the whole of the live software today, at <strong>https://app-staging.gompha.com</strong>.</p>
    <p>There is <strong>no schedule, no patients, no patient card, no tooth chart, no appointments, no
    Income and Expenses, no inventory and no X-rays yet</strong>. If you are looking for one of those,
    read <a href="whats-not-here-yet.html">Whats-Not-Here-Yet</a> first so nobody spends an afternoon hunting for a screen that
    has not been built.</p>
    </blockquote>
    <p>This vault is the single onboarding source for everyone who uses Gompha. It describes the
    software <strong>exactly as it is right now</strong>. Anything decided but not built lives as one line in
    <a href="roadmap.html">Roadmap</a>.</p>
    <h2>Start here, by role</h2>
    <table>
    <thead>
    <tr>
    <th>You are</th>
    <th>Start here</th>
    <th>Is there work for you in Milestone 1?</th>
    </tr>
    </thead>
