    <div class="crumb"><a href="index.html">Gompha Manual</a></div>
    <div class="draft">Draft — this manual describes the upcoming version of Gompha.</div>
    <hr />
    <h2>tags: [role, milestone-1]</h2>
    <h1>Assistant</h1>
    <h2>Read this first</h2>
    <p><strong>Milestone 1 has no schedule and no patients</strong>, so there is nothing for you to do in Gompha yet
    beyond getting your account working. <a href="whats-not-here-yet.html">Whats-Not-Here-Yet</a>.</p>
    <h2>Set your account up</h2>
    <p>The owner will send you a link — WhatsApp, SMS or in person, <strong>not email</strong>. Open it and choose your
    own password. <a href="activate-your-account.html">Activate-Your-Account</a> · <a href="passwords-and-sessions.html">Passwords-and-Sessions</a>.</p>
    <h2>When you sign in</h2>
    <ol>
    <li>Open <strong>https://app-staging.gompha.com</strong> and sign in (<a href="sign-in.html">Sign-In</a>).</li>
    <li>You get a short page headed <strong>"You're signed in"</strong> which names your role and lists the clinic's
       <strong>rooms</strong>.</li>
    </ol>
    <p>The <strong>gear</strong> at the top right gives you <a href="switch-to-dark-mode.html">Switch-to-Dark-Mode</a> and <strong>Sign out</strong>.</p>
    <h2>You are attached to one doctor, and that matters</h2>
    <p>Every assistant is created <strong>under one named doctor</strong>. On the owner's screen your card reads
    <em>"Assistant · under Dr …"</em>.</p>
    <p>That doctor decides the meaning of almost everything you can see. Your access is set to <strong>Own</strong> in
    most sections, and for you <strong>"own" means your doctor's</strong>
    (<a href="set-what-each-person-can-see.html">Set-What-Each-Person-Can-See</a>):</p>
    <ul>
    <li><strong>His patients</strong>, as contacts and as clinical records — not the whole clinic's</li>
    <li><strong>His schedule</strong> — not the whole clinic's book</li>
    <li><strong>What his patients owe</strong></li>
    </ul>
    <p>One section starts at <strong>None</strong>: <strong>Financial information</strong>. For you that would mean <em>your doctor's
    earnings</em>, which is not something the software hands over by default. The owner can grant it, and
    that has to be a choice somebody makes on purpose.</p>
    <p><strong>His treatment list is his alone.</strong> Each doctor keeps his own treatments, prices and times
    (<a href="set-up-your-treatment-list.html">Set-Up-Your-Treatment-List</a>). In this version there is no screen for you to open it — no button
    in your gear menu, and nothing on your home page. If he asks you to fix a price for him, he has to
    do it from his own sign-in.</p>
    <p><strong>If you move to a different doctor, tell the owner.</strong> Everything you can see moves with it, and in
    Milestone 1 the change cannot be made on screen — support has to do it.</p>
    <h3>If his side of the app is empty</h3>
    <p>Two ordinary reasons, neither of them a fault on your account:</p>
    <ul>
    <li><strong>He has not opened his invite yet.</strong> Until he sets his own password there is no active doctor for
      you to be attached to. It appears as soon as he does (<a href="activate-your-account.html">Activate-Your-Account</a>).</li>
    <li><strong>He has been archived</strong> — he has left the clinic. His side of the app goes at that moment, even
      if you were already signed in. You can still sign in and nothing you recorded is lost; the owner
      has to attach you to another doctor, and in Milestone 1 that needs a call to us.</li>
    </ul>
    <p><strong>Ask the owner to check the doctor's card.</strong> Do not reset your own password over this — it is not a
    sign-in problem, and a new password will change nothing.</p>
    <h2>Worth reading now</h2>
    <ul>
    <li><a href="working-offline.html">Working-Offline</a> — the grey <strong>"No connection"</strong> strip is normal, not an error, and while it shows
      nothing can be saved.</li>
    <li><a href="install-the-app-on-a-phone.html">Install-the-App-on-a-Phone</a> — you will be working from a phone or a chair-side tablet. Set the
      tablet to <strong>Comfortable</strong> so the buttons are big enough with gloves on.</li>
    <li><strong>Forgotten your password? Ask the owner</strong> — Gompha sends no email, and one button from them
      gets you a fresh link. <a href="reset-your-password.html">Reset-Your-Password</a>.</li>
    <li><a href="when-something-goes-wrong.html">When-Something-Goes-Wrong</a> — if a red box shows a code, press <strong>Report this</strong>.</li>
    </ul>
    <p>Next: <a href="sign-in.html">Sign-In</a> · <a href="roles-and-access.html">Roles-and-Access</a> · <a href="whats-not-here-yet.html">Whats-Not-Here-Yet</a> · <a href="home.html">Home</a></p>
    </div></body></html>
