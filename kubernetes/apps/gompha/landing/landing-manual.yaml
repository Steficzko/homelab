    <h2>tags: [home]</h2>
    <h1>Gompha Manual</h1>
    <p><strong>Version: v0.0 — no modules live · Stamped 2026-08-15</strong></p>
    <blockquote>
    <p><strong>Architecture update (2026-08-15):</strong> ADR-014 moved Gompha to online-first. The server is the
    single source of truth for every write; there is no writable offline replica. Offline now
    means viewing cached data, read-only. See <a href="working-offline.html">Working-Offline</a>.</p>
    <p><strong>Nothing live to document.</strong>
    Gompha is being built. No screen has shipped, so this vault has no instructions in it yet.
    Every page below is a placeholder that keeps the structure stable. Each one gets written the
    day its module ships, from the screens as they actually are.</p>
    </blockquote>
    <p>If you are onboarding a clinic today, this vault is not yet the thing to hand over. Nothing here
    describes working software.</p>
    <h2>What this vault is</h2>
    <p>The single onboarding source for everyone who uses Gompha — reception, doctors, assistants and
    clinic admins. It documents the software <strong>as it is right now</strong>. Not what is planned, not what
    the old app did. Anything not yet live lives as one line in <a href="roadmap.html">Roadmap</a>.</p>
    <h2>By role</h2>
    <table>
    <thead>
    <tr>
    <th>You are</th>
    <th>Start here</th>
    </tr>
    </thead>
    <tbody>
    <tr>
    <td>Front desk</td>
    <td><a href="receptionist.html">Receptionist</a></td>
    </tr>
    <tr>
    <td>Doctor</td>
    <td><a href="doctor.html">Doctor</a></td>
    </tr>
    <tr>
    <td>Assistant</td>
    <td><a href="assistant.html">Assistant</a></td>
    </tr>
    <tr>
    <td>Clinic admin</td>
    <td><a href="clinic-admin.html">Clinic-Admin</a></td>
    </tr>
    </tbody>
    </table>
    <h2>By task</h2>
    <p>Named the way staff ask for them, not the way the software is organised.</p>
    <ul>
    <li><a href="register-a-patient.html">Register-a-Patient</a></li>
    <li><a href="book-an-appointment.html">Book-an-Appointment</a></li>
    <li><a href="take-a-payment.html">Take-a-Payment</a></li>
    <li><a href="use-the-tooth-chart.html">Use-the-Tooth-Chart</a></li>
    <li><a href="record-a-treatment.html">Record-a-Treatment</a></li>
    <li><a href="read-the-day-view.html">Read-the-Day-View</a></li>
    <li><a href="work-offline.html">Work-Offline</a></li>
    <li><a href="install-the-app-on-a-phone.html">Install-the-App-on-a-Phone</a></li>
    <li><a href="add-a-staff-member.html">Add-a-Staff-Member</a></li>
    </ul>
    <h2>Things worth understanding</h2>
    <ul>
    <li><a href="working-offline.html">Working-Offline</a> — the one to read first, once it exists</li>
    <li><a href="roles-and-access.html">Roles-and-Access</a></li>
    <li><a href="dual-currency-money.html">Dual-Currency-Money</a></li>
    <li><a href="what-your-licence-covers.html">What-Your-Licence-Covers</a></li>
    </ul>
    <h2>What is coming</h2>
    <p><a href="roadmap.html">Roadmap</a> — one line each, no dates, no promises.</p>
    </div></body></html>
