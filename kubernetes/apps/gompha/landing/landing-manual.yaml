    <div class="draft">Draft — this manual describes the upcoming version of Gompha.</div>
    <hr />
    <p>tags: [task, milestone-1, screen/person-archive, root]
    screen: Archive this person (popup)</p>
    <hr />
    <h1>Archive a Person</h1>
    <p><strong>For the owner.</strong> On a person's card, on the people and access step of <a href="set-up-your-clinic.html">Set-Up-Your-Clinic</a>.</p>
    <p><strong>There is no Delete in Gompha, and there never will be.</strong> Somebody who leaves the clinic is
    <strong>archived</strong>: they stop being able to sign in, and everything they did stays exactly where it is,
    still under their name.</p>
    <blockquote>
    <p><strong>Read this whole page before you press it.</strong> Bringing an archived person back is not in this
    version. Archive the wrong person and it takes a call to us to undo.</p>
    </blockquote>
    <h2>Steps</h2>
    <ol>
    <li>Find the person's card on the people step.</li>
    <li>Press <strong>Archive</strong> — the red-outlined button at the bottom right of the card.</li>
    <li>A popup opens in the middle of the screen (on a phone it fills the screen), headed <strong>Archive
       this person</strong>, naming who it is and their role. It tells you plainly:<blockquote>
    <p>They stop being able to sign in straight away, and any device they are already signed in on
    is signed out.</p>
    </blockquote>
    </li>
    <li>To go ahead, press the red <strong>Archive</strong>. To back out, press <strong>Keep them</strong> — nothing happens.</li>
    </ol>
    <h2>What changes on the card</h2>
    <ul>
    <li>The card turns grey and gains an <strong>Archived</strong> badge.</li>
    <li>A line appears: <em>"Sign-in is blocked and their access is frozen. Their past work and their
      colour stay with them."</em></li>
    <li>The five access sections are greyed out. So is the doctor colour.</li>
    <li><strong>New invite link</strong> and <strong>Archive</strong> are gone; only <strong>Edit details</strong> stays.</li>
    </ul>
    <h2>What archiving does <em>not</em> do</h2>
    <ul>
    <li><strong>It does not delete anything.</strong> In the popup's own words:<blockquote>
    <p><strong>Archived, not deleted.</strong> Nothing is erased: every appointment they booked and every payment
    recorded against them stays exactly where it is, still under their name. That is why there is
    no delete — deleting a doctor would take his work with him.</p>
    </blockquote>
    </li>
    <li><strong>It does not free up their doctor colour.</strong> The colour stays reserved to them, so old records
      keep reading the way they always did.</li>
    <li><strong>It does not remove them from the list.</strong> They stay visible, greyed, so nobody wonders where a
      name went.</li>
    </ul>
    <h2>If you archive a doctor, read this</h2>
    <p><strong>His assistant loses her view of his work at the same moment.</strong> An assistant is attached to one
    doctor, and most of what she can see is <em>his</em> (<a href="roles-and-access.html">Roles-and-Access</a>). Archive him and that half of
    her screen goes — instantly, and on any device she is already signed in on.</p>
    <p>Her own account is untouched: she can still sign in, and nothing she recorded is lost. But until the
    owner attaches her to another doctor, there is nothing of his left for her to open.</p>
    <p><strong>In Milestone 1 that reattachment cannot be done on screen</strong> — it needs a call to us. So before you
    archive a doctor, decide who his assistant works under next.</p>
    <h2>Who cannot be archived</h2>
    <p><strong>The owner.</strong> A card carrying the green <strong>ROOT</strong> badge has no Archive button at all — it is not
    offered rather than offered and refused. The clinic must always have an owner.</p>
    <h2>What can go wrong</h2>
    <table>
    <thead>
    <tr>
    <th>On screen</th>
    <th>What it means</th>
    <th>What to do</th>
    </tr>
    </thead>
    <tbody>
    <tr>
    <td>The button is greyed out with <strong>Needs the clinic link.</strong></td>
    <td>The device cannot reach the server.</td>
    <td>See <a href="working-offline.html">Working-Offline</a>.</td>
    </tr>
    <tr>
    <td><strong>No connection — this needs the clinic link. Nothing changed; try again when it is back.</strong></td>
    <td>The connection dropped mid-press.</td>
    <td>Nobody was archived. Try again.</td>
    </tr>
    <tr>
    <td><strong>The clinic is read-only until the licence is renewed. Nothing changed.</strong></td>
    <td>The licence has lapsed.</td>
    <td>See <a href="what-your-licence-covers.html">What-Your-Licence-Covers</a>.</td>
    </tr>
    <tr>
    <td>There is no Archive button on this card</td>
    <td>It is the owner's card.</td>
    <td>See above.</td>
    </tr>
    </tbody>
    </table>
    <h2>Why it works this way</h2>
    <p><strong>A treatment belongs to the patient, not to the doctor who typed it.</strong> If deleting a doctor
    deleted his work, a patient's medical history would lose entries every time a dentist moved on.
    That is not a data-tidiness preference; it is what makes the record trustworthy.</p>
    <p><strong>Sessions die in the same breath.</strong> Blocking sign-in but leaving a live session alive on a tablet
    somebody took home would be a lock with the intruder still inside. Archiving ends every one of
    their sessions in the same instant (<a href="passwords-and-sessions.html">Passwords-and-Sessions</a>).</p>
    <p><strong>"Archive", not "Remove" or "Delete".</strong> The word on the button has to match what actually happens.
    A button labelled Delete that quietly keeps everything teaches staff that the words in this app
    cannot be trusted — and the first time that matters will be somewhere far more expensive.</p>
    <p><strong>Bringing someone back is a separate decision.</strong> It is not a side effect of asking for a link or
    of editing a name. Until it has its own button, it needs a call — which is the right cost for an
    action that hands somebody their access back.</p>
    <p>Next: <a href="give-someone-a-new-link.html">Give-Someone-a-New-Link</a> · <a href="fix-a-persons-details.html">Fix-a-Persons-Details</a> · <a href="roles-and-access.html">Roles-and-Access</a> · <a href="home.html">Home</a></p>
    </div></body></html>
