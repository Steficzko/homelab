    <tr>
    <td>The owner (root)</td>
    <td><a href="clinic-admin.html">Clinic-Admin</a></td>
    <td>Yes — you set the clinic up</td>
    </tr>
    <tr>
    <td>A doctor</td>
    <td><a href="doctor.html">Doctor</a></td>
    <td>Yes — you set up your own treatment list</td>
    </tr>
    <tr>
