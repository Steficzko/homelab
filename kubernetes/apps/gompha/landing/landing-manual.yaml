    </style></head><body><div class="wrap">
    <div class="crumb"><a href="index.html">Gompha Manual</a></div>
    <div class="draft">Draft — this manual describes the upcoming version of Gompha.</div>
    <hr />
    <h2>tags: [concept, milestone-1, support]</h2>
    <h1>Passwords and Being Signed Out</h1>
    <h2>The password rules</h2>
    <p>When you set a password — on your invite (<a href="activate-your-account.html">Activate-Your-Account</a>) or on a reset
    (<a href="reset-your-password.html">Reset-Your-Password</a>) — Gompha checks four things:</p>
    <ol>
    <li><strong>At least 12 characters.</strong></li>
    <li><strong>Not blank.</strong></li>
    <li><strong>At least 5 different characters</strong>, so <code>aaaaaaaaaaaa</code> is refused.</li>
    <li><strong>Not a password that has appeared in a known public breach.</strong></li>
    </ol>
    <p>A line under the field tells you as you type whether the first three are satisfied. The fourth is
    checked when you press the button, and if it fails you get:</p>
    <blockquote>
    <p>This password appears in a known breach — choose another</p>
    </blockquote>
    <p><strong>That is not a comment on how clever your password is.</strong> It means that exact password already
    appears on lists that attackers try first. A long phrase of three or four ordinary words is easier
    to remember and passes comfortably.</p>
    <p><strong>Your password is never sent anywhere in a readable form</strong>, and the breach check does not send it
    either — only a short fragment of a scrambled version leaves the clinic, which is not enough to
    reconstruct anything. If that check cannot be reached, setting your password still works: a flicker
    in the internet must never be what stops a new receptionist from getting started.</p>
    <h2>Why you get signed out</h2>
    <p><strong>A session lasts 12 hours.</strong> That covers a clinic day with room to spare. After that you sign in
    again. There is nothing wrong.</p>
    <p>You are also signed out when:</p>
    <ul>
    <li>you press <strong>Sign out</strong> in the Settings popup (<a href="sign-in.html">Sign-In</a>),</li>
    <li>you finish a <strong>password reset</strong> — that deliberately signs out every other device,</li>
    <li>your account is <strong>archived</strong>, which stops every device immediately.</li>
    </ul>
    <p><strong>Being offline does not sign you out.</strong> See <a href="working-offline.html">Working-Offline</a>.</p>
    <p><strong>Closing the browser does not sign you out</strong>, and neither does closing the tab. Use <strong>Sign out</strong> on
    a shared machine.</p>
    <h2>What Gompha never asks you</h2>
    <ul>
    <li>Nobody at the clinic and nobody at Gompha can tell you your password. It is not stored in a form
      anyone can read, including us.</li>
    <li><strong>No support request will ever ask you for your password.</strong> If one does, it is not from us.</li>
    <li>Anyone who needs to get you back in issues you a fresh link. They never set a password for you.</li>
    </ul>
    <h2>Why it works this way</h2>
    <p><strong>Twelve characters, not eight with a capital and a symbol.</strong> Length beats decoration: the rules
    that demand a symbol produce <code>Passw0rd!</code> in every clinic in the world. Length and a breach check
    between them refuse the passwords that actually get guessed.</p>
    <p><strong>The breach check happens when the password is set, not later.</strong> A password already known to
    attackers is the single most likely way into this clinic's records, and the only moment it can be
    refused cheaply is the moment somebody chooses it.</p>
    <p><strong>A reset signs out every other device.</strong> If someone else had got in, the reset is what removes them.
    Changing the lock while leaving the intruder inside would be theatre.</p>
    <p><strong>A session is a record on the server, not a note in the browser.</strong> In the first version of Gompha,
    signing out only cleared the browser, so a session on a forgotten tablet stayed alive. Now ending a
    session ends it for real, and archiving a person kills every session they had in the same breath.</p>
    <p>Next: <a href="sign-in.html">Sign-In</a> · <a href="roles-and-access.html">Roles-and-Access</a> · <a href="home.html">Home</a></p>
    </div></body></html>
