    <h2>tags: [roadmap]</h2>
    <h1>Roadmap</h1>
    <p>Decided, but <strong>not in the software today</strong>. One line each. No dates, no promises. Nothing on this
    page can be shown to a clinic as a feature.</p>
    <p>When one of these ships, it leaves this page and becomes a real page in the vault.</p>
    <h2>The next things staff will notice</h2>
    <ul>
    <li>Email from Gompha — staff invites and password resets sent automatically, from the clinic's own
      mail address, switched on only after a test message actually arrives. Until then links are
      hand-delivered (<a href="give-someone-a-new-link.html">Give-Someone-a-New-Link</a>).</li>
    <li>Bringing an archived person back (<a href="archive-a-person.html">Archive-a-Person</a>).</li>
    <li>Changing a person's role, and moving an assistant to a different doctor.</li>
    <li>A screen for reading the record of who did what, and the owner's choice of who may read it.</li>
    <li>The screens that do not yet name their own reason for a refusal learning to, so every code is the
      specific one (<a href="error-codes.html">Error-Codes</a>).</li>
    <li>A warning before the licence lapses, and quiet automatic renewal behind it
      (<a href="what-your-licence-covers.html">What-Your-Licence-Covers</a>).</li>
    <li>A copy of the schedule and a doctor's own patients kept on the device, readable when the link is
      down (<a href="working-offline.html">Working-Offline</a>).</li>
    <li>Room opening hours, and splitting a shared room between doctors, set on the schedule itself.</li>
    <li>A way back into the clinic setup screen from inside the app, instead of typing the address
      (<a href="clinic-admin.html">Clinic-Admin</a>).</li>
    <li>A screen for setting the day's dollar–dinar rate, so a price shows its converted figure
      (<a href="dual-currency-money.html">Dual-Currency-Money</a>).</li>
    <li>The owner being able to look at another doctor's treatment list to help him with it
      (<a href="set-up-your-treatment-list.html">Set-Up-Your-Treatment-List</a>).</li>
    <li>A doctor's own materials and medicines, linked to his treatments — step 2 of a doctor's setup is
      the placeholder for it today.</li>
    </ul>
    <h2>The modules themselves</h2>
    <ul>
    <li>The schedule and the day grid — reception's home screen.</li>
    <li>Patients: the patient card, search, the clinical record.</li>
    <li>The tooth chart.</li>
    <li>Recording treatments and notes <strong>on a patient</strong> — separate from the list of treatments a doctor
      offers, which is already live (<a href="record-a-treatment.html">Record-a-Treatment</a>).</li>
    <li>Income and Expenses, patient balances and payments.</li>
    <li>Inventory.</li>
    <li>X-rays and photos.</li>
    </ul>
    <h2>Settled ways of working, already true underneath</h2>
    <p>These are not features. They are decisions already built into what exists, mentioned here so nobody
    proposes the opposite later.</p>
    <ul>
    <li>The server decides everything. There is no device that can save a change on its own, and there is
      never a half-saved record to reconcile (<a href="working-offline.html">Working-Offline</a>).</li>
    <li>A lapsed licence makes the clinic read-only. It never deletes anything
      (<a href="what-your-licence-covers.html">What-Your-Licence-Covers</a>).</li>
    <li>Doctor seats are counted per role; reception and assistants are not counted.</li>
    <li>A seat is a person, not a device.</li>
    <li>Nobody and nothing is truly deleted — people and rooms are archived (<a href="archive-a-person.html">Archive-a-Person</a>).</li>
    <li>Every refusal carries a code that never changes its meaning (<a href="error-codes.html">Error-Codes</a>).</li>
    <li>What a clinic may do is carried in its own licence, so a bespoke arrangement never needs a new
      version of the software.</li>
    <li>Clinics that buy their own branding get their own domain and look.</li>
    <li>No billing, invoicing or payment inside the product. Money is arranged out of band, the way
      clinics here actually buy.</li>
    </ul>
    <p>Back to <a href="home.html">Home</a> · what Milestone 1 covers: <a href="whats-not-here-yet.html">Whats-Not-Here-Yet</a></p>
    </div></body></html>
