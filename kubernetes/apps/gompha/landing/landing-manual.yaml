    <div class="crumb"><a href="index.html">Gompha Manual</a></div>
    <div class="draft">Draft — this manual describes the upcoming version of Gompha.</div>
    <hr />
    <h2>tags: [concept, scope, milestone-1]</h2>
    <h1>What Is Not Here Yet</h1>
    <p><strong>Gompha is being built in milestones. This manual, and the software behind it, is at
    Milestone 1.</strong></p>
    <p>Milestone 1 is deliberately small. It is the part everything else needs first: who the users
    are, what each of them may see, which rooms the clinic has, and what each doctor treats and
    charges.</p>
    <h2>What Milestone 1 gives you</h2>
    <ul>
    <li>Signing in and out, with your own password (<a href="sign-in.html">Sign-In</a>)</li>
    <li>An invite link that lets each person set their own password (<a href="activate-your-account.html">Activate-Your-Account</a>)</li>
    <li>Setting a new password from a link (<a href="reset-your-password.html">Reset-Your-Password</a>)</li>
    <li>A three-step setup for the owner: greeting, people and access, rooms (<a href="set-up-your-clinic.html">Set-Up-Your-Clinic</a>)</li>
    <li>The five access sections, set per person (<a href="set-what-each-person-can-see.html">Set-What-Each-Person-Can-See</a>)</li>
    <li>Per-person fixes on each card: a fresh link (<a href="give-someone-a-new-link.html">Give-Someone-a-New-Link</a>), correcting a name or
      email (<a href="fix-a-persons-details.html">Fix-a-Persons-Details</a>), archiving someone who has left (<a href="archive-a-person.html">Archive-a-Person</a>)</li>
    <li>Twelve doctor colours (<a href="choose-a-doctor-colour.html">Choose-a-Doctor-Colour</a>)</li>
    <li>The clinic's rooms, by name (<a href="add-the-clinic-rooms.html">Add-the-Clinic-Rooms</a>)</li>
    <li>Dark mode and a display-density switch (<a href="switch-to-dark-mode.html">Switch-to-Dark-Mode</a>)</li>
    <li>An error code and a reference on failures, with a <strong>Report this</strong> link
      (<a href="when-something-goes-wrong.html">When-Something-Goes-Wrong</a>, <a href="error-codes.html">Error-Codes</a>)</li>
    <li><strong>A doctor's own treatment list, with his prices and his timings</strong> — his treatments in his own
      order, priced in dollars or dinar, with chair and working times and multi-visit work
      (<a href="set-up-your-treatment-list.html">Set-Up-Your-Treatment-List</a>, <a href="add-a-treatment.html">Add-a-Treatment</a>, <a href="organise-your-treatment-list.html">Organise-Your-Treatment-List</a>,
      <a href="delete-and-restore-a-treatment.html">Delete-and-Restore-a-Treatment</a>). It is the reason a doctor signing in lands on his own setup
      screen rather than the plain "You're signed in" page.</li>
    </ul>
    <h2>What it does not give you</h2>
    <p>None of the following exists in the software today. Not hidden, not behind a permission, not
    "coming next week" — <strong>not built</strong>.</p>
    <table>
    <thead>
    <tr>
    <th>You are looking for</th>
    <th>Status</th>
    </tr>
    </thead>
    <tbody>
    <tr>
    <td>The schedule / day grid</td>
    <td>Not built</td>
    </tr>
    <tr>
    <td>Booking or cancelling an appointment</td>
    <td>Not built</td>
    </tr>
    <tr>
    <td>Patients, patient search, the patient card</td>
    <td>Not built</td>
    </tr>
    <tr>
    <td>The tooth chart (odontogram)</td>
    <td>Not built</td>
    </tr>
    <tr>
    <td>Recording a treatment on a patient, and clinical notes</td>
    <td>Not built</td>
    </tr>
    <tr>
    <td>Income and Expenses</td>
    <td>Not built</td>
    </tr>
    <tr>
    <td>Payments and what a patient owes</td>
    <td>Not built</td>
    </tr>
    <tr>
    <td>Inventory</td>
    <td>Not built</td>
    </tr>
    <tr>
    <td>X-rays and photos</td>
    <td>Not built</td>
    </tr>
    <tr>
    <td>Reports</td>
    <td>Not built</td>
    </tr>
    <tr>
    <td>Booking a patient onto a treatment from a doctor's list</td>
    <td>Not built — the list is ready first, the schedule follows (<a href="set-up-your-treatment-list.html">Set-Up-Your-Treatment-List</a>)</td>
    </tr>
    <tr>
    <td>The owner opening another doctor's treatment list, even to help</td>
    <td>Not built — each doctor's list is his own (<a href="roles-and-access.html">Roles-and-Access</a>)</td>
    </tr>
    <tr>
    <td>A screen for setting the dollar–dinar exchange rate</td>
    <td>Not built — until it exists, a price saves in the currency you typed and no converted figure is shown (<a href="dual-currency-money.html">Dual-Currency-Money</a>)</td>
    </tr>
    <tr>
    <td>A doctor's own materials and medicines</td>
    <td>Not built — step 2 of a doctor's setup says so and asks nothing of him</td>
    </tr>
    <tr>
    <td>Email from Gompha — invites and password links arrive by hand</td>
    <td><strong>Deliberately off</strong> (<a href="give-someone-a-new-link.html">Give-Someone-a-New-Link</a>)</td>
    </tr>
    <tr>
    <td>Bringing an archived person back</td>
    <td>Not built (<a href="archive-a-person.html">Archive-a-Person</a>)</td>
    </tr>
    <tr>
    <td>Changing which doctor an assistant works under</td>
    <td>Not built (<a href="add-a-staff-member.html">Add-a-Staff-Member</a>)</td>
    </tr>
    <tr>
    <td>A screen for the record of who did what</td>
    <td>Not built — the record is being kept</td>
    </tr>
    <tr>
    <td>A warning before the licence lapses</td>
    <td>Not built (<a href="what-your-licence-covers.html">What-Your-Licence-Covers</a>)</td>
    </tr>
    </tbody>
    </table>
    <p><strong>A receptionist or an assistant who signs in today sees one screen</strong>: a short "You're signed in"
    page that names your role and lists the clinic's rooms. That is correct behaviour, not a fault, and
    not a permission problem. See <a href="receptionist.html">Receptionist</a> and <a href="assistant.html">Assistant</a>.</p>
    <p><strong>A doctor sees that page too, plus his own treatment list</strong> — his treatments, his prices, his
    timings, which is the one piece of real work Milestone 1 asks of him. Nothing patient-facing hangs
    off it yet. See <a href="doctor.html">Doctor</a> and <a href="set-up-your-treatment-list.html">Set-Up-Your-Treatment-List</a>.</p>
    <h2>Why the access settings are there before the screens are</h2>
    <p>The five sections you set in Milestone 1 (<a href="set-what-each-person-can-see.html">Set-What-Each-Person-Can-See</a>) are recorded now and
    govern each module <strong>as it arrives</strong>. Getting them decided before there is a patient record to
    guard is deliberate: retrofitting access to a system that already holds clinical data is how
    clinics end up with everyone seeing everything.</p>
    <p>Most of them have nothing to hide yet, and will the moment the module they cover ships. <strong>One
    already works:</strong> <strong>Financial information</strong> set to <code>None</code> hides the prices on a doctor's own
    treatment list — he sees the word <strong>Hidden</strong> behind a small padlock where a price would be, and
    cannot set one. That is the access setting doing its job, not a fault.</p>
    <h2>Two things to tell staff on day one</h2>
    <ol>
    <li><strong>Do not go looking for the schedule.</strong> It is not there. Nobody has misconfigured anything.</li>
    <li><strong>The setup you do now is not throwaway.</strong> People, access and rooms are the real records the
       later modules attach to. Nothing here is re-entered later.</li>
    </ol>
    <p>Back to <a href="home.html">Home</a> · what is decided but unbuilt: <a href="roadmap.html">Roadmap</a></p>
    </div></body></html>
