    <div class="crumb"><a href="index.html">Gompha Manual</a></div>
    <div class="draft">Draft — this manual describes the upcoming version of Gompha.</div>
    <hr />
    <p>tags: [task, milestone-1, screen/redeem]
    screen: Join the clinic</p>
    <hr />
    <h1>Activate Your Account</h1>
    <p>You were added to Gompha by the clinic owner and sent a link. The link is how you choose your own
    password. Nobody at the clinic, and nobody at Gompha, knows or sets your password for you.</p>
    <p><strong>The link is single-use and expires 48 hours after it was created.</strong> Once you have used it, it
    will not work a second time — that is normal, you are already set up, and you sign in from then on
    with <a href="sign-in.html">Sign-In</a>.</p>
    <h2>Steps</h2>
    <ol>
    <li>Open the link you were sent. It arrives by WhatsApp, SMS or in person — <strong>not by email</strong>. See
       <em>Why it works this way</em> below.</li>
    <li>The screen is headed <strong>Join the clinic</strong>, with <em>"Set your password to activate your account."</em>
       underneath.</li>
    <li>Type your name in <strong>Your name</strong>. Arabic and Kurdish are fine here; type it the way you want it
       to appear to colleagues.</li>
    <li>Choose a password in the <strong>Password</strong> field. A small line of text under the field tells you
       whether it is acceptable yet (<a href="passwords-and-sessions.html">Passwords-and-Sessions</a> has the rules).</li>
    <li>Type the same password again in <strong>Confirm password</strong>.</li>
    <li>Press <strong>Activate account</strong>.</li>
    </ol>
    <p>You are signed in immediately. You do not have to sign in again straight away.</p>
    <h2>If something goes wrong</h2>
    <table>
    <thead>
    <tr>
    <th>On screen</th>
    <th>What it means</th>
    <th>What to do</th>
    </tr>
    </thead>
    <tbody>
    <tr>
    <td><strong>This link is incomplete</strong></td>
    <td>The link lost its code, usually because it was retyped by hand or truncated when it was forwarded.</td>
    <td>Ask the owner for the link again, and copy the whole thing.</td>
    </tr>
    <tr>
    <td><strong>This link is invalid or has already been used. Ask for a new one.</strong></td>
    <td>Used once already, or more than 48 hours old.</td>
    <td>Ask the owner to issue a new link.</td>
    </tr>
    <tr>
    <td><strong>At least 12 characters.</strong> under the password field</td>
    <td>The password is too short.</td>
    <td>Make it longer.</td>
    </tr>
    <tr>
    <td><strong>This password appears in a known breach — choose another</strong></td>
    <td>The password has appeared in a public leak of stolen passwords.</td>
    <td>Choose a different one. It is not a judgement on you.</td>
    </tr>
    <tr>
    <td><strong>Too many attempts — wait a moment and try again.</strong></td>
    <td>Too many tries in a short time.</td>
    <td>Wait about a minute. Nothing is locked or damaged.</td>
    </tr>
    <tr>
    <td>The sign-in screen appears instead of this one</td>
    <td>The link was cut short — usually copied by hand, or truncated by the app it was forwarded through.</td>
    <td>Ask the owner for a fresh link and open it whole.</td>
    </tr>
    </tbody>
    </table>
    <h2>Lost the link, or it has expired?</h2>
    <p><strong>Ask the owner for another one.</strong> They press one button on your card and a new link appears —
    <a href="give-someone-a-new-link.html">Give-Someone-a-New-Link</a>. Nothing about your account is affected: your role, your access and
    your name are all still there, waiting for you to set a password.</p>
    <p>Note for the owner: an older link you already sent keeps working until it expires, so issuing a
    new one does not break the old one.</p>
    <h2>Why it works this way</h2>
    <p><strong>No email is sent.</strong> Sending mail as the clinic, from the clinic's own address, needs a mail
    setup that is deliberately not switched on yet — half-configured mail lands in spam folders and
    nobody finds out until an invite is silently lost. Until it is on, the owner copies the link and
    delivers it the way this clinic already talks to its staff. Nothing is lost by hand delivery, and
    an invite that visibly needs sending is better than one that quietly failed to send.</p>
    <p><strong>Your password is yours.</strong> The owner creates the <em>person</em>, never the password. That way there is
    no moment where someone else knows your password, and no shared first password making the rounds
    of the clinic.</p>
    <p><strong>The code sits after the <code>#</code> in the address.</strong> Everything after <code>#</code> stays inside your browser and
    is never sent to any server that relays the page. That keeps a code that could take over your
    account out of server logs and out of anybody's browsing history — the app wipes it from the
    address bar as soon as the screen opens.</p>
    <p><strong>One use, 48 hours.</strong> A link that works forever is a spare key to your account left lying in a
    chat thread.</p>
    <p>Next: <a href="sign-in.html">Sign-In</a> · <a href="passwords-and-sessions.html">Passwords-and-Sessions</a> · <a href="give-someone-a-new-link.html">Give-Someone-a-New-Link</a> · <a href="home.html">Home</a></p>
    </div></body></html>
