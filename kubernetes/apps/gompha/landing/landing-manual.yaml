    <p>tags: [concept, stub, not-live]
    status: not-live</p>
    <hr />
    <h1>Working Offline</h1>
    <p><strong>Nothing live to document.</strong> No part of the app exists yet, so nothing here can be described
    honestly.</p>
    <p><strong>This is the most important page in the vault</strong>, and it stays deliberately empty until there is
    real behaviour to describe. Guessing here would be worse than saying nothing: staff would be
    taught to look for a mark on the screen that does not exist, and would trust a booking that was
    never confirmed.</p>
    <p><strong>Architecture note (ADR-014, accepted 2026-08-15):</strong> the app is online-first. The server is the
    single source of truth for every write. There is no writable offline replica and no 3-day offline
    data buffer — that buffer now applies only to the licence, not to patient or appointment data
    (see <a href="what-your-licence-covers.html">What-Your-Licence-Covers</a>). Being offline means <em>viewing cached data, read-only</em>: nothing
    can be booked, paid or written to a patient's record until the device is back online.</p>
    <p>When the app ships, this page must answer three questions in plain words:</p>
    <ol>
    <li>How do I know this device is offline, and why is that normal rather than a fault?</li>
    <li>What can I still do while offline (look things up) and what must wait (booking, payments,
       notes)?</li>
    <li>What happens the moment the connection comes back?</li>
    </ol>
    <p>Until then: <a href="work-offline.html">Work-Offline</a> · <a href="home.html">Home</a> · <a href="roadmap.html">Roadmap</a></p>
    </div></body></html>
