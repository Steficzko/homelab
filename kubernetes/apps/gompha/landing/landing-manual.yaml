    <div class="crumb"><a href="index.html">Gompha Manual</a></div>
    <div class="draft">Draft — this manual describes the upcoming version of Gompha.</div>
    <hr />
    <p>tags: [task, milestone-1, screen/services, doctor]
    screen: Your treatments (categories, order, search)</p>
    <hr />
    <h1>Organise Your Treatment List</h1>
    <p><strong>For doctors only</strong>, on your own list (<a href="set-up-your-treatment-list.html">Set-Up-Your-Treatment-List</a>). Your categories, your
    order. Nobody else sees either.</p>
    <h2>Find one treatment</h2>
    <p>Type into the <strong>Search a name or a code</strong> box at the top. It searches names and codes, in Arabic and
    Kurdish script as well as English. If nothing matches you get one line — <em>No treatment matches "…"</em>
    — and <strong>Clear search</strong> puts the whole list back.</p>
    <h2>Group them under headings</h2>
    <ol>
    <li>Press <strong>+ New category</strong>.</li>
    <li>Type the name and press <strong>Save</strong> (or <strong>Enter</strong>).</li>
    <li>Put treatments into it either from the treatment itself — open it and pick the <strong>Category</strong>
       (<a href="add-a-treatment.html">Add-a-Treatment</a>) — or from the list: press the <strong>⋮</strong> at the right of a line and choose
       <strong>Move to category…</strong>, then pick one.</li>
    </ol>
    <p>On a category heading, the <strong>⋮</strong> gives you <strong>Rename</strong>, <strong>Add a subcategory</strong>, <strong>Move up</strong>, <strong>Move
    down</strong> and <strong>Delete category</strong>.</p>
    <ul>
    <li><strong>Categories go one level deep.</strong> A subcategory cannot hold subcategories of its own.</li>
    <li><strong>Pressing the heading folds the group shut.</strong> That is only for your eyes, on that device — it is
      not saved for anyone else and it changes nothing.</li>
    <li><strong>Anything not filed sits at the bottom</strong> under <strong>Not in a category</strong>.</li>
    <li><strong>Deleting a category never deletes treatments.</strong> They move to <em>Not in a category</em>, and the
      screen says so before you confirm.</li>
    </ul>
    <h2>Put them in your own order</h2>
    <p>Three ways, all doing the same thing:</p>
    <ul>
    <li><strong>Drag</strong> the <strong>⠿</strong> handle at the left of a line up or down.</li>
    <li><strong>Keyboard:</strong> move onto the handle with Tab, press <strong>Space</strong>, use <strong>↑</strong> and <strong>↓</strong>, press
      <strong>Space</strong> to drop or <strong>Escape</strong> to cancel. Each move is announced — <em>"Position 3 of 12"</em> — for
      anyone working by keyboard or with a screen reader.</li>
    <li><strong>The ⋮ menu:</strong> <strong>Move up</strong>, <strong>Move down</strong>, <strong>Move to top</strong>.</li>
    </ul>
    <p>While it saves, a small line says <em>Saving your order…</em>. If the save fails you get
    <em>Couldn't save the new order. The list is back the way it was.</em> with <strong>Try again</strong> — the list on
    your screen is never left in an order the server does not have.</p>
    <p><strong>Dragging works within one group.</strong> To move a treatment into a different category, use <strong>Move to
    category…</strong> from the <strong>⋮</strong> menu.</p>
    <h2>What you cannot do</h2>
    <ul>
    <li><strong>You cannot sort by price or by name.</strong> The order is the one you set, and nothing re-sorts it
      behind your back.</li>
    <li><strong>300 treatments and 60 categories</strong> is the ceiling per doctor. The largest real list in the
      clinic is around thirty; if you ever meet the limit, tell us.</li>
    </ul>
    <h2>Why it works this way</h2>
    <p><strong>The order is a clinical judgement, not data.</strong> The treatments you do ten times a day belong at
    the top of your list, and only you know which those are. An alphabetical list, or one sorted by
    price, buries them — and this list exists to be picked from quickly at the desk once booking
    arrives.</p>
    <p><strong>Right-click and long-press open the same ⋮ menu.</strong> They are shortcuts. Everything in that menu is
    also reachable by pressing a visible button, because a menu that is the only way to do something is
    invisible to anyone who was not shown it.</p>
    <p><strong>Nothing here is shared.</strong> Your categories are yours. Another doctor filing the same treatment
    under a different heading changes nothing on your screen — the two lists never meet.</p>
    <p>Next: <a href="set-up-your-treatment-list.html">Set-Up-Your-Treatment-List</a> · <a href="delete-and-restore-a-treatment.html">Delete-and-Restore-a-Treatment</a> · <a href="add-a-treatment.html">Add-a-Treatment</a> ·
    <a href="home.html">Home</a></p>
    </div></body></html>
