    <div class="draft">Draft — this manual describes the upcoming version of Gompha.</div>
    <hr />
    <h2>tags: [role, milestone-1]</h2>
    <h1>Receptionist</h1>
    <h2>Read this first</h2>
    <p><strong>Milestone 1 has no schedule and no patients.</strong> There is nothing for the front desk to do in Gompha
    yet. Signing in and knowing your way to the sign-in screen is the whole of it for now.</p>
    <p>That is deliberate, not an oversight. <a href="whats-not-here-yet.html">Whats-Not-Here-Yet</a>.</p>
    <h2>Set your account up</h2>
    <p>The owner will send you a link — WhatsApp, SMS or in person, <strong>not email</strong>. Open it and choose your
    own password. <a href="activate-your-account.html">Activate-Your-Account</a> · <a href="passwords-and-sessions.html">Passwords-and-Sessions</a>.</p>
    <h2>When you sign in</h2>
    <ol>
    <li>Open <strong>https://app-staging.gompha.com</strong> and sign in (<a href="sign-in.html">Sign-In</a>).</li>
    <li>You get a short page headed <strong>"You're signed in"</strong> which names your role and lists the clinic's
       <strong>rooms</strong>.</li>
    </ol>
    <p>The <strong>gear</strong> at the top right gives you <a href="switch-to-dark-mode.html">Switch-to-Dark-Mode</a> and <strong>Sign out</strong>.</p>
    <p><strong>Set the front desk machine to Compact.</strong> It fits more on the screen, which is what you will want
    the day the day-grid arrives.</p>
    <h2>What the front desk will and will not be able to see</h2>
    <p>The owner has already set this, and it takes effect as each module ships
    (<a href="set-what-each-person-can-see.html">Set-What-Each-Person-Can-See</a>):</p>
    <ul>
    <li><strong>Schedule — All.</strong> The whole clinic's book. This is the front desk's home screen when it lands.</li>
    <li><strong>Patients as contacts — All.</strong> Names and phone numbers, so you can ring and confirm.</li>
    <li><strong>Patient financial record — All.</strong> What each patient owes and has paid.</li>
    <li><strong>Patients as medical — None.</strong> You will not see clinical notes or treatments. That is the design,
      not a restriction on you personally: a name and a phone number are one thing, a medical record is
      another.</li>
    <li><strong>Financial information — None.</strong> The clinic's and the doctors' own earnings are not front-desk
      information.</li>
    </ul>
    <p>If a doctor tells you that you should be able to see something and you cannot, that is a
    conversation with the owner, not a fault to report.</p>
    <p><strong>Treatments and prices are not yours to hold.</strong> Each doctor keeps his own list of what he does,
    what he charges and how long it takes (<a href="set-up-your-treatment-list.html">Set-Up-Your-Treatment-List</a>). You have no screen for it
    in this version, and you will not be typing prices. When the schedule arrives, you will book from
    those lists — which is why the doctors are being asked to get them right now. If a doctor says a
    treatment of his is "missing", the answer is that he adds it himself, on his own sign-in.</p>
    <h2>The one page you should actually read now</h2>
    <p><a href="working-offline.html">Working-Offline</a>. When the schedule arrives you will be the person who notices the internet is
    down first, and you need to know two things by heart:</p>
    <ol>
    <li>The grey strip at the top saying <strong>"No connection"</strong> is normal and is not an error.</li>
    <li>While it is showing, <strong>you cannot book</strong> — and nothing you did earlier has been lost.</li>
    </ol>
    <h2>Two more things to know by heart</h2>
    <ul>
    <li><strong>Forgotten your password? Ask the owner.</strong> Gompha sends no email; the owner presses one button
      and sends you a fresh link. Do not wait for an inbox. <a href="reset-your-password.html">Reset-Your-Password</a>.</li>
    <li><strong>A red box with a code like <code>GMP-1304</code> has a Report this link.</strong> Press it, add one sentence
      about what you were doing, send. You will be the person who sees most of these.
      <a href="when-something-goes-wrong.html">When-Something-Goes-Wrong</a>.</li>
    </ul>
    <p>Next: <a href="sign-in.html">Sign-In</a> · <a href="working-offline.html">Working-Offline</a> · <a href="when-something-goes-wrong.html">When-Something-Goes-Wrong</a> · <a href="whats-not-here-yet.html">Whats-Not-Here-Yet</a> ·
    <a href="home.html">Home</a></p>
    </div></body></html>
