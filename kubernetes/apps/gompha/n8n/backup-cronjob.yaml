# Logical backup of the GOMPHA n8n (product automation) -> MinIO app-backups/gompha-n8n/.
# n8n stores everything in SQLite on an RWO Longhorn PVC, so a second pod can't mount it
# while n8n runs. This Job execs into the live n8n pod, runs the n8n CLI export, copies the
# tarball out, and uploads it. Credentials export ENCRYPTED — restorable only together with
# the gompha n8n N8N_ENCRYPTION_KEY (n8n/secret.sops.yaml). app-backups already replicates
# to Greece hourly, so this lands in both sites with no extra wiring.
# Restore on a fresh n8n (same encryption key):
#   n8n import:workflow --separate --input=workflows/
#   n8n import:credentials --input=credentials.json
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: n8n-backup
  namespace: gompha
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: n8n-backup
  namespace: gompha
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: n8n-backup
  namespace: gompha
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: n8n-backup
subjects:
  - kind: ServiceAccount
    name: n8n-backup
    namespace: gompha
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: n8n-backup
  namespace: gompha
spec:
  schedule: "30 * * * *"            # hourly at :30
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 10800   # auto-clean finished jobs (stops one-off failures re-alerting forever)
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        spec:
          serviceAccountName: n8n-backup
          restartPolicy: Never
          affinity:                       # co-locate with n8n (cross-node net is unreliable)
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app: n8n
                  topologyKey: kubernetes.io/hostname
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
          initContainers:
            - name: copy-mc
              image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
              securityContext:
                runAsUser: 0                  # mc is 0711 root-owned; need root to read+copy it
              command: ["/bin/sh", "-c", "cp /usr/bin/mc /tools/mc && chmod 0755 /tools/mc"]
              volumeMounts:
                - { name: tools, mountPath: /tools }
          containers:
            - name: export
              image: bitnamilegacy/kubectl:1.33
              envFrom:
                - secretRef: { name: backup-s3-secret }   # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_ENDPOINTS
              env:
                - { name: HOME,      value: /work }
                - { name: BUCKET,    value: app-backups }
                - { name: PREFIX,    value: gompha-n8n }
                - { name: RETENTION, value: "30d" }   # 30d of hourly exports
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  POD=$(kubectl get pod -n gompha -l app=n8n -o jsonpath='{.items[0].metadata.name}')
                  TS=$(date +%Y%m%d-%H%M%S)
                  echo "==> Exporting workflows + credentials from ${POD} ..."
                  kubectl exec -n gompha "$POD" -- sh -c '
                    set -e
                    rm -rf /tmp/n8n-backup && mkdir -p /tmp/n8n-backup/workflows
                    # Tolerate an empty n8n: export:* exits non-zero when there are no
                    # workflows/credentials yet (fresh product instance). Still ship a tarball.
                    n8n export:workflow --all --separate --output=/tmp/n8n-backup/workflows >/dev/null 2>&1 || echo "(no workflows yet)"
                    n8n export:credentials --all --output=/tmp/n8n-backup/credentials.json >/dev/null 2>&1 || echo "(no credentials yet)"
                    tar czf /tmp/n8n-backup.tgz -C /tmp/n8n-backup .
                  '
                  kubectl cp -n gompha "$POD:/tmp/n8n-backup.tgz" "/work/n8n-${TS}.tgz"
                  kubectl exec -n gompha "$POD" -- rm -rf /tmp/n8n-backup /tmp/n8n-backup.tgz || true
                  echo "==> Uploading n8n-${TS}.tgz ..."
                  /tools/mc alias set s3 "$AWS_ENDPOINTS" "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY"
                  /tools/mc cp "/work/n8n-${TS}.tgz" "s3/${BUCKET}/${PREFIX}/n8n-${TS}.tgz"
                  echo "==> Pruning > ${RETENTION} old ..."
                  /tools/mc rm --recursive --force --older-than "$RETENTION" "s3/${BUCKET}/${PREFIX}/" || true
                  echo "==> Done: s3://${BUCKET}/${PREFIX}/n8n-${TS}.tgz"
              volumeMounts:
                - { name: tools, mountPath: /tools }
                - { name: work,  mountPath: /work }
          volumes:
            - { name: tools, emptyDir: {} }
            - { name: work,  emptyDir: {} }
