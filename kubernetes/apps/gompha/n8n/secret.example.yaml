# Gompha n8n secret — envFrom into the n8n deployment. The real values live in
# secret.sops.yaml (SOPS-encrypted, excluded from ArgoCD). Apply it out-of-band:
#     sops -d kubernetes/apps/gompha/n8n/secret.sops.yaml | kubectl apply -f -
# N8N_ENCRYPTION_KEY must stay stable — if it changes, n8n can't decrypt stored credentials.
apiVersion: v1
kind: Secret
metadata:
  name: n8n-secret
  namespace: gompha
type: Opaque
stringData:
  N8N_ENCRYPTION_KEY: "REPLACE_ME_32_CHAR_RANDOM_STRING"
