apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: gompha
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      affinity:                              # ADR-030 pattern: prefer workers, soft fallback
        nodeAffinity:                        # 2026-10-02: g2 (etcd) at 74% mem, w1 at 50%
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: n8n
          image: n8nio/n8n:2.43.3
          envFrom:
            - secretRef:
                name: n8n-secret
          env:
            - name: N8N_HOST
              value: auto.gompha.com
            - name: N8N_PORT
              value: "5678"
            - name: N8N_PROTOCOL
              value: https
            - name: WEBHOOK_URL
              value: https://auto.gompha.com/
            - name: GENERIC_TIMEZONE
              value: Europe/Prague
            - name: N8N_TRUST_PROXY
              value: "true"
          resources:
            requests:
              memory: 256Mi
              cpu: "100m"
            limits:
              memory: 1Gi
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5678
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5678
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: n8n-data-pvc
