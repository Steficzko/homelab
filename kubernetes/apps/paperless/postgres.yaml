apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: paperless
  labels:
    recurring-job.longhorn.io/daily-backup: "enabled"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources: { requests: { storage: 5Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres, namespace: paperless }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine@sha256:3c5c8892d184f738f4fe282d14ddaa613a38f00f4189d2d94725ebe6f2909ddb
          envFrom: [{ secretRef: { name: postgres-secret } }]
          readinessProbe: { tcpSocket: { port: 5432 }, initialDelaySeconds: 15, periodSeconds: 10 }
          livenessProbe: { tcpSocket: { port: 5432 }, initialDelaySeconds: 30, periodSeconds: 30, failureThreshold: 5 }
          resources: { requests: { memory: 256Mi, cpu: "100m" }, limits: { memory: 512Mi } }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data, subPath: pgdata }]
      volumes: [{ name: data, persistentVolumeClaim: { claimName: postgres-pvc } }]
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: paperless }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: postgres, namespace: paperless }
spec:
  podSelector: { matchLabels: { app: postgres } }
  policyTypes: [Ingress, Egress]   # no egress rules = postgres talks to nobody
  ingress:
    - ports: [{ port: 5432 }]
      from:
        - podSelector: { matchLabels: { app: paperless } }
        - podSelector: { matchLabels: { app: postgres-backup } }
