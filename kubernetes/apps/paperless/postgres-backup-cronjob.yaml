# Logical (pg_dump) backup of the Paperless Postgres DB -> MinIO.
# The Longhorn daily-backup label on the PVCs covers the blocks; this covers the schema,
# which is what you actually need to restore a document store onto a different version.
# Restore:  pg_restore -h <host> -U <user> -d <db> --clean <file>.dump
#
# Requires a MinIO service account scoped to app-backups/paperless-postgres/ — every other
# app here has its own key rather than a shared one. See backup-s3-secret-placeholder.yaml.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: paperless
spec:
  schedule: "45 1 * * *"          # daily 01:45 — between nextcloud (01:30) and cal
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 10800
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: postgres-backup
        spec:
          restartPolicy: Never
          affinity:                       # co-locate with postgres (cross-node net is unreliable)
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app: postgres
                  topologyKey: kubernetes.io/hostname
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          initContainers:
            - name: copy-mc
              image: ghcr.io/steficzko/mc:RELEASE.2025-08-13T08-35-41Z@sha256:fc471559bd4d9a058985680ce49771626405886eebabaee6b7d5d1265c8ef823   # Steficzko/mc-image; was a GitHub download per run — github.com 504ed the nixery curl 2026-11-08
              imagePullPolicy: IfNotPresent   # digest-only refs default to Always; nixery outage 2026-10-14 (STOR-51)
              securityContext:
                runAsUser: 0                  # mc is 0711 root-owned; need root to read+copy it
              command: ["/bin/sh", "-c", "set -e; cp /mc /tools/mc && echo 01f866e9c5f9b87c2b09116fa5d7c06695b106242d829a8bb32990c00312e891\ \ /tools/mc | sha256sum -c -"]
              volumeMounts:
                - { name: tools, mountPath: /tools }
          containers:
            - name: dump
              image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
              envFrom:
                - secretRef: { name: postgres-secret }
                - secretRef: { name: backup-s3-secret }
              env:
                - { name: HOME,      value: /work }
                - { name: PGHOST,    value: postgres }
                - { name: BUCKET,    value: app-backups }
                - { name: PREFIX,    value: paperless-postgres }
                - { name: RETENTION, value: "30d" }
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  export PGPASSWORD="$POSTGRES_PASSWORD"
                  TS=$(date +%Y%m%d-%H%M%S)
                  FILE="${POSTGRES_DB}-${TS}.dump"
                  echo "==> Waiting for ${PGHOST}:5432 (tolerates kube-router NetworkPolicy propagation delay) ..."
                  ok=0
                  for i in $(seq 1 30); do
                    if pg_isready -h "$PGHOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -t 3 >/dev/null 2>&1; then ok=1; echo "    reachable (try ${i})"; break; fi
                    sleep 3
                  done
                  [ "$ok" = 1 ] || { echo "ERROR: postgres unreachable after retries"; exit 1; }
                  echo "==> Dumping ${POSTGRES_DB} from ${PGHOST} ..."
                  pg_dump -h "$PGHOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc -Z6 -f "/work/${FILE}"
                  echo "==> Uploading ${FILE} ..."
                  /tools/mc alias set s3 "$AWS_ENDPOINTS" "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY"
                  /tools/mc mb --ignore-existing "s3/${BUCKET}" 2>/dev/null || true
                  /tools/mc cp "/work/${FILE}" "s3/${BUCKET}/${PREFIX}/${FILE}"
                  echo "==> Pruning > ${RETENTION} old ..."
                  /tools/mc rm --recursive --force --older-than "$RETENTION" "s3/${BUCKET}/${PREFIX}/" || true
                  echo "==> Done: s3://${BUCKET}/${PREFIX}/${FILE}"
              volumeMounts:
                - { name: tools, mountPath: /tools }
                - { name: work,  mountPath: /work }
          volumes:
            - { name: tools, emptyDir: {} }
            - { name: work,  emptyDir: {} }
