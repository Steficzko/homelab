# Excluded from the ArgoCD Application (see kubernetes/bootstrap/apps/paperless.yaml) —
# apply by hand once, then fill it from a SOPS file. Keys the CronJob expects:
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_ENDPOINTS (http://192.168.1.100:9100)
# Use a MinIO service account scoped to app-backups/paperless-postgres/, not a shared key.
apiVersion: v1
kind: Secret
metadata:
  name: backup-s3-secret
  namespace: paperless
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-options: Prune=false
type: Opaque
