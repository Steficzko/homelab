apiVersion: v1
kind: PersistentVolume
metadata:
  name: paperless-media-nfs
spec:
  capacity:
    storage: 100Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: 192.168.1.100
    path: /mnt/user/Paperless-ngx/xartura.kostikidis
  mountOptions:
    - hard
    - nfsvers=4.1
