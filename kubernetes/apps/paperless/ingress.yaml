apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paperless
  namespace: paperless
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure,lan,trusted
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts: [xartura.kostikidis.net]
      secretName: paperless-tls
  rules:
    - host: xartura.kostikidis.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: paperless, port: { number: 8000 } } }
