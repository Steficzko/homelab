# Copy to secret.sops.yaml and encrypt with: sops -e -i secret.sops.yaml
# Two secrets are created from this file — postgres-secret and paperless-secret.
#
# postgres-secret — used by the postgres container
# paperless-secret — used by paperless and redis containers
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: paperless
stringData:
  POSTGRES_DB: paperless
  POSTGRES_USER: paperless
  POSTGRES_PASSWORD: changeme
---
apiVersion: v1
kind: Secret
metadata:
  name: paperless-secret
  namespace: paperless
stringData:
  PAPERLESS_SECRET_KEY: changeme-django-secret-50-chars-min
  PAPERLESS_DBPASS: changeme            # must match POSTGRES_PASSWORD above
  PAPERLESS_REDIS: redis://:changeme-redis@redis:6379
  REDIS_PASSWORD: changeme-redis
  PAPERLESS_ADMIN_USER: admin
  PAPERLESS_ADMIN_PASSWORD: changeme
  PAPERLESS_ADMIN_MAIL: kostikidis@gmail.com
