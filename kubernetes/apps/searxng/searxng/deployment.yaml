apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: searxng
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
    spec:
      # k8s injects SEARXNG_PORT=tcp://... from the Service name, which collides
      # with SearXNG's own SEARXNG_PORT (wants an int) -> disable service links
      enableServiceLinks: false
      containers:
        - name: searxng
          # ponytail: :latest for now — pin to a dated tag once confirmed; Renovate will track it
          image: searxng/searxng:latest
          env:
            - name: TZ
              value: Europe/Prague
            - name: SEARXNG_BASE_URL
              value: https://search.kostikidis.net/
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  name: searxng-secret
                  key: SEARXNG_SECRET
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
