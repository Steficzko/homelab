apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: searxng
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
    spec:
      # k8s injects SEARXNG_PORT=tcp://... from the Service name, which collides
      # with SearXNG's own SEARXNG_PORT (wants an int) -> disable service links
      enableServiceLinks: false
      # SearXNG seds $SEARXNG_SECRET into settings.yml at boot -> needs a writable
      # copy; seed the (read-only) ConfigMap into an emptyDir first.
      initContainers:
        - name: seed-settings
          image: searxng/searxng:2026.6.24-e3126b89e@sha256:77b6ec55d5176fc47cfe91df5e182393133305358741d0c80ebbeec75ac39f99
          command: ["sh", "-c", "cp /src/settings.yml /work/settings.yml && sed -i \"s|ultrasecretkey|$SEARXNG_SECRET|\" /work/settings.yml"]
          env:
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  name: searxng-secret
                  key: SEARXNG_SECRET
          volumeMounts:
            - name: settings
              mountPath: /work
            - name: settings-src
              mountPath: /src
      containers:
        - name: searxng
          image: searxng/searxng:2026.6.24-e3126b89e@sha256:77b6ec55d5176fc47cfe91df5e182393133305358741d0c80ebbeec75ac39f99
          env:
            - name: TZ
              value: Europe/Prague
            - name: SEARXNG_BASE_URL
              value: https://search.kostikidis.net/
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
          volumeMounts:
            - name: settings
              mountPath: /etc/searxng/settings.yml
              subPath: settings.yml
            - name: settings-src
              mountPath: /branding
              readOnly: true
          # swap the favicon + strip the pre-compressed variants that'd otherwise win
          lifecycle:
            postStart:
              exec:
                command: ["sh", "-c", "D=/usr/local/searxng/searx/static/themes/simple/img; cp /branding/favicon.svg \"$D/favicon.svg\" 2>/dev/null; rm -f \"$D/favicon.svg.gz\" \"$D/favicon.svg.br\"; true"]
      volumes:
        - name: settings
          emptyDir: {}
        - name: settings-src
          configMap:
            name: searxng-settings
