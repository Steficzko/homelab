# Placeholder so the empty Secret exists before the real (SOPS) data is applied.
# IgnoreExtraneous + Prune=false keep ArgoCD selfHeal from stripping the
# out-of-band data from minio-replication-secret.sops.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: minio-replication-secret
  namespace: backup
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-options: Prune=false
type: Opaque
