# Backup watchdog — a dead-man's-switch for the logical backups. Every 30 min it inspects
# MinIO (size + freshness of the newest object) and pings an Uptime Kuma PUSH monitor per
# backup ONLY if healthy. If a backup failed, wrote an empty file, or never ran, the ping is
# withheld and the Kuma monitor goes DOWN (interval 90 min) -> alert. This catches the exact
# failure mode that bit the dental backup (silent empty 200 B dumps) without needing an HTTP
# client inside the (minimal) backup images. greece-restore pings itself from its own script.
# Push URLs are in the SOPS 'kuma-push' secret (out-of-band). Monitors live in the CZ Kuma.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-watchdog
  namespace: backup
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 10800   # auto-clean finished jobs (stops one-off failures re-alerting forever)
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: watchdog
              image: nixery.dev/shell/minio-client/curl/jq@sha256:96f52222657dd7bf2aca0f61568da7a6c7061dbdf78b480c89d7a9c867aed72f   # mc + curl + jq in one
              envFrom:
                - secretRef: { name: minio-replication-secret }   # SRC_/DST_ ACCESS_KEY + SECRET_KEY
              env:
                - { name: SRC_ENDPOINT, value: "http://192.168.1.100:9100" }
                - { name: DST_ENDPOINT, value: "http://100.85.129.88:9100" }
                - { name: HOME, value: "/tmp" }
                - name: PUSH_DENTAL
                  valueFrom: { secretKeyRef: { name: kuma-push, key: DENTAL } }
                - name: PUSH_GOMPHA_N8N
                  valueFrom: { secretKeyRef: { name: kuma-push, key: GOMPHA_N8N } }
                - name: PUSH_REPLICATION
                  valueFrom: { secretKeyRef: { name: kuma-push, key: REPLICATION } }
                - name: PUSH_GOMPHA_CLINIC
                  valueFrom: { secretKeyRef: { name: kuma-push, key: GOMPHA_CLINIC } }
                - name: PUSH_NEXTCLOUD
                  valueFrom: { secretKeyRef: { name: kuma-push, key: NEXTCLOUD } }
                # 2026-08-29: 11 of 16 backup jobs had no watch at all. vaultwarden was the
                # worst of them — it holds every credential, every SSH key and the age key
                # that decrypts this repo's SOPS secrets, and nothing would have told us if
                # it started shipping empty archives.
                - name: PUSH_VAULTWARDEN
                  valueFrom: { secretKeyRef: { name: kuma-push, key: VAULTWARDEN } }
                - name: PUSH_PLANE
                  valueFrom: { secretKeyRef: { name: kuma-push, key: PLANE } }
                - name: PUSH_BJJ
                  valueFrom: { secretKeyRef: { name: kuma-push, key: BJJ } }
                - name: PUSH_N8N
                  valueFrom: { secretKeyRef: { name: kuma-push, key: N8N } }
                - name: PUSH_CAL
                  valueFrom: { secretKeyRef: { name: kuma-push, key: CAL } }
                - name: PUSH_MYINVOICE
                  valueFrom: { secretKeyRef: { name: kuma-push, key: MYINVOICE } }
                - name: PUSH_NAMOSOCKS_DB
                  valueFrom: { secretKeyRef: { name: kuma-push, key: NAMOSOCKS_DB } }
                - name: PUSH_NAMOSOCKS_WP
                  valueFrom: { secretKeyRef: { name: kuma-push, key: NAMOSOCKS_WP } }
                - name: PUSH_NAMO_N8N
                  valueFrom: { secretKeyRef: { name: kuma-push, key: NAMO_N8N } }
                - name: PUSH_NAMO_WAREHOUSE
                  valueFrom: { secretKeyRef: { name: kuma-push, key: NAMO_WAREHOUSE } }
                - name: PUSH_BLANCA_DB
                  valueFrom: { secretKeyRef: { name: kuma-push, key: BLANCA_DB } }
                - name: PUSH_BLANCA_WP
                  valueFrom: { secretKeyRef: { name: kuma-push, key: BLANCA_WP } }
                - name: HC_WATCHDOG
                  valueFrom: { secretKeyRef: { name: kuma-push, key: HC_WATCHDOG } }
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -u
                  mc alias set src "$SRC_ENDPOINT" "$SRC_ACCESS_KEY" "$SRC_SECRET_KEY" >/dev/null
                  mc alias set dst "$DST_ENDPOINT" "$DST_ACCESS_KEY" "$DST_SECRET_KEY" >/dev/null
                  # check NAME PATH MIN_BYTES MAX_AGE_SEC PUSH_URL
                  check() {
                    j=$(mc ls --json "$2" 2>/dev/null | jq -s 'sort_by(.lastModified)|last // empty')
                    sz=$(printf '%s' "$j" | jq -r '.size // 0')
                    lm=$(printf '%s' "$j" | jq -r '.lastModified // empty')
                    age=999999; [ -n "$lm" ] && age=$(( $(date +%s) - $(date -d "$lm" +%s) ))
                    if [ "${sz:-0}" -ge "$3" ] && [ "$age" -le "$4" ]; then
                      curl -fsS --max-time 10 "$5?status=up&msg=$1-ok-${sz}b-$((age/60))m" >/dev/null 2>&1 \
                        && echo "  $1: UP (size=${sz}B age=$((age/60))m)"
                    else
                      echo "  $1: UNHEALTHY (size=${sz:-0}B age=$((age/60))m) -> withholding ping; Kuma will alert"
                    fi
                  }
                  echo "== backup-watchdog $(date -u +%FT%TZ) =="
                  check dental      "src/clinic-backups/clinic-postgres/" 50000 5400 "$PUSH_DENTAL"
                  # 100 B looks absurdly low next to every other threshold here, and it is
                  # deliberate but CONDITIONAL: verified 2026-08-30 that this n8n has zero
                  # workflows and zero credentials ("No workflows found with specified
                  # filters"), so its tarball is a legitimate ~574 B empty archive.
                  # THE MOMENT gompha n8n gets real workflows, RAISE THIS — at 100 B an
                  # empty export would keep passing and the check would protect nothing,
                  # which is the exact failure this watchdog exists to catch.
                  check gompha-n8n  "src/app-backups/gompha-n8n/"          100  5400 "$PUSH_GOMPHA_N8N"
                  check replication "dst/clinic-backups/clinic-postgres/" 50000 7200 "$PUSH_REPLICATION"
                  # The REBUILD's database. It had no backup at all until
                  # 2026-08-18 and no watch until now — a silently failing backup
                  # looks exactly like a working one, which is worse than none.
                  # 20000 B: real dumps are ~38 KB and the failure mode this
                  # guards against (pg_dump refusing a newer server) wrote 200 B.
                  check gompha-clinic "src/clinic-backups/gompha-clinic-postgres/" 20000 5400 "$PUSH_GOMPHA_CLINIC"
                  # Nextcloud pg_dump is DAILY (01:30), not hourly like the others,
                  # so MAX_AGE is 26h. Real dumps are ~950 KB; 400000 min catches the
                  # empty-dump failure mode without tripping on normal size drift.
                  check nextcloud   "src/app-backups/nextcloud-postgres/"  400000 93600 "$PUSH_NEXTCLOUD"

                  # --- added 2026-08-29 -------------------------------------------------
                  # MIN_BYTES is roughly half the observed healthy size: high enough to catch
                  # the empty/truncated-dump failure mode, low enough to survive normal drift.
                  # MAX_AGE is 90 min for hourly jobs, 26 h for daily ones (same convention
                  # as nextcloud above). Sizes observed 2026-08-29 are noted per line.
                  check vaultwarden "src/app-backups/vaultwarden/"        300000 93600 "$PUSH_VAULTWARDEN"   # ~590 KB daily 03:15
                  check plane       "src/app-backups/plane-postgres/"    1000000  5400 "$PUSH_PLANE"         # ~3.7 MB hourly
                  check bjj         "src/app-backups/bjj-postgres/"       200000  5400 "$PUSH_BJJ"           # ~466 KB hourly
                  check n8n         "src/app-backups/n8n/"                200000  5400 "$PUSH_N8N"           # ~512 KB hourly
                  check cal         "src/app-backups/cal-postgres/"       300000 93600 "$PUSH_CAL"           # ~581 KB daily 01:45
                  check myinvoice   "src/myinvoice-backups/daily/db/"      15000 93600 "$PUSH_MYINVOICE"     # ~33 KB daily 03:45
                  check namosocks-db "src/namosocks-backups/db/"          600000 93600 "$PUSH_NAMOSOCKS_DB"  # ~1.3 MB daily 03:00
                  check namosocks-wp "src/namosocks-backups/wp-content/" 50000000 93600 "$PUSH_NAMOSOCKS_WP" # ~118 MB daily 03:00
                  check namo-n8n    "src/namosocks-backups/n8n/"            7000 93600 "$PUSH_NAMO_N8N"      # ~15 KB daily 03:45
                  check namo-wh     "src/namosocks-backups/warehouse/"      1500 93600 "$PUSH_NAMO_WAREHOUSE" # ~3.3 KB daily 03:30
                  check blanca-db   "src/blanca-web-backups/db/"           400000 93600 "$PUSH_BLANCA_DB"    # ~885 KB daily 03:30
                  check blanca-wp   "src/blanca-web-backups/wp-content/" 50000000 93600 "$PUSH_BLANCA_WP"    # ~126 MB daily 03:30

                  # healthchecks.io: the watchdog reporting that IT is still running.
                  # Every check above pings Kuma, which lives on the same Unraid box as
                  # this cluster's alerting -- so if the CronJob stops, all 17 checks go
                  # quiet and look healthy. This ping is the only thing outside the fleet
                  # that would notice. Unconditional: it reports liveness, not backup health.
                  curl -fsS -m 10 --retry 3 "$HC_WATCHDOG" >/dev/null 2>&1 || true
