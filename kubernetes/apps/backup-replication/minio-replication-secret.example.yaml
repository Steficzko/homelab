# Real values live in minio-replication-secret.sops.yaml (generated by
# scripts/bootstrap-backup-s3-creds.sh). This documents the shape only.
#   SRC_* = Prague MinIO (copied from longhorn-backup-secret)
#   DST_* = Greece MinIO root creds (set on the Portainer minio-dr stack)
apiVersion: v1
kind: Secret
metadata:
  name: minio-replication-secret
  namespace: backup
type: Opaque
stringData:
  SRC_ACCESS_KEY: "REPLACE_ME"
  SRC_SECRET_KEY: "REPLACE_ME"
  DST_ACCESS_KEY: "REPLACE_ME"
  DST_SECRET_KEY: "REPLACE_ME"
