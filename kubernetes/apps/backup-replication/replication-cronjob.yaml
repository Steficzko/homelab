# Mirrors the Prague MinIO backup bucket -> Greece MinIO (unraid-ptolemaida) over
# the Tailscale mesh, so the hourly pg_dump + n8n exports land off-site in Greece.
#
# hostNetwork: true makes the pod share the node's netns, so egress to the Greece
# tailnet IP (100.85.129.88) exits as the node's own Tailscale address — the
# reliable way for in-cluster traffic to traverse the tailnet.
#
# Source (Prague) keeps 7d; Greece keeps 30d (deeper DR history). Greece bucket
# also has object versioning on, so overwrites/deletes are recoverable there too.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: minio-replication
  namespace: backup
spec:
  schedule: "45 * * * *"            # hourly at :45 — after postgres(:00) + n8n(:30)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 10800   # auto-clean finished jobs (stops one-off failures re-alerting forever)
      backoffLimit: 2
      activeDeadlineSeconds: 7200      # allow a large initial longhorn sync (resumable)
      template:
        spec:
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet
          restartPolicy: Never
          containers:
            - name: mirror
              # Pinned to the digest verified working on 2026-06-15 (was :latest).
              # To update: pull a fresh minio/mc, confirm a replication run, then
              # swap the sha256 below for the new one.
              image: nixery.dev/shell/minio-client/curl/jq@sha256:96f52222657dd7bf2aca0f61568da7a6c7061dbdf78b480c89d7a9c867aed72f   # was quay.io/minio/mc — Quay gated anonymous pulls 2026-09-24
              envFrom:
                - secretRef: { name: minio-replication-secret }   # SRC_/DST_ ACCESS_KEY + SECRET_KEY
              env:
                - { name: SRC_ENDPOINT,   value: "http://192.168.1.100:9100" }
                - { name: DST_ENDPOINT,   value: "http://100.85.129.88:9100" }
                - { name: BUCKET,         value: "app-backups" }   # our logical dumps: accumulate + cap
                - { name: RETENTION,      value: "30d" }
                - { name: EXTRA_BUCKETS,  value: "velerok3s longhornk3s clinic-backups namosocks-backups blanca-web-backups myinvoice-backups" }   # faithful mirrors (clinic-backups = dental DB dumps, namosocks-backups = WP staging, blanca-web-backups = Dr. Ali clinic WP, myinvoice-backups = invoicing; retention capped by MinIO ILM — flat 30d for all EXCEPT myinvoice-backups, which is GFS by prefix: daily/ 30d, weekly/ 365d, monthly/ 1825d — invoices are statutory records)
                - { name: HOME,           value: "/tmp" }
              command:
                - /bin/sh
                - -c
                - |
                  set -u
                  mc alias set src "$SRC_ENDPOINT" "$SRC_ACCESS_KEY" "$SRC_SECRET_KEY" || exit 1
                  mc alias set dst "$DST_ENDPOINT" "$DST_ACCESS_KEY" "$DST_SECRET_KEY" || exit 1
                  FAILED=""
                  # Hardened 2026-09-24 after one 349 MiB object froze all seven buckets for 7 h:
                  # (1) a failing bucket no longer aborts the run — every bucket is attempted and
                  #     the job exits 1 at the end if any failed;
                  # (2) when the streamed mirror fails, the objects still pending are copied via a
                  #     local staging file. mc mirror streams src -> dst and retries a multipart part
                  #     from an already-consumed stream ("ContentLength=... with Body length ..."),
                  #     which cannot succeed once Greece is slow; a copy from a local file retries
                  #     safely. Verified 2026-09-24: streamed copy failed 4/4, staged copy succeeded.
                  mirror_bucket() {   # $1 bucket, remaining args = extra mc mirror flags
                    b=$1; shift
                    if mc mirror --overwrite "$@" "src/${b}" "dst/${b}"; then return 0; fi
                    echo "   streamed mirror of ${b} failed -> staged fallback for the objects still pending"
                    mc mirror --overwrite "$@" --dry-run --json "src/${b}" "dst/${b}" \
                      | jq -r 'select(.source != null) | .source' \
                      | sed -E "s#^.*/${b}/##" \
                      | while IFS= read -r key; do
                          [ -n "$key" ] || continue
                          f="/stage/$(basename "$key")"
                          if mc cp --quiet "src/${b}/${key}" "$f" && mc cp --quiet "$f" "dst/${b}/${key}"; then
                            echo "   staged: ${key}"
                          else
                            echo "   STAGED COPY FAILED: ${key}"
                          fi
                          rm -f "$f"
                        done
                    # final streamed pass: only leftovers remain, and it is the pass/fail verdict
                    mc mirror --overwrite "$@" "src/${b}" "dst/${b}"
                  }
                  echo "==> ${BUCKET}: mirror (accumulate, cap ${RETENTION}) ..."
                  mirror_bucket "${BUCKET}" || FAILED="${FAILED} ${BUCKET}"
                  mc rm --recursive --force --older-than "$RETENTION" "dst/${BUCKET}" || true
                  for b in $EXTRA_BUCKETS; do
                    echo "==> ${b}: faithful versioned mirror Prague -> Greece ..."
                    mc mb --ignore-existing "dst/${b}"
                    mc version enable "dst/${b}" || true
                    mirror_bucket "${b}" --remove || FAILED="${FAILED} ${b}"
                  done
                  if [ -n "$FAILED" ]; then echo "==> Replication FAILED for:${FAILED}"; exit 1; fi
                  echo "==> Replication done."
              volumeMounts:
                - { name: stage, mountPath: /stage }
          volumes:
            - { name: stage, emptyDir: {} }   # staged-copy fallback scratch, node disk
