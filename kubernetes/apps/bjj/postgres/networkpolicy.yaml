apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  namespace: bjj
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: n8n
      ports:
        - port: 5432
    # allow the in-namespace pg_dump backup CronJob
    - from:
        - podSelector:
            matchLabels:
              app: postgres-backup
      ports:
        - port: 5432
