# Placeholder so the empty Secret exists for the backup CronJob even before the
# real (SOPS-encrypted) data is applied. IgnoreExtraneous + Prune=false keep
# ArgoCD selfHeal from stripping the data applied out-of-band from the
# backup-s3-secret.sops.yaml file (same pattern as postgres-secret).
apiVersion: v1
kind: Secret
metadata:
  name: backup-s3-secret
  namespace: bjj
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-options: Prune=false
type: Opaque
