apiVersion: apps/v1
kind: Deployment
metadata:
  name: bjj-app
  namespace: bjj
spec:
  # TEMPORARILY OFFLINE 2026-07-30: scaled to 0 while the unauthenticated n8n
  # webhook API (BFLA/IDOR — leaked member PII + gym finances) is remediated.
  # Restore to 1 to bring app.teamelwany.com back.
  replicas: 0
  selector:
    matchLabels:
      app: bjj-app
  template:
    metadata:
      labels:
        app: bjj-app
    spec:
      containers:
        - name: nginx
          image: nginx:1.31-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: 32Mi
              cpu: "10m"
            limits:
              memory: 64Mi
              cpu: "100m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 20
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
        - name: html
          configMap:
            name: html
