    \ </style>\n</head>\n<body>\n\n<!-- ── LOGIN ── -->\n<div id=\"login\">\n  <div
    class=\"logo\">\n    <h1>TEAM ELWANY</h1>\n    <p>Staff Portal</p>\n  </div>\n
    \ <div class=\"login-box\">\n    <input type=\"password\" id=\"pass\" placeholder=\"••••••••\"
    autocomplete=\"current-password\">\n    <div class=\"err\" id=\"lerr\"></div>\n
    \   <button class=\"btn btn-gold\" id=\"lbtn\" onclick=\"doLogin()\">Sign In</button>\n
    \ </div>\n</div>\n\n<!-- ── APP ── -->\n<div id=\"app\">\n  <header>\n    <div>\n
    \     <div class=\"hrole\">TEAM ELWANY STAFF</div>\n      <div class=\"hname\"
    id=\"hname\"></div>\n    </div>\n    <button class=\"btn btn-ghost\" onclick=\"doLogout()\">Logout</button>\n
    \ </header>\n\n  <!-- Main navigation -->\n  <div class=\"main-nav\">\n    <div
    class=\"main-tab on\" id=\"tab-ledger\" onclick=\"switchMain('ledger',this)\">Ledger</div>\n
    \   <div class=\"main-tab\" id=\"tab-attendance\" onclick=\"switchMain('attendance',this)\">Attendance</div>\n
    \ </div>\n\n  <!-- Ledger Section -->\n  <div id=\"ledger-section\">\n    <!--
    Coach View -->\n    <div id=\"coach-view\" style=\"display:none\">\n      <div
    class=\"card\">\n        <div class=\"label\">New Entry</div>\n        <div class=\"type-grid\">\n
    \         <button class=\"type-btn wide\" data-type=\"gi_rental\" onclick=\"pick(this)\">\n
    \           <span class=\"icon\">\U0001F94B</span> Gi Rental\n          </button>\n
    \         <button class=\"type-btn\" data-type=\"subscription\" onclick=\"pick(this)\">\n
    \           <span class=\"icon\">\U0001F4C5</span><span>Sub</span>\n          </button>\n
    \         <button class=\"type-btn\" data-type=\"rashguard\" onclick=\"pick(this)\">\n
    \           <span class=\"icon\">\U0001F455</span><span>Rashguard</span>\n          </button>\n
    \         <button class=\"type-btn\" data-type=\"kimono\" onclick=\"pick(this)\">\n
    \           <span class=\"icon\">\U0001F93C</span><span>Kimono</span>\n          </button>\n
    \         <button class=\"type-btn wide\" data-type=\"other\" onclick=\"pick(this)\">\n
    \           <span class=\"icon\">\U0001F4B0</span> Other\n          </button>\n
    \       </div>\n        <div class=\"input-row\">\n          <input type=\"text\"
    id=\"sname\" placeholder=\"Student name\">\n          <input type=\"number\" id=\"amt\"
    placeholder=\"Amount\" class=\"amt\" min=\"0\" step=\"0.01\">\n        </div>\n
    \       <input type=\"text\" id=\"notes\" placeholder=\"Notes (optional)\" style=\"margin-bottom:12px\">\n
    \       <button class=\"btn btn-gold\" id=\"sbtn\" onclick=\"addEntry()\">Add
    Entry</button>\n      </div>\n\n      <div>\n        <div class=\"vtabs\">\n          <div
    class=\"vtab on\" onclick=\"showTab('active',this)\">Active</div>\n          <div
    class=\"vtab\" onclick=\"showTab('history',this)\">History</div>\n        </div>\n
    \       <div id=\"active-list\"></div>\n        <div id=\"history-list\" style=\"display:none\"></div>\n
    \     </div>\n    </div>\n\n    <!-- BigDaddy View -->\n    <div id=\"bd-view\"
    style=\"display:none\">\n      <div class=\"ctabs\" id=\"ctabs\"></div>\n      <div
    class=\"cpanel\" id=\"cpanel\"></div>\n    </div>\n  </div>\n\n  <!-- Attendance
    Section -->\n  <div id=\"att-section\">\n    <div class=\"att-header\">\n      <div
    class=\"att-date-row\">\n        <label>Date</label>\n        <input type=\"date\"
    id=\"att-date\" onchange=\"loadAttCheckins()\">\n      </div>\n      <div id=\"att-stats\"></div>\n
    \     <input type=\"text\" id=\"att-search\" placeholder=\"Search student…\" oninput=\"renderRoster()\">\n
    \   </div>\n    <div class=\"att-list\" id=\"att-list\"></div>\n  </div>\n</div>\n\n<!--
    Flush Modal -->\n<div class=\"overlay\" id=\"fmodal\">\n  <div class=\"modal\">\n
    \   <h3>Confirm Flush</h3>\n    <p id=\"fmsg\"></p>\n    <div class=\"mbtns\">\n
    \     <button class=\"btn btn-outline\" onclick=\"closeModal()\" style=\"flex:1\">Cancel</button>\n
    \     <button class=\"btn btn-gold\" id=\"fbtn\" onclick=\"doFlush()\" style=\"flex:1\">Flush</button>\n
    \   </div>\n  </div>\n</div>\n\n<script>\nconst API  = '/api';\nconst CUR  = '$';\n\nlet
    S = null;\nlet selType = null;\nlet flushCoachId = null;\nlet coaches = [];\n\n//
    attendance state\nlet roster = [];\nlet attCheckins = new Set();\nlet attDate
    = today();\nlet rosterLoaded = false;\n\n// ── BOOT ──────────────────────────────────────────────────────────────────\nwindow.onload
    = () => {\n  const s = sessionStorage.getItem('elwany_s');\n  if (s) { S = JSON.parse(s);
    go(); }\n  document.getElementById('pass').onkeydown = e => { if (e.key === 'Enter')
    doLogin(); };\n};\n\n// ── AUTH ──────────────────────────────────────────────────────────────────\nasync
    function doLogin() {\n  const pass = document.getElementById('pass').value.trim();\n
    \ if (!pass) return;\n  const btn = document.getElementById('lbtn');\n  btn.disabled
    = true;\n  btn.innerHTML = '<span class=\"spin\"></span>Signing in…';\n  document.getElementById('lerr').textContent
    = '';\n  try {\n    const r = await call('POST', '/ledger-login', { password:
    pass });\n    if (r.success) {\n      S = r.user;\n      sessionStorage.setItem('elwany_s',
    JSON.stringify(S));\n      go();\n    } else {\n      document.getElementById('lerr').textContent
    = 'Wrong password.';\n    }\n  } catch { document.getElementById('lerr').textContent
    = 'Connection error. Try again.'; }\n  btn.disabled = false;\n  btn.textContent
    = 'Sign In';\n}\n\nfunction doLogout() {\n  S = null; selType = null; roster =
    []; rosterLoaded = false; attCheckins = new Set();\n  sessionStorage.removeItem('elwany_s');\n
    \ document.getElementById('app').style.display = 'none';\n  document.getElementById('login').style.display
    = 'flex';\n  document.getElementById('pass').value = '';\n  document.getElementById('bd-view').style.display
    = 'none';\n  document.getElementById('coach-view').style.display = 'none';\n  //
    reset nav to ledger\n  document.getElementById('tab-ledger').classList.add('on');\n
    \ document.getElementById('tab-attendance').classList.remove('on');\n  document.getElementById('ledger-section').style.display
    = 'block';\n  document.getElementById('att-section').style.display = 'none';\n}\n\nfunction
    go() {\n  document.getElementById('login').style.display = 'none';\n  document.getElementById('app').style.display
    = 'flex';\n  document.getElementById('hname').textContent = S.name;\n  document.getElementById('att-date').value
    = today();\n  if (S.role === 'bigdaddy') {\n    document.getElementById('bd-view').style.display
    = 'flex';\n    loadBD();\n  } else {\n    document.getElementById('coach-view').style.display
    = 'flex';\n    loadCoach();\n  }\n}\n\n// ── MAIN NAV ──────────────────────────────────────────────────────────────\nfunction
    switchMain(section, el) {\n  document.querySelectorAll('.main-tab').forEach(t
    => t.classList.remove('on'));\n  el.classList.add('on');\n  document.getElementById('ledger-section').style.display
    = section === 'ledger' ? 'block' : 'none';\n  document.getElementById('att-section').style.display
    \  = section === 'attendance' ? 'flex' : 'none';\n  if (section === 'attendance')
    loadAttendance();\n}\n\n// ── COACH ─────────────────────────────────────────────────────────────────\nfunction
    pick(btn) {\n  selType = btn.dataset.type;\n  document.querySelectorAll('.type-btn').forEach(b
    => b.classList.remove('selected'));\n  btn.classList.add('selected');\n}\n\nasync
    function addEntry() {\n  if (!selType) { alert('Select a type.'); return; }\n
    \ const name = document.getElementById('sname').value.trim();\n  const amt  =
    parseFloat(document.getElementById('amt').value);\n  const note = document.getElementById('notes').value.trim();\n
    \ if (!name) { alert('Enter student name.'); return; }\n  if (!amt || amt <= 0)
    { alert('Enter a valid amount.'); return; }\n  const btn = document.getElementById('sbtn');\n
    \ btn.disabled = true;\n  btn.innerHTML = '<span class=\"spin\"></span>Saving…';\n
    \ try {\n    const r = await call('POST', '/ledger-entry', {\n      user_id: S.user_id,
    type: selType,\n      student_name: name, amount: amt, notes: note,\n      entry_date:
    today()\n    });\n    if (r.success) {\n      document.getElementById('sname').value
    = '';\n      document.getElementById('amt').value = '';\n      document.getElementById('notes').value
    = '';\n      selType = null;\n      document.querySelectorAll('.type-btn').forEach(b
    => b.classList.remove('selected'));\n      loadCoach();\n    }\n  } catch { alert('Failed
    to save.'); }\n  btn.disabled = false;\n  btn.textContent = 'Add Entry';\n}\n\nasync
    function loadCoach() {\n  document.getElementById('active-list').innerHTML = '<div
    class=\"empty\">Loading…</div>';\n  try {\n    const r = await call('GET', `/ledger-entries?user_id=${S.user_id}`);\n
    \   renderActive(r.active || []);\n    renderHistory(r.history || [], document.getElementById('history-list'));\n
    \ } catch { document.getElementById('active-list').innerHTML = '<div class=\"empty\">Failed
    to load.</div>'; }\n}\n\nfunction renderActive(entries) {\n  const el = document.getElementById('active-list');\n
    \ if (!entries.length) { el.innerHTML = '<div class=\"empty\">No active entries
    yet.</div>'; return; }\n  const total = entries.reduce((s,e) => s + +e.amount,
    0);\n  el.innerHTML = `\n    <div class=\"entries-header\">\n      <div class=\"label\"
    style=\"margin:0\">Active (${entries.length})</div>\n      <div class=\"badge\">${CUR}${total.toFixed(2)}</div>\n
    \   </div>\n    ${entries.map(entryHTML).join('')}`;\n}\n\nfunction renderHistory(batches,
    el) {\n  if (!batches.length) { el.innerHTML = '<div class=\"empty\">No history
    yet.</div>'; return; }\n  el.innerHTML = batches.map(b => `\n    <div class=\"batch\">\n
    \     <div class=\"batch-hd\" onclick=\"toggleBatch(this)\">\n        <div>\n
    \         <div style=\"font-weight:700;font-size:.9rem\">${fmtDate(b.flushed_at)}</div>\n
    \         <div style=\"font-size:.75rem;color:var(--muted)\">${b.entry_count}
    entries</div>\n        </div>\n        <div style=\"font-weight:800;color:var(--green)\">${CUR}${(+b.total_amount).toFixed(2)}</div>\n
    \     </div>\n      <div class=\"batch-body\">${(b.entries||[]).map(entryHTML).join('')}</div>\n
    \   </div>`).join('');\n}\n\nfunction showTab(tab, el) {\n  document.querySelectorAll('.vtab').forEach(t
    => t.classList.remove('on'));\n  el.classList.add('on');\n  document.getElementById('active-list').style.display
    \ = tab==='active'  ? 'block' : 'none';\n  document.getElementById('history-list').style.display
    = tab==='history' ? 'block' : 'none';\n}\n\n// ── BIGDADDY ──────────────────────────────────────────────────────────────\nasync
    function loadBD() {\n  document.getElementById('cpanel').innerHTML = '<div class=\"empty\">Loading…</div>';\n
    \ try {\n    const r = await call('GET', `/ledger-all?user_id=${S.user_id}`);\n
    \   coaches = r.coaches || [];\n    if (!coaches.length) { document.getElementById('cpanel').innerHTML
    = '<div class=\"empty\">No coaches.</div>'; return; }\n    document.getElementById('ctabs').innerHTML
    = coaches.map((c,i) =>\n      `<div class=\"ctab ${i===0?'on':''}\" onclick=\"pickCoach(${c.id},this)\">${c.name}</div>`\n
    \   ).join('');\n    renderCoach(coaches[0]);\n  } catch { document.getElementById('cpanel').innerHTML
    = '<div class=\"empty\">Failed to load.</div>'; }\n}\n\nfunction pickCoach(id,
    el) {\n  document.querySelectorAll('.ctab').forEach(t => t.classList.remove('on'));\n
    \ el.classList.add('on');\n  const c = coaches.find(x => x.id === id);\n  if (c)
    renderCoach(c);\n}\n\nfunction renderCoach(c) {\n  const active = c.active_entries
    || [];\n  const hist   = c.history || [];\n  const total  = active.reduce((s,e)
    => s + +e.amount, 0);\n  const canFlush = active.length > 0;\n  document.getElementById('cpanel').innerHTML
    = `\n    <div class=\"csummary\">\n      <div>\n        <div class=\"ctotal\">${CUR}${total.toFixed(2)}</div>\n
    \       <div class=\"ccount\">${active.length} active entr${active.length===1?'y':'ies'}</div>\n
    \     </div>\n      <button class=\"btn btn-gold\" style=\"width:auto;padding:12px
    20px;${!canFlush?'opacity:.4;pointer-events:none':''}\"\n        onclick=\"openFlush(${c.id},'${c.name}')\">Flush
