apiVersion: v1
kind: ConfigMap
metadata:
  name: html
  namespace: bjj
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
      <title>Elwany Staff</title>
      <meta name="mobile-web-app-capable" content="yes">
      <meta name="apple-mobile-web-app-capable" content="yes">
      <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
      <style>
        *{box-sizing:border-box;margin:0;padding:0}
        :root{
          --bg:#0d0d0d;--card:#1a1a1a;--border:#2a2a2a;
          --gold:#C9A84C;--text:#e8e8e8;--muted:#777;
          --green:#4caf50;--red:#e53935;
        }
        body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;max-width:480px;margin:0 auto}
    
        /* ── LOGIN ── */
        #login{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px 28px;gap:36px}
        .logo h1{color:var(--gold);font-size:1.7rem;font-weight:800;letter-spacing:.06em;text-align:center}
        .logo p{color:var(--muted);font-size:.85rem;text-align:center;margin-top:6px}
        .login-box{width:100%;display:flex;flex-direction:column;gap:14px}
        input[type=password]{width:100%;padding:18px 16px;background:var(--card);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:1.1rem;outline:none;text-align:center;letter-spacing:.2em;transition:border-color .2s}
        input[type=password]:focus{border-color:var(--gold)}
        input[type=text],input[type=number],input[type=date]{width:100%;padding:14px 16px;background:var(--card);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:1rem;outline:none;transition:border-color .2s}
        input[type=text]:focus,input[type=number]:focus,input[type=date]:focus{border-color:var(--gold)}
        input[type=date]{color-scheme:dark}
        .err{color:var(--red);font-size:.85rem;text-align:center;min-height:20px}
    
        /* ── BUTTONS ── */
        .btn{padding:16px;border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;transition:opacity .15s,transform .1s;width:100%}
        .btn:active{transform:scale(.97)}
        .btn:disabled{opacity:.4;cursor:not-allowed}
        .btn-gold{background:var(--gold);color:#0d0d0d}
        .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
        .btn-ghost{background:transparent;color:var(--muted);padding:8px 12px;font-size:.8rem;font-weight:600;width:auto}
        .btn-danger{background:var(--red);color:#fff}
    
        /* ── APP SHELL ── */
        #app{display:none;flex-direction:column;min-height:100vh}
        header{padding:14px 20px;border-bottom:1px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
        header .hname{color:var(--gold);font-size:1.1rem;font-weight:700}
        header .hrole{color:var(--muted);font-size:.75rem;margin-top:2px}
    
        /* ── MAIN NAV ── */
        .main-nav{display:flex;border-bottom:1px solid var(--border);background:var(--card)}
        .main-tab{flex:1;padding:13px;text-align:center;font-size:.88rem;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;transition:all .15s}
        .main-tab.on{color:var(--gold);border-bottom-color:var(--gold)}
    
        /* ── COACH VIEW ── */
        #coach-view{padding:20px 16px;display:flex;flex-direction:column;gap:20px}
        .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px}
        .label{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:12px}
    
        /* type buttons */
        .type-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
        .type-btn{padding:14px 10px;border-radius:10px;border:2px solid var(--border);background:transparent;color:var(--text);font-size:.85rem;font-weight:700;cursor:pointer;text-align:center;transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:4px}
        .type-btn .icon{font-size:1.4rem}
        .type-btn.wide{grid-column:1/-1;flex-direction:row;justify-content:center;gap:10px;padding:18px 10px;font-size:1rem}
        .type-btn.selected{border-color:var(--gold);background:rgba(201,168,76,.12);color:var(--gold)}
    
        /* entry inputs */
        .input-row{display:flex;gap:10px;margin-bottom:12px}
        .input-row input:first-child{flex:1}
        .input-row .amt{flex:0 0 100px}
    
        /* entries */
        .entries-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
        .badge{background:rgba(201,168,76,.15);color:var(--gold);padding:4px 12px;border-radius:20px;font-size:.82rem;font-weight:700}
        .entry{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
        .etype{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
        .ename{font-size:.95rem;font-weight:600;margin-top:2px}
        .edate{font-size:.75rem;color:var(--muted);margin-top:2px}
        .eamt{font-size:1.1rem;font-weight:800;color:var(--green)}
        .empty{text-align:center;color:var(--muted);font-size:.9rem;padding:36px 0}
    
        /* view tabs */
        .vtabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:16px}
        .vtab{flex:1;padding:12px;text-align:center;font-size:.85rem;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
        .vtab.on{color:var(--gold);border-bottom-color:var(--gold)}
    
        /* flush batch */
        .batch{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden}
        .batch-hd{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
        .batch-hd:hover{background:rgba(255,255,255,.03)}
        .batch-body{display:none;padding:4px 0}
        .batch-body.open{display:block}
    
        /* ── BIGDADDY VIEW ── */
        #bd-view{display:flex;flex-direction:column}
        .ctabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--border);background:var(--card);scrollbar-width:none}
        .ctabs::-webkit-scrollbar{display:none}
        .ctab{padding:14px 20px;font-size:.85rem;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:all .15s}
        .ctab.on{color:var(--gold);border-bottom-color:var(--gold)}
        .cpanel{padding:20px 16px}
        .csummary{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center}
        .ctotal{font-size:1.5rem;font-weight:800;color:var(--gold)}
        .ccount{font-size:.78rem;color:var(--muted);margin-top:3px}
    
        /* ── ATTENDANCE ── */
        #att-section{display:none;flex-direction:column;flex:1}
        .att-header{padding:16px;background:var(--card);border-bottom:1px solid var(--border)}
        .att-date-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
        .att-date-row label{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);white-space:nowrap}
        .att-date-row input{flex:1;padding:10px 14px;font-size:.9rem}
        #att-stats{font-size:.8rem;color:var(--muted);margin-bottom:10px}
        #att-search{margin-bottom:0;padding:12px 16px;font-size:.95rem}
        .att-list{overflow-y:auto}
        .att-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;-webkit-tap-highlight-color:transparent;user-select:none}
        .att-row:active{background:rgba(255,255,255,.04)}
        .att-row.checked{background:rgba(76,175,80,.07)}
        .att-name{font-size:.95rem;font-weight:600;margin-bottom:3px}
        .att-badge{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:8px;display:inline-block}
        .att-badge.active{background:rgba(76,175,80,.18);color:var(--green)}
        .att-badge.expired{background:rgba(229,57,53,.18);color:var(--red)}
        .att-check{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:800;border:2px solid var(--border);color:var(--muted);transition:all .15s;flex-shrink:0}
        .att-row.checked .att-check{background:var(--green);border-color:var(--green);color:#fff;font-size:1.1rem}
    
        /* ── MODAL ── */
        .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;align-items:center;justify-content:center;padding:24px}
        .overlay.open{display:flex}
        .modal{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;width:100%;max-width:360px}
        .modal h3{color:var(--gold);margin-bottom:10px}
        .modal p{color:var(--muted);font-size:.9rem;margin-bottom:20px;line-height:1.5}
        .mbtns{display:flex;gap:10px}
    
        .spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
        @keyframes spin{to{transform:rotate(360deg)}}
      </style>
    </head>
    <body>
    
    <!-- ── LOGIN ── -->
    <div id="login">
      <div class="logo">
        <h1>TEAM ELWANY</h1>
        <p>Staff Portal</p>
      </div>
      <div class="login-box">
        <input type="password" id="pass" placeholder="••••••••" autocomplete="current-password">
        <div class="err" id="lerr"></div>
        <button class="btn btn-gold" id="lbtn" onclick="doLogin()">Sign In</button>
      </div>
    </div>
    
    <!-- ── APP ── -->
    <div id="app">
      <header>
        <div>
          <div class="hrole">TEAM ELWANY STAFF</div>
          <div class="hname" id="hname"></div>
        </div>
        <button class="btn btn-ghost" onclick="doLogout()">Logout</button>
      </header>
    
      <!-- Main navigation -->
      <div class="main-nav">
        <div class="main-tab on" id="tab-ledger" onclick="switchMain('ledger',this)">Ledger</div>
        <div class="main-tab" id="tab-attendance" onclick="switchMain('attendance',this)">Attendance</div>
        <div class="main-tab" id="tab-control" style="display:none" onclick="switchMain('control',this)">Control</div>
      </div>
    
      <!-- Ledger Section (coach view — same for everyone including BigDaddy) -->
      <div id="ledger-section">
        <div id="coach-view" style="display:none">
          <div class="card">
            <div class="label">New Entry</div>
            <div class="type-grid">
              <button class="type-btn wide" data-type="kimono_rent" data-amount="5000" onclick="pick(this)">
                <span class="icon">🥋</span><span>Kimono Rent — <strong>5,000</strong></span>
              </button>
              <button class="type-btn" data-type="sub_men" data-amount="100" onclick="pick(this)">
                <span class="icon">📅</span><span>Sub Men<br><small>100</small></span>
              </button>
              <button class="type-btn" data-type="sub_kids_women" data-amount="50" onclick="pick(this)">
                <span class="icon">👨‍👩‍👧</span><span>Sub Kids/Women<br><small>50</small></span>
              </button>
              <button class="type-btn wide" data-type="kimono_buy" data-amount="100" onclick="pick(this)">
                <span class="icon">🤼</span><span>Kimono Purchase — <strong>100</strong></span>
              </button>
              <button class="type-btn wide" data-type="other" data-amount="" onclick="pick(this)">
                <span class="icon">💰</span> Other
              </button>
            </div>
            <input type="text" id="sname" placeholder="Student name" style="margin-bottom:12px">
            <input type="number" id="amt" placeholder="Amount" min="0" step="1"
              style="display:none;margin-bottom:12px;width:100%">
            <input type="text" id="notes" placeholder="Notes (required for Other)" style="margin-bottom:12px">
            <button class="btn btn-gold" id="sbtn" onclick="addEntry()">Add Entry</button>
          </div>
    
          <div>
            <div class="vtabs">
              <div class="vtab on" onclick="showTab('active',this)">Active</div>
              <div class="vtab" onclick="showTab('history',this)">History</div>
            </div>
            <div id="active-list"></div>
            <div id="history-list" style="display:none"></div>
          </div>
        </div>
      </div>
    
      <!-- Control Section (BigDaddy only) -->
      <div id="control-section" style="display:none">
        <div id="bd-view">
          <div class="ctabs" id="ctabs"></div>
          <div class="cpanel" id="cpanel"></div>
        </div>
      </div>
    
      <!-- Attendance Section -->
      <div id="att-section">
        <div class="att-header">
          <div class="att-date-row">
            <label>Date</label>
            <input type="date" id="att-date" onchange="loadAttCheckins()">
          </div>
          <div id="att-stats"></div>
          <input type="text" id="att-search" placeholder="Search student…" oninput="renderRoster()">
        </div>
        <div class="att-list" id="att-list"></div>
      </div>
    </div>
    
    <!-- Flush Modal -->
    <div class="overlay" id="fmodal">
      <div class="modal">
        <h3>Confirm Flush</h3>
        <p id="fmsg"></p>
        <div class="mbtns">
          <button class="btn btn-outline" onclick="closeModal()" style="flex:1">Cancel</button>
          <button class="btn btn-gold" id="fbtn" onclick="doFlush()" style="flex:1">Flush</button>
        </div>
      </div>
    </div>
    
    <script>
    const API  = '/api';
    
    const TYPES = {
      kimono_rent:    { label: 'Kimono Rent'     },
      kimono_buy:     { label: 'Kimono Purchase' },
      sub_men:        { label: 'Sub — Men'        },
      sub_kids_women: { label: 'Sub — Kids/Women' },
      other:          { label: 'Other'            }
    };
    
    // amounts ≥ 250 = IQD ledger, < 250 = USD ledger
    function isIQD(amount) { return +amount >= 250; }
    function fmtAmt(amount) {
      const n = +amount;
      return isIQD(n) ? n.toLocaleString() : n.toFixed(2);
    }
    
    let S = null;
    let selType = null;
    let flushCoachId = null;
    let coaches = [];
    
    // attendance state
    let roster = [];
    let attCheckins = new Set();
    let attDate = today();
    let rosterLoaded = false;
    
    // ── BOOT ──────────────────────────────────────────────────────────────────
    window.onload = () => {
      const s = sessionStorage.getItem('elwany_s');
      if (s) { S = JSON.parse(s); go(); }
      document.getElementById('pass').onkeydown = e => { if (e.key === 'Enter') doLogin(); };
    };
    
    // ── AUTH ──────────────────────────────────────────────────────────────────
    async function doLogin() {
      const pass = document.getElementById('pass').value.trim();
      if (!pass) return;
      const btn = document.getElementById('lbtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spin"></span>Signing in…';
      document.getElementById('lerr').textContent = '';
      try {
        const r = await call('POST', '/ledger-login', { password: pass });
        if (r.success) {
          S = r.user;
          sessionStorage.setItem('elwany_s', JSON.stringify(S));
          go();
        } else {
          document.getElementById('lerr').textContent = 'Wrong password.';
        }
      } catch { document.getElementById('lerr').textContent = 'Connection error. Try again.'; }
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
    
    function doLogout() {
      S = null; selType = null; roster = []; rosterLoaded = false; attCheckins = new Set();
      sessionStorage.removeItem('elwany_s');
      document.getElementById('app').style.display = 'none';
      document.getElementById('login').style.display = 'flex';
      document.getElementById('pass').value = '';
      document.getElementById('coach-view').style.display = 'none';
      document.getElementById('tab-control').style.display = 'none';
      document.getElementById('tab-ledger').classList.add('on');
      document.getElementById('tab-attendance').classList.remove('on');
      document.getElementById('tab-control').classList.remove('on');
      document.getElementById('ledger-section').style.display = 'block';
      document.getElementById('att-section').style.display = 'none';
      document.getElementById('control-section').style.display = 'none';
    }
    
    function go() {
      document.getElementById('login').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
      document.getElementById('hname').textContent = S.name;
      document.getElementById('att-date').value = today();
      // everyone gets the coach (ledger) view
      document.getElementById('coach-view').style.display = 'flex';
      loadCoach();
      // bigdaddy also gets Control tab
      if (S.role === 'bigdaddy') {
        document.getElementById('tab-control').style.display = 'flex';
      }
    }
    
    // ── MAIN NAV ──────────────────────────────────────────────────────────────
    function switchMain(section, el) {
      document.querySelectorAll('.main-tab').forEach(t => t.classList.remove('on'));
      el.classList.add('on');
      document.getElementById('ledger-section').style.display  = section === 'ledger'     ? 'block' : 'none';
      document.getElementById('att-section').style.display     = section === 'attendance' ? 'flex'  : 'none';
      document.getElementById('control-section').style.display = section === 'control'    ? 'block' : 'none';
      if (section === 'attendance') loadAttendance();
      if (section === 'control')    loadBD();
    }
    
    // ── COACH ─────────────────────────────────────────────────────────────────
    function pick(btn) {
      selType = btn.dataset.type;
      document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      const preset = btn.dataset.amount;
      const amtEl = document.getElementById('amt');
      if (selType === 'other') {
        amtEl.value = '';
        amtEl.style.display = 'block';
        document.getElementById('notes').placeholder = 'Notes (required)';
        document.getElementById('notes').focus();
      } else {
        amtEl.value = preset || '';
        amtEl.style.display = 'none';
        document.getElementById('notes').placeholder = 'Notes (optional)';
      }
    }
    
    async function addEntry() {
      if (!selType) { alert('Select a type.'); return; }
      const name = document.getElementById('sname').value.trim();
      const amt  = parseFloat(document.getElementById('amt').value);
      const note = document.getElementById('notes').value.trim();
      if (!name) { alert('Enter student name.'); return; }
      if (!amt || amt <= 0) { alert('Enter a valid amount.'); return; }
      if (selType === 'other' && !note) { alert('Enter a note for Other entries.'); return; }
      const btn = document.getElementById('sbtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spin"></span>Saving…';
      try {
        const r = await call('POST', '/ledger-entry', {
          user_id: S.user_id, type: selType,
          student_name: name, amount: amt, notes: note,
          entry_date: today()
        });
        if (r.success) {
          document.getElementById('sname').value = '';
          document.getElementById('amt').value = '';
          document.getElementById('notes').value = '';
          selType = null;
          document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('selected'));
          loadCoach();
        }
      } catch { alert('Failed to save.'); }
      btn.disabled = false;
      btn.textContent = 'Add Entry';
    }
    
    async function loadCoach() {
      document.getElementById('active-list').innerHTML = '<div class="empty">Loading…</div>';
      try {
        const r = await call('GET', `/ledger-entries?user_id=${S.user_id}`);
        renderActive(r.active || []);
        renderHistory(r.history || [], document.getElementById('history-list'));
      } catch { document.getElementById('active-list').innerHTML = '<div class="empty">Failed to load.</div>'; }
    }
    
    function renderActive(entries) {
      const el = document.getElementById('active-list');
      if (!entries.length) { el.innerHTML = '<div class="empty">No active entries yet.</div>'; return; }
      const usd = entries.filter(e => !isIQD(e.amount));
      const iqd = entries.filter(e =>  isIQD(e.amount));
      const usdTotal = usd.reduce((s,e) => s + +e.amount, 0);
      const iqdTotal = iqd.reduce((s,e) => s + +e.amount, 0);
      let html = '';
      if (usd.length) html += `
        <div class="entries-header" style="margin-top:12px">
          <div class="label" style="margin:0">Dollars (${usd.length})</div>
          <div class="badge">${usdTotal.toFixed(2)}</div>
        </div>${usd.map(entryHTML).join('')}`;
      if (iqd.length) html += `
        <div class="entries-header" style="margin-top:${usd.length?'20px':'12px'}">
          <div class="label" style="margin:0">Dinars (${iqd.length})</div>
          <div class="badge">${iqdTotal.toLocaleString()}</div>
        </div>${iqd.map(entryHTML).join('')}`;
      el.innerHTML = html;
    }
    
    function totalBadge(entries) {
      const usd = entries.filter(e => !isIQD(e.amount)).reduce((s,e) => s + +e.amount, 0);
      const iqd = entries.filter(e =>  isIQD(e.amount)).reduce((s,e) => s + +e.amount, 0);
      const parts = [];
      if (usd) parts.push(usd.toFixed(2));
      if (iqd) parts.push(iqd.toLocaleString());
      return parts.join(' / ') || '0';
    }
    
    function renderHistory(batches, el) {
      if (!batches.length) { el.innerHTML = '<div class="empty">No history yet.</div>'; return; }
      el.innerHTML = batches.map(b => `
        <div class="batch">
          <div class="batch-hd" onclick="toggleBatch(this)">
            <div>
              <div style="font-weight:700;font-size:.9rem">${fmtDate(b.flushed_at)}</div>
              <div style="font-size:.75rem;color:var(--muted)">${b.entry_count} entries</div>
            </div>
            <div style="font-weight:800;color:var(--green)">$${(+b.total_amount).toFixed(2)}</div>
          </div>
          <div class="batch-body">${(b.entries||[]).map(entryHTML).join('')}</div>
        </div>`).join('');
    }
    
    function showTab(tab, el) {
      document.querySelectorAll('.vtab').forEach(t => t.classList.remove('on'));
      el.classList.add('on');
      document.getElementById('active-list').style.display  = tab==='active'  ? 'block' : 'none';
      document.getElementById('history-list').style.display = tab==='history' ? 'block' : 'none';
    }
    
    // ── BIGDADDY ──────────────────────────────────────────────────────────────
    async function loadBD() {
      document.getElementById('cpanel').innerHTML = '<div class="empty">Loading…</div>';
      try {
        const r = await call('GET', `/ledger-all?user_id=${S.user_id}`);
        coaches = r.coaches || [];
        if (!coaches.length) { document.getElementById('cpanel').innerHTML = '<div class="empty">No coaches.</div>'; return; }
        document.getElementById('ctabs').innerHTML = coaches.map((c,i) =>
          `<div class="ctab ${i===0?'on':''}" onclick="pickCoach(${c.id},this)">${c.name}</div>`
        ).join('');
        renderCoach(coaches[0]);
      } catch { document.getElementById('cpanel').innerHTML = '<div class="empty">Failed to load.</div>'; }
    }
    
    function pickCoach(id, el) {
      document.querySelectorAll('.ctab').forEach(t => t.classList.remove('on'));
      el.classList.add('on');
      const c = coaches.find(x => x.id === id);
      if (c) renderCoach(c);
    }
    
    function renderCoach(c) {
      const active = c.active_entries || [];
      const hist   = c.history || [];
      const canFlush = active.length > 0;
      const usdEntries = active.filter(e => !isIQD(e.amount));
      const iqdEntries = active.filter(e =>  isIQD(e.amount));
      const usdTotal   = usdEntries.reduce((s,e) => s + +e.amount, 0);
      const iqdTotal   = iqdEntries.reduce((s,e) => s + +e.amount, 0);
      document.getElementById('cpanel').innerHTML = `
        <div class="csummary" style="flex-direction:column;gap:14px;align-items:stretch">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div>
              <div style="font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)">Dollars</div>
              <div class="ctotal" style="font-size:1.3rem">${usdTotal > 0 ? usdTotal.toFixed(2) : '—'}</div>
              <div class="ccount">${usdEntries.length} entr${usdEntries.length===1?'y':'ies'}</div>
            </div>
            <div style="width:1px;background:var(--border);align-self:stretch"></div>
            <div style="text-align:right">
              <div style="font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)">Dinars</div>
              <div class="ctotal" style="font-size:1.3rem">${iqdTotal > 0 ? iqdTotal.toLocaleString() : '—'}</div>
              <div class="ccount">${iqdEntries.length} entr${iqdEntries.length===1?'y':'ies'}</div>
            </div>
          </div>
          <button class="btn btn-gold" style="${!canFlush?'opacity:.4;pointer-events:none':''}"
            onclick="openFlush(${c.id},'${c.name}')">Flush ${c.name}</button>
        </div>
        <div style="height:1px;background:var(--border);margin:4px 0 16px"></div>
        </div>
        ${active.length
          ? `<div class="entries-header"><div class="label" style="margin:0">Active</div></div>${active.map(entryHTML).join('')}`
          : '<div class="empty">No active entries.</div>'}
        ${hist.length ? `
          <div style="margin-top:24px">
            <div class="label" style="margin-bottom:12px">History</div>
            ${hist.map(b=>`
              <div class="batch">
                <div class="batch-hd" onclick="toggleBatch(this)">
                  <div>
                    <div style="font-weight:700;font-size:.9rem">${fmtDate(b.flushed_at)}</div>
                    <div style="font-size:.75rem;color:var(--muted)">${b.entry_count} entries</div>
                  </div>
                  <div style="font-weight:800;color:var(--green)">$${(+b.total_amount).toFixed(2)}</div>
                </div>
                <div class="batch-body">${(b.entries||[]).map(entryHTML).join('')}</div>
              </div>`).join('')}
          </div>` : ''}`;
    }
    
    // ── FLUSH ─────────────────────────────────────────────────────────────────
    function openFlush(coachId, coachName) {
      flushCoachId = coachId;
      document.getElementById('fmsg').textContent =
        `Move all active entries for ${coachName} to history? Both you and ${coachName} will still see them.`;
      document.getElementById('fmodal').classList.add('open');
    }
    
    function closeModal() {
      flushCoachId = null;
      document.getElementById('fmodal').classList.remove('open');
    }
    
    async function doFlush() {
      const btn = document.getElementById('fbtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spin"></span>Flushing…';
      try {
        const r = await call('POST', '/ledger-flush', { user_id: S.user_id, coach_id: flushCoachId });
        if (r.success) { closeModal(); loadBD(); }
        else { alert('Flush failed.'); }
      } catch { alert('Connection error.'); }
      btn.disabled = false;
      btn.textContent = 'Flush';
    }
    
    // ── ATTENDANCE ────────────────────────────────────────────────────────────
    async function loadAttendance() {
      attDate = document.getElementById('att-date').value || today();
      if (!rosterLoaded) {
        document.getElementById('att-list').innerHTML = '<div class="empty">Loading roster…</div>';
        try {
          const r = await call('GET', '/attendance-roster');
          roster = r.students || [];
          rosterLoaded = true;
        } catch {
          document.getElementById('att-list').innerHTML = '<div class="empty">Failed to load roster.</div>';
          return;
        }
      }
      await loadAttCheckins();
    }
    
    async function loadAttCheckins() {
      attDate = document.getElementById('att-date').value || today();
      try {
        const r = await call('GET', `/attendance-today?class_date=${attDate}`);
        const ids = r.student_ids || [];
        attCheckins = new Set(Array.isArray(ids) ? ids : []);
        renderRoster();
      } catch {
        document.getElementById('att-list').innerHTML = '<div class="empty">Failed to load check-ins.</div>';
      }
    }
    
    function renderRoster() {
      const q = document.getElementById('att-search').value.trim().toLowerCase();
      const filtered = q ? roster.filter(s => s.name.toLowerCase().includes(q)) : roster;
      const activeCount = roster.filter(s => s.active).length;
      document.getElementById('att-stats').textContent =
        `${attCheckins.size} checked in · ${activeCount} / ${roster.length} members active`;
    
      if (!filtered.length) {
        document.getElementById('att-list').innerHTML = '<div class="empty">No students found.</div>';
        return;
      }
    
      const sorted = [...filtered].sort((a, b) => {
        const ac = attCheckins.has(a.id), bc = attCheckins.has(b.id);
        if (ac !== bc) return bc ? 1 : -1;
        return a.name.localeCompare(b.name);
      });
    
      document.getElementById('att-list').innerHTML = sorted.map(s => {
        const checked = attCheckins.has(s.id);
        const expStr = s.expiry_ms
          ? new Date(s.expiry_ms).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})
          : 'No expiry';
        const safeName = s.name.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
        return `<div class="att-row${checked?' checked':''}" id="att-${s.id}" onclick="toggleAtt('${s.id}','${safeName}')">
          <div>
            <div class="att-name">${s.name}</div>
            <span class="att-badge ${s.active?'active':'expired'}">${s.active?'Active':'Expired'} · ${expStr}</span>
          </div>
          <div class="att-check">${checked?'✓':'+'}</div>
        </div>`;
      }).join('');
    }
    
    async function toggleAtt(studentId, studentName) {
      const wasChecked = attCheckins.has(studentId);
      // optimistic update
      if (wasChecked) attCheckins.delete(studentId); else attCheckins.add(studentId);
      renderRoster();
      try {
        const ep = wasChecked ? '/attendance-unmark' : '/attendance-mark';
        await call('POST', ep, {
          user_id: S.user_id,
          student_id: studentId,
          student_name: studentName,
          class_date: attDate
        });
      } catch {
        // revert
        if (wasChecked) attCheckins.add(studentId); else attCheckins.delete(studentId);
        renderRoster();
        alert('Failed to save. Check connection.');
      }
    }
    
    // ── HELPERS ───────────────────────────────────────────────────────────────
    function entryHTML(e) {
      return `<div class="entry">
        <div>
          <div class="etype">${TYPES[e.type]?.label || e.type}</div>
          <div class="ename">${e.student_name}</div>
          <div class="edate">${fmtDate(e.entry_date)}${e.notes?' · '+e.notes:''}</div>
        </div>
        <div class="eamt">${fmtAmt(e.amount)}</div>
      </div>`;
    }
    
    function toggleBatch(hd) { hd.nextElementSibling.classList.toggle('open'); }
    
    function today() { return new Date().toISOString().split('T')[0]; }
    
    function fmtDate(d) {
      if (!d) return '';
      return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
    }
    
    async function call(method, path, body) {
      const opts = { method, headers: {'Content-Type':'application/json'} };
      if (body) opts.body = JSON.stringify(body);
      const r = await fetch(API + path, opts);
      if (!r.ok) throw new Error(r.status);
      return r.json();
    }
    </script>
    </body>
    </html>
    
