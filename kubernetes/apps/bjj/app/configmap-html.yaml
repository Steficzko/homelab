    entryHTML(e) {\n  const typeLabel = {gi_rental:'Gi Rental',subscription:'Subscription',rashguard:'Rashguard',kimono:'Kimono',other:'Other'};\n
    \ return `<div class=\"entry\">\n    <div>\n      <div class=\"etype\">${typeLabel[e.type]||e.type}</div>\n
    \     <div class=\"ename\">${e.student_name}</div>\n      <div class=\"edate\">${fmtDate(e.entry_date)}${e.notes?'
