    \     student_id: studentId,\n      student_name: studentName,\n      class_date:
    attDate\n    });\n  } catch {\n    // revert\n    if (wasChecked) attCheckins.add(studentId);
    else attCheckins.delete(studentId);\n    renderRoster();\n    alert('Failed to
