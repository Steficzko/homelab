apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: actualbudget
  namespace: actualbudget
spec:
  podSelector:
    matchLabels:
      app: actualbudget
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 5006
  egress:
    # DNS
    - ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    # outbound HTTPS (GoCardless/SimpleFIN bank sync, update check)
    - ports:
        - { port: 443, protocol: TCP }
