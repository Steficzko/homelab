apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dataimporter
  namespace: firefly
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts: [import.kostikidis.net]
      secretName: dataimporter-tls
  rules:
    - host: import.kostikidis.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: dataimporter, port: { number: 8080 } } }
