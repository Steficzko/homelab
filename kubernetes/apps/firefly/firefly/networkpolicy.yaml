apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: firefly, namespace: firefly }
spec:
  podSelector: { matchLabels: { app: firefly } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } } }]
      ports: [{ port: 8080 }]
  egress:
    - ports: [{ port: 5432 }]
      to: [{ podSelector: { matchLabels: { app: postgres } } }]
    - ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]   # DNS
    - ports: [{ port: 443, protocol: TCP }]                                # HTTPS (exchange rates)
    - ports: [{ port: 587, protocol: TCP }, { port: 465, protocol: TCP }]  # SMTP (Gmail)
