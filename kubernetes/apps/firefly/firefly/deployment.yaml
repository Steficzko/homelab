apiVersion: apps/v1
kind: Deployment
metadata:
  name: firefly
  namespace: firefly
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: firefly
  template:
    metadata:
      labels:
        app: firefly
    spec:
      containers:
        - name: firefly
          image: fireflyiii/core:version-6.6.6
          envFrom:
            - secretRef:
                name: firefly-secret        # APP_KEY, DB_PASSWORD
          env:
            - { name: APP_URL, value: "https://money.kostikidis.net" }
            - { name: TZ, value: "Europe/Prague" }
            - { name: TRUSTED_PROXIES, value: "**" }
            - { name: DB_CONNECTION, value: "pgsql" }
            - { name: DB_HOST, value: "postgres.firefly.svc.cluster.local" }
            - { name: DB_PORT, value: "5432" }
            - { name: DB_DATABASE, value: "firefly" }
            - { name: DB_USERNAME, value: "firefly" }
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /login, port: 8080 }
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 12
          livenessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests: { memory: 256Mi, cpu: "100m" }
            limits: { memory: 768Mi }
          volumeMounts:
            - name: upload
              mountPath: /var/www/html/storage/upload
      volumes:
        - name: upload
          persistentVolumeClaim:
            claimName: firefly-upload
