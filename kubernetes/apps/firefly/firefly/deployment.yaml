apiVersion: apps/v1
kind: Deployment
metadata:
  name: firefly
  namespace: firefly
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: firefly
  template:
    metadata:
      labels:
        app: firefly
    spec:
      # fix upload-dir ownership on the PVC (uses the image's own www-data uid)
      initContainers:
        - name: fix-upload-perms
          image: fireflyiii/core:version-6.6.6
          command: ["sh", "-c", "chown -R www-data:www-data /var/www/html/storage/upload && chmod -R u+rwX /var/www/html/storage/upload"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: upload
              mountPath: /var/www/html/storage/upload
      containers:
        - name: firefly
          image: fireflyiii/core:version-6.6.6
          envFrom:
            - secretRef:
                name: firefly-secret        # APP_KEY, DB_PASSWORD, MAIL_PASSWORD
          env:
            - { name: APP_URL, value: "https://money.kostikidis.net" }
            - { name: TZ, value: "Europe/Prague" }
            - { name: TRUSTED_PROXIES, value: "**" }
            - { name: DB_CONNECTION, value: "pgsql" }
            - { name: DB_HOST, value: "postgres.firefly.svc.cluster.local" }
            - { name: DB_PORT, value: "5432" }
            - { name: DB_DATABASE, value: "firefly" }
            - { name: DB_USERNAME, value: "firefly" }
            # SMTP (Gmail) — password reset + notifications. MAIL_PASSWORD from secret.
            - { name: MAIL_MAILER, value: "smtp" }
            - { name: MAIL_HOST, value: "smtp.gmail.com" }
            - { name: MAIL_PORT, value: "587" }
            - { name: MAIL_ENCRYPTION, value: "tls" }
            - { name: MAIL_USERNAME, value: "kostikidis.network@gmail.com" }
            - { name: MAIL_FROM, value: "kostikidis.network@gmail.com" }
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /login, port: 8080 }
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 12
          livenessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests: { memory: 256Mi, cpu: "100m" }
            limits: { memory: 768Mi }
          volumeMounts:
            - name: upload
              mountPath: /var/www/html/storage/upload
      volumes:
        - name: upload
          persistentVolumeClaim:
            claimName: firefly-upload
