apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: postgres, namespace: firefly }
spec:
  podSelector: { matchLabels: { app: postgres } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: firefly } }
        - podSelector: { matchLabels: { app: firefly-cron } }   # daily firefly-iii:cron
      ports: [{ port: 5432 }]
