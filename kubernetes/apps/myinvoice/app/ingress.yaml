# Exposed via the kostikidis wildcard Cloudflare tunnel.
# STAYS BEHIND THE *.kostikidis.net CLOUDFLARE ACCESS WILDCARD — do NOT add a
# bypass policy. This is invoicing data, and the app ships a browser setup
# wizard that is publicly claimable until it has been completed (same trap the
# blanca-web WordPress installer hit on 2026-08-06).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myinvoice
  namespace: myinvoice
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Traefik (CLSTR-29). cloudflared reaches this host over HTTPS on Traefik's
    # websecure entrypoint (tunnel rule: originServerName faktury.kostikidis.net),
    # so the cert in the tls: block below is the one served. Traefik does not
    # redirect http->https on its own, so the old ssl-redirect loop cannot happen.
    # The 25m nginx body limit is gone: Cloudflare caps a request at 100 MB and
    # the host sits behind Access.
spec:
  ingressClassName: traefik
  tls:
    - hosts: [faktury.kostikidis.net]
      secretName: faktury-kostikidis-net-tls
  rules:
    - host: faktury.kostikidis.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: myinvoice
                port:
                  number: 80
