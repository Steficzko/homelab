# Placeholder so the Secret exists before the real (SOPS-encrypted) data is
# applied. IgnoreExtraneous + Prune=false keep ArgoCD selfHeal from stripping
# the data applied out-of-band from secret.sops.yaml (same pattern as namosocks).
apiVersion: v1
kind: Secret
metadata:
  name: myinvoice-secret
  namespace: myinvoice
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-options: Prune=false
type: Opaque
