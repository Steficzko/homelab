# Placeholder so the Secret exists before the real (SOPS-encrypted) data is
# applied out-of-band from backup-s3-secret.sops.yaml. Same pattern as blanca-web.
apiVersion: v1
kind: Secret
metadata:
  name: backup-s3-secret
  namespace: myinvoice
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-options: Prune=false
type: Opaque
