upgradeCRDs: false
snapshotsEnabled: false

credentials:
  useSecret: true
  existingSecret: velero-credentials

configuration:
  volumeSnapshotLocation:
    - name: default
      provider: aws
      config:
        region: minio
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: velerok3s
      default: true
      config:
        region: minio
        s3ForcePathStyle: "true"
        s3Url: http://192.168.1.100:9100
        publicUrl: http://192.168.1.100:9100

  uploaderType: kopia
  defaultVolumesToFsBackup: false

initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.14.2
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins

schedules:
  daily:
    disabled: false
    schedule: "0 2 * * *"
    useOwnerReferencesInBackup: false
    template:
      ttl: 720h
      storageLocation: default
      includedNamespaces:
        - "*"
      defaultVolumesToFsBackup: false
      # Velero here captures Kubernetes API objects ONLY — the cluster-rebuild artifact.
      # Volume DATA is Longhorn's job (block backups to s3://longhornk3s) plus the per-app
      # logical dumps; Velero has never taken a volume snapshot and is not meant to.
      #
      # Explicit false, added 2026-08-30. It was previously unset, which left Velero
      # attempting a snapshot per PV and emitting
      #   "No volume ID returned by volume snapshotter for persistent volume"
      # sixty times a night — one per PV, every run, forever. Nothing was failing, but a
      # backup that cries wolf 60 times nightly trains you to ignore its warnings, which is
      # how a real one gets missed. Saying "no" out loud also makes the intent legible to
      # the next reader, who would otherwise see a half-configured snapshotter.
      snapshotVolumes: false
      labelSelector:
        matchExpressions:
          - key: "velero.io/exclude-from-backup"
            operator: DoesNotExist
