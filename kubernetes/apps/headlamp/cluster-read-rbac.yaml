# Supplements the chart's SA→view binding (view is namespaced-only, no secrets).
# Adds read-only visibility for the cluster-scoped resources the overview needs —
# nodes, node/pod metrics (CPU/mem bars), PVs, storage, and the CRDs this cluster
# runs (ArgoCD, Longhorn, cert-manager, Prometheus operator, Velero). Still no secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp-cluster-read
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics", "nodes/stats", "persistentvolumes", "namespaces", "events", "componentstatuses"]
    verbs: ["get", "list", "watch"]
  # secrets: explicitly granted at user request — exposes decoded secret values
  # in the dashboard to anyone past Cloudflare Access. Read-only.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "volumeattachments", "csinodes", "csidrivers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiregistration.k8s.io"]
    resources: ["apiservices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argoproj.io", "longhorn.io", "cert-manager.io", "acme.cert-manager.io", "monitoring.coreos.com", "snapshot.storage.k8s.io", "velero.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # remaining common groups so the dashboard stops hitting "no permission" walls
  # (Gateway API is installed here; ingressclasses/rbac/etc. are cluster-scoped).
  # Core secrets are deliberately NOT granted — no secret values in the dashboard.
  - apiGroups:
      - "gateway.networking.k8s.io"
      - "networking.k8s.io"
      - "policy"
      - "autoscaling"
      - "node.k8s.io"
      - "scheduling.k8s.io"
      - "coordination.k8s.io"
      - "discovery.k8s.io"
      - "flowcontrol.apiserver.k8s.io"
      - "admissionregistration.k8s.io"
      - "rbac.authorization.k8s.io"
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-cluster-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: headlamp-cluster-read
subjects:
  - kind: ServiceAccount
    name: headlamp
    namespace: headlamp
