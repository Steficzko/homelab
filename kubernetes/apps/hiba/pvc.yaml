apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hiba-content
  namespace: hiba
spec:
  # The site is a static export of /mnt/devdata/Hiba/brain/pack (~2.2 MB, 520 files),
  # pushed in by pipelines/publish_site.sh. Nothing in the cluster ever writes here.
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
