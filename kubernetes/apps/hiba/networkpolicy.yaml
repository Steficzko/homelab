apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hiba
  namespace: hiba
spec:
  podSelector:
    matchLabels:
      app: hiba
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:   # Traefik (CLSTR-29); nginx kept until it is removed
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 8080
  egress: []     # a static file server has nowhere to call out to — not even DNS
