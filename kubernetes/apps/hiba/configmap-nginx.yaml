apiVersion: v1
kind: ConfigMap
metadata:
  name: hiba-nginx
  namespace: hiba
data:
  nginx.conf: |
    # Static-only server: no scripting engine, no upstreams, no write path.
    worker_processes 1;
    error_log /dev/stderr warn;
    pid /tmp/nginx.pid;
    events { worker_connections 256; }
    http {
      include       /etc/nginx/mime.types;
      default_type  application/octet-stream;
      access_log    /dev/stdout combined;
      server_tokens off;

      client_body_temp_path /tmp/client_body;
      proxy_temp_path       /tmp/proxy;
      fastcgi_temp_path     /tmp/fastcgi;
      uwsgi_temp_path       /tmp/uwsgi;
      scgi_temp_path        /tmp/scgi;

      sendfile on;
      keepalive_timeout 30s;
      client_max_body_size 1k;      # nothing is ever uploaded here
      gzip on;
      gzip_types text/plain text/css application/javascript application/json image/svg+xml;
      charset utf-8;
      charset_types text/html text/css application/javascript application/json;

      server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        autoindex off;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        # The pages load fonts from Google and nothing else; no scripts from anywhere but themselves.
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; script-src 'self' 'unsafe-inline'; frame-ancestors 'self'; base-uri 'none'; form-action 'none'" always;

        # Only GET/HEAD exist on a static archive.
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }

        location = /healthz { access_log off; return 200 "ok\n"; }

        location / {
          try_files $uri $uri/ =404;
        }

        location ~* \.(html)$ { expires 5m; }
        location ~* \.(css|js|jpg|jpeg|png|svg|woff2|zip)$ { expires 7d; }

        # No dotfiles, no editor leftovers.
        location ~ /\. { deny all; }
      }
    }
