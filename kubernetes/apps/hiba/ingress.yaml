apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hiba
  namespace: hiba
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure,trusted
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - hiba.kostikidis.net
      secretName: hiba-kostikidis-net-tls
  rules:
    - host: hiba.kostikidis.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hiba
                port:
                  number: 80
