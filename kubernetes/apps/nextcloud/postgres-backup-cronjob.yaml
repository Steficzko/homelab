# Logical (pg_dump) backup of the Nextcloud Postgres DB -> MinIO. Until 2026-08-26 the DB had NO dump at all — only crash-consistent Longhorn snapshots.
# Complements the block-level Longhorn/Velero snapshots with a portable,
# version-restorable dump usable for granular restore and migration.
# Restore:  pg_restore -h <host> -U <user> -d <db> --clean <file>.dump
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: nextcloud
spec:
  schedule: "30 1 * * *"          # daily 01:30 — family data, not a dev DB
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 10800   # auto-clean finished jobs (stops one-off failures re-alerting forever)
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: postgres-backup
        spec:
          restartPolicy: Never
          affinity:                       # co-locate with postgres (cross-node net is unreliable)
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app: postgres
                  topologyKey: kubernetes.io/hostname
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          initContainers:
            - name: copy-mc
              image: ghcr.io/steficzko/mc:RELEASE.2025-08-13T08-35-41Z@sha256:fc471559bd4d9a058985680ce49771626405886eebabaee6b7d5d1265c8ef823   # Steficzko/mc-image; was a GitHub download per run — github.com 504ed the nixery curl 2026-11-08
              imagePullPolicy: IfNotPresent   # digest-only refs default to Always; nixery outage 2026-10-14 (STOR-51)
              securityContext:
                runAsUser: 0                  # mc is 0711 root-owned; need root to read+copy it
              command: ["/bin/sh", "-c", "set -e; cp /mc /tools/mc && echo 01f866e9c5f9b87c2b09116fa5d7c06695b106242d829a8bb32990c00312e891\ \ /tools/mc | sha256sum -c -"]
              volumeMounts:
                - { name: tools, mountPath: /tools }
          containers:
            - name: dump
              image: postgres:16-alpine@sha256:f377d590e5474681d4d7838635031a2b50647923b7abfa803ce9b5ff35d5c663
              envFrom:
                - secretRef: { name: postgres-secret }    # POSTGRES_USER / POSTGRES_DB / POSTGRES_PASSWORD
                - secretRef: { name: backup-s3-secret }    # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_ENDPOINTS
              env:
                - { name: HOME,      value: /work }
                - { name: PGHOST,    value: postgres }
                - { name: BUCKET,    value: app-backups }
                - { name: PREFIX,    value: nextcloud-postgres }
                - { name: RETENTION, value: "30d" }   # 30 daily restore points
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  export PGPASSWORD="$POSTGRES_PASSWORD"
                  TS=$(date +%Y%m%d-%H%M%S)
                  FILE="${POSTGRES_DB}-${TS}.dump"
                  echo "==> Waiting for ${PGHOST}:5432 (tolerates kube-router NetworkPolicy propagation delay) ..."
                  ok=0
                  for i in $(seq 1 30); do
                    if pg_isready -h "$PGHOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -t 3 >/dev/null 2>&1; then ok=1; echo "    reachable (try ${i})"; break; fi
                    sleep 3
                  done
                  [ "$ok" = 1 ] || { echo "ERROR: postgres unreachable after retries"; exit 1; }
                  echo "==> Dumping ${POSTGRES_DB} from ${PGHOST} ..."
                  pg_dump -h "$PGHOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc -Z6 -f "/work/${FILE}"
                  echo "==> Uploading ${FILE} ..."
                  /tools/mc alias set s3 "$AWS_ENDPOINTS" "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY"
                  # ponytail-free note: the scoped policy has no CreateBucket/HeadBucket —
                  # deliberate least-privilege. app-backups always exists (other jobs make it),
                  # so a denied existence check must not fail the run.
                  /tools/mc mb --ignore-existing "s3/${BUCKET}" 2>/dev/null || true
                  /tools/mc cp "/work/${FILE}" "s3/${BUCKET}/${PREFIX}/${FILE}"
                  echo "==> Pruning > ${RETENTION} old ..."
                  /tools/mc rm --recursive --force --older-than "$RETENTION" "s3/${BUCKET}/${PREFIX}/" || true
                  echo "==> Done: s3://${BUCKET}/${PREFIX}/${FILE}"
              volumeMounts:
                - { name: tools, mountPath: /tools }
                - { name: work,  mountPath: /work }
          volumes:
            - { name: tools, emptyDir: {} }
            - { name: work,  emptyDir: {} }
