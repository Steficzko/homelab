# DO NOT COMMIT WITH REAL VALUES
# Create the real secret with:
#   kubectl create secret generic postgres-secret -n nextcloud \
#     --from-literal=POSTGRES_USER=nextcloud \
#     --from-literal=POSTGRES_DB=nextcloud \
#     --from-literal=POSTGRES_PASSWORD=CHANGE_ME
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: nextcloud
stringData:
  POSTGRES_USER: nextcloud
  POSTGRES_DB: nextcloud
  POSTGRES_PASSWORD: CHANGE_ME
