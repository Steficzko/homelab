apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  namespace: nextcloud
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 5432
      from:
        - podSelector:
            matchLabels:
              app: nextcloud
        - podSelector:
            matchLabels:
              app: nextcloud-cron
        # pg_dump backup CronJob (added 2026-08-26 with the backup job itself)
        - podSelector:
            matchLabels:
              app: postgres-backup
