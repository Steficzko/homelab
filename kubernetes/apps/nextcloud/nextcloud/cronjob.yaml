# Runs Nextcloud background tasks every 5 minutes
# Required for notifications, file scanning, app updates
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nextcloud-cron
  namespace: nextcloud
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 10800   # auto-clean finished jobs (stops one-off failures re-alerting forever)
      template:
        metadata:
          labels:
            app: nextcloud-cron
        spec:
          restartPolicy: OnFailure
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app: nextcloud
                  topologyKey: kubernetes.io/hostname
          initContainers:
            - name: fix-permissions
              image: busybox:1.38@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
              command: ["sh", "-c", "chown -R 33:33 /data && chmod 0770 /data"]
              securityContext:
                runAsUser: 0
              volumeMounts:
                - name: data
                  mountPath: /data
          containers:
            - name: cron
              image: nextcloud:35.0.2-apache@sha256:89af7ee7a96ff5e9668280566209268ae6b2d02327f6ef6d56f6d68228cf9431
              command: ["php", "-f", "/var/www/html/cron.php"]
              securityContext:
                runAsUser: 33
              volumeMounts:
                - name: app
                  mountPath: /var/www/html
                - name: data
                  mountPath: /var/www/html/data
          volumes:
            - name: app
              persistentVolumeClaim:
                claimName: nextcloud-app-pvc
            - name: data
              persistentVolumeClaim:
                claimName: nextcloud-data-pvc
