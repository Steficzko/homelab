# Runs Nextcloud background tasks every 5 minutes
# Required for notifications, file scanning, app updates
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nextcloud-cron
  namespace: nextcloud
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: nextcloud-cron
        spec:
          restartPolicy: OnFailure
          initContainers:
            - name: fix-permissions
              image: busybox
              command: ["sh", "-c", "chown -R 33:33 /data && chmod 0770 /data"]
              securityContext:
                runAsUser: 0
              volumeMounts:
                - name: data
                  mountPath: /data
          containers:
            - name: cron
              image: nextcloud:33.0.3-apache
              command: ["php", "-f", "/var/www/html/cron.php"]
              securityContext:
                runAsUser: 33
              volumeMounts:
                - name: app
                  mountPath: /var/www/html
                - name: data
                  mountPath: /var/www/html/data
          volumes:
            - name: app
              persistentVolumeClaim:
                claimName: nextcloud-app-pvc
            - name: data
              persistentVolumeClaim:
                claimName: nextcloud-data-pvc
