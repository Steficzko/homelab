# Runs Nextcloud background tasks every 5 minutes
# Required for notifications, file scanning, app updates
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nextcloud-cron
  namespace: nextcloud
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 10800   # auto-clean finished jobs (stops one-off failures re-alerting forever)
      template:
        metadata:
          labels:
            app: nextcloud-cron
        spec:
          restartPolicy: OnFailure
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app: nextcloud
                  topologyKey: kubernetes.io/hostname
          # SEC-12: no root chown init container any more, see deployment.yaml.
          securityContext: { runAsUser: 33, runAsGroup: 33, runAsNonRoot: true }
          containers:
            - name: cron
              image: nextcloud:35.0.2-apache@sha256:d88929dc8386420b8963f86cabb667fdaf733eef9dcf8fc98e226801a32c023c
              command: ["php", "-f", "/var/www/html/cron.php"]
              securityContext:
                runAsUser: 33
              volumeMounts:
                - name: app
                  mountPath: /var/www/html
                - name: data
                  mountPath: /var/www/html/data
          volumes:
            - name: app
              persistentVolumeClaim:
                claimName: nextcloud-app-pvc
            - name: data
              persistentVolumeClaim:
                claimName: nextcloud-data-pvc
