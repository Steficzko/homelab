apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nextcloud
  namespace: nextcloud
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # `lan` = direct LAN path at home (traefik values, ADR-044 amendment 2026-10-22).
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure,lan
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - nextcloud.kostikidis.net
      secretName: nextcloud-tls
  rules:
    - host: nextcloud.kostikidis.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nextcloud
                port:
                  number: 80
