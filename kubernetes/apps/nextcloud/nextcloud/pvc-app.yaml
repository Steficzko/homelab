# Longhorn PVC for Nextcloud app files and config
# Kept separate from data so app survives Unraid reboots
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-app-pvc
  namespace: nextcloud
  labels:
    recurring-job.longhorn.io/daily-backup: "enabled"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
