apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nextcloud
  template:
    metadata:
      labels:
        app: nextcloud
    spec:
      # SEC-12 (2026-10-24): whole pod as www-data so the NextCloud export can root_squash.
      # The old root init container (chown -R 33:33 /data) is gone: every file was already 33,
      # and a squashed root chown would fail and block the start. Apache binds :80 as uid 33
      # because containerd 2.x sets ip_unprivileged_port_start=0 in pods (tested in a throwaway pod).
      securityContext: { runAsUser: 33, runAsGroup: 33, runAsNonRoot: true }
      containers:
        - name: nextcloud
          image: nextcloud:35.0.2-apache@sha256:89af7ee7a96ff5e9668280566209268ae6b2d02327f6ef6d56f6d68228cf9431
          ports:
            - containerPort: 80
          env:
            - name: POSTGRES_HOST
              value: postgres.nextcloud.svc.cluster.local
            - name: POSTGRES_DB
              value: nextcloud
            - name: REDIS_HOST
              value: redis.nextcloud.svc.cluster.local
            - name: REDIS_HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secret
                  key: REDIS_PASSWORD
            - name: NEXTCLOUD_TRUSTED_DOMAINS
              value: nextcloud.kostikidis.net
            - name: OVERWRITEPROTOCOL
              value: https
            - name: OVERWRITECLIURL
              value: https://nextcloud.kostikidis.net
            - name: TRUSTED_PROXIES
              value: 10.0.0.0/8
            - name: NEXTCLOUD_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secret
                  key: NEXTCLOUD_ADMIN_USER
            - name: NEXTCLOUD_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secret
                  key: NEXTCLOUD_ADMIN_PASSWORD
            - name: POSTGRES_USER
              value: nextcloud
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              memory: 512Mi
              cpu: "250m"
            limits:
              memory: 4Gi
          volumeMounts:
            - name: app
              mountPath: /var/www/html
            - name: data
              mountPath: /var/www/html/data
      volumes:
        - name: app
          persistentVolumeClaim:
            claimName: nextcloud-app-pvc
        - name: data
          persistentVolumeClaim:
            claimName: nextcloud-data-pvc
