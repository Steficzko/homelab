# DO NOT COMMIT WITH REAL VALUES
# Create the real secret with:
#   kubectl create secret generic nextcloud-secret -n nextcloud \
#     --from-literal=NEXTCLOUD_ADMIN_USER=admin \
#     --from-literal=NEXTCLOUD_ADMIN_PASSWORD=CHANGE_ME \
#     --from-literal=POSTGRES_PASSWORD=CHANGE_ME
apiVersion: v1
kind: Secret
metadata:
  name: nextcloud-secret
  namespace: nextcloud
stringData:
  NEXTCLOUD_ADMIN_USER: admin
  NEXTCLOUD_ADMIN_PASSWORD: CHANGE_ME
  POSTGRES_PASSWORD: CHANGE_ME
