# Public only through the team-elwany tunnel (k3sTeamELwany -> traefik:80). /api/cron/* and /api/health
# are answered 404 by a tunnel rule ahead of this host (cron calls web:3000 in-cluster).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openreply
  namespace: openreply
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: openreply-no-sales-pages@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: reply.teamelwany.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port: {number: 3000}
---
# Hide OpenReply's bundled marketing pages (owner 2026-11-26: "NUKE the sales page").
# Only these exact pages redirect; /login, /dashboard, /api/*, /_next/*, /privacy etc. are untouched.
# /dashboard itself bounces logged-out visitors to /login.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: no-sales-pages
  namespace: openreply
spec:
  redirectRegex:
    regex: '^https?://[^/]+/(brand|comment-link-automation|contributors|instagram-comment-to-dm-templates|instagram-dm-automation-agencies|manychat-alternative|meta-review|sponsors|templates)?(/[^?]*)?(\?.*)?$'
    replacement: 'https://reply.teamelwany.com/dashboard'
