# Template only. Real values: secret.sops.yaml (SOPS/age), applied out of band.
apiVersion: v1
kind: Secret
metadata: {name: openreply-env, namespace: openreply}
stringData:
  POSTGRES_PASSWORD: ""
  REDIS_PASSWORD: ""
  DATABASE_URL: postgresql://openreply:<POSTGRES_PASSWORD>@postgres:5432/openreply
  REDIS_URL: redis://:<REDIS_PASSWORD>@redis:6379
  NEXTAUTH_URL: https://reply.teamelwany.com
  AUTH_URL: https://reply.teamelwany.com
  NEXTAUTH_SECRET: ""          # openssl rand -base64 32
  CRON_SECRET: ""              # separate random, never equal to NEXTAUTH_SECRET
  ENCRYPTION_KEY: ""           # openssl rand -hex 32
  EMAIL_SERVER: smtps://<user>:<app password>@smtp.gmail.com:465
  EMAIL_FROM: ""
  ALLOWED_EMAILS: ""           # REQUIRED: comma separated sign-in allowlist
  WEBHOOK_VERIFY_TOKEN: ""
  INSTAGRAM_APP_ID: ""         # Meta app TeamElwany Internal (owner, Plane MKT-9)
  INSTAGRAM_APP_SECRET: ""
  FACEBOOK_APP_SECRET: ""
