# Deployed via ArgoCD (bootstrap: dental-clinic.yaml). Source of truth: saas.dental deploy/
# clinic-api: the whole security perimeter (threat model §1.3).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinic-api
  namespace: dental-clinic
  labels: {app: clinic-api}
spec:
  replicas: 1   # in-memory rate limiting assumes 1 replica (marked graduation point)
  selector:
    matchLabels: {app: clinic-api}
  template:
    metadata:
      labels:
        app: clinic-api
        clinic-db-access: "true"   # NetworkPolicy selector for Postgres ingress (REQ-16)
    spec:
      imagePullSecrets: [{name: ghcr-pull}]
      containers:
        - name: api
          image: ghcr.io/steficzko/dental-api:v0.40.0   # PRODUCTION TAG - promoted 2026-08-07
          ports: [{containerPort: 8000, name: http}]
          env:
            - {name: BASE_DOMAIN, value: "gompha.com,kostikidis.net"}  # rebrand = this one value
            # SMTP (password-reset sender). Only the password is secret; the rest are plain.
            - {name: SMTP_HOST, value: "smtp.gmail.com"}
            - {name: SMTP_PORT, value: "587"}
            - {name: SMTP_USERNAME, value: "kostikidis.network@gmail.com"}
            - {name: SMTP_FROM, value: "kostikidis.network@gmail.com"}   # From = authed account (Gmail rule)
            - name: SMTP_PASSWORD         # Google app-password (16 chars), in SOPS
              valueFrom: {secretKeyRef: {name: clinic-api-secret, key: SMTP_PASSWORD}}
            - name: DATABASE_URL          # postgresql://clinic_app:...@clinic-postgres/clinic
              valueFrom: {secretKeyRef: {name: clinic-api-secret, key: DATABASE_URL}}
            - name: N8N_SHARED_SECRET     # REQ-12 (voice phase)
              valueFrom: {secretKeyRef: {name: clinic-api-secret, key: N8N_SHARED_SECRET}}
            # ---- voice pipeline (v0.29.0, migration 0028; docs/voice-pipeline-plan.md).
            # ON-PREM: whisper + ollama in the ai namespace (NOT litellm — app/voice.py
            # assert_onprem allowlists exactly these two hosts; the netpol pins them).
            - {name: VOICE_WHISPER_URL, value: "http://whisper.ai.svc:8000"}
            - {name: VOICE_LLM_URL, value: "http://ollama.ai.svc:11434"}
            - {name: VOICE_KEEP_AUDIO, value: "true"}   # keep audio; MinIO 2-day ILM auto-expires it
            # MinIO audio archive. Endpoint is a LAN host (not secret); keys are SOPS.
            # Until the MINIO_* keys land in clinic-api-secret, upload answers 503 (safe).
            - {name: MINIO_ENDPOINT, value: "192.168.1.100:9100"}
            - {name: MINIO_BUCKET, value: "clinic-voice"}
            - {name: MINIO_SECURE, value: "false"}
            - name: MINIO_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: clinic-api-secret, key: MINIO_ACCESS_KEY, optional: true}}
            - name: MINIO_SECRET_KEY
              valueFrom: {secretKeyRef: {name: clinic-api-secret, key: MINIO_SECRET_KEY, optional: true}}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          readinessProbe:
            httpGet: {path: /api/healthz, port: 8000}
---
apiVersion: v1
kind: Service
metadata:
  name: clinic-api
  namespace: dental-clinic
spec:
  selector: {app: clinic-api}
  ports: [{name: http, port: 8000, targetPort: 8000}]
