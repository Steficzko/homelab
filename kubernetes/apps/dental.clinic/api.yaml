# Deployed via ArgoCD (bootstrap: dental-clinic.yaml). Source of truth: saas.dental deploy/
# clinic-api: the whole security perimeter (threat model §1.3).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinic-api
  namespace: dental-clinic
  labels: {app: clinic-api}
spec:
  replicas: 1   # in-memory rate limiting assumes 1 replica (marked graduation point)
  selector:
    matchLabels: {app: clinic-api}
  template:
    metadata:
      labels:
        app: clinic-api
        clinic-db-access: "true"   # NetworkPolicy selector for Postgres ingress (REQ-16)
    spec:
      imagePullSecrets: [{name: ghcr-pull}]
      containers:
        - name: api
          image: ghcr.io/steficzko/dental-api:v0.1.7   # registry placeholder
          ports: [{containerPort: 8000, name: http}]
          env:
            - {name: BASE_DOMAIN, value: "kostikidis.net"}  # rebrand = this one value
            - name: DATABASE_URL          # postgresql://clinic_app:...@clinic-postgres/clinic
              valueFrom: {secretKeyRef: {name: clinic-api-secret, key: DATABASE_URL}}
            - name: N8N_SHARED_SECRET     # REQ-12 (voice phase)
              valueFrom: {secretKeyRef: {name: clinic-api-secret, key: N8N_SHARED_SECRET}}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          readinessProbe:
            httpGet: {path: /api/healthz, port: 8000}
---
apiVersion: v1
kind: Service
metadata:
  name: clinic-api
  namespace: dental-clinic
spec:
  selector: {app: clinic-api}
  ports: [{name: http, port: 8000, targetPort: 8000}]
