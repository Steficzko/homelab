# Deployed via ArgoCD (bootstrap: dental-clinic.yaml). Source of truth: saas.dental deploy/
# Wildcard host: every <slug>.kostikidis.net hits the SPA; the API decides whether
# the tenant exists (unknown slug → static not-found, REQ-4). Adding a clinic = INSERT a
# tenant row — no change to this file, ever (decisions.md routing pattern).
# CATCH-ALL CAVEATS (domain flattened 2026-07-04, .blanka. level dropped):
#  - ingress-nginx gives exact-host ingresses (immich.kostikidis.net, ...) precedence over
#    this wildcard, so existing apps are unaffected; every OTHER subdomain lands here.
#  - CF Access policies on *.kostikidis.net MUST EXEMPT tenant hosts — the app has its own
#    login; CF Access in front would lock the doctors out (deploy checklist item).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dental-clinic
  namespace: dental-clinic
  annotations:
    # NO cert-manager.io/cluster-issuer HERE — deliberate. The blanka-wildcard
    # Certificate below already manages secret blanka-wildcard-tls. With this
    # annotation present, cert-manager's ingress-shim ALSO auto-creates a
    # Certificate named after the secret (blanka-wildcard-tls), so two objects
    # fight over one secret: the explicit one wins and the shim's copy sits
    # Ready=False forever ("Secret was issued for blanka-wildcard ... you might
    # have two conflicting Certificates pointing to the same secret").
    # The explicit Certificate is the one to keep — it also covers the apex,
    # which the shim's copy does not. Re-adding this annotation re-creates the clash.
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["*.kostikidis.net"]
      secretName: blanka-wildcard-tls
  rules:
    # PRODUCTION EXACT HOST (2026-08-05): blankadental holds the REAL clinic
    # data and rides the production deployments now. Exact host beats the
    # wildcard below, so every OTHER kostikidis.net subdomain still lands on
    # the staging pair (which owns the separate staging DB since the split).
    - host: "blankadental.kostikidis.net"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: clinic-spa, port: {number: 80}}
    # STAGING (2026-08-02): kostikidis.net hosts hit the -staging pair, which
    # carries the newer image tag. Production gompha.com stays on clinic-spa.
    - host: "*.kostikidis.net"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: clinic-spa-staging, port: {number: 80}}
    # gompha.com tenant wildcard (multi-domain, Option B). No TLS block here:
    # gompha.com is a SEPARATE CF account and TLS terminates at Cloudflare's edge
    # (the cloudflared-gompha tunnel reaches this ingress over HTTP). The gompha
    # landing (apex + www), auto.gompha.com, and the licensing pair
    # licensing-staging/licence-staging.gompha.com (saas-gompha-licensing-staging
    # ns; prod adds licensing/licence.gompha.com) are EXACT hosts → ingress-nginx
    # gives them precedence, so this wildcard only catches <slug>.gompha.com tenants —
    # EXCEPT /manual, carved out by apps/gompha/landing/manual-ingress.yaml
    # (longest-prefix wins; the staff manual sits behind the landing pod's cookie gate).
    - host: "*.gompha.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: clinic-spa, port: {number: 80}}
---
# Wildcard cert for the clinic NAMESPACE. Even if the cluster already holds a
# *.kostikidis.net cert elsewhere, cert secrets are namespaced — this namespace needs its
# own copy (or a reflector). Same DNS name, no new DNS record needed.
# NOTE: Let's Encrypt issues wildcards via DNS-01 ONLY — the ClusterIssuer needs a
# Cloudflare API-token solver (token in SOPS, REQ-18). HTTP-01 cannot issue this cert.
# Also needs the wildcard DNS record *.kostikidis.net (+ cf tunnel route if tunneled).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: blanka-wildcard
  namespace: dental-clinic
spec:
  secretName: blanka-wildcard-tls
  issuerRef: {name: letsencrypt-prod, kind: ClusterIssuer}
  dnsNames:
    - "*.kostikidis.net"
    - "kostikidis.net"
