# Deployed via ArgoCD (bootstrap: dental-clinic.yaml). Source of truth: saas.dental deploy/
# SOPS pattern (same as bjj): these PLACEHOLDER files are what's committed in plaintext;
# the real values live in sibling *.sops.yaml files encrypted with SOPS/age, and the
# ArgoCD Application excludes *.sops.yaml from plain sync (REQ-18 — zero plaintext
# secrets in git, verified by history scan).
#
# NOT here and never anywhere in repo/cluster: the license-signing PRIVATE key (REQ-18,
# licensing.md) and the backup-restore age PRIVATE key (REQ-17) — both live offline
# with Stefanos.
---
apiVersion: v1
kind: Secret
metadata:
  name: clinic-postgres-secret
  namespace: dental-clinic
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: PLACEHOLDER            # superuser — migrate/backup jobs ONLY, never the app
  DATABASE_URL_SUPERUSER: postgresql://postgres:PLACEHOLDER@clinic-postgres:5432/clinic
  CLINIC_APP_DB_PASSWORD: PLACEHOLDER       # set on role clinic_app by migrate.sh
---
apiVersion: v1
kind: Secret
metadata:
  name: clinic-api-secret
  namespace: dental-clinic
stringData:
  # App connects as clinic_app: NOSUPERUSER, NOBYPASSRLS (REQ-2).
  DATABASE_URL: postgresql://clinic_app:PLACEHOLDER@clinic-postgres:5432/clinic
  N8N_SHARED_SECRET: PLACEHOLDER            # REQ-12 (voice phase); >=32 random bytes
---
apiVersion: v1
kind: Secret
metadata:
  name: clinic-backup-s3-secret
  namespace: dental-clinic
stringData:
  S3_ENDPOINT: http://minio.PLACEHOLDER.svc:9000
  S3_ACCESS_KEY: PLACEHOLDER                # scoped: write-mostly, clinic-backups bucket ONLY (REQ-17)
  S3_SECRET_KEY: PLACEHOLDER
---
apiVersion: v1
kind: Secret
metadata:
  name: clinic-n8n-secret
  namespace: dental-clinic
stringData:
  CLINIC_INTERNAL_SECRET: PLACEHOLDER       # same value as clinic-api N8N_SHARED_SECRET (REQ-12)
