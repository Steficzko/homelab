# Exact host takes precedence over the dental-clinic *.kostikidis.net wildcard
# catch-all (ingress-nginx exact-host priority), so padle.kostikidis.net lands here.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: padle
  namespace: padle
  annotations:
    # NO cert-manager.io/cluster-issuer HERE — deliberate. The padle-wildcard
    # Certificate below already manages secret padle-wildcard-tls. With this
    # annotation present, cert-manager's ingress-shim ALSO auto-creates a
    # Certificate named after the secret (padle-wildcard-tls), so two objects
    # fight over one secret: the explicit one wins and the shim's copy sits
    # Ready=False forever ("Secret was issued for padle-wildcard ... you might
    # have two conflicting Certificates pointing to the same secret").
    # The explicit Certificate is the one to keep — it also covers the apex,
    # which the shim's copy does not. Re-adding this annotation re-creates the clash.
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["*.kostikidis.net"]
      secretName: padle-wildcard-tls
  rules:
    - host: padle.kostikidis.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: padle, port: {number: 8000}}
---
# Cert secrets are namespaced — padle needs its own copy of the wildcard
# (same DNS-01 ClusterIssuer as dental.clinic's blanka-wildcard).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: padle-wildcard
  namespace: padle
spec:
  secretName: padle-wildcard-tls
  issuerRef: {name: letsencrypt-prod, kind: ClusterIssuer}
  dnsNames:
    - "*.kostikidis.net"
    - "kostikidis.net"
