# WP's fake cron is disabled (DISABLE_WP_CRON) — WooCommerce scheduled actions
# and the analytics lookup tables need cron that actually fires.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: wp-cron
  namespace: namosocks
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      backoffLimit: 1
      activeDeadlineSeconds: 240
      template:
        metadata:
          labels:
            app: wp-cron
        spec:
          restartPolicy: Never
          containers:
            - name: curl
              image: curlimages/curl:8.22.0
              command:
                - /bin/sh
                - -c
                # the Host: colon must sit inside a quoted scalar or YAML parses this line as a map
                # via the INGRESS, not the wordpress svc: pod-to-pod got CNI-rejected after a pod
                # roll (2026-08-01) despite a correct netpol allow; the ingress path is what real
                # traffic uses and is always exercised. Host colon must stay inside quotes.
                # --retry absorbs transient unavailability instead of failing the Job:
                # the K3s netpol pod-admission lag (~30-45s) and node drains both take the
                # ingress out from under a short-lived Job. The 2026-09-01 rolling reboot
                # errored 4 of these across two namespaces; the next tick succeeded, so the
                # failure was pure noise. retry-max-time 100 + -m 110 worst-cases at 210s,
                # inside activeDeadlineSeconds 240. --retry-all-errors is needed because -f
                # turns a 502 during a pod roll into exit 22, which plain --retry ignores.
                - 'curl -fsS -m 110 --retry 4 --retry-delay 10 --retry-all-errors --retry-max-time 100 -H "Host: staging.namosocks.com" "http://ingress-nginx-controller.ingress-nginx.svc.cluster.local/wp-cron.php?doing_wp_cron" > /dev/null'
              resources:
                requests: { memory: 16Mi, cpu: 10m }
                limits: { memory: 64Mi, cpu: 100m }
