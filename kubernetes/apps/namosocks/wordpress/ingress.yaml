apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wordpress
  namespace: namosocks
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
spec:
  ingressClassName: nginx
  rules:
    # kostikidis.net build host removed 2026-08-01 ("as if it never existed") — the client's
    # domain via the client's tunnel is the only door. TLS ends at Cloudflare; at launch add
    # namosocks.com + www rules here.
    - host: staging.namosocks.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wordpress
                port:
                  number: 80
