apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wp-content-pvc
  namespace: namosocks
  labels:
    recurring-job.longhorn.io/daily-backup: "enabled"   # 2026-10-25: was only in app dumps
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
