# Nightly logical backup: mariadb-dump + wp-content tar -> MinIO (namosocks-backups).
# Bucket has 30-day ILM + hourly replication to Greece — no client-side pruning needed.
# Restore: mariadb -h mariadb -u wordpress -p wordpress < dump.sql ; untar into the PVC.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: namosocks-backup
  namespace: namosocks
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 10800
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: namosocks-backup
        spec:
          restartPolicy: Never
          affinity:                       # wp-content PVC is RWO longhorn — must share the node with wordpress
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app: wordpress
                  topologyKey: kubernetes.io/hostname
          initContainers:
            - name: copy-mc
              image: nixery.dev/shell/minio-client/curl/jq@sha256:96f52222657dd7bf2aca0f61568da7a6c7061dbdf78b480c89d7a9c867aed72f   # was quay.io/minio/mc — Quay gated anonymous pulls 2026-09-24
              securityContext:
                runAsUser: 0
              command: ["/bin/sh", "-c", "set -e; curl -fsSL --retry 3 --max-time 120 https://github.com/minio/mc/releases/download/RELEASE.2025-08-13T08-35-41Z/mc.linux-amd64.RELEASE.2025-08-13T08-35-41Z -o /tools/mc && echo 01f866e9c5f9b87c2b09116fa5d7c06695b106242d829a8bb32990c00312e891\ \ /tools/mc | sha256sum -c - && chmod 0755 /tools/mc"]
              volumeMounts:
                - { name: tools, mountPath: /tools }
          containers:
            - name: dump
              image: mariadb:11.8
              envFrom:
                - secretRef: { name: backup-s3-secret }   # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_ENDPOINTS
              env:
                - { name: HOME,   value: /work }
                - { name: BUCKET, value: namosocks-backups }
                - name: MARIADB_PASSWORD
                  valueFrom:
                    secretKeyRef: { name: namosocks-secret, key: MARIADB_PASSWORD }
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  TS=$(date +%Y%m%d-%H%M%S)
                  # K3s netpol admits fresh job pods ~30-45s late -> first connects get
                  # refused/time out (produced a silent 20B empty dump on blanca-web).
                  # Wait for a real connection before dumping.
                  echo "==> Waiting for DB ..."
                  for i in $(seq 1 30); do
                    mariadb -h mariadb -u wordpress -p"$MARIADB_PASSWORD" -e 'SELECT 1' >/dev/null 2>&1 && break
                    [ "$i" = 30 ] && { echo "DB unreachable after 150s"; exit 1; }
                    sleep 5
                  done
                  echo "==> Dumping wordpress DB ..."
                  # dump to file, not a pipeline — a piped dump exits with gzip's status
                  # and masks connection failures
                  mariadb-dump -h mariadb -u wordpress -p"$MARIADB_PASSWORD" \
                    --single-transaction --quick wordpress > "/work/db-${TS}.sql"
                  [ -s "/work/db-${TS}.sql" ] || { echo "empty dump"; exit 1; }
                  gzip -6 "/work/db-${TS}.sql"
                  echo "==> Archiving wp-content ..."
                  # live site -> tar exit 1 ("file changed as we read it") is expected; >=2 is real
                  tar -C /wp-content -czf "/work/wp-content-${TS}.tar.gz" . || [ $? -eq 1 ]
                  echo "==> Uploading ..."
                  /tools/mc alias set s3 "$AWS_ENDPOINTS" "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY"
                  /tools/mc cp "/work/db-${TS}.sql.gz" "s3/${BUCKET}/db/db-${TS}.sql.gz"
                  /tools/mc cp "/work/wp-content-${TS}.tar.gz" "s3/${BUCKET}/wp-content/wp-content-${TS}.tar.gz"
                  echo "==> Done (ILM prunes >30d server-side)"
              volumeMounts:
                - { name: tools, mountPath: /tools }
                - { name: work, mountPath: /work }
                - { name: wp-content, mountPath: /wp-content, readOnly: true }
          volumes:
            - { name: tools, emptyDir: {} }
            - { name: work, emptyDir: {} }
            - name: wp-content
              persistentVolumeClaim:
                claimName: wp-content-pvc
