apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  namespace: blanca-dental-care
spec:
  serviceName: mariadb
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      containers:
        - name: mariadb
          image: mariadb:11.8@sha256:c4124d1afa875e47f2892edf26b482fa54f796e2f342d3717a04ca091a22a9bd
          env:
            - name: MARIADB_DATABASE
              value: wordpress
            - name: MARIADB_USER
              value: wordpress
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: blanca-web-secret, key: MARIADB_ROOT_PASSWORD }
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef: { name: blanca-web-secret, key: MARIADB_PASSWORD }
          ports:
            - containerPort: 3306
          resources:
            requests:
              memory: 256Mi
              cpu: 50m
            limits:
              memory: 512Mi
              cpu: 500m
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  # daily Longhorn backup: the live PVC carries recurring-job.longhorn.io/daily-backup=enabled + source=enabled,
  # set with kubectl label (2026-10-25). volumeClaimTemplates are immutable on an existing
  # StatefulSet, so the label cannot live here without recreating it.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn
        resources:
          requests:
            storage: 5Gi
