apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wordpress
  namespace: blanca-dental-care
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - blancadentacare.kostikidis.net
      secretName: blancadentacare-kostikidis-net-tls
  rules:
    # Build host on the kostikidis wildcard tunnel. The client's own Cloudflare
    # domain gets its own rule (+ WORDPRESS_CONFIG_EXTRA whitelist entry) later.
    - host: blancadentacare.kostikidis.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wordpress
                port:
                  number: 80
    # Client domain via the BlancaDentalClinic tunnel (0552c71b) — TLS terminates
    # at Cloudflare, plain http origin hop, so no cert-manager TLS for these hosts.
    - host: blancadentalcare.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wordpress
                port:
                  number: 80
    - host: www.blancadentalcare.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wordpress
                port:
                  number: 80
