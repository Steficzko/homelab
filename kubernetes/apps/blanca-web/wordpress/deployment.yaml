apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  namespace: blanca-dental-care
spec:
  replicas: 1
  strategy:
    type: Recreate          # RWO wp-content PVC — no rolling overlap possible
  selector:
    matchLabels:
      app: wordpress
  template:
    metadata:
      labels:
        app: wordpress
    spec:
      affinity:                              # ADR-030 pattern: prefer workers, soft fallback
        nodeAffinity:                        # 2026-10-02: g2 (etcd) at 74% mem, w1 at 50%
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      securityContext:
        fsGroup: 33          # www-data — so the longhorn PVC is writable for uploads/plugins
      containers:
        - name: wordpress
          image: wordpress:php8.3-apache
          env:
            - name: WORDPRESS_DB_HOST
              value: mariadb
            - name: WORDPRESS_DB_NAME
              value: wordpress
            - name: WORDPRESS_DB_USER
              value: wordpress
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: blanca-web-secret, key: MARIADB_PASSWORD }
            - name: WORDPRESS_CONFIG_EXTRA
              value: |
                define('DISABLE_WP_CRON', true); /* real cron via wp-cron CronJob */
                ini_set('memory_limit', '512M'); define('WP_MEMORY_LIMIT', '512M');
                /* TLS terminates at Cloudflare/ingress; without this WP redirect-loops */
                $_SERVER['HTTPS'] = 'on';
                /* Multi-host whitelist — the client's own Cloudflare domain gets added
                   here (plus in the ingress) when it exists. Without a dynamic siteurl
                   WP canonical-redirects every request back to one host.
                   The FALLBACK is what wp-cli and any request with no Host header
                   resolve to, so it must be the client's domain: sitemaps, Yoast
                   indexables and every scripted deploy are written from the CLI. */
                $blanca_hosts = ['blancadentalcare.com', 'www.blancadentalcare.com', 'blancadentacare.kostikidis.net'];
                $blanca_h = isset($_SERVER['HTTP_HOST']) ? strtolower($_SERVER['HTTP_HOST']) : '';
                if (!in_array($blanca_h, $blanca_hosts, true)) { $blanca_h = 'blancadentalcare.com'; }
                define('WP_HOME', 'https://' . $blanca_h); define('WP_SITEURL', 'https://' . $blanca_h);
          envFrom:
            - secretRef:
                name: blanca-web-secret   # WORDPRESS_AUTH_KEY … salts
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: 512Mi
              cpu: 500m            # client site: a real CPU share when the node is busy
            limits:
              memory: 2Gi          # 768Mi OOMKilled repeatedly during site build (2026-08-06)
              # No CPU limit: at 1 core, bursty PHP workers were CFS-throttled 85% while
              # averaging 0.5 core, so 5 concurrent visitors stalled pages to ~12 s (2026-10-16).
          readinessProbe:
            httpGet:
              path: /wp-login.php
              port: 80
              httpHeaders:
                - name: Host
                  value: blancadentalcare.com
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5      # 1 s default dropped the only replica under load = full 503
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 5
          volumeMounts:
            - name: wp-content
              mountPath: /var/www/html/wp-content
      volumes:
        - name: wp-content
          persistentVolumeClaim:
            claimName: wp-content-pvc
