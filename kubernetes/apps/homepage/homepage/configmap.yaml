    - More Apps:
      - Mealie:
          icon: sh-mealie
          href: https://mealie.kostikidis.net
          description: Recipes & meal planning
      - FreshRSS:
          icon: sh-freshrss
          href: https://rss.kostikidis.net
          description: RSS reader
      - Obsidian LiveSync:
          icon: sh-obsidian
          href: https://obsidian.kostikidis.net
