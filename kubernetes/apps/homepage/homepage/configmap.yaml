    - AI & Monitoring:
      - Open WebUI:
          icon: sh-open-webui
          href: https://chat.kostikidis.net
          description: LLM interface
      - Uptime Kuma:
          icon: sh-uptime-kuma
          href: http://100.82.66.30:3001
          description: Service monitoring
      - Portainer:
          icon: sh-portainer
          href: http://100.82.66.30:9000
          description: Container management

    - External:
      - Blog:
          icon: sh-hugo
          href: https://kostikidis.net
          description: Personal blog
      - Studio Concrete Luka:
          icon: si-wordpress
          href: https://studioconcreteluka.com
          description: Photography studio
      - Blanca Dental Care:
          icon: si-wordpress
          href: https://blancadentalcare.com
          description: Dr. Ali clinic website
          siteMonitor: https://blancadentalcare.com

  bookmarks.yaml: |
    []

  docker.yaml: |
    {}

  kubernetes.yaml: |
    {}
