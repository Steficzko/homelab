apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  settings.yaml: |
    title: Kostikidis
    theme: dark
    color: stone
    headerStyle: boxed
    cardBlur: md
    statusStyle: dot
    layout:
      Cluster:
        style: row
        columns: 3
      Infrastructure:
        style: row
        columns: 4
      Home:
        style: row
        columns: 3
      Family Photos:
        style: row
        columns: 4
      Media:
        style: row
        columns: 4
      Apps:
        style: row
        columns: 4
      More Apps:
        style: row
        columns: 3
      AI & Monitoring:
        style: row
        columns: 3
      External:
        style: row
        columns: 2

  widgets.yaml: |
    # Cluster totals + one bar per node. Needs kubernetes.yaml mode:cluster, the homepage
    # ServiceAccount cluster-read (rbac.yaml) and metrics-server (present). This is the native
    # node view that was missing while kubernetes.yaml was empty.
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - glances:
        url: http://192.168.1.100:61208
        version: 4
        cpu: true
        mem: true
        uptime: true
        label: Unraid
    - datetime:
        text_size: xl
        format:
          timeStyle: short
          dateStyle: short
    - search:
        provider: custom
        url: https://search.kostikidis.net/search?q=
        target: _blank

  services.yaml: |
    - Cluster:
      - k3s-prg-b3:
          icon: sh-kubernetes
          description: 100.119.146.29 — control plane
          widget:
            type: customapi
            url: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/query?query=round%28100-avg%28rate%28node_cpu_seconds_total%7Bmode%3D%22idle%22%2Cinstance%3D%22k3s-prg-b3%22%7D%5B5m%5D%29%29%2A100%2C1%29%20or%20round%28%281-node_memory_MemAvailable_bytes%7Binstance%3D%22k3s-prg-b3%22%7D/node_memory_MemTotal_bytes%7Binstance%3D%22k3s-prg-b3%22%7D%29%2A100%2C1%29"
            mappings:
              - field: data.result.0.value.1
                label: CPU
                format: text
                suffix: "%"
              - field: data.result.1.value.1
                label: RAM
                format: text
                suffix: "%"
      - k3s-prg-g2:
          icon: sh-kubernetes
          description: 100.99.236.88 — control plane
          widget:
            type: customapi
            url: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/query?query=round%28100-avg%28rate%28node_cpu_seconds_total%7Bmode%3D%22idle%22%2Cinstance%3D%22k3s-prg-g2%22%7D%5B5m%5D%29%29%2A100%2C1%29%20or%20round%28%281-node_memory_MemAvailable_bytes%7Binstance%3D%22k3s-prg-g2%22%7D/node_memory_MemTotal_bytes%7Binstance%3D%22k3s-prg-g2%22%7D%29%2A100%2C1%29"
            mappings:
              - field: data.result.0.value.1
                label: CPU
                format: text
                suffix: "%"
              - field: data.result.1.value.1
                label: RAM
                format: text
                suffix: "%"
      - k3s-prg-r1:
          icon: sh-kubernetes
          description: 100.120.7.31 — control plane
          widget:
            type: customapi
            url: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/query?query=round%28100-avg%28rate%28node_cpu_seconds_total%7Bmode%3D%22idle%22%2Cinstance%3D%22k3s-prg-r1%22%7D%5B5m%5D%29%29%2A100%2C1%29%20or%20round%28%281-node_memory_MemAvailable_bytes%7Binstance%3D%22k3s-prg-r1%22%7D/node_memory_MemTotal_bytes%7Binstance%3D%22k3s-prg-r1%22%7D%29%2A100%2C1%29"
            mappings:
              - field: data.result.0.value.1
                label: CPU
                format: text
                suffix: "%"
              - field: data.result.1.value.1
                label: RAM
                format: text
                suffix: "%"
      - k3s-prg-w1:
          icon: sh-kubernetes
          description: 100.106.239.5 — worker
          widget:
            type: customapi
            url: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/query?query=round%28100-avg%28rate%28node_cpu_seconds_total%7Bmode%3D%22idle%22%2Cinstance%3D%22k3s-prg-w1%22%7D%5B5m%5D%29%29%2A100%2C1%29%20or%20round%28%281-node_memory_MemAvailable_bytes%7Binstance%3D%22k3s-prg-w1%22%7D/node_memory_MemTotal_bytes%7Binstance%3D%22k3s-prg-w1%22%7D%29%2A100%2C1%29"
            mappings:
              - field: data.result.0.value.1
                label: CPU
                format: text
                suffix: "%"
              - field: data.result.1.value.1
                label: RAM
                format: text
                suffix: "%"
      - k3s-prg-w2:
          icon: sh-kubernetes
          description: 100.114.159.23 — worker
          widget:
            type: customapi
            url: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/query?query=round%28100-avg%28rate%28node_cpu_seconds_total%7Bmode%3D%22idle%22%2Cinstance%3D%22k3s-prg-w2%22%7D%5B5m%5D%29%29%2A100%2C1%29%20or%20round%28%281-node_memory_MemAvailable_bytes%7Binstance%3D%22k3s-prg-w2%22%7D/node_memory_MemTotal_bytes%7Binstance%3D%22k3s-prg-w2%22%7D%29%2A100%2C1%29"
            mappings:
              - field: data.result.0.value.1
                label: CPU
                format: text
                suffix: "%"
              - field: data.result.1.value.1
                label: RAM
                format: text
                suffix: "%"

    - Infrastructure:
      - ArgoCD:
          icon: sh-argocd
          href: https://argocd.kostikidis.net
          description: GitOps
      - Grafana:
          icon: sh-grafana
          href: https://grafana.kostikidis.net
          description: Metrics & alerts
      - Plane:
          icon: sh-plane
          href: https://plane.kostikidis.net
          description: Issue tracker · homelab backlog
      - Proxmox:
          icon: sh-proxmox
          href: https://100.70.109.10:8006
          description: Hypervisor · LXC + VM
      # Longhorn's own API (9500) is unauthenticated and can delete volumes, so its netpol
      # admits only Longhorn pods (bootstrap/longhorn/kustomization.yaml). Read it from
      # Prometheus instead.
      - Longhorn:
          icon: sh-longhorn
          href: https://grafana.kostikidis.net
          description: Distributed block storage
          widget:
            type: prometheusmetric
            url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
            refreshInterval: 60000
            metrics:
              - label: Used
                query: sum(longhorn_node_storage_usage_bytes) / sum(longhorn_node_storage_capacity_bytes) * 100
                format:
                  type: percent
                  options:
                    maximumFractionDigits: 0
              - label: Volumes
                query: count(longhorn_volume_robustness)
              - label: Degraded
                query: count(longhorn_volume_robustness == 2) or vector(0)
      - Headlamp:
          icon: sh-headlamp
          href: https://k8s.kostikidis.net
          description: Kubernetes UI
      - xyOps Prague:
          icon: mdi-calendar-clock
          href: http://100.82.66.30:5522
          description: Job scheduler · 11 servers
      - xyOps Greece:
          icon: mdi-calendar-clock
          href: http://100.85.129.88:5522
          description: Ops · DR + martunia
      # Speedtest Tracker, hourly (0 * * * *) on each Unraid.
      # These use widgets, so Homepage fetches them server-side — the netpol needs
      # 100.64.0.0/10:8765 for Greece (Prague is covered by the 192.168.1.0/24 rule).
      - Repy:
          icon: speedtest-tracker
          href: http://192.168.1.100:8765
          description: Prague · line speed, hourly
          widget:
            type: speedtest
            url: http://192.168.1.100:8765
      - Ptolemaida:
          icon: speedtest-tracker
          href: http://100.85.129.88:8765
          description: Greece · line speed, hourly
          widget:
            type: speedtest
            url: http://100.85.129.88:8765
      # Unraid array/pool health via the built-in unraid-api GraphQL (VIEWER key, read-only).
      # Keys come from the homepage-secrets Secret as HOMEPAGE_VAR_*. Prague answers on https,
      # Greece's https serves 404 on /graphql so it uses http (tailnet-encrypted anyway).
      - Unraid Prague:
          icon: sh-unraid
          href: https://192.168.1.100
          description: repy · array + disks
          widget:
            type: unraid
            url: https://192.168.1.100
            key: "{{HOMEPAGE_VAR_UNRAID_PRAGUE_KEY}}"
            # 4-field cap: show array fullness (the disk-filling alert) + free space + load.
            fields: ["arrayUsedPercent","arrayFree","cpu","memoryPercent"]
      - Unraid Greece:
          icon: sh-unraid
          href: http://100.85.129.88
          description: ptolemaida · array + disks
          widget:
            type: unraid
            url: http://100.85.129.88
            key: "{{HOMEPAGE_VAR_UNRAID_GREECE_KEY}}"
            fields: ["arrayUsedPercent","arrayFree","cpu","memoryPercent"]
      - Syncthing:
          icon: sh-syncthing
          href: http://100.82.66.30:8384
          description: devdata → laptop + Greece DR
          widget:
            type: syncthing
            url: http://192.168.1.100:8384
            key: "{{HOMEPAGE_VAR_SYNCTHING_KEY}}"
      - MinIO:
          icon: sh-minio
          href: http://100.82.66.30:9101
          description: S3 · backups + registry cache
          siteMonitor: http://192.168.1.100:9100/minio/health/live
      - Uptime Kuma:
          icon: sh-uptime-kuma
          href: http://100.82.66.30:3001
          description: Service monitoring
      - Portainer:
          icon: sh-portainer
          href: http://100.82.66.30:9000
          description: Container management

    - Home:
      # HA is reached over the tailnet; it is being rebuilt as an HA OS VM (HA-21).
      - Home Assistant:
          icon: sh-home-assistant
          href: http://100.82.66.30:8123
          description: Lights, sensors, presence
          siteMonitor: http://192.168.1.100:8123
      - Grocy:
          icon: sh-grocy
          href: https://grocy.kostikidis.net
          description: Household management
      - Mealie:
          icon: sh-mealie
          href: https://mealie.kostikidis.net
          description: Recipes & meal planning

    # Immich widgets: in-cluster service, admin API key with only server.statistics.
    # The immich netpols admit the homepage pod on 2283.
    - Family Photos:
      - Immich Stefanos:
          icon: sh-immich
          href: https://stefanosmobiles.kostikidis.net
          description: Stefanos
          widget:
            type: immich
            url: http://immich-stefanos.immich.svc.cluster.local:2283
            key: "{{HOMEPAGE_VAR_IMMICH_STEFANOS_KEY}}"
            version: 2
      - Immich Marianna:
          icon: sh-immich
          href: https://mariannamobiles.kostikidis.net
          description: Marianna
          widget:
            type: immich
            url: http://immich-marianna.immich.svc.cluster.local:2283
            key: "{{HOMEPAGE_VAR_IMMICH_MARIANNA_KEY}}"
            version: 2
      - Immich Lightroom:
          icon: sh-immich
          href: https://lightroom.kostikidis.net
          description: Lightroom catalog
          widget:
            type: immich
            url: http://immich-lightroom.immich.svc.cluster.local:2283
            key: "{{HOMEPAGE_VAR_IMMICH_LIGHTROOM_KEY}}"
            version: 2
      - Immich Elwany:
          icon: sh-immich
          href: https://gallery.teamelwany.com
          description: Team Elwany
          widget:
            type: immich
            url: http://immich-elwany.immich.svc.cluster.local:2283
