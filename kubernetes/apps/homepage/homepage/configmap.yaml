          widget:
            type: bazarr
            url: http://192.168.1.100:6767
            key: "{{HOMEPAGE_VAR_BAZARR_KEY}}"
      - qBittorrent:
          icon: sh-qbittorrent
          href: http://100.82.66.30:8080
          description: Downloads
          widget:
            type: qbittorrent
            url: http://192.168.1.100:8080
            username: admin
            password: "{{HOMEPAGE_VAR_QBIT_PASSWORD}}"

