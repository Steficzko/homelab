    # Media stack on Prague Unraid (Portainer stack media-center). Hrefs over the tailnet,
    # widgets server-side over the LAN (covered by the 192.168.1.0/24 egress rule).
    - Media:
      - Jellyfin:
          icon: sh-jellyfin
          href: http://100.82.66.30:8096
          description: Movies & shows
          widget:
            type: jellyfin
            url: http://192.168.1.100:8096
            key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
            version: 2
            enableBlocks: true
            enableNowPlaying: true
      - Jellyseerr:
          icon: sh-jellyseerr
          href: http://100.82.66.30:5055
          description: Requests
          widget:
            type: seerr
            url: http://192.168.1.100:5055
            key: "{{HOMEPAGE_VAR_SEERR_KEY}}"
      - Sonarr:
          icon: sh-sonarr
          href: http://100.82.66.30:8989
          description: TV
          widget:
            type: sonarr
            url: http://192.168.1.100:8989
            key: "{{HOMEPAGE_VAR_SONARR_KEY}}"
      - Radarr:
          icon: sh-radarr
          href: http://100.82.66.30:7878
          description: Movies
          widget:
            type: radarr
            url: http://192.168.1.100:7878
            key: "{{HOMEPAGE_VAR_RADARR_KEY}}"
      - Prowlarr:
