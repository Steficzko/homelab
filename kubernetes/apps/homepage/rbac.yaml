# Homepage's Kubernetes integration needs to read nodes, pods and the metrics API to draw
# per-node CPU/memory/pod bars. Read-only, cluster-scoped (nodes and metrics are not
# namespaced). Without this the native cluster widget renders empty — which is why node
# stats were missing while metrics-server itself was healthy.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homepage
  namespace: homepage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homepage-read
rules:
  - apiGroups: [""]
    resources: [nodes, pods, namespaces]
    verbs: [get, list]
  - apiGroups: ["metrics.k8s.io"]
    resources: [nodes, pods]
    verbs: [get, list]
  - apiGroups: ["networking.k8s.io"]
    resources: [ingresses]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homepage-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homepage-read
subjects:
  - kind: ServiceAccount
    name: homepage
    namespace: homepage
