# The real secret is kubernetes/apps/brain/secret.sops.yaml, applied out-of-band
# (`sops -d ... | kubectl apply -f -`). ArgoCD manages only this placeholder.
apiVersion: v1
kind: Secret
metadata:
  name: brain-secret
  namespace: brain
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-options: Prune=false
type: Opaque
