# Local git history for the vault — ADR-038 amendment 2026-09-11 (BRAIN-46).
#
# The Markdown folder is the only durable artefact in the brain, and pass two moves every file and
# rewrites its path from tags while the staged-correction path has an LLM rewriting note content.
# The master is Syncthing `sendonly`, so a bad filing pass reaches every read-only mirror within
# seconds. This gives that an undo and a readable diff, and makes "nothing is deleted silently"
# verifiable instead of a slogan.
#
# NO REMOTE, EVER. "The vault never reaches git" means no remote: nothing is pushed, fetched or
# hosted, and this history is local state on the same volume as the notes. The job REFUSES TO RUN
# if it ever finds a remote configured, so the invariant is enforced here and not only in prose.
#
# Why a CronJob and not capture.py: the capture container is Alpine with readOnlyRootFilesystem,
# runAsNonRoot and no git, and cannot acquire one at runtime. Building a custom image would break
# the rule that keeps this project honest — upstream images only, capture delivered as a ConfigMap
# so there is no image to build. A script that must run is a Job (DECISIONS.md 2026-09-11).
#
# ponytail: commits are time-based, so one commit may bundle several captures and cannot name a
# capture id. Upgrade path if tracing a single capture ever matters: git inside the capture image
# and commit per pass. The cheap version already gives the undo and the diff, which is the point.
#
# Pinned to k3s-prg-w1 because the vault PVC is ReadWriteOnce and the brain pod holds it there.
# Needs no network at all; the ns `brain` NetworkPolicy selects app=brain and does not cover this.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-git
  namespace: brain
spec:
  schedule: "*/15 * * * *"        # no timeZone set on purpose: a */15 schedule is timezone-agnostic
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app: vault-git
        spec:
          restartPolicy: Never
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - { key: kubernetes.io/hostname, operator: In, values: [k3s-prg-w1] }
          securityContext:
            runAsUser: 99          # same as everything else that touches this volume
            runAsGroup: 100
            runAsNonRoot: true
          containers:
            - name: git
              image: alpine/git:latest@sha256:6f3b5029566da8e90b24945933dcd806be866b64b1e706f51828bf84faccf21b
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
              env:
                - { name: HOME, value: /tmp }    # git needs a writable HOME; root fs is read-only
                - { name: TZ,   value: Europe/Prague }
                # /data/vault is owned by root:users mode 2775 — that is how Longhorn creates a
                # volume root. The job writes through the group (gid 100), but git compares the
                # repository directory's OWNER to the running uid, sees root against 99, and
                # refuses with "detected dubious ownership". That check exists to stop you running
                # hooks out of someone else's repo; here the directory is a mount root owned by
                # root by construction and the content is ours, so the exception is correct rather
                # than a workaround. Declared as env so it applies to every git call and stays
                # visible in the manifest instead of being buried in the script.
                # The committer is the pipeline, not Stefanos — a synthetic, non-routable identity
                # so the history never implies he typed something he did not.
                - { name: GIT_CONFIG_COUNT,   value: "3" }
                - { name: GIT_CONFIG_KEY_0,   value: safe.directory }
                - { name: GIT_CONFIG_VALUE_0, value: /data/vault }
                - { name: GIT_CONFIG_KEY_1,   value: user.name }
                - { name: GIT_CONFIG_VALUE_1, value: brain vault-git }
                - { name: GIT_CONFIG_KEY_2,   value: user.email }
                - { name: GIT_CONFIG_VALUE_2, value: brain@cluster.local }
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  cd /data/vault

                  # Guard: never run git anywhere but the vault. `git add -A` in the wrong place
                  # ingests whatever it finds, and a bad mount or an empty path variable is all it
                  # takes to point it somewhere else. Checked in 2026-09-11 after exactly that
                  # happened on a workstation while testing this script.
                  [ "$PWD" = "/data/vault" ] || { echo "FATAL: cwd is $PWD, not the vault"; exit 1; }
                  if [ ! -d .stfolder ] || [ ! -d inbox ]; then
                    echo "FATAL: $PWD has no .stfolder and inbox, so it is not the vault. Refusing."
                    exit 1
                  fi

                  if [ ! -d .git ]; then
                    echo "initialising the vault history"
                    git init -q
                  fi

                  # Rewritten EVERY run, not only at init. Learned 2026-09-11: writing this once
                  # inside the init branch meant a repo created by an earlier version kept the old
                  # exclusions, so a later fix silently did nothing and 64k lines of plugin
                  # JavaScript went into the first commit.
                  # Local excludes, not a .gitignore: a .gitignore would be a new file IN the vault
                  # and would sync to every device. info/exclude stays inside .git.
                  #   lost+found  root-owned mode 0770 on the ext4 volume; uid 99 cannot read it
                  #   .stfolder   Syncthing's marker
                  #   plugins/    Obsidian plugin CODE — reinstallable, would dominate every diff,
                  #               and local-llm-helper/data.json holds device-local settings that
                  #               are already in .stignore. The small .obsidian/*.json config IS
                  #               kept, so a restore still yields a working Obsidian.
                  #   workspace*  Obsidian per-device UI state
                  printf '%s\n' 'lost+found/' '.stfolder/' '.obsidian/workspace*.json' \
                                '.obsidian/cache/' '.obsidian/plugins/' '.trash/' \
                                > .git/info/exclude

                  # Anything excluded after it was already tracked stays tracked until told
                  # otherwise. Untrack it, keeping the file on disk.
                  git rm -r --cached --quiet --ignore-unmatch .obsidian/plugins >/dev/null 2>&1 || true

                  # The invariant, enforced rather than documented.
                  if [ -n "$(git remote)" ]; then
                    echo "FATAL: a remote is configured on the vault repository. The vault must never"
                    echo "reach a remote (ADR-038). Refusing to run; remove the remote deliberately."
                    git remote -v
                    exit 1
                  fi

                  git add -A
                  if git diff --cached --quiet; then
                    echo "no change since the last commit"
                  else
                    git diff --cached --stat
                    git commit -q -m "vault $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
                    echo "committed $(git rev-parse --short HEAD)"
                  fi
              volumeMounts:
                - { name: vault, mountPath: /data/vault }
                - { name: tmp,   mountPath: /tmp }
              resources:
                requests: { memory: 32Mi, cpu: 10m }
                limits:   { memory: 256Mi, cpu: "500m" }
          volumes:
            - name: vault
              persistentVolumeClaim: { claimName: vault }
            - name: tmp
              emptyDir: { sizeLimit: 64Mi }
