# ~/brain-dev/*.py are symlinks to those). Edit there, run the tests, regenerate with the
# command in the phase A plan (Task 4 step 1). ADR-038.
apiVersion: v1
kind: ConfigMap
metadata:
  name: brain-capture-code
  namespace: brain
data:
  capture.py: |
    #!/usr/bin/env python3
    """brain-capture (ADR-038, phase A pass one).

    A file in the drop zone, a Telegram voice note, a link or a text message becomes one Markdown
    note in the vault within the minute. Raw text stays on the array; web pages become Paperless
    documents. Stdlib only: the image is python + ffmpeg + yt-dlp and nothing else.

    Rules this file enforces (ADR-038):
      - pipelines write only under VAULT/inbox/ and under DATA/; the drop folder is never moved
        or deleted from (it is the phone's send-only Syncthing folder);
      - Telegram is inbound only: the bot accepts one chat id and answers with a number, never a title;
      - a backend outage (Whisper/LiteLLM unreachable) is not a bad file: the cycle stops and retries;
      - every transcript passes the hallucination filter; `verified: false` marks a doubtful one.
    Pass two (title, kind, tags, parties on the containment alias) is phase B and does not exist here.
    """
    import glob, html, json, os, re, shutil, subprocess, tempfile, threading, time
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    import unicodedata, urllib.error, urllib.parse, urllib.request, uuid
    from datetime import datetime
    from pathlib import Path

    VAULT = Path(os.environ.get("VAULT", "/data/vault"))
    DATA = Path(os.environ.get("DATA", "/data/data"))
    PAPERLESS = Path(os.environ.get("PAPERLESS_CONSUME", "/data/paperless-consume"))
    LITELLM = os.environ.get("LITELLM_URL", "http://litellm.ai.svc.cluster.local:4000/v1")
    KEY = os.environ["LITELLM_KEY"]
    TOKEN = os.environ["TELEGRAM_TOKEN"]
    ALLOWED_CHATS = {int(x) for x in os.environ.get("TELEGRAM_CHAT_IDS", "").split(",") if x.strip()}
    KUMA = os.environ.get("KUMA_PUSH_URL", "")
    GOTENBERG = os.environ.get("GOTENBERG_URL", "http://gotenberg.n8n.svc.cluster.local:3000")
    POLL = int(os.environ.get("POLL_SECONDS", "60"))
    API = f"https://api.telegram.org/bot{TOKEN}"
    FILEAPI = f"https://api.telegram.org/file/bot{TOKEN}"
    EXT = {".mp4", ".mov", ".mkv", ".webm", ".avi", ".m4a", ".mp3", ".wav", ".aac", ".opus", ".ogg", ".oga", ".flac"}
    AUDIO_ONLY = {".m4a", ".mp3", ".wav", ".aac", ".opus", ".ogg", ".oga", ".flac"}
    CHUNK = 600  # ponytail: whisper container OOMs on long files at 6 GiB; 10-min chunks, as ingest.py
    VIDEO_HOSTS = ("youtube.com", "youtu.be", "instagram.com", "tiktok.com", "vimeo.com", "facebook.com/reel")
    # Whisper large-v3 invents these on silence, confidently, in all four languages
    # (research: ~/adr-drafts/research/whisper-hallucination-detection.md).
    BLOCKLIST = {"thank you.", "thank you for watching.", "thanks for watching.", "dziękuję.", "dziękuję za uwagę.",
                 "υπότιτλοι authorwave", "www.hradeckralove.org", "titulky vytvořil johnyx.", "subtitles by the amara.org community"}
    WORD_P, WORD_DUR, NO_SPEECH, COMPRESSION = 0.15, 0.133, 0.6, 2.4
    STATE = {"captures": 0, "last_capture": 0.0, "last_cycle": 0.0, "errors": 0, "backend_down": 0, "ignored": 0}
    LOCK = threading.Lock()
    # Drops the watcher will never pick up, already named in the log. ponytail: an in-memory set, not a
    # state file — a pod restart re-logs them, which is the right trade: the log is what gets read.
    IGNORED = set()
    # chat id -> (note path, epoch). After a link is captured, the NEXT plain text message becomes that
    # note's "Why". One-shot and consumed on use. Stefanos does not reply to prompts, he types the
    # thought as a new message — measured 2026-09-11, twice, when his note about scaling Gompha became
    # an orphan instead of context on the reel that prompted it.
    PENDING = {}
    CONTEXT_WINDOW = int(os.environ.get("CONTEXT_WINDOW_SECONDS", "300"))
    # Imported video: a short clip is the library, a long one is a bookmark. Measured on DURATION, never
    # on file size — a 3-minute phone clip can outweigh a 40-minute talk. Decided 2026-09-11.
    MEDIA_KEEP_SECONDS = int(os.environ.get("MEDIA_KEEP_SECONDS", "300"))


    class BackendDown(Exception):
        """Whisper/LiteLLM/Gotenberg unreachable or 5xx: not the file's fault."""


    def log(m):
        print(f"[{time.strftime('%H:%M:%S')}] {m}", flush=True)


    # ---------- notes ----------
    def slugify(s):
        s = unicodedata.normalize("NFKD", s or "").encode("ascii", "ignore").decode()
        s = re.sub(r"[^\w\s-]", "", s.lower()).strip()
        s = re.sub(r"[\s_-]+", "-", s).strip("-")[:60].strip("-")
        return s or "note"


    def first_line_title(text):
        for line in (text or "").splitlines():
            line = line.strip()
            if line:
                return line[:70]
        return "note"


    # The one wall. Anything that is not Stefanos's own words lives behind it, so an index can exclude
    # it with a single path rule — `origin` is frontmatter, and frontmatter is invisible to retrieval.
    OUTSIDE = {"imported": "outside/imported", "conversation": "outside/parties"}


    def note_path(created, slug, folder="inbox"):
        return VAULT / folder / f"{created.strftime('%Y-%m-%d-%H%M')}-{slug}.md"


    def _fm(v):
        if isinstance(v, bool):
            return "true" if v else "false"
        if isinstance(v, list):
            return "[" + ", ".join(str(x) for x in v) + "]"
        return str(v)


    def write_note(kind, title, body, extra):
        now = datetime.now().astimezone()
        origin = extra.pop("origin", None) or ("imported" if kind.endswith("-link") else "self")
        folder = OUTSIDE.get(origin, "inbox")   # his own words stay in the inbox; the rest go behind the wall
        p = note_path(now, slugify(title), folder)
        n = 1
        while p.exists():  # never overwrite: same minute + same slug gets a suffix
            n += 1
            p = note_path(now, f"{slugify(title)}-{n}", folder)
        fm = {"created": now.isoformat(timespec="seconds"), "source": kind, "origin": origin, **extra}
        fm.setdefault("tags", [])
        fm.setdefault("enriched", False)
        lines = ["---"] + [f"{k}: {_fm(v)}" for k, v in fm.items()] + ["---", "", f"# {title}", "", (body or "").rstrip(), ""]
        p.parent.mkdir(parents=True, exist_ok=True)
        p.write_text("\n".join(lines), encoding="utf-8")
        with LOCK:
            STATE["captures"] += 1
            STATE["last_capture"] = time.time()
        return p


    def append_section(path, heading, text):
        with open(path, "a", encoding="utf-8") as f:
            f.write(f"\n## {heading}\n\n{(text or '').rstrip()}\n")


    def find_note_by_ask(ask_id):
        """Scans the WHOLE vault, newest first. It was inbox-only until 2026-09-12, when imported notes
        moved behind the wall into outside/imported — a reply to a link's question then found nothing,
        which a test caught. ponytail: a full scan per reply, fine at this size; if it ever costs
        anything, index the ask ids instead of walking files."""
        for f in sorted(VAULT.rglob("*.md"), key=lambda x: x.name, reverse=True):
            head = f.read_text(encoding="utf-8")[:2000]
            if re.search(rf"^telegram_ask: {ask_id}$", head, re.M):
                return f
        return None


    # ---------- http ----------
    def multipart(fields, files):
        b = uuid.uuid4().hex
        out = bytearray()
        for k, v in fields.items():
            out += f"--{b}\r\nContent-Disposition: form-data; name=\"{k}\"\r\n\r\n{v}\r\n".encode()
        for k, (fname, data) in files.items():
            out += f"--{b}\r\nContent-Disposition: form-data; name=\"{k}\"; filename=\"{fname}\"\r\nContent-Type: application/octet-stream\r\n\r\n".encode()
            out += data + b"\r\n"
        out += f"--{b}--\r\n".encode()
        return bytes(out), f"multipart/form-data; boundary={b}"


    def http(method, url, data=None, headers=None, timeout=300):
        req = urllib.request.Request(url, data=data, method=method, headers=headers or {})
        with urllib.request.urlopen(req, timeout=timeout) as r:
            return r.read()


    def backend(method, url, data=None, headers=None, timeout=300):
        """Like http() but a connection failure or 5xx is BackendDown, not a bad input."""
        try:
            return http(method, url, data, headers, timeout)
        except urllib.error.HTTPError as e:
            if e.code >= 500:
                raise BackendDown(f"{url} -> {e.code}") from e
            raise
        except (urllib.error.URLError, TimeoutError, ConnectionError, OSError) as e:
            raise BackendDown(f"{url} -> {e}") from e


    def post_json(url, obj, headers=None, timeout=300):
        h = {"Content-Type": "application/json", **(headers or {})}
        return json.loads(http("POST", url, json.dumps(obj).encode(), h, timeout))


    def get_json(url, timeout=70):
        return json.loads(http("GET", url, timeout=timeout))


    AUTH = {"Authorization": f"Bearer {KEY}"}


    # ---------- transcription (LiteLLM only — ADR-038 rule 4) ----------
    def ff(*a):
        subprocess.run(["ffmpeg", "-y", "-v", "error", *a], check=True)


    def filter_transcript(vj):
        """Apply the hallucination checks to one verbose_json response.
        Returns (text, verified). verified is False when anything was dropped."""
        segs = vj.get("segments") or []
        if not segs:
            t = (vj.get("text") or "").strip()
            return t, bool(t)
        words = vj.get("words") or []
        bad_words = {(round(w.get("start", 0), 2), (w.get("word") or "").strip()) for w in words
                     if w.get("probability", 1.0) < WORD_P or (w.get("end", 0) - w.get("start", 0)) < WORD_DUR}
        kept, dropped = [], 0
        for s in segs:
            t = (s.get("text") or "").strip()
            if not t:
                continue
            if s.get("no_speech_prob", 0) > NO_SPEECH or s.get("compression_ratio", 0) > COMPRESSION \
               or t.lower() in BLOCKLIST or re.fullmatch(r"\S+\.(org|com|net|cz|pl|gr)/?", t.lower()):
                dropped += 1
                continue
            if bad_words:
                bad = {bw[1].strip(".,!?") for bw in bad_words}
                toks = [w for w in t.split() if w.strip(".,!?") not in bad]
                if len(toks) < len(t.split()):
                    dropped += 1
                    t = " ".join(toks)
                    if not t:
                        continue
            kept.append(t)
        return "\n".join(kept).strip(), dropped == 0


    def progress():
        STATE["last_cycle"] = time.time()  # liveness watches this; long transcriptions must keep it fresh


    def whisper_chunk(wav):
        progress()
        body, ctype = multipart({"model": "whisper", "response_format": "verbose_json", "timestamp_granularities[]": "word"},
                                {"file": (wav.name, wav.read_bytes())})
        last = None
        for i in range(3):
            try:
                return json.loads(backend("POST", f"{LITELLM}/audio/transcriptions", body,
                                          {"Content-Type": ctype, **AUTH}, timeout=900))
            except BackendDown as e:
                last = e
                log(f"  whisper attempt {i+1}: {e}")
                time.sleep(20)
        raise last


    def transcribe(path):
        """ffmpeg → 16 kHz mono → 10-min chunks → whisper; returns (text, verified)."""
        with tempfile.TemporaryDirectory() as td:
            wav = Path(td) / "a.wav"
            ff("-i", str(path), "-ac", "1", "-ar", "16000", "-vn", str(wav))
            ff("-i", str(wav), "-f", "segment", "-segment_time", str(CHUNK), "-c", "copy", f"{td}/p_%03d.wav")
            parts = sorted(Path(td).glob("p_*.wav"))
            out, verified = [], True
            for i, part in enumerate(parts):
                t, ok = filter_transcript(whisper_chunk(part))
                progress()
                verified = verified and ok
                if t:
                    out.append((f"[{(i*CHUNK)//60:02d}:00] " if len(parts) > 1 else "") + t)
            return "\n".join(out).strip(), verified


    # ---------- raw artefacts ----------
    def frames(media, out):
        if media.suffix.lower() in AUDIO_ONLY:
            return 0
        probe = subprocess.run(["ffprobe", "-v", "error", "-select_streams", "v", "-show_entries", "stream=codec_type",
                                "-of", "csv=p=0", str(media)], capture_output=True, text=True)
        if "video" not in probe.stdout:
            return 0
        out.mkdir(parents=True, exist_ok=True)
        try:
            ff("-i", str(media), "-vf", "select='gt(scene,0.30)',scale=1280:-2", "-vsync", "vfr", str(out / "scene_%04d.jpg"))
            ff("-i", str(media), "-vf", "fps=1/30,scale=1280:-2", str(out / "t_%03d.jpg"))
        except Exception as e:
            log(f"  frames skipped ({e.__class__.__name__})")  # frames are a bonus; never block the note
        return len(list(out.glob("*.jpg")))


    def capture_dir(slug):
        d = DATA / "attachments" / datetime.now().strftime("%Y") / f"{datetime.now().strftime('%Y-%m-%d')}-{slug}"
        d.mkdir(parents=True, exist_ok=True)
        return d


    def rel(p):  # path as stored in notes: relative to the data volume, prefixed for humans
        return "data/" + str(Path(p).relative_to(DATA))


    # ---------- capture 1: audio ----------
    def audio_dest(name):
        return DATA / "audio" / datetime.now().strftime("%Y") / name


    def transcript_of(dest):
        return dest.with_suffix(dest.suffix + ".txt")


    def already_done(f):
        """A drop is done only when its kept copy has a transcript beside it. A copy without a
        transcript means the pod died mid-work; the sweep in watcher() picks it up again."""
        dest = audio_dest(f.name)
        return dest.exists() and dest.stat().st_size == f.stat().st_size and transcript_of(dest).exists()


    def process_audio_file(dest, source):
        """dest is already the kept copy under DATA/audio/YYYY/."""
        log(f"audio START {dest.name}")
        text, verified = transcribe(dest)
        text = text or "(no speech detected)"
        dest.with_suffix(dest.suffix + ".txt").write_text(text, encoding="utf-8")
        p = write_note(source, first_line_title(text), text, {"audio": rel(dest), "verified": verified, "tags": []})
        log(f"audio DONE {p.name} verified={verified}")
        return p


    def process_drop(path):
        dest = audio_dest(path.name)
        dest.parent.mkdir(parents=True, exist_ok=True)
        shutil.copy2(str(path), str(dest))  # copy, never move: the drop folder belongs to the phone
        return process_audio_file(dest, "drop")


    def kuma(status, msg):
        if not KUMA:
            return
        try:
            http("GET", KUMA.replace("status=up", f"status={status}").replace("msg=OK", f"msg={urllib.parse.quote(msg)}"), timeout=10)
        except Exception as e:
            log(f"kuma push failed: {e}")


    def orphans():
        """Kept copies (drops or Telegram saves) that have no transcript: work interrupted by a
        restart, a liveness kill, or a backend outage. Older than 2 min so in-flight ones are skipped."""
        for f in sorted((DATA / "audio").glob("*/*")):
            if f.is_file() and f.suffix.lower() in EXT and not transcript_of(f).exists() \
               and "_failed" not in f.parts and time.time() - f.stat().st_mtime > 120:
                yield f


    def report_unsupported(drops):
        """Nothing is ignored silently — the sibling of nothing is deleted silently.

        The watcher only takes audio/video (EXT), so a dropped PDF, Markdown file or folder used to sit
        there forever with no note, no error and no log line. Name each one once. The file is never
        touched: the drop zone is Stefanos's, and the pod only ever copies out of it.
        """
        for f in sorted(drops.iterdir()):
            if f.name.startswith(".") or f.name in IGNORED:
                continue
            if f.is_file() and f.suffix.lower() in EXT:
                continue
            try:
                if time.time() - f.stat().st_mtime < 15:
                    continue                      # still being written; look again next cycle
            except FileNotFoundError:
                continue                          # vanished between listing and stat
            IGNORED.add(f.name)
            STATE["ignored"] += 1
            if f.is_dir():
                why = "a folder — batch import is not built yet (one capture per file, shared batch id)"
            elif f.suffix.lower() == ".pdf":
                why = "a PDF — documents go to the Paperless consume share, not here"
            else:
                why = f"unsupported type {f.suffix.lower() or '(no extension)'}"
            log(f"drop IGNORED {f.name}: {why}. Left untouched, nothing was deleted.")


    def watcher():
        drops = DATA / "drops"
        drops.mkdir(parents=True, exist_ok=True)
        while True:
            status, msg = "up", "OK"
            try:
                work = [("drop", f) for f in sorted(drops.iterdir())
                        if f.is_file() and f.suffix.lower() in EXT and not f.name.startswith(".")
                        and not already_done(f) and time.time() - f.stat().st_mtime >= 15]
                work += [("orphan", f) for f in orphans()]
                report_unsupported(drops)
                sweep_held()
                for kind, f in work:
                    try:
                        if kind == "drop":
                            process_drop(f)
                        else:
                            process_audio_file(f, "telegram-voice" if f.name.startswith("tg-") else "drop")
                    except BackendDown as e:
                        STATE["backend_down"] += 1
                        status, msg = "down", "backend"
                        log(f"backend down, retry next cycle: {e}")
                        break
                    except Exception as e:
                        STATE["errors"] += 1
                        log(f"audio FAILED {f.name}: {e}")
                        failed = DATA / "audio" / "_failed"
                        failed.mkdir(parents=True, exist_ok=True)
                        if kind == "drop":
                            shutil.copy2(str(f), str(failed / f.name))  # keep the drop untouched; park a copy
                        else:
                            shutil.move(str(f), str(failed / f.name))   # orphan copy: move so it is not retried forever
                        (failed / (f.name + ".err")).write_text(str(e))
                        STATE["last_cycle"] = time.time()
                STATE["last_cycle"] = time.time()
            except Exception as e:
                STATE["errors"] += 1
                status, msg = "down", "watcher"
                log(f"watcher error: {e}")
            kuma(status, msg)
            time.sleep(POLL)


    # ---------- capture 2: links and text from Telegram ----------
    def is_video_url(url):
        return any(h in url for h in VIDEO_HOSTS)


    def page_title(url):
        try:
            raw = http("GET", url, headers={"User-Agent": "Mozilla/5.0 brain-capture"}, timeout=20)[:200000].decode("utf-8", "ignore")
            m = re.search(r"<title[^>]*>(.*?)</title>", raw, re.S | re.I)
            return html.unescape(m.group(1)).strip()[:120] if m else url
        except Exception:
            return url


    def page_to_paperless(url, title):
        body, ctype = multipart({"url": url}, {})
        pdf = backend("POST", f"{GOTENBERG}/forms/chromium/convert/url", body, {"Content-Type": ctype}, timeout=120)
        name = f"{datetime.now().strftime('%Y-%m-%d')} {slugify(title)[:60]}.pdf"
        out = PAPERLESS / name
        out.parent.mkdir(parents=True, exist_ok=True)
        out.write_bytes(pdf)
        return name


    def ytdlp(url, d):
        subprocess.run(["yt-dlp", "-q", "--no-playlist", "-f", "bv*[height<=720]+ba/b", "--write-info-json",
                        "--write-description", "-o", str(d / "media.%(ext)s"), url], check=True, timeout=1800)
        info = next(iter(d.glob("*.info.json")), None)
        j = json.loads(info.read_text()) if info else {}
        media = next((m for m in d.glob("media.*") if m.suffix.lower() in EXT), None)
        return j.get("title") or url, (j.get("description") or ""), media, j.get("duration")


    def tg_send(chat, text, reply_to=None, buttons=None):
        body = {"chat_id": chat, "text": text}
        if reply_to:
            body["reply_to_message_id"] = reply_to
        if buttons:
            body["reply_markup"] = {"inline_keyboard": buttons}
        return post_json(f"{API}/sendMessage", body)["result"]["message_id"]


    def tg_edit(chat, message_id, text, buttons=None):
        """Rewrite a message already sent. Progress lives in ONE message instead of five, and choosing
        a button replaces the buttons with what was chosen — so the chat reads back as a record of what
        happened, not a trail of dead keyboards."""
        body = {"chat_id": chat, "message_id": message_id, "text": text}
        body["reply_markup"] = {"inline_keyboard": buttons or []}
        try:
            post_json(f"{API}/editMessageText", body)
        except Exception as e:                    # an edit is cosmetic; never lose a capture over one
            log(f"  edit failed (harmless): {e}")


    def tg_answer(callback_id, text=""):
        """Stops Telegram's spinner. Without it the button shows a loading state until it times out."""
        try:
            post_json(f"{API}/answerCallbackQuery", {"callback_query_id": callback_id, "text": text})
        except Exception as e:
            log(f"  answerCallbackQuery failed (harmless): {e}")


    # What a link is about. The value is the tag written into the note's frontmatter; the label is what
    # he taps. Two rows of three so every button stays readable on a phone.
    CATEGORIES = [
        [("\U0001F6E0 tool", "tool"), ("\U0001F94B bjj", "bjj"), ("\U0001F4A1 idea", "idea")],
        [("\U0001F4DA read later", "read-later"), ("\U0001F464 person", "person"), ("⬜ skip", "skip")],
        [("\U0001F4CC keep the video too", "keep")],
    ]
    ASKED = {}          # button message_id -> (note path, asked_at). Answer whenever; nothing expires.
    HELD = {}           # note path -> (media file, duration, held_since). Retention waits on the answer.
    MEDIA_HOLD_SECONDS = int(os.environ.get("MEDIA_HOLD_SECONDS", "86400"))


    def sweep_held(now=None):
        """Imported media he never categorised. The rule's default is deletion, so an unanswered
        question must not become a permanent keep — that is how the array filled up with reels. One day
        to answer, then the default applies and the note records it."""
        now = now or time.time()
        for p, (media, duration, since) in list(HELD.items()):
            if now - since < MEDIA_HOLD_SECONDS:
                continue
            HELD.pop(p, None)
            gate = media_gate(media, duration, None)
            log(f"  held media expired for {p.name}: {gate}")
            try:
                append_section(p, "Retention", f"{gate} (no category given within {MEDIA_HOLD_SECONDS // 3600} h)")
            except OSError as e:
                log(f"  could not record retention on {p.name}: {e}")


    def category_buttons():
        return [[{"text": lbl, "callback_data": val} for lbl, val in row] for row in CATEGORIES]


    def add_tag(path, tag):
        """Write a tag into the existing frontmatter `tags:` line. Frontmatter is flat `key: value`
        written by write_note, so this is a line edit, not a YAML round-trip — the capture image has no
        pyyaml and a real parser would reformat the whole file."""
        text = path.read_text(encoding="utf-8")
        m = re.search(r"^tags: \[(.*?)\]$", text, re.M)
        if not m:
            append_section(path, "Category", tag)
            return
        have = [t.strip() for t in m.group(1).split(",") if t.strip()]
        if tag in have:
            return
        have.append(tag)
        path.write_text(text[:m.start()] + f"tags: [{', '.join(have)}]" + text[m.end():], encoding="utf-8")


    def video_title(url):
        """Title BEFORE the download, because a note's path is fixed at capture and never changes.
        Costs one metadata call (~4 s measured). Instagram and TikTok return a generic "Video by <user>",
        so fall back to the caption, which is where the substance is."""
        try:
            out = subprocess.run(["yt-dlp", "-q", "--no-warnings", "--no-playlist",
                                  "--print", "%(title)s", "--print", "%(description)s", url],
                                 capture_output=True, text=True, timeout=90, check=True).stdout.splitlines()
        except Exception as e:
            log(f"  title lookup failed, falling back to the url: {e}")
            return url
        t = (out[0] if out else "").strip()
        desc = " ".join(out[1:]).strip()
        if not t or t == url or re.fullmatch(r"video by .+", t, re.I):
            t = desc
        return " ".join(t.split())[:120] or url


    def probe_duration(media):
        """Duration from the downloaded file. yt-dlp reports none for Instagram, which used to leave
        every reel as "unknown" and therefore kept forever. Reading it off the file makes it a measured
        fact rather than a guess, which is what the retention rule needs to fire at all."""
        if media is None or not media.exists():
            return None
        try:
            out = subprocess.run(["ffprobe", "-v", "error", "-show_entries", "format=duration",
                                  "-of", "default=nw=1:nk=1", str(media)],
                                 capture_output=True, text=True, timeout=30, check=True).stdout.strip()
            return float(out)
        except Exception as e:
            log(f"  ffprobe failed, duration stays unknown: {e}")
            return None


    def media_gate(media, duration, category=None):
        """Retention for IMPORTED media, applied once he says what the thing is.

        The rule (DECISIONS 2026-09-11, glossary "Grace period"): imported media is DELETED once
        processed and the note keeps the URL. BJJ technique videos are the single exception — kept when
        they run MEDIA_KEEP_SECONDS or less, because a short clip is the library while a long
        instructional is only a bookmark. A `keep` tap overrides the gate outright.

        Until 2026-09-13 this applied the duration gate to *everything* and kept anything whose
        duration was unknown, which inverted the rule: Instagram reports no duration, so every reel was
        kept forever. Deletion is the default; keeping is what has to be earned.

        Returns a sentence for the note — "nothing is deleted silently" means the deletion is written
        where he will read it.
        """
        if media is None or not media.exists():
            return "no media file"
        size = f"{media.stat().st_size // 1048576} MB"
        if category == "keep":
            return f"`{media.name}` kept ({size}) — you asked to keep it, which overrides the gate"
        if category == "bjj":
            if duration is None:
                return f"`{media.name}` kept ({size}) — BJJ, and the duration is unknown; nothing is deleted on a guess"
            if duration <= MEDIA_KEEP_SECONDS:
                return f"`{media.name}` kept ({int(duration)} s, at or under the {MEDIA_KEEP_SECONDS} s BJJ gate)"
            media.unlink()
            return (f"media deleted: BJJ but {int(duration)} s, over the {MEDIA_KEEP_SECONDS} s gate, {size} freed. "
                    f"The link, the transcript and the frames are kept.")
        media.unlink()
        why = "imported media is deleted once processed" if category else "no category given"
        return f"media deleted ({size} freed) — {why}. The link, the transcript and the frames are kept."


    def capture_link(url, msg_id, chat, why=""):
        video = is_video_url(url)
        # One status message, edited as the work proceeds — the dental bot's running commentary, which
        # is the thing worth copying: silence during a 90 s video fetch reads as a broken bot.
        status = tg_send(chat, "\U0001F4E5 got it — reading the link…", reply_to=msg_id)
        title = video_title(url) if video else page_title(url)
        slug = slugify(title) or "link"
        short = " ".join(title.split())[:60]
        p = write_note("telegram-link", title, f"<{url}>", {"url": url, "telegram_msg": msg_id, "tags": []})
        PENDING[chat] = (p, time.time())   # the next plain text message is this note's Why. No prompt.
        if why:
            append_section(p, "Why", why)
        n = STATE["captures"]
        try:
            if video:
                tg_edit(chat, status, f"\U0001F3AC “{short}”\nfetching video + transcribing…")
                d = capture_dir(slug)
                vtitle, desc, media, duration = ytdlp(url, d)
                if desc:
                    (d / "caption.txt").write_text(desc, encoding="utf-8")
                text, verified = transcribe(media) if media else ("", True)
                (d / "transcript.txt").write_text(text, encoding="utf-8")
                nf = frames(media, d / "frames") if media else 0
                append_section(p, "Title", vtitle)
                if desc:
                    append_section(p, "Caption", desc)
                if text:
                    append_section(p, "Transcript", text)
                if duration is None:
                    duration = probe_duration(media)
                # The category decides whether this survives, and he has not answered yet — so the file
                # is HELD, not gated, and the gate runs on the button press (or on the sweep below if he
                # never answers). Deleting first and asking after would make the keep button a lie.
                HELD[p] = (media, duration, time.time())
                append_section(p, "Raw", f"`{rel(d)}/` ({nf} frames){'' if verified else ' — transcript not verified'}\n\n"
                                         f"media held until you say what this is")
            else:
                tg_edit(chat, status, f"\U0001F4C4 “{short}”\nrendering the page to Paperless…")
                doc = page_to_paperless(url, title)
                append_section(p, "Paperless", f"document `{doc}` (searchable once consumed)")
            done = f"✅ #{n} “{short}”\nWhat is it about?"
            tg_edit(chat, status, done, category_buttons())
            ASKED[status] = (p, time.time())
        except BackendDown as e:
            STATE["backend_down"] += 1
            append_section(p, "Capture error", f"backend unavailable: {e}")
            # Still ask: the note exists and the category is his answer, not the backend's.
            tg_edit(chat, status, f"⚠️ #{n} backend unavailable — link and note kept.\nWhat is it about?",
                    category_buttons())
            ASKED[status] = (p, time.time())
        except Exception as e:
            STATE["errors"] += 1
            append_section(p, "Capture error", str(e)[:300])
            tg_edit(chat, status, f"⚠️ #{n} failed: {type(e).__name__} — note kept, nothing lost")
        return p


    def telegram():
        offset = 0
        log(f"telegram: allowed chats {sorted(ALLOWED_CHATS)}")
        while True:
            try:
                for u in get_json(f"{API}/getUpdates?offset={offset}&timeout=50").get("result", []):
                    offset = u["update_id"] + 1
                    if (cq := u.get("callback_query")):
                        # A tapped category button. Arrives as its own update type, not as a message.
                        cmsg = cq.get("message") or {}
                        cchat = (cmsg.get("chat") or {}).get("id")
                        if cchat not in ALLOWED_CHATS:
                            tg_answer(cq["id"])
                            continue
                        bmid, choice = cmsg.get("message_id"), (cq.get("data") or "")
                        entry = ASKED.pop(bmid, None)
                        head = (cmsg.get("text") or "").split("\n")[0]
                        if entry is None:
                            # The pod restarted, or the button was tapped twice. Say so rather than
                            # pretending it worked — nothing is ignored silently.
                            tg_answer(cq["id"], "that one is already answered")
                            tg_edit(cchat, bmid, f"{head}\n(already answered)")
                        else:
                            note = entry[0]
                            if choice != "skip":
                                add_tag(note, choice)
                            # Retention runs HERE, because the answer is what decides it.
                            line = ""
                            if (held := HELD.pop(note, None)) is not None:
                                gate = media_gate(held[0], held[1], choice)
                                append_section(note, "Retention", gate)
                                log(f"  {note.name}: {gate}")
                                line = "\n" + ("\U0001F5D1 video deleted, link + transcript kept"
                                               if "deleted" in gate else "\U0001F4CC video kept")
                            label = "untagged" if choice == "skip" else f"\U0001F3F7 {choice}"
                            tg_answer(cq["id"], "left untagged" if choice == "skip" else f"tagged {choice}")
                            tg_edit(cchat, bmid, f"{head}\n{label}{line}")
                            log(f"tagged {note.name} as {choice}")
                        continue
                    msg = u.get("message") or {}
                    chat = (msg.get("chat") or {}).get("id")
                    if chat not in ALLOWED_CHATS:
                        continue  # silently: the bot is private
                    media = msg.get("voice") or msg.get("audio") or msg.get("video") or msg.get("video_note")
                    text = (msg.get("text") or "").strip()
                    reply_to = (msg.get("reply_to_message") or {}).get("message_id")
                    if media:
                        fp = get_json(f"{API}/getFile?file_id={media['file_id']}")["result"]["file_path"]
                        dest = audio_dest(f"tg-{msg['message_id']}{Path(fp).suffix or '.oga'}")
                        dest.parent.mkdir(parents=True, exist_ok=True)
                        dest.write_bytes(http("GET", f"{FILEAPI}/{fp}", timeout=120))
                        tg_send(chat, "🎙 queued")
                        threading.Thread(target=_voice, args=(dest, chat), daemon=True).start()
                    elif reply_to and text and (p := find_note_by_ask(reply_to)) is not None:
                        append_section(p, "Why", text)
                        tg_send(chat, "✅ added")
                        # The lookup lives in the condition on purpose. It used to be an `if` inside the
                        # branch, so a reply to anything that is NOT one of our asks was swallowed: no
                        # note, no log, no reply. Any message sent as a reply — a link included — was
                        # simply lost. Now a missed ask falls through to the URL and text branches, so a
                        # message always becomes something. Nothing is ignored silently.
                    elif text and (pend := PENDING.pop(chat, None)) is not None \
                            and time.time() - pend[1] < CONTEXT_WINDOW \
                            and not re.search(r"https?://\S+", text):
                        # He types the thought as a new message rather than replying. Take it either way.
                        append_section(pend[0], "Why", text)
                        tg_send(chat, f"\u2705 added to \u201c{pend[0].stem[16:56]}\u2026\u201d")
                    elif (m := re.search(r"https?://\S+", text)):
                        # a shared link usually arrives with words around it ("look at this https://…");
                        # the first URL is the capture, the surrounding words are the "why"
                        url, why = m.group(0).rstrip(".,)"), (text[:m.start()] + text[m.end():]).strip()
                        threading.Thread(target=capture_link, args=(url, msg["message_id"], chat, why), daemon=True).start()
                    elif text:
                        write_note("telegram-text", first_line_title(text), text, {"telegram_msg": msg["message_id"], "tags": []})
                        tg_send(chat, f"✅ #{STATE['captures']}")
            except Exception as e:
                STATE["errors"] += 1
                log(f"telegram error: {e}")
                time.sleep(5)


    def _voice(dest, chat):
        try:
            process_audio_file(dest, "telegram-voice")
            tg_send(chat, f"✅ #{STATE['captures']}")
        except BackendDown as e:
            STATE["backend_down"] += 1
            log(f"voice deferred, backend down: {e}")
            tg_send(chat, "⏳ backend busy, will retry")
            # the kept copy is also visible to the watcher? no — watcher reads drops. Leave a drop copy so it retries.
            drop = DATA / "drops" / dest.name
            if not drop.exists():
                shutil.copy2(str(dest), str(drop))
            dest.unlink(missing_ok=True)
        except Exception as e:
            STATE["errors"] += 1
            log(f"voice FAILED {dest.name}: {e}")
            tg_send(chat, "⚠️ failed")


    # ---------- health + metrics ----------
    class H(BaseHTTPRequestHandler):
        def log_message(self, *a):
            pass

        def do_GET(self):
            if self.path == "/ready":
                ok = STATE["last_cycle"] > 0
                self.send_response(200 if ok else 503); self.end_headers(); self.wfile.write(b"ready" if ok else b"starting")
            elif self.path == "/healthz":
                ok = time.time() - STATE["last_cycle"] < 5 * POLL
                self.send_response(200 if ok else 503); self.end_headers(); self.wfile.write(b"ok" if ok else b"stale")
            elif self.path == "/metrics":
                body = (f"brain_captures_total {STATE['captures']}\n"
                        f"brain_last_capture_timestamp_seconds {STATE['last_capture']}\n"
                        f"brain_last_cycle_timestamp_seconds {STATE['last_cycle']}\n"
                        f"brain_errors_total {STATE['errors']}\n"
                        f"brain_backend_down_total {STATE['backend_down']}\n"
                        f"brain_drops_ignored_total {STATE['ignored']}\n").encode()
                self.send_response(200); self.send_header("Content-Type", "text/plain"); self.end_headers(); self.wfile.write(body)
            else:
                self.send_response(404); self.end_headers()


    def serve():
        ThreadingHTTPServer(("0.0.0.0", 8080), H).serve_forever()


    if __name__ == "__main__":
        (VAULT / "inbox").mkdir(parents=True, exist_ok=True)
        if not ALLOWED_CHATS:
            raise SystemExit("TELEGRAM_CHAT_IDS is empty: refusing to run an open bot")
        log(f"brain-capture up vault={VAULT} data={DATA} litellm={LITELLM}")
        STATE["last_cycle"] = time.time()
        for t in (watcher, telegram):
            threading.Thread(target=t, daemon=True).start()
        serve()
