# ADR-038 phase A. One pod, two containers, one RWO vault: `capture` (drop-zone watcher +
# Telegram long-poll, stdlib Python from the brain-capture-code ConfigMap) and `syncthing`
# (the only way humans reach the vault). Unprivileged: runs as the Unraid nobody:users pair
# (99:100), which is what the NFS shares squash to.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brain
  namespace: brain
spec:
  replicas: 1
  strategy: { type: Recreate }   # RWO volume: never two pods
  selector:
    matchLabels: { app: brain }
  template:
    metadata:
      labels: { app: brain }
      annotations:
        checksum/code: "c0f92d60ba5babf8"   # sha256 of capture.py, set by the regeneration step; a code push rolls the pod
    spec:
      securityContext:
        fsGroup: 100
        runAsNonRoot: true    # pod-wide invariant; the obsidian container opts out explicitly below (s6 starts as root, drops to PUID 99)
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:   # pinned: the browser Obsidian address is this node's tailnet name (NodePort + Local policy)
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: kubernetes.io/hostname, operator: In, values: [k3s-prg-w1] }
      containers:
        - name: capture
          image: ghcr.io/jauderho/yt-dlp:latest@sha256:0987db27a321d2e485873168b7eb50d21bf11b5f1f309c4594cfc713bdf76a82   # Alpine + python3.14 + ffmpeg 8 + yt-dlp; nothing installed at start
          command: ["python3", "/app/capture.py"]
          securityContext:
            runAsUser: 99
            runAsGroup: 100
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          envFrom:
            - secretRef: { name: brain-secret }   # TELEGRAM_TOKEN, TELEGRAM_CHAT_IDS, LITELLM_KEY, KUMA_PUSH_URL
          env:
            - { name: VAULT, value: /data/vault }
            - { name: DATA, value: /data/data }
            - { name: PAPERLESS_CONSUME, value: /data/paperless-consume }
            - { name: LITELLM_URL, value: "http://litellm.ai.svc.cluster.local:4000/v1" }
            - { name: GOTENBERG_URL, value: "http://gotenberg.n8n.svc.cluster.local:3000" }
            - { name: POLL_SECONDS, value: "60" }
            - { name: TZ, value: Europe/Prague }
            - { name: HOME, value: /tmp }          # yt-dlp cache; root fs is read-only
            - { name: TMPDIR, value: /tmp }
          ports:
            - { name: metrics, containerPort: 8080 }
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
            initialDelaySeconds: 90
            periodSeconds: 60
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /ready, port: metrics }
            initialDelaySeconds: 5
            periodSeconds: 30
          volumeMounts:
            - { name: code, mountPath: /app, readOnly: true }
            - { name: vault, mountPath: /data/vault }
            - { name: data, mountPath: /data/data }
            - { name: paperless-consume, mountPath: /data/paperless-consume }
            - { name: tmp, mountPath: /tmp }
            - { name: zoneinfo, mountPath: /usr/share/zoneinfo, readOnly: true }   # Alpine image has no tzdata; TZ=Europe/Prague needs it for note timestamps
          resources:
            requests: { memory: 256Mi, cpu: 100m }
            limits:   { memory: 2Gi, cpu: "2" }     # ffmpeg scene detection on 720p video
        - name: syncthing
          image: syncthing/syncthing:2.1.5@sha256:397aa00b92b48d65540ea3ae3cbf271b87bdccbe07a0b7bd7d2debc3a7b29138
          env:
            - { name: STGUIADDRESS, value: "0.0.0.0:8384" }
            - { name: STNOUPGRADE, value: "1" }      # Renovate bumps the tag, not the binary
            - { name: PUID, value: "99" }
            - { name: PGID, value: "100" }
            - { name: TZ, value: Europe/Prague }
          securityContext:
            runAsUser: 99
            runAsGroup: 100
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          ports:
            - { name: gui, containerPort: 8384 }
            - { name: sync-tcp, containerPort: 22000, protocol: TCP }
            - { name: sync-udp, containerPort: 22000, protocol: UDP }
          livenessProbe:
            httpGet: { path: /rest/noauth/health, port: gui }
            initialDelaySeconds: 30
            periodSeconds: 60
          volumeMounts:
            - { name: syncthing-config, mountPath: /var/syncthing/config }
            - { name: vault, mountPath: /data/vault }
            - { name: data, mountPath: /data/data }
          resources:
            requests: { memory: 128Mi, cpu: 50m }
            limits:   { memory: 1Gi, cpu: "1" }
        - name: obsidian
          # Obsidian desktop streamed to the browser (KasmVNC). Sits on the master vault: what you
          # type here lands on the source of truth; Syncthing fans it out. Reachable on the tailnet
          # only (NodePort + netpol). BRAIN-40.
          image: lscr.io/linuxserver/obsidian:1.9.14@sha256:49b3b4d853c8918293bf2af0e3be5b7a0f1ab5fe81b4117404fc047035833bb2
          env:
            - { name: PUID, value: "99" }
            - { name: PGID, value: "100" }
            - { name: TZ, value: Europe/Prague }
            - { name: TITLE, value: "Second Brain" }
            - name: CUSTOM_USER
              valueFrom: { secretKeyRef: { name: brain-secret, key: OBSIDIAN_USER } }
            - name: PASSWORD
              valueFrom: { secretKeyRef: { name: brain-secret, key: OBSIDIAN_PASSWORD } }
          ports:
            - { name: web, containerPort: 3001 }   # HTTPS twin (self-signed): a secure context is needed for clipboard/WebRTC in the stream
          securityContext:
            runAsNonRoot: false   # the ONE exception in this pod: s6-overlay starts as root and drops to PUID 99
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL], add: [CHOWN, SETUID, SETGID, FOWNER, DAC_OVERRIDE] }   # what s6 needs to drop privileges
          livenessProbe:
            tcpSocket: { port: 3001 }
            initialDelaySeconds: 60
            periodSeconds: 60
            failureThreshold: 3
          readinessProbe:
            tcpSocket: { port: 3001 }
            initialDelaySeconds: 20
            periodSeconds: 30
          volumeMounts:
            - { name: obsidian-config, mountPath: /config }
            - { name: vault, mountPath: /vault }
          resources:
            requests: { memory: 512Mi, cpu: 100m }
            limits:   { memory: 2Gi, cpu: "2" }
      volumes:
        - name: code
          configMap: { name: brain-capture-code }
        - name: vault
          persistentVolumeClaim: { claimName: vault }
        - name: data
          persistentVolumeClaim: { claimName: data }
        - name: paperless-consume
          persistentVolumeClaim: { claimName: paperless-consume }
        - name: syncthing-config
          persistentVolumeClaim: { claimName: syncthing-config }
        - name: obsidian-config
          persistentVolumeClaim: { claimName: obsidian-config }
        - name: tmp
          emptyDir: { sizeLimit: 8Gi }
        - name: zoneinfo
          hostPath: { path: /usr/share/zoneinfo, type: Directory }   # read-only; the nodes are Debian and carry tzdata
---
apiVersion: v1
kind: Service
metadata:
  name: brain-capture
  namespace: brain
  labels: { app: brain }        # ServiceMonitor matches Service labels, not pod selectors
spec:
  selector: { app: brain }
  ports:
    - { name: metrics, port: 8080, targetPort: metrics }
---
apiVersion: v1
kind: Service
metadata:
  name: brain-syncthing-gui
  namespace: brain
spec:
  selector: { app: brain }
  ports:
    - { name: gui, port: 8384, targetPort: gui }
---
# k3s ServiceLB binds 22000 on every node IP. LAN peers dial any node. Relays and global
# discovery are OFF until the remote-reach ticket is decided (ADR-038 security posture).
apiVersion: v1
kind: Service
metadata:
  name: brain-syncthing
  namespace: brain
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local   # keep the peer's real IP so the netpol's LAN rule is what gates 22000 (with Cluster, svclb SNATs to the node bridge and the rule is decorative)
  selector: { app: brain }
  ports:
    - { name: sync-tcp, port: 22000, targetPort: 22000, protocol: TCP }
    - { name: sync-udp, port: 22000, targetPort: 22000, protocol: UDP }
---
# Browser Obsidian: tailnet only. NodePort with Local policy keeps the client's tailnet address
# so the netpol (ingress from 100.64.0.0/10 on 3001) is what admits it; the LAN is not allowed.
# The pod is pinned to k3s-prg-w1 so the address is stable: https://k3s-prg-w1.taila09f30.ts.net:30301
# (self-signed certificate; accept it once). Basic auth from brain-secret is the access control —
# the tailnet ACL is stock allow-all (SEC-8), so 100.64.0.0/10 is not "Stefanos only".
apiVersion: v1
kind: Service
metadata:
  name: brain-obsidian
  namespace: brain
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector: { app: brain }
  ports:
    - { name: web, port: 3001, targetPort: web, nodePort: 30301 }
