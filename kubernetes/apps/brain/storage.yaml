# ADR-038: the vault (Obsidian's files) lives on Longhorn; drops and raw data live on the
# Unraid array over NFS; web pages and documents go to Paperless through its consume share.
#
# The three recurring-job labels are the set that actually reaches the Longhorn Volume CR
# (verified 2026-09-10: `daily-backup` alone is ignored; `source` makes Longhorn sync PVC labels
# to the volume, and that sync REPLACES the labels, so the default group must be restated or
# filesystem-trim and snapshot-cleanup silently stop).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vault
  namespace: brain
  labels:
    recurring-job.longhorn.io/daily-backup: "enabled"
    recurring-job.longhorn.io/source: "enabled"
    recurring-job-group.longhorn.io/default: "enabled"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: syncthing-config
  namespace: brain
  labels:
    recurring-job.longhorn.io/daily-backup: "enabled"   # device identity; losing it = re-pair every peer
    recurring-job.longhorn.io/source: "enabled"
    recurring-job-group.longhorn.io/default: "enabled"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: obsidian-config
  namespace: brain
  labels:
    recurring-job.longhorn.io/daily-backup: "enabled"   # Obsidian settings + plugins for the browser instance
    recurring-job.longhorn.io/source: "enabled"
    recurring-job-group.longhorn.io/default: "enabled"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
# NFS PersistentVolume to the Unraid share `brain` (drops in, raw out). Exported with
# all_squash to 99:100; the pod runs as 99:100. Storage figure is not enforced for NFS.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: brain-data-nfs
spec:
  capacity:
    storage: 100Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: 192.168.1.100
    path: /mnt/user/brain
  mountOptions:
    - hard
    - nfsvers=4.1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: brain
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: brain-data-nfs
  resources:
    requests:
      storage: 100Ti
---
# Paperless's consume share (the same export Paperless mounts). The pod writes rendered
# page PDFs and dropped documents into its `brain/` subfolder; Paperless does the rest.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: brain-paperless-consume-nfs
spec:
  capacity:
    storage: 100Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: 192.168.1.100
    path: /mnt/user/Xartura/brain
  mountOptions:
    - hard
    - nfsvers=4.1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-consume
  namespace: brain
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: brain-paperless-consume-nfs
  resources:
    requests:
      storage: 100Ti
