apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: immich-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: tensorchord/pgvecto-rs:pg14-v0.2.0  # pgvecto-rs adds vector search for Immich Smart Search
          env:
            - name: POSTGRES_DB
              value: immich
            - name: POSTGRES_USER
              value: immich
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-secret
                  key: DB_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata  # subPath avoids lost+found conflict with Longhorn
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: immich-postgres-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: immich-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: immich-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-server
  template:
    metadata:
      labels:
        app: immich-server
    spec:
      containers:
        - name: immich-server
          image: ghcr.io/immich-app/immich-server:release
          envFrom:
            - configMapRef:
                name: immich-config
            - secretRef:
                name: immich-secret
          volumeMounts:
            - name: uploads
              mountPath: /usr/src/app/upload
              subPath: uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: immich-uploads-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-ml
  namespace: immich-test
spec:
  replicas: 2   # 2 replicas across G2 and B3 for load balancing
  selector:
    matchLabels:
      app: immich-ml
  template:
    metadata:
      labels:
        app: immich-ml
    spec:
      containers:
        - name: immich-ml
          image: ghcr.io/immich-app/immich-machine-learning:release
          env:
            - name: MACHINE_LEARNING_WORKERS
              value: "5"
          volumeMounts:
            - name: ml-cache
              mountPath: /cache
              subPath: cache
      volumes:
        - name: ml-cache
          persistentVolumeClaim:
            claimName: immich-ml-pvc
