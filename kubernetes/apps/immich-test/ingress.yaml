apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immich-ingress
  namespace: immich-test
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "0"      # no upload size limit
    nginx.ingress.kubernetes.io/ssl-redirect: "false"     # avoids redirect loop with Cloudflare
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - immich-test.kostikidis.net
      secretName: immich-test-tls
  rules:
    - host: immich-test.kostikidis.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: immich-server
                port:
                  number: 2283
