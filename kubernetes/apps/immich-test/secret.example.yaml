# Immich database password
# DO NOT commit the real value — this file shows structure only.
# In production: encrypt with SOPS+Age and commit as secret.sops.yaml
#
# Create the real secret:
#   kubectl create secret generic immich-secret \
#     --from-literal=DB_PASSWORD=<YOUR_DB_PASSWORD> \
#     -n immich-test
apiVersion: v1
kind: Secret
metadata:
  name: immich-secret
  namespace: immich-test
type: Opaque
stringData:
  DB_PASSWORD: REPLACE_WITH_DB_PASSWORD
