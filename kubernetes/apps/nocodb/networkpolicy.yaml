apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  namespace: nocodb
spec:
  podSelector:
    matchLabels: { app: postgres }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: {} }]
      ports: [{ port: 5432 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nocodb
  namespace: nocodb
spec:
  podSelector:
    matchLabels: { app: nocodb }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
        # n8n calls the NocoDB API for the Drive/Zoom automations.
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: n8n }
      ports: [{ port: 8080 }]
