apiVersion: v1
kind: Secret
metadata:
    name: wordpress-secret
    namespace: studioconcreteluka
stringData:
    WORDPRESS_DB_PASSWORD: SAME_AS_MARIADB_PASSWORD_ABOVE
---
apiVersion: v1
kind: Secret
metadata:
    name: cloudflare-tunnel-token
    namespace: studioconcreteluka
stringData:
    token: PASTE_CF_TUNNEL_TOKEN_HERE
