apiVersion: v1
kind: Secret
metadata:
    name: mariadb-secret
    namespace: studioconcreteluka
stringData:
    MARIADB_DATABASE: wordpress
    MARIADB_USER: wordpress
    MARIADB_PASSWORD: REPLACE_WITH_STRONG_PASSWORD
    MARIADB_ROOT_PASSWORD: REPLACE_WITH_STRONG_ROOT_PASSWORD
