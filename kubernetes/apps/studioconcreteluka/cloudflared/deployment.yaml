apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: studioconcreteluka
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared-studioconcreteluka
  template:
    metadata:
      labels:
        app: cloudflared-studioconcreteluka
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: cloudflared-studioconcreteluka
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --no-autoupdate
            - run
            - --token
            - $(TUNNEL_TOKEN)
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-tunnel-token
                  key: token
          resources:
            requests:
              memory: 64Mi
              cpu: 10m
            limits:
              memory: 128Mi
              cpu: 100m
