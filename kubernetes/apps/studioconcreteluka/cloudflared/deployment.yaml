apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: studioconcreteluka
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared-studioconcreteluka
  template:
    metadata:
      labels:
        app: cloudflared-studioconcreteluka
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --no-autoupdate
            - run
            - --token
            - $(TUNNEL_TOKEN)
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-tunnel-token
                  key: token
