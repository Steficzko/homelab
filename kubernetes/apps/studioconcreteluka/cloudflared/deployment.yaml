apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: studioconcreteluka
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared-studioconcreteluka
  template:
    metadata:
      labels:
        app: cloudflared-studioconcreteluka
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: cloudflared-studioconcreteluka
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.9.3
          args:
            - tunnel
            - --no-autoupdate
            # Off QUIC 2026-09-15: the Vodafone CPE rebooted at 00:26 UTC into new
            # firmware and its NAT now drops our long-lived UDP mappings; all tunnels then
            # flap in lockstep. Not packet loss -- UDP measures 0% and HTTP/3 runs at
            # 7.8 MB/s. See kubernetes/networking/cloudflared/deployment.yaml for the full
            # evidence. http2 rides TCP/7844 and re-establishes through it transparently.
            - --protocol
            - http2
            # No IPv6 default route on any node; without this, AAAA dials burn connection
            # slots failing "network is unreachable".
            - --edge-ip-version
            - "4"
            - run
            - --token
            - $(TUNNEL_TOKEN)
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-tunnel-token
                  key: token
          resources:
            requests:
              memory: 64Mi
              cpu: 10m
            limits:
              memory: 128Mi
              cpu: 100m
