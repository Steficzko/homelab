# Placeholder so the empty Secret exists for the backup CronJob even before the
# real (SOPS-encrypted) data is applied out-of-band (backup-s3-secret.sops.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: backup-s3-secret
  namespace: plane
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-options: Prune=false
type: Opaque
