# The admin container's nginx answers the bare directory path GET /god-mode with an
# ABSOLUTE redirect to its own listen port over http:
#   Location: http://plane.kostikidis.net:3000/god-mode/
# which hangs in the browser. ingress-nginx rewrote it with proxy-redirect; Traefik
# cannot rewrite a Location header, so this route answers exactly /god-mode itself
# with a 301 to https://<host>/god-mode/ before plane-admin sees it. It is the only
# path that does this (/god-mode/..., /spaces are relative or 200). The chart's own
# IngressRoute (plane-ingress) would otherwise win on rule length, hence priority.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: godmode-slash
  namespace: plane
spec:
  redirectRegex:
    regex: "^https?://([^/]+)/god-mode(\\?.*)?$"
    replacement: "https://${1}/god-mode/${2}"
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: plane-godmode-slash
  namespace: plane
spec:
  entryPoints: [web, websecure]
  routes:
    - match: Host(`plane.kostikidis.net`) && Path(`/god-mode`)
      kind: Rule
      priority: 1000
      middlewares:
        - name: godmode-slash
      services:
        - name: plane-admin
          port: 3000
