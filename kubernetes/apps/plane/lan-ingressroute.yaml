# Home path for Plane (owner decision 2026-11-03: every app reachable at home without
# Cloudflare). wrt-edge answers plane.kostikidis.net with 192.168.1.210; Traefik's `lan`
# (family VLAN, lan zone) and `trusted` (VLAN 10, DNAT to :8446) entrypoints terminate TLS.
#
# The chart's own IngressRoute (plane-ingress) cannot do this: it binds to `web` only and
# setting a tls_secret_name would move it to websecure and break the tunnel (CLSTR-29).
# So this mirrors its routes for the home entrypoints. Keep the paths in step with the
# chart (kubectl -n plane get ingressroute plane-ingress -o yaml) after Plane upgrades.
#
# The Certificate also gives plane-tls a renewal owner: the secret existed since 08-23
# with no Certificate behind it and would have expired 2026-11-20.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: plane-tls
  namespace: plane
spec:
  secretName: plane-tls
  dnsNames: [plane.kostikidis.net]
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: plane-home
  namespace: plane
spec:
  entryPoints: [lan, trusted]
  tls:
    secretName: plane-tls
  routes:
    - match: Host(`plane.kostikidis.net`) && Path(`/god-mode`)
      kind: Rule
      priority: 1000
      middlewares: [{ name: godmode-slash }]
      services: [{ name: plane-admin, port: 3000 }]
    - match: Host(`plane.kostikidis.net`) && PathPrefix(`/spaces`)
      kind: Rule
      middlewares: [{ name: plane-body-limit }]
      services: [{ name: plane-space, port: 3000 }]
    - match: Host(`plane.kostikidis.net`) && PathPrefix(`/god-mode`)
      kind: Rule
      middlewares: [{ name: plane-body-limit }]
      services: [{ name: plane-admin, port: 3000 }]
    - match: Host(`plane.kostikidis.net`) && PathPrefix(`/api`)
      kind: Rule
      middlewares: [{ name: plane-body-limit }]
      services: [{ name: plane-api, port: 8000 }]
    - match: Host(`plane.kostikidis.net`) && PathPrefix(`/auth`)
      kind: Rule
      middlewares: [{ name: plane-body-limit }]
      services: [{ name: plane-api, port: 8000 }]
    - match: Host(`plane.kostikidis.net`) && PathPrefix(`/static/`)
      kind: Rule
      middlewares: [{ name: plane-body-limit }]
      services: [{ name: plane-api, port: 8000 }]
    - match: Host(`plane.kostikidis.net`) && PathPrefix(`/live`)
      kind: Rule
      middlewares: [{ name: plane-body-limit }]
      services: [{ name: plane-live, port: 3000 }]
    - match: Host(`plane.kostikidis.net`) && PathPrefix(`/uploads`)
      kind: Rule
      middlewares: [{ name: plane-body-limit }]
      services: [{ name: plane-minio, port: 9000 }]
    - match: Host(`plane.kostikidis.net`) && PathPrefix(`/`)
      kind: Rule
      middlewares: [{ name: plane-body-limit }]
      services: [{ name: plane-web, port: 3000 }]
