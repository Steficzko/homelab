# Logical (pg_dump) backup of the Plane Postgres DB -> MinIO object storage.
# Complements the block-level Longhorn snapshots with a portable, version-restorable
# dump. Plane holds the live decision frontier (replacing docs/FOG.md), so ticket
# state between snapshots is worth real point-in-time recovery even though the raw
# transcripts remain source of truth on disk.
#
# Restore:  pg_restore -h plane-pgdb -U <user> -d <db> --clean <file>.dump
#
# Adapted from kubernetes/apps/bjj/postgres/backup-cronjob.yaml. Image is pinned to
# postgres:15-alpine to match the server version plane-ce pins (15.7).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: plane
spec:
  schedule: "0 * * * *"            # hourly at :00
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 10800   # auto-clean finished jobs (stops one-off failures re-alerting forever)
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: postgres-backup      # deliberately NOT app.kubernetes.io/instance: plane —
                                      # keeps this pod out of the namespace NetworkPolicy so it
                                      # can reach Unraid MinIO; allowed into pgdb explicitly.
        spec:
          restartPolicy: Never
          affinity:                       # PREFER postgres's node, never require it: a hard rule left
            podAffinity:                  # every run Pending when that node's CPU requests hit 99%
              preferredDuringSchedulingIgnoredDuringExecution:   # (11-04, 3 runs DeadlineExceeded).
                - weight: 100             # Cross-node startup lag is covered by the pg_isready loop below.
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        app.name: plane-plane-pgdb
                    topologyKey: kubernetes.io/hostname
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          initContainers:
            - name: copy-mc
              image: ghcr.io/steficzko/mc:RELEASE.2025-08-13T08-35-41Z@sha256:fc471559bd4d9a058985680ce49771626405886eebabaee6b7d5d1265c8ef823   # Steficzko/mc-image; was a GitHub download per run — github.com 504ed the nixery curl 2026-11-08
              imagePullPolicy: IfNotPresent   # digest-only refs default to Always; nixery outage 2026-10-14 (STOR-51)
              securityContext:
                runAsUser: 0                  # mc is 0711 root-owned; need root to read+copy it
              command: ["/bin/sh", "-c", "set -e; cp /mc /tools/mc && echo 01f866e9c5f9b87c2b09116fa5d7c06695b106242d829a8bb32990c00312e891\ \ /tools/mc | sha256sum -c -"]
              volumeMounts:
                - { name: tools, mountPath: /tools }
          containers:
            - name: dump
              image: postgres:15-alpine@sha256:54e0dd8e8cddcdbb9156c2486eed5a43eccb7214d7c6828097d41ce049fb3984
              envFrom:
                - secretRef: { name: plane-pgdb-secret }    # POSTGRES_USER / POSTGRES_DB / POSTGRES_PASSWORD
                - secretRef: { name: backup-s3-secret }     # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_ENDPOINTS
              env:
                - { name: HOME,      value: /work }
                - { name: PGHOST,    value: plane-pgdb }
                - { name: BUCKET,    value: app-backups }
                - { name: PREFIX,    value: plane-postgres }
                - { name: RETENTION, value: "7d" }    # 7d of hourly dumps = 168 restore points
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  export PGPASSWORD="$POSTGRES_PASSWORD"
                  TS=$(date +%Y%m%d-%H%M%S)
                  FILE="${POSTGRES_DB}-${TS}.dump"
                  echo "==> Waiting for ${PGHOST}:5432 (tolerates kube-router NetworkPolicy propagation delay) ..."
                  ok=0
                  for i in $(seq 1 30); do
                    if pg_isready -h "$PGHOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -t 3 >/dev/null 2>&1; then ok=1; echo "    reachable (try ${i})"; break; fi
                    sleep 3
                  done
                  [ "$ok" = 1 ] || { echo "ERROR: postgres unreachable after retries"; exit 1; }
                  echo "==> Dumping ${POSTGRES_DB} from ${PGHOST} ..."
                  pg_dump -h "$PGHOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc -Z6 -f "/work/${FILE}"
                  echo "==> Uploading ${FILE} ..."
                  /tools/mc alias set s3 "$AWS_ENDPOINTS" "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY"
                  # No `mc mb` here. app-backups is a SHARED, pre-existing bucket and this user is
                  # scoped to its own prefix with no s3:CreateBucket — `mc mb --ignore-existing`
                  # still issues CreateBucket and dies with "Access Denied", which failed the very
                  # first run. Creating the bucket is not this job's business; if it ever went
                  # missing the cp below fails loudly, which is what we want.
                  /tools/mc cp "/work/${FILE}" "s3/${BUCKET}/${PREFIX}/${FILE}"
                  echo "==> Pruning > ${RETENTION} old ..."
                  /tools/mc rm --recursive --force --older-than "$RETENTION" "s3/${BUCKET}/${PREFIX}/" || true
                  echo "==> Done: s3://${BUCKET}/${PREFIX}/${FILE}"
              volumeMounts:
                - { name: tools, mountPath: /tools }
                - { name: work,  mountPath: /work }
          volumes:
            - { name: tools, emptyDir: {} }
            - { name: work,  emptyDir: {} }
