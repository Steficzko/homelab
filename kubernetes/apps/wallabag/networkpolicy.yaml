apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wallabag
  namespace: wallabag
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 80
  egress:
    - {}
