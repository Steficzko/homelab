apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallabag
  namespace: wallabag
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wallabag
  template:
    metadata:
      labels:
        app: wallabag
    spec:
      containers:
        - name: wallabag
          image: wallabag/wallabag:2.6.14
          ports:
            - containerPort: 80
          env:
            - name: WALLABAG_URL
              value: https://read.kostikidis.net
            - name: SYMFONY__ENV__DATABASE_DRIVER
              value: pdo_sqlite
            - name: SYMFONY__ENV__DATABASE_NAME
              value: /var/www/wallabag/data/db/wallabag.sqlite
            - name: SYMFONY__ENV__DOMAIN_NAME
              value: https://read.kostikidis.net
            - name: SYMFONY__ENV__SECRET
              valueFrom:
                secretKeyRef:
                  name: wallabag-secret
                  key: APP_SECRET
          readinessProbe:
            httpGet:
              path: /login
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /login
              port: 80
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: "100m"
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/www/wallabag/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: wallabag-data-pvc
