# DOCUMENTATION ONLY — never applied. The ArgoCD Application excludes
# *.example.yaml AND *.sops.yaml from sync (an applied example once initialised a
# database with 'changeme' — see Gompha ops/k3s/argocd-sops-prune-conflict.md).
#
# Real values live in the sibling *.sops.yaml files (SOPS/age), applied MANUALLY
# at bootstrap:
#   for f in kubernetes/apps/saas-gompha/staging/*.sops.yaml; do
#     sops -d "$f" | kubectl apply -f -
#   done
#
# nkaBE authored the *.sops.yaml as UNSEALED STUBS (comment-only, no plaintext):
# I do not hold the age key, so I cannot encrypt. STEFANOS seals each secret:
#   sops -e -i kubernetes/apps/saas-gompha/staging/<name>.sops.yaml
# after pasting the real values below into that file's stringData/data. Until
# sealed, the stubs are empty documents (safe if accidentally applied).
#
# Recipient (age) is the cluster key already used by the licensing secrets.
---
# Postgres: the bootstrap superuser + BOTH build-required roles (spec §3).
# Generate each password: head -c 24 /dev/urandom | base64 | tr -d '/+='
apiVersion: v1
kind: Secret
metadata:
  name: clinic-postgres-secret
  namespace: saas-gompha-staging
type: Opaque
stringData:
  POSTGRES_USER: postgres                       # bootstrap superuser (init only; the API never uses it)
  POSTGRES_PASSWORD: REPLACE_32_CHAR_RANDOM
  GOMPHA_OWNER_PASSWORD: REPLACE_32_CHAR_RANDOM  # gompha_owner  (BYPASSRLS; migrations/seeding)
  GOMPHA_APP_PASSWORD: REPLACE_32_CHAR_RANDOM    # gompha_app    (NOBYPASSRLS; runtime)
---
# API: the two DSNs (owner for the migrate initContainer + reaper, app for the
# runtime) and the redeem-invite bearer. Host = the clinic-postgres Service; DB
# = gompha_clinic. Passwords MUST match the postgres secret above.
apiVersion: v1
kind: Secret
metadata:
  name: clinic-api-secret
  namespace: saas-gompha-staging
type: Opaque
stringData:
  GOMPHA_MIGRATION_DATABASE_URL: postgresql://gompha_owner:REPLACE_OWNER_PASSWORD@clinic-postgres:5432/gompha_clinic
  GOMPHA_DATABASE_URL: postgresql://gompha_app:REPLACE_APP_PASSWORD@clinic-postgres:5432/gompha_clinic
  # The per-tenant instance bearer for licensing's redeem-invite. INERT until
  # the ADR-024 keyless onboard surface + its NetworkPolicy are ruled on
  # (networkpolicies.yaml). Issued by licensing at provisioning for the staging
  # tenant; keep it here so the wiring is ready the moment the path opens.
  GOMPHA_INSTANCE_CREDENTIAL: REPLACE_INSTANCE_CREDENTIAL_FROM_LICENSING
---
# GHCR pull secret — same registry/account as licensing.
# kubectl create secret docker-registry ghcr-pull --docker-server=ghcr.io \
#   --docker-username=steficzko --docker-password=<GHCR_PAT> -o yaml --dry-run=client
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull
  namespace: saas-gompha-staging
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: REPLACE_DOCKERCONFIGJSON_B64
